:"可视化数据集中的视频与状态动作序列"},{"path":"src/lerobot/scripts/lerobot_train.py:543","what":"train() 函数，整个训练流水线的编排核心"},{"path":"src/lerobot/scripts/lerobot_record.py:228","what":"record_loop() 函数，遥操作采集数据的主循环"}],"key_files":[{"path":"README.md","why":"先建立整体认知：硬件、数据集、策略三大块与 CLI 用法"},{"path":"src/lerobot/configs/policies.py","why":"PreTrainedConfig 基类，理解 draccus ChoiceRegistry 如何注册与选择策略"},{"path":"src/lerobot/policies/pretrained.py","why":"PreTrainedPolicy 基类，理解策略必须实现的接口与并行声明"},{"path":"src/lerobot/robots/robot.py","why":"Robot 基类，理解硬件抽象层的契约"},{"path":"src/lerobot/policies/factory.py","why":"make_policy 工厂，理解策略如何被按名约定地实例化"},{"path":"src/lerobot/scripts/lerobot_train.py","why":"训练入口，串联数据集、策略、处理器、优化器与分布式"},{"path":"src/lerobot/datasets/lerobot_dataset.py","why":"LeRobotDataset 实现，理解统一数据格式的读写"},{"path":"src/lerobot/processor/pipeline.py","why":"处理流水线，理解观测/动作前后处理如何可组合"}],"extension_points":["想加新策略：在 src/lerobot/policies/<name>/ 下写 configuration_<name>.py，用 @PreTrainedConfig.register_subclass(\"<name>\") 注册一个继承 PreTrainedConfig 的配置类；再写 modeling_<name>.py 暴露 <Name>Policy，继承 PreTrainedPolicy","想加新机器人：在 src/lerobot/robots/ 下新建目录，写继承 Robot 的类和继承 RobotConfig 的配置类并注册","想加新遥操作器或相机：分别继承 Teleoperator / Camera 并注册对应 Config","想加新仿真环境：在 src/lerobot/envs/ 下写继承 EnvConfig 的类，实现 create_envs 返回 gymnasium 向量化环境","想加新的数据前后处理步骤：在 src/lerobot/processor/ 下写 ProcessorStep 并在策略的 processor_<name>.py 里组装 make_<name>_pre_post_processors","想接入第三方硬件包：发布名为 lerobot_robot_* / lerobot_teleoperator_* / lerobot_camera_* 的包，会被自动发现"],"learning_path":["第1步：读 README.md 与 pyproject.toml 的 [project.scripts]，搞清有哪些 CLI 入口","第2步：读 src/lerobot/configs/policies.py 与 src/lerobot/robots/robot.py，掌握两类核心配置基类与注册机制","第3步：读 src/lerobot/policies/pretrained.py 与一个具体策略如 policies/act/modeling_act.py，理解策略契约","第4步：读 src/lerobot/policies/factory.py，理解配置到实例的按名约定工厂","第5步：读 src/lerobot/scripts/lerobot_train.py 的 train()，把整条训练流水线串起来","第6步：读 src/lerobot/scripts/lerobot_record.py 与 datasets/lerobot_dataset.py，理解数据采集与统一格式"],"diagram_mermaid":"graph TD\n  CLI[CLI 命令行参数] --> CFG[TrainPipelineConfig 配置对象]\n  CFG --> DS[make_train_eval_datasets 构建数据集]\n  CFG --> POL[make_policy 构建策略]\n  CFG --> PROC[make_pre_post_processors 构建处理器]\n  DS --> DL[DataLoader 批量加载]\n  DL --> PRE[Preprocessor 归一化与设备搬运]\n  PRE --> MODEL[Policy forward 计算损失]\n  MODEL --> OPT[optimizer.step 更新权重]\n  OPT --> CKPT[保存 checkpoint]\n  CKPT --> HUB[上传 HuggingFace Hub]\n  POL --> ACT[select_action 推理动作]\n  ACT --> ENV[仿真或真实环境 rollout]","surprises":["策略类的导入完全靠命名约定：配置模块 configuration_<name>.py 会被重写成 modeling_<name>.py 再取 <Name>Policy，模块名不合规会直接报错","训练里刻意写 policy(batch) 而不是 policy.forward(batch)，因为 FSDP2 只通过 nn.Module 的 __call__ 钩子做参数 all-gather","基础安装非常轻，训练/硬件/数据集能力分别藏在 lerobot[training]、lerobot[hardware] 等 extras 后面，缺包时会给出可操作的安装提示","第三方硬件无需改本仓库，只要包名以 lerobot_robot_ 等前缀发布即可被自动发现并用 --robot.type 直接调用"],"confidence":"高"},"huggingface/smolagents":{"repo":"huggingface/smolagents","name":"smolagents","one_liner":"极简 Agent 框架，让 LLM 直接用 Python 代码当动作与工具","problem":"传统 Agent 让 LLM 输出 JSON 工具调用，步骤多、性能差、格式脆弱。本库改让模型写 Python 代码动作并在沙箱执行，把 Agent 核心逻辑压到约千行，用更少 LLM 调用完成复杂任务。","difficulty":"入门","core_abstractions":[{"name":"MultiStepAgent","role":"Agent 抽象基类，定义 ReAct 主循环 run 与 _run_stream，子类实现 _step_stream","file":"src/smolagents/agents.py"},{"name":"CodeAgent","role":"把动作写成 Python 代码、解析并交给执行器运行的 Agent","file":"src/smolagents/agents.py"},{"name":"ToolCallingAgent","role":"经典 JSON 工具调用式 Agent，与 CodeAgent 并列可选","file":"src/smolagents/agents.py"},{"name":"Tool","role":"工具基类，子类实现 forward 并声明 name/description/inputs/output_type","file":"src/smolagents/tools.py"},{"name":"tool","role":"把普通函数一键包装成 Tool 的装饰器","file":"src/smolagents/tools.py"},{"name":"PythonExecutor","role":"代码执行器抽象接口，定义 send_tools/send_variables/__call__","file":"src/smolagents/local_python_executor.py"},{"name":"LocalPythonExecutor","role":"基于 AST 白名单的本地执行器，非安全沙箱","file":"src/smolagents/local_python_executor.py"},{"name":"RemotePythonExecutor","role":"远程沙箱执行器基类，派生 E2B/Docker/Modal/Blaxel","file":"src/smolagents/remote_executors.py"},{"name":"Model","role":"模型抽象基类，定义 generate/generate_stream，派生各厂商模型","file":"src/smolagents/models.py"},{"name":"AgentMemory","role":"对话记忆容器，持有 system prompt 与各 MemoryStep 步骤","file":"src/smolagents/memory.py"},{"name":"ActionStep","role":"单步动作/观察/代码/工具调用的记录单元","file":"src/smolagents/memory.py"},{"name":"RunResult","role":"聚合输出、token 用量、步骤与耗时的运行结果对象","file":"src/smolagents/agents.py"}],"layers":[{"name":"Agent 编排层","responsibility":"ReAct 主循环、规划步、多智能体托管与提示词装配","modules":["src/smolagents"],"files":["src/smolagents/agents.py","src/smolagents/monitoring.py"]},{"name":"工具层","responsibility":"工具基类与装饰器、内置工具箱、MCP 工具集合接入","modules":["src/smolagents"],"files":["src/smolagents/tools.py","src/smolagents/default_tools.py","src/smolagents/mcp_client.py"]},{"name":"代码执行层","responsibility":"本地受限执行与云端沙箱执行","modules":["src/smolagents"],"files":["src/smolagents/local_python_executor.py","src/smolagents/remote_executors.py"]},{"name":"模型接入层","responsibility":"统一 ChatMessage 协议，适配 Transformers/LiteLLM/OpenAI 等模型","modules":["src/smolagents"],"files":["src/smolagents/models.py"]},{"name":"记忆与状态层","responsibility":"步骤记忆、token 用量统计与日志回调","modules":["src/smolagents"],"files":["src/smolagents/memory.py","src/smolagents/monitoring.py"]},{"name":"提示词与序列化层","responsibility":"YAML 提示模板、Agent/Tool 的保存与 Hub 上传","modules":["src/smolagents/prompts"],"files":["src/smolagents/prompts/code_agent.yaml","src/smolagents/serialization.py"]},{"name":"入口与交互层","responsibility":"CLI、Gradio UI 与网页浏览 Agent","modules":["src/smolagents"],"files":["src/smolagents/cli.py","src/smolagents/gradio_ui.py","src/smolagents/vision_web_browser.py"]}],"data_flow":["第1步：用户调用 agent.run 传入任务字符串，任务写入 AgentMemory 并追加 TaskStep","第2步：run 内部驱动 _run_stream，按 max_steps 进入循环，可选按 planning_interval 触发规划步","第3步：write_memory_to_messages 把记忆步骤转成模型可读的聊天消息序列","第4步：CodeAgent._step_stream 调用 model.generate 生成输出文本","第5步：parse_code_blobs 从文本中抽取代码块，fix_final_answer_code 做修补","第6步：代码作为一次 ToolCall 交给 python_executor 执行","第7步：执行器把 agent.tools 与 managed_agents 以 Python 函数形式注入命名空间，代码可直接调用","第8步：执行日志与最后输出写回 memory_step.observations","第9步：若代码调用了 final_answer 函数，执行器抛出 FinalAnswerException 标记 is_final_answer","第10步：非最终步则回到第3步继续循环，最终步产出 FinalAnswerStep","第11步：run 收集最后一步输出，可选组装 RunResult 返回"],"entry_points":[{"path":"src/smolagents/agents.py","what":"MultiStepAgent.run 与 CodeAgent._step_stream，Agent 运行主入口"},{"path":"src/smolagents/cli.py","what":"smolagent 命令行入口，支持交互式配置"},{"path":"src/smolagents/vision_web_browser.py","what":"webagent 命令行入口，基于 helium 的网页浏览 Agent"},{"path":"smolagent","what":"通用多步 CodeAgent CLI 命令"},{"path":"webagent","what":"网页浏览专用 Agent CLI 命令"}],"key_files":[{"path":"README.md","why":"先读它建立代码即动作的整体认知与安全提示"},{"path":"src/smolagents/agents.py","why":"核心文件，MultiStepAgent/CodeAgent/ToolCallingAgent 全在这里"},{"path":"src/smolagents/tools.py","why":"Tool 基类与 @tool 装饰器，理解扩展点的起点"},{"path":"src/smolagents/local_python_executor.py","why":"代码动作如何被受限执行，AST 白名单机制"},{"path":"src/smolagents/models.py","why":"模型抽象与各厂商适配，理解 ChatMessage 协议"},{"path":"src/smolagents/memory.py","why":"记忆步骤模型，理解循环如何累积上下文"},{"path":"src/smolagents/prompts/code_agent.yaml","why":"CodeAgent 的系统提示模板，决定输出代码块格式"},{"path":"src/smolagents/default_tools.py","why":"内置工具实现范例，写新工具可照抄"}],"extension_points":["加新工具：继承 src/smolagents/tools.py 的 Tool 实现 forward，或用 @tool 装饰普通函数","自定义 Agent 行为：继承 MultiStepAgent 并实现 _step_stream","自定义执行环境：继承 PythonExecutor 实现 __call__，或继承 RemotePythonExecutor","接入新模型：继承 Model 实现 generate，参考 models.py 中各适配类","改动作格式：编辑 src/smolagents/prompts/code_agent.yaml 提示模板与 code_block_tags"],"learning_path":["第1步读 README.md，理解代码即动作与传统 JSON 调用的差异","第2步读 src/smolagents/agents.py 的 MultiStepAgent.run 与 _run_stream 主循环","第3步读 CodeAgent._step_stream，看生成到解析到执行三步","第4步读 src/smolagents/tools.py 的 Tool 与 @tool，理解工具即函数","第5步读 src/smolagents/local_python_executor.py，理解受限执行与 final_answer 终止","第6步读 src/smolagents/models.py 与 memory.py，补齐模型与记忆细节"],"diagram_mermaid":"graph TD\n  A[用户任务] --> B[写入 AgentMemory]\n  B --> C[记忆转聊天消息]\n  C --> D[模型生成代码动作]\n  D --> E[解析代码块]\n  E --> F[PythonExecutor 执行]\n  F --> G[工具以函数形式调用]\n  G --> H{调用 final_answer}\n  H -->|否| I[写回观察结果]\n  I --> C\n  H -->|是| J[返回最终答案]\n  J --> K[组装 RunResult]","surprises":["LocalPythonExecutor 名字像沙箱，实则只是 AST 白名单限制，官方明确声明不是安全边界，不能跑不可信代码","终止条件不是模型输出某个 JSON 字段，而是代码里调用 final_answer 函数并触发异常来中断执行","工具在沙箱中就是普通 Python 函数，模型可以写 for 循环在一次动作里批量调用多个工具，因此比 JSON 调用少约 30% 步骤","同一套基类下 CodeAgent 与 ToolCallingAgent 仅覆盖 _step_stream 就切换了动作表示形式，抽象非常薄"],"confidence":"高"},"isaac-sim/IsaacLab":{"repo":"isaac-sim/IsaacLab","name":"Isaac Lab","one_liner":"基于 Omniverse 的 GPU 并行机器人学习仿真与训练框架","problem":"把机器人强化学习/模仿学习的仿真、传感器、随机化与策略训练整合成可大规模并行的统一流程，降低 sim-to-real 门槛。","difficulty":"困难","core_abstractions":[{"name":"ManagerBasedEnv","role":"manager-based 工作流的环境基类，持有场景与各类 manager，但不含 reward/termination，对 MDP 保持无关","file":"source/isaaclab/isaaclab/envs/manager_based_env.py"},{"name":"ManagerBasedRLEnv","role":"在 ManagerBasedEnv 之上补齐 reward、termination、reset 与 Gymnasium 接口的 RL 任务环境，是绝大多数训练任务的入口类","file":"source/isaaclab/isaaclab/envs/manager_based_rl_env.py"},{"name":"DirectRLEnv / DirectMARLEnv","role":"另一种工作流：不拆 manager，由用户在一个类里直接实现 scene 搭建、观测、奖励、终止与 reset","file":"source/isaaclab/isaaclab/envs/direct_rl_env.py"},{"name":"ManagerBase / ManagerTermBase","role":"所有 manager 的抽象基类，负责把配置对象解析成一个个 term 并统一调度，是 MDP 分解机制的核心","file":"source/isaaclab/isaaclab/managers/manager_base.py"},{"name":"InteractiveScene","role":"场景管理器，依据 InteractiveSceneCfg 创建机器人、刚体、传感器等实体并做 GPU 批量克隆与数据缓冲","file":"source/isaaclab/isaaclab/scene/interactive_scene.py"},{"name":"SimulationContext","role":"物理仿真上下文单例，控制 dt、物理步进、渲染与物理后端，env 必须由它驱动","file":"source/isaaclab/isaaclab/sim/simulation_context.py"},{"name":"configclass + EnvCfg","role":"基于 dataclass 的配置体系，用 @configclass 声明式定义场景/MDP 项，是用户定义新任务的主要接口","file":"source/isaaclab/isaaclab/envs/manager_based_env_cfg.py"},{"name":"RslRlVecEnvWrapper","role":"把 Isaac Lab 环境适配成 RSL-RL 等库所需的向量化环境接口，是 env 与策略库之间的桥","file":"source/isaaclab_rl/isaaclab_rl/rsl_rl/vecenv_wrapper.py"}],"layers":[{"name":"启动/App 层","responsibility":"启动 Omniverse Kit 内核、解析命令行与 Kit 参数、创建仿真上下文与可视化窗口","modules":["source/isaaclab/isaaclab/app","apps","source/isaaclab/isaaclab/cli"],"files":["source/isaaclab/isaaclab/app/app_launcher.py","source/isaaclab/isaaclab/app/sim_launcher.py"]},{"name":"仿真核心层","responsibility":"封装物理步进、时间步/decimation、渲染与物理后端抽象","modules":["source/isaaclab/isaaclab/sim","source/isaaclab_physx","source/isaaclab_newton"],"files":["source/isaaclab/isaaclab/sim/simulation_context.py","source/isaaclab/isaaclab/sim/simulation_cfg.py"]},{"name":"场景/资产/传感器层","responsibility":"提供机器人、刚体、可变形体、相机/激光雷达/接触等资产的配置与运行时句柄","modules":["source/isaaclab/isaaclab/scene","source/isaaclab/isaaclab/assets","source/isaaclab/isaaclab/sensors","source/isaaclab/isaaclab/terrains"],"files":["source/isaaclab/isaaclab/scene/interactive_scene.py","source/isaaclab_assets/isaaclab_assets/robots/franka.py"]},{"name":"环境抽象层","responsibility":"把场景与 manager 组织成对 agent 暴露的 step/reset 接口，区分 manager-based 与 direct 两种工作流","modules":["source/isaaclab/isaaclab/envs"],"files":["source/isaaclab/isaaclab/envs/manager_based_env.py","source/isaaclab/isaaclab/envs/manager_based_rl_env.py","source/isaaclab/isaaclab/envs/direct_rl_env.py"]},{"name":"Manager/MDP 层","responsibility":"把 MDP 拆成 action/observation/reward/termination/event/command/curriculum/recorder 等可插拔 term 并统一调度","modules":["source/isaaclab/isaaclab/managers","source/isaaclab/isaaclab/envs/mdp"],"files":["source/isaaclab/isaaclab/managers/action_manager.py","source/isaaclab/isaaclab/managers/observation_manager.py","source/isaaclab/isaaclab/envs/mdp/rewards.py"]},{"name":"任务层","responsibility":"提供 30+ 现成环境与机器人配置，并通过 gym.register 把任务名映射到 env cfg 与各 RL 库的 agent cfg","modules":["source/isaaclab_tasks","source/isaaclab_tasks_experimental"],"files":["source/isaaclab_tasks/isaaclab_tasks/contrib/lift/lift_env_cfg.py","source/isaaclab_tasks/isaaclab_tasks/contrib/lift/config/franka/__init__.py"]},{"name":"RL 集成层","responsibility":"统一 train/play/export 入口，按 --rl_library 分发到 RSL-RL/SB3/SKRL/rl_games/TorchRL 等后端并做环境适配","modules":["source/isaaclab_rl"],"files":["source/isaaclab_rl/isaaclab_rl/entrypoints/dispatch.py","source/isaaclab_rl/isaaclab_rl/entrypoints/backends/train_rsl_rl.py"]}],"data_flow":["第1步：运行 scripts/reinforcement_learning/train.py，它导入 isaaclab_rl.entrypoints.run_train_cli","第2步：dispatch.run_cli 解析 --rl_library 与 --task，并从 gym.spec 的 kwargs 解析出默认后端","第3步：resolve_task_config 通过任务注册取出 env_cfg_entry_point 与 agent 配置并实例化为 @configclass","第4步：launch_simulation 启动 Kit 与 SimulationContext，创建 USD stage 并配置物理/渲染","第5步：create_isaaclab_env 用 gym.make(task) 实例化 ManagerBasedRLEnv","第6步：ManagerBasedEnv.__init__ 创建 InteractiveScene 与 EventManager，调用 sim.reset() 激活物理句柄","第7步：load_managers 依次构建 recorder/action/observation manager，并把配置解析成 term","第8步：RslRlVecEnvWrapper 包装环境，构建 OnPolicyRunner 等策略 runner","第9步：runner.learn 循环中策略输出 action，调用 env.step(action)","第10步：step 内 action_manager.process_action/apply_action 驱动 decimation 次物理步进，再算 termination/reward、reset 终止环境、observation_manager.compute 生成观测并返回"],"entry_points":[{"path":"scripts/reinforcement_learning/train.py","what":"统一 RL 训练入口，转调 isaaclab_rl.entrypoints.run_train_cli"},{"path":"scripts/reinforcement_learning/play.py","what":"加载 checkpoint 回放/评估策略"},{"path":"scripts/environments/zero_agent.py","what":"零动作 agent，用于快速验证环境能否跑通"},{"path":"scripts/environments/random_agent.py","what":"随机动作 agent，用于冒烟测试环境"},{"path":"scripts/tutorials/03_envs","what":"环境创建与 manager 配置的官方教学脚本"},{"path":"isaaclab (console script -> isaaclab.cli:cli)","what":"安装后的命令行工具，提供环境列表、预编译等子命令"},{"path":"apps/isaaclab.python.kit","what":"Kit experience 文件，定义启动 Isaac Sim 内核所需的扩展集"}],"key_files":[{"path":"README.md","why":"先建立整体认知：GPU 并行、基于 Isaac Sim、支持 RL/IL 与多后端"},{"path":"source/isaaclab/isaaclab/envs/manager_based_env.py","why":"理解 env 如何组织场景与 manager，以及 step/reset 的主循环"},{"path":"source/isaaclab/isaaclab/envs/manager_based_rl_env.py","why":"看 RL 版如何补上 reward/termination/reset 与 Gymnasium 接口"},{"path":"source/isaaclab/isaaclab/managers/manager_base.py","why":"理解 MDP 分解机制与 term 的统一调度方式"},{"path":"source/isaaclab_tasks/isaaclab_tasks/contrib/lift/lift_env_cfg.py","why":"一个完整 manager-based 任务配置范例，把抽象落到具体 term"},{"path":"source/isaaclab_tasks/isaaclab_tasks/contrib/lift/config/franka/__init__.py","why":"看清 gym.register 如何把任务名、env 类与 cfg 入口绑定"},{"path":"source/isaaclab_rl/isaaclab_rl/entrypoints/dispatch.py","why":"理解统一入口如何按 --rl_library 分发到各 RL 后端"},{"path":"source/isaaclab_rl/isaaclab_rl/entrypoints/backends/train_rsl_rl.py","why":"完整的训练调用链：解析→启动仿真→建环境→包装→runner.learn"}],"extension_points":["想加新环境：写一个继承 ManagerBasedRLEnvCfg 或 DirectRLEnvCfg 的 @configclass，在包内 __init__.py 用 gym.register(entry_point='isaaclab.envs:ManagerBasedRLEnv', kwargs={'env_cfg_entry_point': ...}) 注册","想加新机器人：在 source/isaaclab_assets/robots 下新增 ArticulationCfg，并在任务 cfg 的 scene.robot 里 replace 使用","想加新 MDP 项：在 source/isaaclab/isaaclab/envs/mdp 下写函数，再在任务 cfg 里用 RewTerm/ObsTerm/EventTerm/TerminationTermCfg 引用","想加新 manager：继承 source/isaaclab/isaaclab/managers/manager_base.py 的 ManagerBase，并实现 active_terms 等抽象方法","想换物理后端：在 source/isaaclab_physx 或 source/isaaclab_newton 实现对应 physics manager，通过 physics= 选择器切换","想接新 RL 库：在 source/isaaclab_rl/isaaclab_rl/entrypoints/backends 增加 train/play 后端模块，并在 dispatch._BACKEND_MODULES 注册"],"learning_path":["第1步：读 README.md 与 docs，理解 GPU 并行、基于 Isaac Sim、支持多 RL 后端这三点定位","第2步：跑 scripts/tutorials/03_envs 系列，先会用再懂原理","第3步：读 envs/manager_based_env.py 的 __init__/load_managers/reset/step，掌握 env 生命周期","第4步：读 envs/manager_based_rl_env.py 的 step，理解 reward/termination/reset 的插入点","第5步：读 lift_env_cfg.py，把一个真实任务的 scene/actions/observations/rewards 与 manager 对应起来","第6步：读 isaaclab_rl/entrypoints/dispatch.py 与 train_rsl_rl.py，打通从命令行到策略训练的完整链路"],"diagram_mermaid":"graph TD\n  A[命令行 train.py] --> B[dispatch 统一入口]\n  B --> C[resolve_task_config 解析任务]\n  C --> D[launch_simulation 启动 Kit]\n  D --> E[gym.make 创建 ManagerBasedRLEnv]\n  E --> F[In el 读输入、产出 writes","第8步：apply_writes 将 writes 按各 channel 的 reduce 语义合并，更新 channel 版本号","第9步：未到 END 时 create_checkpoint 生成快照并 checkpointer.put 持久化，put_writes 记录中间写入","第10步：达到 END 后按 output_channels 聚合最终状态返回给调用方"],"entry_points":[{"path":"libs/langgraph/langgraph/graph/state.py:compile","what":"把用户构建的 StateGraph 编译为可执行的 CompiledStateGraph，是构建到执行的枢纽"},{"path":"libs/langgraph/langgraph/pregel/main.py:459","what":"Pregel 类定义，实现 invoke/stream/stream_events/get_state 等对外执行接口"},{"path":"libs/langgraph/langgraph/pregel/main.py:stream","what":"核心流式执行入口，驱动整个 superstep 循环"},{"path":"libs/langgraph/langgraph/func/__init__.py","what":"函数式 API 装饰器入口，用 @entrypoint/@task 建图"},{"path":"libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py","what":"预置 ReAct 风格 Agent 构造器，最常见的上手入口"}],"key_files":[{"path":"README.md","why":"先建立定位认知：低层编排框架，核心是 durable execution / HITL / memory"},{"path":"libs/langgraph/langgraph/graph/state.py","why":"StateGraph 与 compile() 所在，理解 DSL 如何编译成执行引擎"},{"path":"libs/langgraph/langgraph/pregel/main.py","why":"Pregel 执行引擎主体，看 invoke/stream 如何驱动循环与检查点"},{"path":"libs/langgraph/langgraph/pregel/_algo.py","why":"superstep 调度核心：prepare_next_tasks 与 apply_writes 决定任务如何产生与写回"},{"path":"libs/langgraph/langgraph/pregel/_loop.py","why":"执行循环与检查点保存/恢复逻辑集中地"},{"path":"libs/langgraph/langgraph/channels/base.py","why":"理解状态如何存储与 reduce 的关键抽象，含 get/update/checkpoint 契约"},{"path":"libs/checkpoint/langgraph/checkpoint/base/__init__.py","why":"持久化接口契约，理解 thread_id 与断点恢复机制"},{"path":"libs/langgraph/langgraph/types.py","why":"Command/Send/RetryPolicy/Interrupt 等控制流与配置类型集中定义"}],"extension_points":["加一个新节点类型：实现可调用对象或用 add_node 传入 Runnable/Callable，节点封装见 libs/langgraph/langgraph/graph/_node.py","自定义状态合并语义：继承 BaseChannel 实现 get/update/from_checkpoint，或用 Annotated[type, reducer] 挂到 schema，参考 libs/langgraph/langgraph/channels/base.py","更换/新增持久化后端：继承 BaseCheckpointSaver 实现 get_tuple/put/put_writes/list，参考 libs/checkpoint-sqlite","新增长期记忆后端：继承 BaseStore 实现 libs/checkpoint/langgraph/store/base/__init__.py 中的接口","自定义流式事件转换：实现 StreamTransformer 并在 compile(transformers=...) 传入","新增缓存策略：继承 BaseCache 用于节点结果缓存"],"learning_path":["第1步：读 README.md 明确它解决 durable execution / HITL / memory 三类问题","第2步：读 graph/state.py 的 StateGraph 与 compile()，搞清 DSL 如何变成执行对象","第3步：读 pregel/main.py 的 Pregel.__init__ 与 stream()，理解执行入口与循环","第4步：读 pregel/_algo.py 的 prepare_next_tasks 与 apply_writes，吃透 superstep 调度","第5步：读 pregel/_loop.py 与 checkpoint/base，理解检查点何时保存与恢复","第6步：读 channels/base.py 与 graph/message.py，掌握状态 reduce 与 add_messages 语义"],"diagram_mermaid":"graph TD\n  U[用户构造 StateGraph] --> C[compile 编译]\n  C --> P[CompiledStateGraph 即 Pregel]\n  P --> L[执行循环 Loop]\n  L --> R[读取检查点 恢复 channels]\n  R --> S[写入 START channel]\n  S --> T[prepare_next_tasks 生成 superstep 任务]\n  T --> N[并发执行 PregelNode 节点函数]\n  N --> W[apply_writes 合并写入 channels]\n  W --> K[create_checkpoint 保存快照]\n  K --> E{是否到达 END}\n  E -->|否| T\n  E -->|是| O[聚合 output_channels 返回结果]\n  K -.-> CP[BaseCheckpointSaver 持久化]\n  P -.-> ST[BaseStore 长期记忆]","surprises":["对外暴露的是 StateGraph DSL，但真正执行的是 Pregel 引擎；compile() 本质是把图翻译成 Pregel 的 channels 与 PregelNode，理解 Pregel 才算看懂 LangGraph","状态字段的合并语义由 channel 类型决定而非用户代码：用 Annotated[list, add_messages] 才能累加，否则默认 LastValue 会覆盖","检查点按 superstep 粒度保存且 put_writes 单独记录中间写入，因此能从中断点精确恢复，但也意味着写入顺序与线程安全需要后端保证","Command 与 Send 是两套动态控制流：Command 改状态并跳转，Send 会 fan-out 成新任务进入下一 superstep，混用容易产生非预期并行"],"confidence":"高"},"mem0ai/mem0":{"repo":"mem0ai/mem0","name":"mem0","one_liner":"为 AI Agent 提供可抽取、可检索、可更新的长期记忆层","problem":"解决 Agent 缺乏长期记忆的问题：把对话与交互自动抽取成事实并去重存储，在多用户/多智能体场景下按语义与关键词混合检索，并支持显式更新与删除。","difficulty":"中等","core_abstractions":[{"name":"Memory / AsyncMemory","role":"记忆层主入口：编排抽取-嵌入-去重-存储-实体链接-检索的完整管线，同步与异步两个实现","file":"mem0/memory/main.py"},{"name":"MemoryBase","role":"记忆层抽象契约，定义 add/get/get_all/search/update/delete 等对外方法","file":"mem0/memory/base.py"},{"name":"VectorStoreBase","role":"向量库统一接口：insert/search/keyword_search/update/get/list，是后端可插拔的核心","file":"mem0/vector_stores/base.py"},{" top 10，结果用整数 ID 映射防止 LLM 幻觉","第5步：Phase 2 LLM 抽取：单次调用把新消息抽成事实列表，支持 custom_instructions 定制","第6步：Phase 3 批量嵌入抽取出的记忆文本，失败时降级为逐条嵌入","第7步：Phase 4/5 逐条计算 MD5 hash，对已有记忆与批内重复做去重，并做 BM25 分词","第8步：Phase 6 批量写入 vector_store，并按记录写入 SQLite 历史表","第9步：Phase 7 实体抽取与链接：抽取实体写入 entity store，按精确匹配或语义相似度合并并维护 linked_memory_ids","第10步：Phase 8 保存原始消息到 SQLite，返回每条 ADD 结果"],"entry_points":[{"path":"mem0/memory/main.py:Memory.add","what":"写入记忆主入口，驱动抽取到存储的完整管线"},{"path":"mem0/memory/main.py:Memory.search","what":"检索记忆主入口，做混合检索与可选重排"},{"path":"mem0/memory/main.py:_add_to_vector_store","what":"V3 分阶段批处理管线主体，是理解记忆写入的核心"},{"path":"mem0/memory/main.py:_search_vector_store","what":"混合检索实现：语义 + BM25 + 实体加权 + 融合排序"},{"path":"mem0/client/main.py:MemoryClient","what":"托管平台客户端入口，与本地 Memory 语义对齐"},{"path":"mem0/__init__.py","what":"包导出入口，暴露 Memory/AsyncMemory/MemoryClient"}],"key_files":[{"path":"README.md","why":"先建立定位：新记忆算法、基准数据与整体能力边界"},{"path":"mem0/AGENTS.md","why":"一张图看懂 provider pattern 与各目录职责，含各层 provider 数量"},{"path":"mem0/memory/base.py","why":"记忆层抽象契约，理解对外能力的最小集合"},{"path":"mem0/configs/base.py","why":"MemoryConfig 参数体系，看清 vector_store/llm/embedder/reranker 如何组合"},{"path":"mem0/memory/main.py","why":"核心实现，add 与 _add_to_vector_store 是记忆写入的完整链路"},{"path":"mem0/memory/main.py:search","why":"检索链路：从查询到混合打分到结果格式化"},{"path":"mem0/vector_stores/base.py","why":"向量库统一接口，理解后端如何可插拔以及 keyword_search 的可选性"},{"path":"mem0/memory/storage.py","why":"SQLite 历史与消息持久化，理解记忆变更历史与去重上下文来源"}],"extension_points":["新增向量库后端：继承 mem0/vector_stores/base.py 的 VectorStoreBase，实现 insert/search/keyword_search/update/get/list，并在 vector_stores/__init__.py 注册","新增 LLM 供应商：继承 mem0/llms/base.py 的 LLMBase 实现 generate_response，在 llms/__init__.py 注册","新增嵌入模型：继承 mem0/embeddings/base.py 的 EmbedderBase，实现 embed 与 embed_batch","新增重排器：继承 mem0/reranker/base.py，并在 MemoryConfig.reranker 配置后由 RerankerFactory 创建","自定义抽取规则：通过 MemoryConfig.custom_instructions 或 add(prompt=...) 覆盖默认抽取提示词","替换记忆核心：继承 mem0/memory/base.py 的 MemoryBase 实现自定义记忆策略","注意 7B 视觉-语言-动作模型，把机器人动作当 token 生成","problem":"通用机器人操作缺少开源的大规模 VLA 模型与可复现训练栈。OpenVLA 用 Prismatic VLM 骨干、把连续动作离散成词表 token 做自回归生成，支持从 Open-X 数据预训练并用 LoRA 低成本微调到新任务与新本体。","difficulty":"困难","core_abstractions":[{"name":"ActionTokenizer","role":"把连续动作按 256 个均匀分箱离散化并映射到词表末尾的 token，同时提供 token 反解为连续动作的接口","file":"prismatic/vla/action_tokenizer.py"},{"name":"OpenVLA","role":"训练/加载态的 VLA 模型，继承 PrismaticVLM，封装 predict_action 推理与动作反归一化统计","file":"prismatic/models/vlas/openvla.py"},{"name":"OpenVLAForActionPrediction","role":"HuggingFace 风格的独立 VLA 类，predict_action 直接 generate 动作 token 再反归一化，供推理与 LoRA 微调使用","file":"prismatic/extern/hf/modeling_prismatic.py"},{"name":"PrismaticForConditionalGeneration","role":"HF 版多模态主干，forward 里拼接视觉 patch embedding 与文本 embedding，是 OpenVLAForActionPrediction 的父类","file":"prismatic/extern/hf/modeling_prismatic.py"},{"name":"PrismaticVLM","role":"训练栈里的 VLM 主干抽象，持有 vision_backbone、projector、llm_backbone，提供 freeze_backbones 与 prompt builder","file":"prismatic/models/vlms/prismatic.py"},{"name":"RLDSDataset","role":"把 RLDS/TFDS 数据集包装成 PyTorch IterableDataset，按 data_mix 混合多数据集并计算动作归一化统计","file":"prismatic/vla/datasets/datasets.py"},{"name":"RLDSBatchTransform","role":"把单条 RLDS 样本转成对话式 prompt，用 ActionTokenizer 把动作写成标签 token，并只在动作位置保留 loss","file":"prismatic/vla/datasets/datasets.py"},{"name":"VLAConfig","role":"draccus ChoiceRegistry 配置基类，声明 base_vlm、数据混合、冻结策略与优化超参，各实验为其子类","file":"prismatic/conf/vla.py"},{"name":"PaddedCollatorForActionPrediction","role":"把变长输入右侧 padding 成 batch，并构造只对动作 token 计损的 labels","file":"prismatic/util/data_utils.py"},{"name":"BaseTrainStrategy","role":"训练策略抽象基类，规定 run_setup 与 run_vla_training 接口，FSDP 与 DDP 实现据此落地分布式训练","file":"prismatic/training/strategies/base_strategy.py"},{"name":"MODEL_REGISTRY","role":"预训练 VLM 的全局注册表，把模型 ID 映射到骨干、视觉表征与 LLM 描述，是 load 的依据","file":"prismatic/models/registry.py"}],"layers":[{"name":"配置层","responsibility":"用 draccus dataclass 声明式定义 VLM 与 VLA 的模型、数据混合与优化超参，并注册可选实验","modules":["prismatic/conf"],"file /* ================= 路由 ================= */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(!h) return {v:'home'};
  const p = h.split('/');
  if(p.length===1) return {v:'domain', d:p[0]};
  if(p.length===2) return {v:'branch', d:p[0], b:+p[1]};
  return {v:'project', d:p[0], b:+p[1], r:repoBySlug[p.slice(2).join('/')]};
}
function go(h){ location.hash = h; }

/* ================= 侧栏树 ================= */
function renderTree(){

  let html = `<div class="trow ${cur.v==='home'?'on':''}" onclick="go('')">
      <span class="tw">›</span><span class="tl">总览</span></div>`;
  for(const [dk, dv] of Object.entries(DOMAINS)){
    const pal = PAL[dk];
    const projs = PROJECTS.filter(p => p.domains.includes(dk));
    const open = cur.d === dk;
    html += `<div class="tnode ${open?'open':''}" data-d="${dk}">
      <div class="trow ${cur.v==='domain'&&cur.d===dk?'on':''}" onclick="go('/${dk}')">
        <span class="tw">›</span><span class="dot" style="background:${pal.c}"></span>
        <span class="tl">${pal.label}</span><span class="tc">${projs.length}</span></div>
      <div class="tkids">`;
    dv.branches.forEach((br, i) => {
      const bp = projs.filter(p => p.branches.includes(br));
      if(!bp.length) return;
      const bOpen = cur.d===dk && cur.b===i;
      html += `<div class="tnode ${bOpen?'open':''}">
        <div class="trow ${cur.v==='branch'&&cur.d===dk&&cur.b===i?'on':''}" onclick="go('/${dk}/${i}')">
          <span class="tw">›</span><span class="tl" title="${esc(br)}">${esc(br)}</span>
          <span class="tc">${bp.length}</span></div>
        <div class="tkids">`;
      bp.sort((a,b)=>starNum(b.star)-starNum(a.star)).forEach(p => {
        const on = cur.v==='project' && cur.r===p.repo;
        html += `<div class="trow tproj ${on?'on':''}" onclick="go('/${dk}/${i}/${slug(p.repo)}')">
          <span class="tw"></span>
          <span class="tl" title="${esc(p.name)}">${esc(p.name)}<span class="st">${esc(p.star||'')}</span>${
            ARCH[p.repo]?'<span class="archflag" title="已有语义架构分析">◆</span>':''}</span></div>`;
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  }
  document.getElementById('tree').innerHTML = html;
  const on = document.querySelector('#tree .trow.on');
  if(on) on.scrollIntoView({block:'nearest'});
}

/* ================= 复用组件 ================= */
function bars(items, cls, unit){
  if(!items || !items.length) return '<div style="font-size:11.5px;color:var(--ink3)">未检测到</div>';
  const max = Math.max(...items.map(i=>i.v)) || 1;
  return '<div class="bars">' + items.map(i =>
    `<div class="row"><span class="lb" title="${esc(i.n)}">${esc(i.n)}</span>
      <span class="track"><span class="fill ${cls}" style="width:${Math.max(2,(i.v/max)*100)}%"></span></span>
      <span class="vl">${unit==='loc'?fmt(i.v)+' 行':fmt(i.v)}</span></div>`).join('') + '</div>';
}
function crumbs(items){
  return '<div class="crumbs">' + items.map((it,i) =>
    i===items.length-1 ? `<span>${esc(it.t)}</span>`
      : `<a onclick="go('${it.h}')">${esc(it.t)}</a><span>›</span>`).join('') + '</div>';
}

  html += `<h1 class="vt">项目全景</h1><div class="vs">${PROJECTS.length} 个已克隆并完成结构分析的开源项目${

  html += `<div class="panel"><h2>项目全景图</h2><div class="ph">矩形面积正比于代码行数 · 点击进入项目详情</div>`;
  const ps = PROJECTS.slice().sort((a,b)=>(b.loc||0)-(a.loc||0));
  const total = ps.reduce((a,p)=>a+(p.loc||0),0)||1;
  const ROWS = 6, target = total/ROWS;
  const rows = []; let cur = [], curSum = 0;
  for(const p of ps){
    cur.push(p); curSum += (p.loc||0);
    if(curSum >= target && rows.length < ROWS-1){ rows.push({items:cur,sum:curSum}); cur=[]; curSum=0; }
  }
  if(cur.length) rows.push({items:cur, sum:curSum});
  html += '<div class="ovrows">' + rows.map(r => '<div class="ovrow">' + r.items.map(p=>{
    const pal = PAL[p.domains[0]] || PAL.agent;
    const w = ((p.loc||1)/r.sum*100).toFixed(2);

    return `<div class="ovtile" style="flex:0 0 ${w}%;background:${pal.bg};color:${pal.c}"

      <span class="n">${esc(p.name)}</span><span class="v">${fmt(p.loc)}</span></div>`;
  }).join('') + '</div>').join('') + '</div></div>';

  html += `<div class="grid">`;
  for(const [dk, dv] of Object.entries(DOMAINS)){
    const pal = PAL[dk];
    const projs = PROJECTS.filter(p => p.domains.includes(dk));
    const dloc = projs.reduce((a,p)=>a+(p.loc||0),0);

    html += `<div class="dcard" onclick="go('/${dk}')">

      <div class="m">${dv.branches.length} 个分支 · ${projs.length} 个项目<br>${fmt(dloc)} 行代码${
        darch?` · ${darch} 份语义架构`:''}</div>
      <div class="bar">${dv.branches.map((br,i)=>{
        const n = projs.filter(p=>p.branches.includes(br)).length;
        return `<i style="width:${(n/projs.length*100).toFixed(1)}%;background:${pal.c};opacity:${0.35+i*0.06}"></i>`;
      }).join('')}</div></div>`;
  }
  html += `</div>`;
  document.getElementById('view').innerHTML = html;
}

/* ================= 视图：分支 ================= */
function viewBranch(dk, bi){
  const dv = DOMAINS[dk]; if(!dv) return viewHome();
  const br = dv.branches[bi]; if(br===undefined) return viewDomain(dk);
  const pal = PAL[dk];
  const projs = PROJECTS.filter(p => p.domains.includes(dk) && p.branches.includes(br))
    .sort((a,b)=>starNum(b.star)-starNum(a.star));
  let html = crumbs([{t:'总览',h:''},{t:pal.label,h:'/'+dk},{t:br,h:`/${dk}/${bi}`}]);
  html += `<h1 class="vt">${esc(br)}</h1>
    <div class="vs">${projs.length} 个项目 · ${fmt(projs.reduce((a,p)=>a+(p.loc||0),0))} 行代码 · 按 star 排序</div>`;
  html += `<table class="pl"><thead><tr>
    <th style="width:26%">项目</th><th style="width:22%">仓库</th><th>说明</th>
    <th style="width:82px;text-align:right">代码行</th><th style="width:60px;text-align:right">star</th>
    <th style="width:76px">架构</th></tr></thead><tbody>`;
  for(const p of projs){
    const desc = ((p.readme&&p.readme.summary) || p.description || '').slice(0, 70);
    html += `<tr onclick="go('/${dk}/${bi}/${slug(p.repo)}')">
      <td><span class="pname">${esc(p.name)}</span></td>
      <td><span class="prepo">${esc(p.repo)}</span></td>
      <td style="color:var(--ink2)">${esc(desc)}${desc.length>=70?'…':''}</td>
      <td class="num">${fmt(p.loc)}</td>
      <td class="num">${esc(p.star||'')}</td>
      <td>${ARCH[p.repo]?'<span class="chip arch">◆ 已分析</span>':'<span style="color:var(--ink4);font-size:11px">—</span>'}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  document.getElementById('view').innerHTML = html;
}

/* ================= 视图：项目详情 ================= */
function viewProject(dk, bi, repo){
  const p = byRepo[repo]; if(!p) return viewHome();
  const dv = DOMAINS[dk], pal = PAL[dk];
  const br = dv ? dv.branches[bi] : p.branches[0];
  const a = ARCH[repo];
  const pri = PRIO[repo];

  let html = crumbs([{t:'总览',h:''},{t:pal.label,h:'/'+dk},
    {t:br||'—',h:`/${dk}/${bi}`},{t:p.name,h:''}]);
  html += `<div class="dhead"><div>
      <h1>${esc(p.name)}</h1>
      <div class="sub">${esc(p.repo)} · ${esc(p.path||'')}</div></div></div>`;
  html += `<div class="dchips">
    ${p.star?`<span class="chip star">★ ${esc(p.star)}</span>`:''}
    ${p.language?`<span class="chip lang">${esc(p.language)}</span>`:''}
    ${p.license&&p.license!=='无'?`<span class="chip lic">${esc(p.license)}</span>`:''}
    ${a?`<span class="chip arch">◆ 语义架构已分析</span>`:''}
    ${pri?`<span class="chip pri" title="任务A 语义架构图优先级">架构优先级 ${pri.arch_score}</span>`:''}
    ${pri?`<span class="chip pri" title="任务B 网页工具改造适用性">工具改造 ${pri.tool_score}</span>`:''}
    <span class="chip">${fmt(p.file_count)} 文件 · ${fmt(p.loc)} 行</span>
  </div>`;

  if(a){
    html += `<div class="panel" style="border-left:3px solid ${pal.c}">
      <h2>语义架构</h2><div class="ph">由子 agent 深读源码产出 · 置信度 ${esc(a.confidence||'—')} · 难度 ${esc(a.difficulty||'—')}</div>
      <p class="lead">${esc(a.one_liner||'')}</p>
      <div class="note">${esc(a.problem||'')}</div>`;
    if(a.diagram_mermaid){
      html += `<div class="mermaid-wrap"><pre class="mermaid">${esc(a.diagram_mermaid)}</pre></div>
        <details class="src"><summary>查看 Mermaid 源码</summary><pre>${esc(a.diagram_mermaid)}</pre></details>`;
    }
    html += `</div>`;

    if((a.core_abstractions||[]).length){
      html += `<div class="panel"><h2>核心抽象</h2><div class="ph">读懂这几个类，就读懂了半个项目</div>
        <table class="tbl"><thead><tr><th style="width:150px">抽象</th><th>职责</th><th style="width:38%">定义位置</th></tr></thead><tbody>`;
      for(const c of a.core_abstractions)
        html += `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.role)}</td><td><code>${esc(c.file)}</code></td></tr>`;
      html += `</tbody></table></div>`;
    }
    if((a.layers||[]).length){
      html += `<div class="panel"><h2>分层结构</h2><div class="ph">自顶向下的职责划分</div>
        <table class="tbl"><thead><tr><th style="width:150px">层</th><th>职责</th><th style="width:34%">主要模块</th></tr></thead><tbody>`;
      for(const l of a.layers)
        html += `<tr><td><b>${esc(l.name)}</b></td><td>${esc(l.responsibility)}</td>
          <td>${(l.modules||[]).map(m=>`<code>${esc(m)}</code>`).join(' ')}</td></tr>`;
      html += `</tbody></table></div>`;
    }
    if((a.data_flow||[]).length){
      html += `<div class="panel"><h2>数据流</h2><div class="ph">从输入到输出的完整链路</div><ol class="flow">`;
      for(const s of a.data_flow) html += `<li>${esc(s)}</li>`;
      html += `</ol></div>`;
    }
    const two = [];
    if((a.key_files||[]).length){
      two.push(`<div class="panel"><h2>建议阅读顺序</h2><div class="ph">按这个顺序读，不要从入口直接跳</div><ol class="kf">` +
        a.key_files.map(k=>`<li><code>${esc(k.path)}</code><br>${esc(k.why)}</li>`).join('') + `</ol></div>`);
    }
    if((a.learning_path||[]).length || (a.extension_points||[]).length){
      let s = `<div class="panel"><h2>学习路径与扩展点</h2>`;
      if((a.learning_path||[]).length)
        s += `<div class="ph">建议学习顺序</div><ol class="flow">` +
             a.learning_path.map(x=>`<li>${esc(x)}</li>`).join('') + `</ol>`;
      if((a.extension_points||[]).length)
        s += `<div class="ph" style="margin-top:14px">想扩展时改哪里</div><ul class="pl2">` +
             a.extension_points.map(x=>`<li>${esc(x)}</li>`).join('') + `</ul>`;
      two.push(s + `</div>`);
    }
    if(two.length) html += `<div class="cols">${two.join('')}</div>`;

    if((a.surprises||[]).length){
      html += `<div class="panel"><h2>容易踩的坑</h2><div class="ph">反直觉的设计，读之前先知道</div>`;
      for(const s of a.surprises) html += `<div class="note">${esc(s)}</div>`;
      html += `</div>`;
    }
  } else {
    html += `<div class="panel"><h2>语义架构</h2><div class="ph">尚未分析</div>
      <div class="note">该项目还没有做语义级架构分析（需人工深读代码）。当前展示的是自动扫描出的结构级信息。
      优先级评分：架构优先级 <b>${pri?pri.arch_score:'—'}</b>。</div></div>`;
  }

  const desc = (p.readme&&p.readme.summary) || p.description || '';
  const feats = (p.readme&&p.readme.features)||[];
  if(desc || feats.length){
    html += `<div class="panel"><h2>功能全景</h2><div class="ph">来自 README 与仓库元数据</div>`;
    if(desc) html += `<p class="lead">${esc(desc)}</p>`;
    if(feats.length) html += `<div class="feats">${feats.slice(0,10).map(f=>`<i>${esc(f.slice(0,60))}</i>`).join('')}</div>`;
    html += `</div>`;
  }

  const langs = (p.languages||[]).filter(l=>l.loc>0).slice(0,7).map(l=>({n:l.name,v:l.loc}));
  const dirs = (p.top_dirs||[]).slice(0,8).map(d=>({n:d.name+'/', v:d.loc||d.files}));
  html += `<div class="cols">
    <div class="panel"><h2>模块架构</h2><div class="ph">顶层目录按代码行数</div>${bars(dirs,'g','loc')}</div>
    <div class="panel"><h2>技术栈</h2><div class="ph">按代码行数分布</div>${bars(langs,'','loc')}</div>
  </div>`;

  const cmds = p.run_commands||[], ents = p.entry_points||[];
  if(cmds.length || ents.length){
    html += `<div class="panel"><h2>运行流程</h2><div class="ph">点击命令可复制</div>`;
    for(const c of cmds.slice(0,4)) html += `<div class="cmd" data-cmd="${esc(c)}">${esc(c)}</div>`;
    if(ents.length) html += `<div class="feats" style="margin-top:9px">${
      ents.slice(0,8).map(e=>`<i>${esc(e.kind)}: ${esc(e.file)}</i>`).join('')}</div>`;
    html += `</div>`;
  }

  html += `<div class="panel"><h2>其他</h2><div class="ph">数据与出处</div>
    <table class="tbl"><tbody>
      <tr><td style="width:110px;color:var(--ink3)">GitHub</td><td><a href="https://github.com/${esc(p.repo)}" target="_blank">${esc(p.repo)} ↗</a></td></tr>
      <tr><td style="color:var(--ink3)">本地路径</td><td><code>${esc(p.path||'')}</code></td></tr>
      <tr><td style="color:var(--ink3)">最后推送</td><td>${esc(p.pushed_at||'—')}</td></tr>
      ${(p.topics||[]).length?`<tr><td style="color:var(--ink3)">Topics</td><td>${(p.topics||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join(' ')}</td></tr>`:''}
    </tbody></table></div>`;

  document.getElementById('view').innerHTML = html;

  document.querySelectorAll('.cmd').forEach(el=>{
    el.onclick = ()=>{
      navigator.clipboard.writeText(el.dataset.cmd).then(()=>{
        const t = document.getElementById('toast');
        t.textContent = '已复制: ' + el.dataset.cmd.slice(0,44);
        t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1400);
      }).catch(()=>{});
    };
  });
  if(mermaidReady){
    try{ mermaid.run({querySelector:'.mermaid'}); }catch(e){}
  }
}

/* ================= 搜索 ================= */
function runSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return false;
  const hits = PROJECTS.filter(p =>
    (p.name||'').toLowerCase().includes(q) || (p.repo||'').toLowerCase().includes(q) ||
    ((p.description||'')+((p.readme&&p.readme.summary)||'')).toLowerCase().includes(q));
  let html = crumbs([{t:'搜索结果',h:''}]);
  html += `<h1 class="vt">搜索「${esc(q)}」</h1><div class="vs">命中 ${hits.length} 个项目</div>`;
  if(!hits.length){ html += `<div class="empty">没有匹配的项目</div>`; }
  else {
    html += `<table class="pl"><thead><tr><th style="width:24%">项目</th><th style="width:20%">仓库</th>
      <th>所属分支</th><th style="width:82px;text-align:right">代码行</th><th style="width:60px;text-align:right">star</th></tr></thead><tbody>`;
    for(const p of hits.sort((a,b)=>starNum(b.star)-starNum(a.star))){
      const dk = p.domains[0], bi = DOMAINS[dk].branches.findIndex(b=>p.branches.includes(b));
      html += `<tr onclick="go('/${dk}/${bi}/${slug(p.repo)}')">
        <td><span class="pname">${esc(p.name)}</span>${ARCH[p.repo]?' <span class="chip arch">◆</span>':''}</td>
        <td><span class="prepo">${esc(p.repo)}</span></td>
        <td style="color:var(--ink2);font-size:12px">${esc(p.branches.join(' / '))}</td>
        <td class="num">${fmt(p.loc)}</td><td class="num">${esc(p.star||'')}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  document.getElementById('view').innerHTML = html;
  return true;
}

/* ================= 渲染 ================= */
function render(){
  const q = document.getElementById('q').value;
  renderTree();
  const cur = route();
  if(q.trim()){ runSearch(q); }
  else if(cur.v==='home') viewHome();
  else if(cur.v==='domain') viewDomain(cur.d);
  else if(cur.v==='branch') viewBranch(cur.d, cur.b);
  else if(cur.v==='project') viewProject(cur.d, cur.b, cur.r);
  else viewHome();
  document.getElementById('view').scrollTop = 0;
}

function renderStats(){
  const loc = PROJECTS.reduce((a,p)=>a+(p.loc||0),0);
  const archN = Object.keys(ARCH).length;
  document.getElementById('hstats').innerHTML =
    `<span><b>${PROJECTS.length}</b> 项目</span>
     <span><b>${fmt(loc)}</b> 行</span>
     <span><b>${archN}</b> 份语义架构</span>
     <span>${META.date||''}</span>`;
}

window.addEventListener('hashchange', render);
document.getElementById('q').addEventListener('input', render);
renderStats(); render();
</script>
</body>
</html>
