<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目浏览器 · 具身智能 × AI Agent</title>
<style>
  :root{
    --bg:#F7F7F5; --panel:#FFFFFF; --line:#E4E2DC; --line2:#EFEDE7;
    --ink:#2C2C2A; --ink2:#5F5E5A; --ink3:#8B8A85; --ink4:#A9A8A3;
    --emb:#0F6E56; --emb-bg:#E1F5EE; --emb-soft:#F2FBF8;
    --agt:#185FA5; --agt-bg:#E6F1FB; --agt-soft:#F3F9FE;
    --crs:#854F0B; --crs-bg:#FAEEDA; --crs-soft:#FDF8EE;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-size:13.5px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}

  /* ---------- 顶栏 ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
  .brand{font-size:14.5px;font-weight:500;white-space:nowrap}
  .brand span{color:var(--ink3);font-weight:400;font-size:12px;margin-left:7px}
  .search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
    padding:5px 11px;background:var(--panel);flex:0 1 300px}
  .search input{border:none;outline:none;font:inherit;font-size:12.5px;width:100%;background:transparent;color:var(--ink)}
  .search input::placeholder{color:var(--ink4)}
  .hstats{margin-left:auto;display:flex;gap:18px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
  .hstats b{color:var(--ink);font-weight:500}

  /* ---------- 布局 ---------- */
  .layout{display:grid;grid-template-columns:286px 1fr;align-items:start;height:calc(100vh - 53px)}
  aside{height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px 40px}
  main{height:100%;overflow-y:auto;padding:20px 26px 80px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} aside{display:none} }

  /* ---------- 侧栏树 ---------- */
  .tnode{user-select:none}
  .trow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;line-height:1.35}
  .trow:hover{background:#F4F3EE}
  .trow.on{background:#EDEBE4}
  .trow.on .tl{font-weight:500}
  .tw{width:13px;flex:0 0 13px;color:var(--ink4);font-size:9px;text-align:center;transition:transform .13s}
  .tnode.open > .trow .tw{transform:rotate(90deg)}
  .tl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .tc{font-size:10.5px;color:var(--ink4);font-family:var(--mono);flex:0 0 auto}
  .tkids{display:none;margin-left:11px;border-left:1px solid var(--line2);padding-left:3px}
  .tnode.open > .tkids{display:block}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .tproj .tl{font-size:12px;color:var(--ink2)}
  .tproj .tl .st{color:var(--ink4);font-size:10px;margin-left:4px;font-family:var(--mono)}
  .archflag{color:#0F6E56;font-size:9px;margin-left:3px}

  /* ---------- 内容 ---------- */
  .crumbs{font-size:12px;color:var(--ink3);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .crumbs a{cursor:pointer;border-bottom:1px dotted var(--line)}
  .crumbs a:hover{color:var(--ink)}
  h1.vt{font-size:17px;font-weight:500;margin:0 0 4px}
  .vs{font-size:12.5px;color:var(--ink3);margin-bottom:18px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer}
  .dcard:hover{border-color:#C9C7C0}
  .dcard .n{font-size:13.5px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .dcard .m{font-size:11.5px;color:var(--ink3);line-height:1.6}
  .dcard .bar{height:4px;background:#F1EFE8;border-radius:3px;margin-top:9px;overflow:hidden;display:flex}
  .dcard .bar i{height:100%;display:block}

  /* 紧凑项目列表 */
  table.pl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  table.pl th{text-align:left;font-size:11px;font-weight:400;color:var(--ink3);padding:9px 12px;
    background:#FAFAF8;border-bottom:1px solid var(--line)}
  table.pl td{padding:9px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:middle}
  table.pl tr:last-child td{border-bottom:none}
  table.pl tbody tr{cursor:pointer}
  table.pl tbody tr:hover{background:#FAFAF8}
  .pname{font-weight:500}
  .prepo{font-size:11px;color:var(--ink3);font-family:var(--mono)}
  .num{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;white-space:nowrap}
  .chip{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:20px;background:#F1EFE8;color:var(--ink2);white-space:nowrap}
  .chip.star{background:#FAEEDA;color:#854F0B;font-weight:500}
  .chip.lic{background:#EAF3DE;color:#3B6D11}
  .chip.lang{background:#E6F1FB;color:#185FA5}
  .chip.arch{background:#E1F5EE;color:#0F6E56;font-weight:500}
  .chip.pri{background:#EEEDFE;color:#534AB7;font-weight:500}

  /* ---------- 项目详情 ---------- */
  .dhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .dhead h1{font-size:19px;font-weight:500;margin:0}
  .dhead .sub{font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:3px}
  .dchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:13px}
  .panel > h2{font-size:13.5px;font-weight:500;margin:0 0 3px}
  .panel > .ph{font-size:11.5px;color:var(--ink3);margin-bottom:12px}
  .lead{font-size:13.5px;line-height:1.72;color:var(--ink);margin:0 0 10px}
  .feats{display:flex;flex-wrap:wrap;gap:5px}
  .feats i{font-style:normal;font-size:11px;background:#FAFAF8;border:1px solid var(--line2);
    border-radius:6px;padding:2px 8px;color:var(--ink2)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media (max-width:1080px){ .cols{grid-template-columns:1fr} }
  .bars{display:flex;flex-direction:column;gap:4px}
  .row{display:grid;grid-template-columns:124px 1fr 84px;align-items:center;gap:9px;font-size:11.5px}
  .row .lb{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
  .track{height:9px;background:#F1EFE8;border-radius:5px;overflow:hidden}
  .fill{height:100%;border-radius:5px;background:#B5D4F4}
  .fill.g{background:#9FE1CB}
  .row .vl{text-align:right;color:var(--ink3);font-family:var(--mono);font-size:11px}
  .cmd{background:#FAFAF8;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;
    font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-bottom:5px;
    white-space:pre-wrap;word-break:break-all;cursor:pointer}
  .cmd:hover{border-color:#C9C7C0}
  ol.flow,ul.pl2{margin:0;padding-left:19px}
  ol.flow li,ul.pl2 li{margin-bottom:6px;line-height:1.65;font-size:12.5px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;font-size:11px;font-weight:400;color:var(--ink3);padding:6px 10px 6px 0;border-bottom:1px solid var(--line2)}
  .tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.6}
  .tbl tr:last-child td{border-bottom:none}
  .tbl code,.kf code,.cmd{font-family:var(--mono)}
  .tbl code{font-size:11px;background:#FAFAF8;padding:1px 5px;border-radius:4px;color:var(--ink2)}
  .kf{list-style:none;margin:0;padding:0;counter-reset:k}
  .kf li{counter-increment:k;position:relative;padding-left:26px;margin-bottom:9px;line-height:1.6;font-size:12.5px}
  .kf li::before{content:counter(k);position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;
    background:#E1F5EE;color:#0F6E56;font-size:10px;text-align:center;line-height:17px;font-weight:500}
  .kf code{font-size:11px;background:#FAFAF8;padding:1px 5px;border-radius:4px;color:var(--ink2)}
  .note{font-size:12.5px;line-height:1.7;color:var(--ink2);background:#FAFAF8;border-left:2px solid var(--line);
    padding:9px 12px;border-radius:0 7px 7px 0;margin-bottom:7px}
  .mermaid-wrap{overflow-x:auto;background:#FCFCFB;border:1px solid var(--line2);border-radius:9px;padding:12px}
  .mermaid-wrap svg{max-width:100%;height:auto}
  details.src{margin-top:9px}
  details.src summary{font-size:11.5px;color:var(--ink3);cursor:pointer}
  details.src pre{background:#FAFAF8;border:1px solid var(--line2);border-radius:8px;padding:10px;
    font-size:11px;font-family:var(--mono);overflow-x:auto;margin-top:7px;color:var(--ink2)}
  .kpi{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px}
  .kpi div b{display:block;font-size:19px;font-weight:500;line-height:1.25}
  .kpi div span{font-size:11.5px;color:var(--ink3)}
  .ovrows{display:flex;flex-direction:column;gap:3px;margin-top:12px}
  .ovrow{display:flex;gap:3px;height:46px}
  .ovtile{border-radius:6px;padding:5px 7px;overflow:hidden;cursor:pointer;display:flex;
    flex-direction:column;justify-content:space-between;min-width:0}
  .ovtile:hover{filter:brightness(.94)}
  .ovtile .n{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovtile .v{font-size:9.5px;opacity:.7;font-family:var(--mono);white-space:nowrap}
  .empty{padding:50px;text-align:center;color:var(--ink3)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2C2C2A;color:#fff;
    font-size:12.5px;padding:8px 16px;border-radius:9px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:60}
  .toast.on{opacity:1}
  .back{font-size:12.5px;color:var(--ink2);background:none;border:none;padding:0;margin-bottom:12px;
    border-bottom:1px dotted var(--line);cursor:pointer}
  .back:hover{color:var(--ink)}
</style>
</head>

</div>

构建","想改训练/评测流程：改 utils/train_utils.py 的 run_epoch 与 rollout_with_stats，或直接改 scripts/train.py 的主循环","想支持新数据集格式：在 utils/dataset.py 新增 Dataset 子类，并让 train_utils.dataset_factory 认识它"],"learning_path":["第1步：读 README.md 与 docs/introduction/overview，建立框架定位与工作流直觉","第2步：读 robomimic/scripts/train.py，把配置、数据、环境、算法、评测的调用链串起来","第3步：读 robomimic/utils/train_utils.py 的 run_epoch 与 rollout_with_stats，理解训练与评测如何分离","第4步：读 robomimic/algo/algo.py 与 bc.py，理解 Algo 基类接口与工厂注册机制","第5步：读 robomimic/config/base_config.py 与 bc_config.py，理解参数体系与配置加锁","第6步：读 robomimic/utils/dataset.py，理解 hdf5 示教数据如何被读取、采样与归一化","第7步：读 robomimic/envs/env_base.py 与 env_robosuite.py，理解环境抽象与解耦"],"diagram_mermaid":"graph TD\n  CFG[Config 配置体系] --> FACT[algo_factory 算法工厂]\n  HDF5[hdf5 示教数据集] --> DS[SequenceDataset 序列采样]\n  DS --> NORM[计算观测与动作归一化统计]\n  HDF5 --> META[提取环境与形状元数据]\n  META --> ENV[EnvBase 仿真环境]\n  FACT --> ALGO[Algo 具体算法]\n  ALGO --> NET[ObservationEncoder 与策略网络]\n  NORM --> ALGO\n  DS --> EPOCH[run_epoch 训练循环]\n  EPOCH --> ALGO\n  ALGO --> CKPT[保存 checkpoint]\n  ALGO --> ROLL[RolloutPolicy 评测封装]\n  ROLL --> ENV\n  ENV --> STATS[成功率与视频统计]\n  CKPT --> AGENT[run_trained_agent 部署推理]","surprises":["环境类型不是显式配置的，而是从 hdf5 数据集的 env_meta 里读取 type 字段推断，训练时环境其实是数据集自带的元数据还原出来的","Config 默认加锁，运行期新增或修改键会直接报错，扩展算法时若忘了在 Config 子类里声明新参数会在运行时报 key 错误","算法与配置是双注册表：算法用 @register_algo_factory_func 注册，配置用 ConfigMeta 元类按 ALGO_NAME 注册，两者名字必须一致","同一个 BC 类通过 gaussian/gmm/vae/rnn/transformer 五个开关在工厂函数里派生出多种变体，读 bc.py 时容易误以为只有一种实现","训练与评测共用 RolloutPolicy 封装，但归一化统计来自数据集而非模型，换数据集评测时统计不匹配会导致动作尺度错误"],"confidence":"高"},"AgentOps-AI/agentops":{"repo":"AgentOps-AI/agentops","name":"AgentOps","one_liner":"AI Agent 的可观测、调试与成本追踪平台，基于 OpenTelemetry","problem":"解决「Agent 是黑盒、出错难定位、成本不可控」的问题：用装饰器与自动埋点把 Agent 每一步的调用、LLM 请求、工具执行变成结构化 Span，上报到可视化面板做回放、调试与成本统计。","difficulty":"中等","core_abstractions":[{"name":"Client","role":"单例门面：读取配置、初始化追踪核心与 API 客户端、启动鉴权任务、按需开启自动埋点，并管理默认会话","file":"agentops/client/client.py"},{"name":"TracingCore","role":"追踪核心：装配 TracerProvider 与处理器、创建/结束 trace、生成 span 并维护活动 trace 表","file":"agentops/sdk/core.py"},{"name":"TraceContext","role":"会话级 trace 的上下文包装：持有根 span 与 context token，作为上下文管理器在退出时按异常与否写入 OK/ERROR 状态","file":"agentops/sdk/core.py"},{"name":"create_entity_decorator","role":"装饰器工厂：为每种实体类型生成 @agent/@task/@tool/@workflow 等装饰器，统一处理同步/异步/生成器函数与类装饰","file":"agentops/sdk/decorators/factory.py"},{"name":"_create_as_current_span","role":"Span 创建原语：按 操作名.类型 命名，写入 agentops.span.kind 等标准属性，用 OTel context 管理实现正确嵌套","file":"agentops/sdk/decorators/utility.py"},{"name":"AuthenticatedOTLPExporter","role":"带鉴权的 OTLP 导出器：支持动态 JWT，token 刷新无需重建 exporter，是 span 上报到 AgentOps 后端的出口","file":"agentops/sdk/exporters.py"},{"name":"InternalSpanProcessor","role":"内部 span 处理器：拦截 span 结束事件用于终端打印与本地可视化提示，与批量导出处理器并列","file":"agentops/sdk/processors.py"},{"name":"CommonInstrumentor","role":"自动埋点基类：封装按版本探测、包装与卸载逻辑，各 LLM/框架 instrumentor 继承它实现无侵入埋点","file":"agentops/instrumentation/common/instrumentor.py"},{"name":"SpanKind","role":"语义约定之 Span 类型枚举：workflow/session/task/agent/tool/llm/guardrail 等，决定 span 在面板中的归类","file":"agentops/semconv/span_kinds.py"},{"name":"SpanAttributes","role":"语义约定之属性键常量：agentops.span.kind、operation.name、agentops.<kind>.input 等统一命名","file":"agentops/semconv/span_attributes.py"},{"name":"ApiClient","role":"后端 API 客户端：负责鉴权换取 JWT、项目信息等控制面交互，与数据面的 OTLP 上报分离","file":"agentops/client/api/__init__.py"}],"layers":[{"name":"门面与初始化层","responsibility":"对外暴露 init 与各装饰器，管理单例 Client、配置解析与默认会话生命周期","modules":["agentops","agentops/client"],"files":["agentops/__init__.py","agentops/client/client.py","agentops/config.py"]},{"name":"追踪核心层","responsibility":"装配遥测管线、创建与结束 trace/span、维护上下文与活动 trace 表","modules":["agentops/sdk"],"files":["agentops/sdk/core.py","agentops/sdk/types.py","agentops/sdk/attributes.py"]},{"name":"装饰器埋点层","responsibility":"提供 @trace/@agent/@task/@tool 等装饰器，自动为被装饰函数创建对应类型的 span 并记录输入输出","modules":["agentops/sdk/decorators"],"files":["agentops/sdk/decorators/__init__.py","agentops/sdk/decorators/factory.py","agentops/sdk/decorators/utility.py"]},{"name":"遥测导出层","responsibility":"span 处理器与 OTLP 导出器，负责批量、鉴权地把遥测数据发往后端","modules":["agentops/sdk"],"files":["agentops/sdk/exporters.py","agentops/sdk/processors.py"]},{"name":"语义约定层","responsibility":"定义 Span 类型、属性键、状态与资源属性的统一命名规范","modules":["agentops/semconv"],"files":["agentops/semconv/span_kinds.py","agentops/semconv/span_attributes.py","agentops/semconv/resource.py"]},{"name":"自动埋点层","responsibility":"通过 import hook 探测并包装 LLM 提供商与 Agent 框架，实现无侵入埋点","modules":["agentops/instrumentation"],"files":["agentops/instrumentation/__init__.py","agentops/instrumentation/common/instrumentor.py","agentops/instrumentation/providers/openai/instrumentor.py"]},{"name":"传输与鉴权层","responsibility":"控制面 API 调用、HTTP 适配与 token 获取","modules":["agentops/client/http","agentops/client/api"],"files":["agentops/client/http/http_client.py","agentops/client/api/__init__.py","agentops/client/api/base.py"]},{"name":"兼容与辅助层","responsibility":"旧版 Session/Event 模型兼容、序列化、日志与环境信息采集","modules":["agentops/legacy","agentops/helpers","agentops/logging"],"files":["agentops/legacy/event.py","agentops/helpers/serialization.py","agentops/logging/config.py"]}],"data_flow":["第1步：import agentops 时若配置自动初始化，则线程安全地创建 Client 单例并解析 Config","第2步：Client.init() 读取 API key，构建 ApiClient，调用 tracer.initialize_from_config 装配追踪核心","第3步：setup_telemetry 创建 AuthenticatedOTLPExporter、BatchSpanProcessor 与 InternalSpanProcessor，并注册到全局 TracerProvider","第4步：若 instrument_llm_calls 为真，调用 instrument_all() 用 import hook 自动探测并包装已安装的 LLM 库与 Agent 框架","第5步：用户用 @trace/@agent/@task/@tool 装饰函数或类，装饰器在调用时通过 _create_as_current_span 创建对应 SpanKind 的 span","第6步：span 创建时写入 agentops.span.kind、operation.name 等标准属性，并序列化函数输入到 agentops.<kind>.input","第7步：函数返回后记录输出属性，退出 context 时 span 自动 end，异常则标记为 ERROR 状态","第8步：会话级别由 tracer.start_trace 创建根 span，end_trace 写入结束状态并触发立即导出","第9步：自动埋点的 provider instrumentor 在真实 LLM 调用处创建 LLM span，抽取模型、token、prompt 等属性","第10步：span 结束时进入 BatchSpanProcessor 队列，达到批量或时间阈值后由 AuthenticatedOTLPExporter 携带 JWT 发往 OTLP 端点","第11步：后端接收 span 并在 AgentOps 面板中按 Session 组织成可回放的执行轨迹","第12步：若开启 log_session_replay_url，客户端会打印可在面板回放的会话链接方便调试"],"entry_points":[{"path":"agentops/__init__.py:init","what":"初始化 AgentOps SDK，配置 API key、标签与自动埋点开关"},{"path":"agentops/sdk/decorators/__init__.py","what":"定义并导出 @trace/@agent/@task/@tool/@workflow 等埋点装饰器"},{"path":"agentops/client/client.py:init","what":"Client 初始化核心，串联配置、追踪核心、API 客户端与自动埋点"},{"path":"agentops/sdk/core.py:setup_telemetry","what":"遥测管线装配入口，创建 exporter 与 processor 并设为全局 provider"},{"path":"agentops/instrumentation/__init__.py","what":"自动埋点注册表与 instrument_all 入口，决定埋点哪些库"}],"key_files":[{"path":"README.md","why":"先建立认知：基于 OpenTelemetry 的可观测平台，Session/Agent/Task 等概念与基本用法"},{"path":"agentops/__init__.py","why":"对外 API 总览：init、装饰器导出与 legacy 兼容入口"},{"path":"agentops/client/client.py","why":"初始化全链路，理解配置、鉴权与追踪核心如何被装配"},{"path":"agentops/sdk/core.py","why":"TracingCore 与 setup_telemetry，是追踪机制的中枢"},{"path":"agentops/sdk/decorators/factory.py","why":"装饰器工厂，看 @agent/@task/@tool 如何统一生成埋点逻辑"},{"path":"agentops/sdk/decorators/utility.py","why":"_create_as_current_span 如何建 span 与写属性，是最小埋点单元"},{"path":"agentops/sdk/exporters.py","why":"数据如何带鉴权上报到后端，理解数据面出口"},{"path":"agentops/instrumentation/__init__.py","why":"自动埋点注册表，理解无侵入埋点覆盖了哪些库"},{"path":"agentops/instrumentation/common/instrumentor.py","why":"自动埋点基类，扩展新库埋点的起点"},{"path":"agentops/semconv/span_kinds.py","why":"Span 类型语义约定，理解数据模型如何在面板中归类"}],"extension_points":["加一个新实体类型的装饰器：调用 create_entity_decorator(SpanKind.XXX) 生成，见 agentops/sdk/decorators/__init__.py","加一个新 LLM 或框架的自动埋点：继承 CommonInstrumentor 并在 INSTRUMENTORS 注册，见 agentops/instrumentation/__init__.py","更换或新增上报后端：替换 AuthenticatedOTLPExporter 或新增 SpanProcessor，见 agentops/sdk/exporters.py","新增语义属性常量：在 agentops/semconv/span_attributes.py 添加属性键","自定义对象序列化：改 agentops/helpers/serialization.py 的 safe_serialize","自定义资源属性：改 agentops/sdk/attributes.py 的 get_global_resource_attributes"],"learning_path":["第1步：读 README.md，理解它基于 OpenTelemetry，Session/Agent/Task/Tool 都是 span","第2步：读 agentops/__init__.py 的 init 与装饰器导出，跑通一个最小埋点示例","第3步：读 client/client.py 的 init，看初始化链路如何串联配置、鉴权与追踪核心","第4步：读 sdk/core.py 的 TracingCore、setup_telemetry、start_trace，掌握 span 与 trace 生命周期","第5步：读 sdk/decorators/factory.py 与 utility.py，理解装饰器如何自动建 span 并记录输入输出","第6步：读 sdk/exporters.py 与 processors.py，理解 span 如何批量、带鉴权地上报","第7步：读 instrumentation/__init__.py 与 common/instrumentor.py，掌握无侵入自动埋点机制","第8步：读 semconv/span_kinds.py 与 span_attributes.py，理解语义约定如何组织数据模型"],"diagram_mermaid":"graph TD\n  I[import agentops 并 init] --> C[Client 单例初始化]\n  C --> CF[解析 Config 与 API Key]\n  C --> T[TracingCore 追踪核心]\n  T --> ST[setup_telemetry 装配管线]\n  ST --> EX[AuthenticatedOTLPExporter 导出器]\n  ST --> BP[BatchSpanProcessor 批处理器]\n  C --> IN[instrument_all 自动埋点]\n  D[装饰器 trace agent task tool] --> SP[_create_as_current_span 建 span]\n  IN --> LLM[LLM 调用处自动建 LLM span]\n  SP --> AT[写入 span 属性与输入输出]\n  LLM --> AT\n  AT --> BP\n  BP --> EX\n  EX --> BE[AgentOps 后端与面板]\n  BE --> RP[会话回放与成本分析]","surprises":["v4 完全构建在 OpenTelemetry 之上：Session、Agent、Task、Tool 等 AgentOps 概念本质都是带 agentops.span.kind 属性的 OTel Span，而不是自有事件模型","埋点有两条并行路径：装饰器显式埋点，以及 instrument_all 用 import hook 监控 import 并包装已安装的 LLM 库实现无侵入埋点","上报用 AuthenticatedOTLPExporter 动态注入 JWT，token 刷新无需重建 exporter，鉴权失败还有每分钟一次的退避限制","为了向后兼容保留了大量 legacy：agentops.legacy 里仍是旧的 Session/Event 模型，@session 现在只是 @trace 的别名","SpanKind 枚举同时容纳 OTel 风格的 workflow/agent/tool 与 legacy 的 agent.action/agent.thinking/llm.call，两套命名并存"],"confidence":"高"},"Cinnamon/kotaemon":{"repo":"Cinnamon/kotaemon","name":"kotaemon","one_liner":"开箱即用、可二次开发的文档问答 RAG 界面与框架","problem":"让用户直接对私有文档做可溯源的问答，同时让开发者能自由替换解析、切分、检索、重排、生成各环节，并把结果落到一个多用户 Gradio 界面里。","difficulty":"中等","core_abstractions":[{"name":"BaseComponent","role":"所有管线组件的基类，基于 theflow 的 Function 实现依赖注入、自动装配与缓存，是组合 RAG 管线的最小单元","file":"libs/kotaemon/kotaemon/base/component.py"},{"name":"Document / RetrievedDocument","role":"贯穿全流程的数据载体，继承 llama-index 的 Document，RetrievedDocument 额外携带 score 与 retrieval_metadata","file":"libs/kotaemon/kotaemon/base/schema.py"},{"name":"VectorIndexing / VectorRetrieval","role":"核心检索内核：前者做 embedding 并写库，后者实现 vector/text/hybrid 三种检索模式与重排","file":"libs/kotaemon/kotaemon/indices/vectorindex.py"},{"name":"BaseVectorStore / BaseDocumentStore","role":"向量库与文档库的存储抽象，决定底层用 Chroma、LanceDB、Qdrant 还是 Milvus","file":"libs/kotaemon/kotaemon/storages/vectorstores/base.py"},{"name":"FileIndex","role":"应用级索引：管理 SQL 关系表、向量库、文档库、文件存储四类资源，并装配索引与检索管线","file":"libs/ktem/ktem/index/file/index.py"},{"name":"BaseFileIndexIndexing / BaseFileIndexRetriever","role":"索引管线与检索管线的接口契约，定义 get_pipeline 与 run/stream 的扩展方式","file":"libs/ktem/ktem/index/file/base.py"},{"name":"BaseReasoning / FullQAPipeline","role":"推理管线基类与默认 QA 实现，串联检索、证据组织、生成与引用展示","file":"libs/ktem/ktem/reasoning/base.py"},{"name":"LLMManager / ModelPool","role":"模型注册表，从 SQLite 加载 LLM/Embedding/Reranking 配置并按名字或默认值取用","file":"libs/ktem/ktem/llms/manager.py"},{"name":"BaseApp","role":"Gradio 应用装配器，负责注册扩展、推理管线与索引，并声明和订阅界面事件","file":"libs/ktem/ktem/app.py"},{"name":"SettingGroup","role":"把 flowsettings 与各组件声明的用户设置组织成可在 UI 上编辑的参数体系","file":"libs/ktem/ktem/settings.py"}],"layers":[{"name":"核心 RAG 框架层","responsibility":"提供与 UI 无关的通用组件：数据模型、检索内核、存储与模型抽象","modules":["libs/kotaemon/kotaemon"],"files":["libs/kotaemon/kotaemon/base/component.py","libs/kotaemon/kotaemon/base/schema.py","libs/kotaemon/kotaemon/indices/vectorindex.py","libs/kotaemon/kotaemon/indices/base.py"]},{"name":"存储抽象层","responsibility":"向量库与文档库的统一接口及多种后端实现","modules":["libs/kotaemon/kotaemon/storages"],"files":["libs/kotaemon/kotaemon/storages/vectorstores/base.py","libs/kotaemon/kotaemon/storages/docstores/base.py"]},{"name":"重排与检索扩展层","responsibility":"提供重排器与网页检索等可插拔检索增强组件","modules":["libs/kotaemon/kotaemon/indices/rankings","libs/kotaemon/kotaemon/indices/retrievers"],"files":["libs/kotaemon/kotaemon/indices/rankings/base.py","libs/kotaemon/kotaemon/indices/rankings/llm.py"]},{"name":"应用装配层","responsibility":"ktem 应用：装配 Gradio 界面、注册扩展与索引、组织设置","modules":["libs/ktem/ktem"],"files":["libs/ktem/ktem/app.py","libs/ktem/ktem/main.py","libs/ktem/ktem/components.py","libs/ktem/ktem/settings.py"]},{"name":"索引与管线层","responsibility":"文件索引的资源管理以及索引/检索管线的具体实现","modules":["libs/ktem/ktem/index"],"files":["libs/ktem/ktem/index/file/index.py","libs/ktem/ktem/index/file/pipelines.py","libs/ktem/ktem/index/manager.py"]},{"name":"推理层","responsibility":"把检索结果与 LLM 组合成带引用、可流式的问答管线","modules":["libs/ktem/ktem/reasoning"],"files":["libs/ktem/ktem/reasoning/simple.py","libs/ktem/ktem/reasoning/react.py","libs/ktem/ktem/reasoning/rewoo.py"]},{"name":"界面层","responsibility":"Gradio 页面：对话、资源、设置、索引管理，并把用户操作接到后端管线","modules":["libs/ktem/ktem/pages"],"files":["libs/ktem/ktem/pages/chat/__init__.py","libs/ktem/ktem/pages/chat/chat_panel.py"]},{"name":"配置层","responsibility":"集中定义数据目录、数据库、向量库/文档库类型与可用的模型清单","modules":["."],"files":["flowsettings.py","app.py"]}],"data_flow":["第1步：python app.py 调用 App.make 构建 Gradio Blocks，BaseApp 初始化时注册扩展、推理管线与索引","第2步：用户上传文件，FileIndex.get_indexing_pipeline 构造索引管线","第3步：IndexDocumentPipeline.stream 遍历文件，route 按扩展名选择 loader 解析成文本块","第4步：TokenSplitter 按 chunk_size 切分，Document 经 embedding 后同时写入向量库、文档库与 SQL 关系表","第5步：用户提问，chat 页面按设置选出 reasoning 类并为每个索引收集 retrievers","第6步：reasoning_cls.get_pipeline 注入选定 LLM 与 retrievers，构造可执行推理管线","第7步：FullQAPipeline.stream 调用 retrieve，VectorRetrieval 以 hybrid 模式并行做向量检索与全文检索并合并","第8步：rerankers 对候选文档重排，可选 LLM 相关度打分","第9步：PrepareEvidencePipeline 组织证据文本，AnswerWithContextPipeline 生成带引用的回答","第10步：管线流式 yield 不同 channel 的 Document，Gradio 分别渲染到聊天、信息、图表面板"],"entry_points":[{"path":"app.py","what":"应用启动入口：创建 App 并 launch Gradio 服务"},{"path":"libs/ktem/ktem/main.py:App.make","what":"渲染主界面并串联各页面事件"},{"path":"libs/ktem/ktem/app.py:BaseApp","what":"应用装配核心：注册扩展、推理管线、索引与设置"},{"path":"libs/ktem/ktem/pages/chat/__init__.py:chat_fn","what":"对话主流程，负责组装 retrievers 与 reasoning 管线并驱动生成"},{"path":"libs/ktem/ktem/index/file/pipelines.py:DocumentRetrievalPipeline","what":"默认检索管线入口，展示混合检索与重排如何串联"}],"key_files":[{"path":"README.md","why":"先分清 end user / developer / contributor 三层定位与两包结构"},{"path":"flowsettings.py","why":"一份文件看懂全局配置：数据目录、向量库/文档库类型、模型清单、索引与推理注册"},{"path":"libs/ktem/ktem/app.py","why":"理解应用如何把扩展、索引、推理管线装配进 Gradio"},{"path":"libs/ktem/ktem/index/file/index.py","why":"FileIndex 是索引的资源中枢，看 Source/Index/VS/DS 如何组织"},{"path":"libs/ktem/ktem/index/file/pipelines.py","why":"索引与检索管线的完整实现，含 loader 路由、切分、混合检索与重排"},{"path":"libs/kotaemon/kotaemon/indices/vectorindex.py","why":"检索内核：三种检索模式与 reranker 调用都在这"},{"path":"libs/ktem/ktem/reasoning/simple.py","why":"默认 QA 推理管线，理解检索结果如何变成带引用的回答"},{"path":"libs/ktem/ktem/llms/manager.py","why":"模型注册表，理解 LLM 如何被配置与取用"},{"path":"libs/kotaemon/kotaemon/base/component.py","why":"组件模型基础，理解 theflow 依赖注入是读懂全部管线的钥匙"}],"extension_points":["加新推理管线：在 libs/ktem/ktem/reasoning/ 新增实现并注册到 flowsettings.py 的 KH_REASONINGS","加新索引或检索管线：实现 libs/ktem/ktem/index/file/base.py 的接口，并通过 FILE_INDEX_PIPELINE / FILE_INDEX_RETRIEVER_PIPELINES 指定","换向量库或文档库：改 flowsettings.py 的 KH_VECTORSTORE / KH_DOCSTORE 的 __type__","加新 LLM 或 Embedding：在 flowsettings.py 的 KH_LLMS / KH_EMBEDDINGS 增加 spec，或在 Resources 页动态添加","加新文件解析器：在 IndexDocumentPipeline.readers 增加扩展名到 reader 的映射，reader 定义见 kotaemon/indices/ingests/files.py","加新重排器：继承 BaseReranking，参考 libs/kotaemon/kotaemon/indices/rankings/base.py"],"learning_path":["第1步：读 README 与 flowsettings.py，建立 kotaemon 与 ktem 两包分工的认知","第2步：读 base/component.py，理解 theflow 的组件与依赖注入模型","第3步：读 ktem/app.py，看应用如何注册扩展、索引与推理管线","第4步：读 index/file/index.py 与 pipelines.py，掌握索引与检索管线","第5步：读 indices/vectorindex.py，吃透混合检索与重排","第6步：读 reasoning/simple.py，理解证据组织与带引用生成","第7步：读 pages/chat/__init__.py，看 UI 如何把检索与推理串起来"],"diagram_mermaid":"graph TD\n  U[用户上传文件] --> FI[FileIndex 资源中枢]\n  FI --> IP[IndexDocumentPipeline]\n  IP --> LD[Loader 解析]\n  LD --> SP[TokenSplitter 切分]\n  SP --> EM[Embedding 向量化]\n  EM --> VS[VectorStore 向量库]\n  SP --> DS[DocStore 文档库]\n  SP --> DB[SQL 关系表]\n  Q[用户提问] --> CP[Chat Page 组装]\n  CP --> RT[Retriever 列表]\n  RT --> VR[VectorRetrieval 混合检索]\n  VS --> VR\n  DS --> VR\n  VR --> RK[Reranker 重排]\n  RK --> EV[PrepareEvidence 组织证据]\n  EV --> QA[AnswerWithContext 生成回答]\n  QA --> UI[Gradio 面板展示]","surprises":["项目其实是两层包：kotaemon 是可独立 import 的通用 RAG 框架，ktem 才是那个开箱即用的应用；改行为多数时候在改 ktem 而非 kotaemon","所有管线组件不是普通类，而是 theflow 的 Function，靠 @Node.auto / Param.auto 声明依赖并自动装配，不熟悉 theflow 会看不懂构造函数为何没有显式传参","hybrid 检索并非分数融合，而是向量检索与全文检索两个线程并行执行后按 doc_id 去重拼接，全文检索命中项 score 固定为 -1","索引一次写三处：SQL 关系表、向量库、文档库，删除文件时必须三处同步清理，否则残留","模型配置在首次启动时写入 SQLite，之后修改 .env 不再生效，需在 Resources 页调整","文件名与内容的关联靠 Index 表的 source_id 到 target_id 关系过滤，而不是文档自身元数据"],"confidence":"高"},"DLR-RM/stable-baselines3":{"repo":"DLR-RM/stable-baselines3","name":"Stable-Baselines3","one_liner":"PyTorch 实现的一组可靠强化学习算法库，接口统一","problem":"强化学习算法实现质量参差、接口各异，难以复现与对比。SB3 用统一的 Algorithm + Policy 抽象把 PPO/A2C/DQN/SAC/TD3/DDPG 等算法收敛到同一套 learn/predict/save/load 接口，并保证实现经过验证。","difficulty":"中等","core_abstractions":[{"name":"BaseAlgorithm","role":"所有 RL 算法的抽象基类，规定 learn/predict/save/load/set_env 等统一接口与学习循环骨架","file":"stable_baselines3/common/base_class.py"},{"name":"BasePolicy","role":"所有策略的抽象基类，继承 nn.Module，规定 predict、_predict、obs_to_tensor、set_training_mode 等契约","file":"stable_baselines3/common/policies.py"},{"name":"ActorCriticPolicy","role":"最常用的策略实现，含策略网络与价值网络，提供 forward 返回动作/价值/对数概率及 evaluate_actions","file":"stable_baselines3/common/policies.py"},{"name":"OnPolicyAlgorithm","role":"在线策略算法基类，实现 collect_rollouts 采样循环与 rollout_buffer 填充，A2C/PPO 由此派生","file":"stable_baselines3/common/on_policy_algorithm.py"},{"name":"OffPolicyAlgorithm","role":"离线策略算法基类，实现经验回放、replay_buffer 采样与按 train_freq 训练，DQN/SAC/TD3/DDPG 由此派生","file":"stable_baselines3/common/off_policy_algorithm.py"},{"name":"BaseBuffer","role":"经验缓冲区抽象，ReplayBuffer 与 RolloutBuffer 分别服务离线与在线算法，负责存取与采样","file":"stable_baselines3/common/buffers.py"},{"name":"BaseCallback","role":"回调机制抽象，通过 on_step/on_rollout_start/on_training_end 等钩子让用户介入训练循环","file":"stable_baselines3/common/callbacks.py"},{"name":"VecEnv","role":"向量化环境抽象基类，定义 reset/step_async/step_wait 等批量接口，统一单环境与多环境","file":"stable_baselines3/common/vec_env/base_vec_env.py"},{"name":"Logger","role":"日志抽象，把指标输出到 stdout、TensorBoard、CSV 等多种后端","file":"stable_baselines3/common/logger.py"},{"name":"BaseModel","role":"策略与网络的通用父类，管理特征提取器与设备，提供 save/load 与参数向量化能力","file":"stable_baselines3/common/policies.py"}],"layers":[{"name":"算法基类层","responsibility":"定义所有算法的公共接口与学习循环骨架，区分在线/离线两种范式","modules":["stable_baselines3/common"],"files":["stable_baselines3/common/base_class.py","stable_baselines3/common/on_policy_algorithm.py","stable_baselines3/common/off_policy_algorithm.py"]},{"name":"策略与网络层","responsibility":"定义策略抽象与 ActorCritic 网络结构、特征提取器、动作分布","modules":["stable_baselines3/common/policies.py"],"files":["stable_baselines3/common/policies.py","stable_baselines3/common/torch_layers.py","stable_baselines3/common/distributions.py"]},{"name":"环境与向量化层","responsibility":"封装 gym 环境为 VecEnv，提供并行、归一化、监控、图像转置等包装器","modules":["stable_baselines3/common/vec_env","stable_baselines3/common/env_util.py","stable_baselines3/common/monitor.py","stable_baselines3/common/env_checker.py"],"files":["stable_baselines3/common/vec_env/base_vec_env.py","stable_baselines3/common/vec_env/dummy_vec_env.py","stable_baselines3/common/vec_env/subproc_vec_env.py","stable_baselines3/common/vec_env/vec_normalize.py"]},{"name":"经验缓冲层","responsibility":"存储与采样经验，含 rollout buffer、replay buffer 与 HER 目标重标记缓冲","modules":["stable_baselines3/common/buffers.py","stable_baselines3/her"],"files":["stable_baselines3/common/buffers.py","stable_baselines3/her/her_replay_buffer.py"]},{"name":"回调与日志层","responsibility":"训练过程的事件钩子、进度记录、检查点保存与动作噪声","modules":["stable_baselines3/common/callbacks.py","stable_baselines3/common/logger.py","stable_baselines3/common/noise.py"],"files":["stable_baselines3/common/callbacks.py","stable_baselines3/common/logger.py","stable_baselines3/common/noise.py"]},{"name":"具体算法层","responsibility":"各算法的网络更新实现，通过继承在线/离线基类并声明 policy_aliases 接入","modules":["stable_baselines3/a2c","stable_baselines3/ppo","stable_baselines3/dqn","stable_baselines3/sac","stable_baselines3/td3","stable_baselines3/ddpg","stable_baselines3/her"],"files":["stable_baselines3/ppo/ppo.py","stable_baselines3/dqn/dqn.py","stable_baselines3/sac/sac.py","stable_baselines3/td3/td3.py","stable_baselines3/a2c/a2c.py"]},{"name":"工具与序列化层","responsibility":"类型别名、调度器、随机种子、zip 模型存取与向量化环境工具","modules":["stable_baselines3/common"],"files":["stable_baselines3/common/utils.py","stable_baselines3/common/type_aliases.py","stable_baselines3/common/save_util.py","stable_baselines3/common/preprocessing.py"]}],"data_flow":["第1步：用户创建环境并调用 model = PPO(\"MlpPolicy\", env)，BaseAlgorithm.__init__ 通过 _get_policy_from_name 从 policy_aliases 解析策略类","第2步：_wrap_env 把 gym 环境包成 DummyVecEnv 并按需加 Monitor，统一成 VecEnv 接口","第3步：model.learn(total_timesteps) 调用 _setup_learn 初始化 Logger、回调列表、随机种子与 _last_obs","第4步：_setup_model 依据 observation_space 实例化 policy、rollout_buffer 与 optimizer","第5步：进入 while 循环，collect_rollouts 用 policy(obs) 采样动作、价值和 log_probs","第6步：env.step 执行动作得到 new_obs/rewards/dones/infos，num_timesteps 累加","第7步：每步 callback.update_locals(locals()) 与 callback.on_step 触发用户回调","第8步：把 (obs, action, reward, value, log_prob) 存入 rollout_buffer，更新 _last_obs","第9步：rollout 结束调用 compute_returns_and_advantage 计算回报与优势","第10步：self.train() 从 rollout_buffer 采样 minibatch 做多轮梯度更新优化 policy","第11步：重复 collect/train 直到 num_timesteps 达到 total_timesteps，触发 on_training_end","第12步：可用 model.save 存成 zip，或用 model.predict 在新环境上推理动作"],"entry_points":[{"path":"stable_baselines3/common/base_class.py:512","what":"BaseAlgorithm.learn 抽象方法，所有算法的训练入口契约"},{"path":"stable_baselines3/common/base_class.py:537","what":"BaseAlgorithm.predict，用策略推理单个观测的动作"},{"path":"stable_baselines3/common/base_class.py:643","what":"BaseAlgorithm.load 类方法，从 zip 恢复模型与策略"},{"path":"stable_baselines3/common/base_class.py:819","what":"BaseAlgorithm.save，把模型与缓冲序列化成 zip"},{"path":"stable_baselines3/common/on_policy_algorithm.py:300","what":"OnPolicyAlgorithm.learn，在线算法的主训练循环"},{"path":"stable_baselines3/common/on_policy_algorithm.py:162","what":"collect_rollouts，在线算法采样并填充 rollout buffer"},{"path":"stable_baselines3/common/off_policy_algorithm.py:324","what":"OffPolicyAlgorithm.learn，离线算法的主训练循环"},{"path":"stable_baselines3/dqn/dqn.py:266","what":"DQN.learn，DQN 专属训练循环覆写"}],"key_files":[{"path":"README.md","why":"先了解定位：可靠实现、统一接口，以及 contrib 与 zoo 的关系"},{"path":"stable_baselines3/common/base_class.py","why":"BaseAlgorithm 是所有算法的公共骨架，理解 learn/predict/save/load 契约"},{"path":"stable_baselines3/common/on_policy_algorithm.py","why":"在线算法的采样-训练循环与 collect_rollouts 实现"},{"path":"stable_baselines3/common/off_policy_algorithm.py","why":"离线算法的经验回放循环，与在线算法对照阅读"},{"path":"stable_baselines3/ppo/ppo.py","why":"最典型的在线算法，看 policy_aliases 声明与 train 更新逻辑"},{"path":"stable_baselines3/common/policies.py","why":"BasePolicy/ActorCriticPolicy，理解策略与算法的组合方式"},{"path":"stable_baselines3/common/callbacks.py","why":"回调机制的全部钩子，扩展训练过程必读"},{"path":"stable_baselines3/common/vec_env/base_vec_env.py","why":"VecEnv 抽象，理解环境如何被统一与向量化"},{"path":"stable_baselines3/common/buffers.py","why":"ReplayBuffer 与 RolloutBuffer，理解经验存储与采样"},{"path":"stable_baselines3/dqn/dqn.py","why":"典型离线算法，与 PPO 对照看两类范式差异"}],"extension_points":["想加新算法：新建 stable_baselines3/<algo>/ 目录，继承 OnPolicyAlgorithm 或 OffPolicyAlgorithm，实现 _setup_model/train/learn，并声明 policy_aliases 字典把策略名映射到策略类","想加新策略：继承 stable_baselines3/common/policies.py 的 BasePolicy 或 ActorCriticPolicy，实现 _predict、forward、evaluate_actions，并在算法的 policy_aliases 里登记","想加新特征提取器：继承 BaseFeaturesExtractor，通过 policy_kwargs 的 features_extractor_class 传入","想加新回调：继承 stable_baselines3/common/callbacks.py 的 BaseCallback，重写 _on_step / _on_rollout_end 等钩子，learn 时用 callback= 传入","想加新环境包装器或向量化后端：继承 VecEnv 或 VecEnvWrapper，实现 reset/step_async/step_wait","想加新经验缓冲：继承 BaseBuffer 或 ReplayBuffer，在算法的 replay_buffer_class / rollout_buffer_class 指定","想加新的日志后端：继承 stable_baselines3/common/logger.py 的 KVWriter 并注册"],"learning_path":["第1步：读 README.md 与官方文档的 RL 入门指南，建立算法与接口的总体印象","第2步：读 stable_baselines3/common/base_class.py 的 BaseAlgorithm，掌握统一接口与 _setup_learn","第3步：读 stable_baselines3/common/on_policy_algorithm.py 与 off_policy_algorithm.py，理解在线/离线两种学习循环","第4步：读 stable_baselines3/ppo/ppo.py，看一个具体算法如何声明策略别名并实现 train","第5步：读 stable_baselines3/common/policies.py，理解策略与算法如何组合、forward 与 _predict 的分工","第6步：读 stable_baselines3/common/callbacks.py，掌握回调扩展机制","第7步：读 stable_baselines3/common/vec_env/base_vec_env.py，理解环境的统一与向量化"],"diagram_mermaid":"graph TD\n  USER[用户代码 PPO 加 env] --> INIT[BaseAlgorithm 初始化]\n  INIT --> RESOLVE[按 policy_aliases 解析策略类]\n  INIT --> WRAP[_wrap_env 包装成 VecEnv]\n  USER --> LEARN[learn 训练循环]\n  LEARN --> SETUP[_setup_learn 初始化日志与回调]\n  SETUP --> MODEL[_setup_model 实例化 policy 与 buffer]\n  MODEL --> COLLECT[collect_rollouts 采样经验]\n  COLLECT --> POLICY[policy 前向采样动作]\n  POLICY --> STEP[env.step 执行动作]\n  STEP --> CB[callback.on_step 触发回调]\n  STEP --> BUFFER[经验存入 rollout buffer]\n  BUFFER --> ADV[计算回报与优势]\n  ADV --> TRAIN[train 梯度更新 policy]\n  TRAIN --> COLLECT\n  LEARN --> SAVE[save 存成 zip 模型]\n  LEARN --> PREDICT[predict 推理动作]","surprises":["算法与策略是解耦的两条线：算法只管学习循环，策略只管网络与动作采样，二者通过 policy_aliases 字典按字符串名绑定","所有算法共用同一套 learn/predict/save/load 接口，即使单个环境也会被包成 DummyVecEnv，所以内部永远是批量接口","回调通过 update_locals(locals()) 动态注入训练循环的局部变量，回调里能直接读到当前步的 obs、reward 等内部状态","策略的 forward 与 _predict 分工不同：forward 训练时返回动作/价值/对数概率，_predict 推理时只返回动作，混用会出错","模型保存成 zip，policy、optimizer、replay_buffer 一起打包，load 依赖递归 getattr/setattr 恢复，改动属性名可能破坏兼容"],"confidence":"高"},"Farama-Foundation/Gymnasium":{"repo":"Farama-Foundation/Gymnasium","name":"Gymnasium","one_liner":"强化学习环境与算法之间的标准 Python 接口库","problem":"用统一 API 描述环境与智能体的交互，让不同 RL 算法与不同环境可以互相替换并公平比较，同时提供一批标准环境和可复用的包装器。","difficulty":"入门","core_abstractions":[{"name":"Env","role":"最核心接口，定义 step/reset/render/close 与 action_space/observation_space，所有环境都必须实现它","file":"gymnasium/core.py"},{"name":"Wrapper","role":"装饰器基类，以对象组合方式模块化改造环境行为而不改原代码，是全部包装器的父类","file":"gymnasium/core.py"},{"name":"ObservationWrapper / RewardWrapper / ActionWrapper","role":"针对观测、奖励、动作三类数据的专项包装器基类，分别重写 observation/reward/action 变换","file":"gymnasium/core.py"},{"name":"EnvSpec + register/make","role":"环境注册表与工厂：register 把 id 映射到 entry_point 与元信息，make 据此动态构造并自动装配包装器","file":"gymnasium/envs/registration.py"},{"name":"Space","role":"动作空间与观测空间的抽象，提供 sample/contains 等，是接口契约的数值载体","file":"gymnasium/spaces/space.py"},{"name":"VectorEnv / SyncVectorEnv / AsyncVectorEnv","role":"批量环境抽象与同步/异步两种实现，把单环境接口扩展成对多环境的批量 step/reset","file":"gymnasium/vector/vector_env.py"},{"name":"PassiveEnvChecker / OrderEnforcing / TimeLimit / Autoreset","role":"make 时自动施加的标准包装器，分别做规范校验、调用顺序检查、时间截断与 episode 自动重置","file":"gymnasium/wrappers/common.py"},{"name":"env_checker","role":"独立的环境规范校验器，用确定性、seed、返回类型等检查帮助用户写出合规的自定义环境","file":"gymnasium/utils/env_checker.py"}],"layers":[{"name":"核心接口层","responsibility":"定义环境与包装器的最小契约，是整个库不依赖具体环境的稳定内核","modules":["gymnasium/core.py"],"files":["gymnasium/core.py"]},{"name":"空间定义层","responsibility":"定义 Box/Discrete/Dict/MultiDiscrete 等动作与观测空间及其采样与合法性判断","modules":["gymnasium/spaces"],"files":["gymnasium/spaces/space.py","gymnasium/spaces/box.py"]},{"name":"注册与工厂层","responsibility":"维护全局 registry，实现 register/spec/make/make_vec 与 EnvSpec 序列化","modules":["gymnasium/envs/registration.py"],"files":["gymnasium/envs/registration.py"]},{"name":"内置环境层","responsibility":"提供 classic control、box2d、toy text、mujoco、tabular、phys2d 等标准环境并在导入时自动注册","modules":["gymnasium/envs"],"files":["gymnasium/envs/__init__.py","gymnasium/envs/classic_control/cartpole.py"]},{"name":"包装器层","responsibility":"提供通用、观测/动作/奖励变换、有状态、渲染与 Atari 预处理等大量可复用包装器","modules":["gymnasium/wrappers"],"files":["gymnasium/wrappers/common.py","gymnasium/wrappers/transform_observation.py"]},{"name":"向量化层","responsibility":"把单环境接口扩展为批量环境接口，提供同步与基于多进程的异步实现","modules":["gymnasium/vector"],"files":["gymnasium/vector/sync_vector_env.py","gymnasium/vector/async_vector_env.py"]},{"name":"工具与校验层","responsibility":"提供环境规范校验、step API 兼容转换、回放、录制、随机种子等辅助能力","modules":["gymnasium/utils"],"files":["gymnasium/utils/env_checker.py","gymnasium/utils/play.py","gymnasium/utils/step_api_compatibility.py"]}],"data_flow":["第1步：import gymnasium 时，gymnasium/envs/__init__.py 通过大量 register 调用把内置环境写入全局 registry","第2步：用户调用 gym.make('CartPole-v1')，进入 envs/registration.py 的 make 函数","第3步：_find_spec 按 id 从 registry 取出 EnvSpec，其中含 entry_point、max_episode_steps、additional_wrappers","第4步：load_env_creator 动态导入 entry_point 字符串（如 classic_control.cartpole:CartPoleEnv）得到环境类","第5步：用合并后的 kwargs 调用 env_creator(**kwargs) 实例化底层环境，并校验它继承自 gymnasium.Env","第6步：把精简后的 EnvSpec 写回 env.unwrapped.spec，作为环境的元信息","第7步：按固定顺序套标准包装器：PassiveEnvChecker → OrderEnforcing → TimeLimit → additional_wrappers → 渲染相关","第8步：返回包装后的环境，用户调用 env.reset(seed=...) 得到 (observation, info)","第9步：循环调用 env.step(action) 得到 (observation, reward, terminated, truncated, info)","第10步：当 terminated 或 truncated 为真时调用 env.reset() 开始新 episode，全部结束后 env.close() 释放资源"],"entry_points":[{"path":"gymnasium.make / gymnasium.make_vec","what":"创建单环境或向量化环境的主入口"},{"path":"gymnasium.register","what":"注册自定义环境到 registry，供 make 使用"},{"path":"gymnasium.Env","what":"自定义环境时继承的基类，需实现 step/reset 等"},{"path":"gymnasium.Wrapper","what":"自定义包装器时继承的基类"},{"path":"gymnasium.utils.env_checker.check_env","what":"校验一个环境是否符合 Gymnasium API 规范"},{"path":"gymnasium.utils.play","what":"键盘交互式回放环境，便于调试"},{"path":"gymnasium.wrappers.RecordVideo","what":"录制环境视频"},{"path":"docs/introduction/create_custom_env.md","what":"官方自定义环境教程，含 gym.register 完整示例"}],"key_files":[{"path":"README.md","why":"先建立定位认知：它是接口标准而非算法库，并提供一批标准环境"},{"path":"gymnasium/core.py","why":"读 Env 与 Wrapper 的 step/reset 契约，这是整个生态的稳定接口"},{"path":"gymnasium/envs/registration.py","why":"理解 register/spec/make 如何把 id 变成自动装配好包装器的环境实例"},{"path":"gymnasium/__init__.py","why":"看清对外暴露的公共 API 与内置环境的自动注册时机"},{"path":"gymnasium/envs/classic_control/cartpole.py","why":"一个最小但完整的真实环境实现，对照接口理解 reset/step 写法"},{"path":"gymnasium/wrappers/common.py","why":"理解 TimeLimit/Autoreset/PassiveEnvChecker/RecordEpisodeStatistics 这些自动包装器"},{"path":"gymnasium/vector/vector_env.py","why":"理解批量环境接口与 AutoresetMode，向量化是训练提速的关键"},{"path":"gymnasium/utils/env_checker.py","why":"了解环境规范的具体检查项，写自定义环境前先看它"}],"extension_points":["想加新环境：继承 gymnasium.Env，实现 step/reset/render/close 并定义 action_space/observation_space，再用 gym.register(id=..., entry_point=...) 注册","想改已有环境行为：继承 gymnasium.Wrapper（或 Observation/Reward/ActionWrapper）并重写对应方法，用对象组合叠加","想加观测/奖励/动作变换：直接用 wrappers 里的 TransformObservation/TransformReward/ClipAction 等，或继承对应专项 Wrapper","想在注册时自动附加包装器：在 register 的 additional_wrappers 传入 WrapperSpec","想批量训练：用 gym.make_vec 或直接构造 SyncVectorEnv/AsyncVectorEnv，也可继承 VectorEnv","想加新空间类型：继承 gymnasium.spaces.Space 并实现 sample/contains","写完环境自检：调用 gymnasium.utils.env_checker.check_env 做合规校验"],"learning_path":["第1步：读 README 与 docs/introduction/basic_usage.md，跑通 make→reset→step→close 循环","第2步：读 core.py 的 Env，牢记 step 返回五元组、reset 返回二元组这两个契约","第3步：读 registration.py 的 register/make，理解注册表与包装器自动装配顺序","第4步：读 cartpole.py，把一个真实环境的实现与接口对应起来","第5步：读 wrappers/common.py，掌握 TimeLimit/Autoreset/RecordEpisodeStatistics 的用途","第6步：按 docs/introduction/create_custom_env.md 动手实现并注册一个自定义环境"],"diagram_mermaid":"graph TD\n  A[用户调用 gym.make] --> B[从 registry 取 EnvSpec]\n  B --> C[动态导入 entry_point 环境类]\n  C --> D[实例化底层 Env]\n  D --> E[写入 env.unwrapped.spec]\n  E --> F[PassiveEnvChecker 校验]\n  F --> G[OrderEnforcing 顺序检查]\n  G --> H[TimeLimit 时间截断]\n  H --> I[additional_wrappers 追加]\n  I --> J[返回包装后的 env]\n  J --> K[reset 返回 obs 与 info]\n  K --> L[step 返回 obs reward terminated truncated info]\n  L --> K","surprises":["自 v0.26 起 step 返回 terminated 与 truncated 两个布尔值取代单个 done，用于区分 MDP 终止与外部时间截断，直接影响 bootstrap 写法","reset 返回 (obs, info) 元组而非单个 obs，很多旧教程仍按旧接口写","make 会自动套上 PassiveEnvChecker、OrderEnforcing、TimeLimit，用户无需手动添加，重复添加反而可能出错","Autoreset 现在是一个显式包装器而非向量环境的隐式行为，且向量环境用 AutoresetMode 枚举来控制重置语义"],"confidence":"高"},"Firecrawl/firecrawl":{"repo":"Firecrawl/firecrawl","name":"Firecrawl","one_liner":"把网页抓取并转成 LLM 友好格式的抓取与抽取 API","problem":"大模型需要干净的网页数据，但真实网页充满脚本、广告与噪声。Firecrawl 提供抓取、爬站、结构化抽取的 API，把 HTML 变成 Markdown 或 JSON 交给 Agent 使用。","difficulty":"困难","core_abstractions":[{"name":"scrapeController","role":"单页抓取入口：校验请求、鉴权计费、构造 job 并投递或同步执行","file":"apps/api/src/controllers/v2/scrape.ts"},{"name":"crawlController","role":"爬站入口：保存 crawl 状态到 Redis，生成初始抓取任务并驱动整站爬取","file":"apps/api/src/controllers/v2/crawl.ts"},{"name":"scrapeURL","role":"抓取核心：按优先级构建引擎回退链，逐个尝试直到成功，再跑 transformers","file":"apps/api/src/scraper/scrapeURL/index.ts"},{"name":"Engine 与 engineHandlers","role":"引擎注册表：定义 fire-engine、playwright、fetch、pdf 等引擎的能力与质量排序","file":"apps/api/src/scraper/scrapeURL/engines/index.ts"},{"name":"WebCrawler","role":"爬站调度：从页面抽取链接、按深度与正则过滤、遵守 robots.txt 并去重","file":"apps/api/src/scraper/WebScraper/crawler.ts"},{"name":"parseMarkdown","role":"HTML 转 Markdown：优先 HTTP 服务，其次 Go 动态库，最后回退 Turndown","file":"apps/api/src/lib/html-to-markdown.ts"},{"name":"performExtraction_F0","role":"结构化抽取服务：抓取多 URL、按 schema 用 LLM 抽取并合并去重","file":"apps/api/src/lib/extract/fire-0/extraction-service-f0.ts"},{"name":"scrapeQueue 与 NuQJob","role":"自研队列抽象：基于 Redis/FoundationDB 的 job 锁、分组与并发控制","file":"apps/api/src/services/worker/nuq.ts"},{"name":"processJobInternal","role":"抓取 worker：消费队列 job，调用 WebScraper 流水线并写回结果与 webhook","file":"apps/api/src/services/worker/scrape-worker.ts"},{"name":"FirecrawlClient","role":"JS/TS SDK 的 v2 客户端，把各 endpoint 封装成方法并内置 Watcher 轮询","file":"apps/js-sdk/firecrawl/src/v2/client.ts"},{"name":"Watcher","role":"SDK 侧任务监视器：轮询 crawl/batch/extract 状态直到完成","file":"apps/js-sdk/firecrawl/src/v2/watcher.ts"},{"name":"transformers","role":"抓取后处理链：抽取链接、元数据、LLM 抽取、PII 脱敏等格式转换","file":"apps/api/src/scraper/scrapeURL/transformers/index.ts"}],"layers":[{"name":"HTTP API 层","responsibility":"Express 路由、鉴权计费中间件、请求校验与错误处理","modules":["apps/api/src/routes","apps/api/src/controllers"],"files":["apps/api/src/index.ts","apps/api/src/routes/v2.ts","apps/api/src/controllers/v2/scrape.ts"]},{"name":"抓取引擎层","responsibility":"引擎回退链、特性标志、最大合理时间与各抓取引擎适配","modules":["apps/api/src/scraper/scrapeURL"],"files":["apps/api/src/scraper/scrapeURL/index.ts","apps/api/src/scraper/scrapeURL/engines/index.ts"]},{"name":"站点爬取层","responsibility":"链接发现与过滤、sitemap 解析、robots.txt 遵守与爬取范围控制","modules":["apps/api/src/scraper/WebScraper"],"files":["apps/api/src/scraper/WebScraper/crawler.ts","apps/api/src/scraper/WebScraper/sitemap.ts"]},{"name":"HTML 转 Markdown 层","responsibility":"把原始 HTML 清洗并转换成 Markdown，多后端与后处理","modules":["apps/api/src/lib","apps/go-html-to-md-service"],"files":["apps/api/src/lib/html-to-markdown.ts","apps/api/src/lib/html-to-markdown-client.ts","apps/go-html-to-md-service/converter.go"]},{"name":"结构化抽取层","responsibility":"按 schema 用 LLM 从多个页面抽取结构化数据并合并去重","modules":["apps/api/src/lib/extract"],"files":["apps/api/src/lib/extract/fire-0/extraction-service-f0.ts","apps/api/src/lib/extract/build-prompts.ts"]},{"name":"队列与 Worker 层","responsibility":"job 入队、worker 消费、并发限流、crawl 收尾与 webhook 通知","modules":["apps/api/src/services"],"files":["apps/api/src/services/queue-worker.ts","apps/api/src/services/worker/scrape-worker.ts","apps/api/src/services/worker/crawl-logic.ts"]},{"name":"SDK 层","responsibility":"为 JS/Python/Go/Java 等语言封装 REST API，提供同步等待与类型定义","modules":["apps/js-sdk","apps/python-sdk"],"files":["apps/js-sdk/firecrawl/src/index.ts","apps/js-sdk/firecrawl/src/v2/client.ts","apps/python-sdk/firecrawl/client.py"]},{"name":"部署层","responsibility":"用 docker-compose 编排 API、worker、playwright、Redis、Postgres 等服务","modules":["docker-compose.yaml"],"files":["docker-compose.yaml","SELF_HOST.md"]}],"data_flow":["第1步：客户端 SDK 或直接调用 POST /v2/scrape，带上 url 与 formats 等选项","第2步：scrapeController 用 zod schema 校验请求，做鉴权、安全模式与威胁防护检查","第3步：构造 scrape job，写入队列 Redis，并由 worker 或同步路径取出执行","第4步：processJobInternal 启动 WebScraper 流水线，进入 scrapeURL 核心","第5步：buildFallbackList 依据请求格式、团队标志与可用引擎算出引擎回退顺序","第6步：按顺序调用 scrapeURLWithEngine，失败则抛出信号切到下一个引擎，直到得到 HTML","第7步：transformers 后处理，抽取链接、元数据、图片，并按需执行 LLM 抽取","第8步：parseMarkdown 把 HTML 转成 Markdown，优先 HTTP 服务，其次 Go 动态库，最后 Turndown","第9步：结果组装成 Document，写回 job 返回值并更新 Redis 中的 scrape 状态","第10步：若是 crawl，crawler 从页面抽取新链接，过滤去重后继续投递子 job，直至达到 limit 或深度","第11步：crawl 全部完成后 finishCrawl 汇总结果，触发 webhook 通知并结算计费","第12步：若是 extract，则抓取多页后按 schema 调 LLM 抽取、合并去重并返回结构化 JSON"],"entry_points":[{"path":"apps/api/src/index.ts","what":"API 服务主入口，注册 v0/v1/v2 路由、BullBoard 与优雅退出"},{"path":"apps/api/src/routes/v2.ts","what":"v2 路由表，把 scrape/crawl/extract 等 endpoint 映射到控制器"},{"path":"apps/api/src/services/queue-worker.ts","what":"队列 worker 进程入口，消费 deep research、billing 等队列"},{"path":"apps/api/src/services/extract-worker.ts","what":"抽取 worker 进程入口，消费 extract 队列并执行抽取服务"},{"path":"apps/js-sdk/firecrawl/src/index.ts","what":"JS/TS SDK 统一入口，导出 v2 客户端与 v1 兼容层"},{"path":"docker-compose.yaml","what":"本地/自托管一键启动全部服务，理解组件拓扑"}],"key_files":[{"path":"README.md","why":"先了解产品能力、API 示例与自托管方式"},{"path":"CLAUDE.md","why":"官方给贡献者的 monorepo 结构与测试约定，快速定位模块"},{"path":"apps/api/src/scraper/scrapeURL/engines/index.ts","why":"引擎注册表与回退链，是抓取策略的核心"},{"path":"apps/api/src/scraper/scrapeURL/index.ts","why":"scrapeURL 主流程，串起引擎选择与后处理"},{"path":"apps/api/src/controllers/v2/scrape.ts","why":"从 HTTP 请求到 job 的完整入口，理解请求生命周期"},{"path":"apps/api/src/lib/html-to-markdown.ts","why":"HTML 转 Markdown 的多后端策略，理解产物来源"},{"path":"apps/api/src/scraper/WebScraper/crawler.ts","why":"爬站链接发现与过滤逻辑，理解 crawl 行为"},{"path":"apps/api/src/services/worker/scrape-worker.ts","why":"worker 如何消费 job 并驱动整条流水线"},{"path":"apps/js-sdk/firecrawl/src/v2/client.ts","why":"SDK 与 API 的映射关系，理解对外接口形态"}],"extension_points":["新增抓取引擎：在 apps/api/src/scraper/scrapeURL/engines/ 下加引擎实现，并在 engines/index.ts 的 Engine 联合、engineHandlers、engineOptions 中注册","调整引擎优先级或特性：改 engines/index.ts 里各引擎的 quality 与 features，或 featureFlagOptions 的 priority","新增抓取后处理格式：在 apps/api/src/scraper/scrapeURL/transformers/ 增加 transformer 并在 index.ts 注册","新增输出格式或字段：改 apps/api/src/controllers/v2/types.ts 的 Document 与 scrapeOptions","换 HTML 转 Markdown 后端：在 lib/html-to-markdown.ts 增加分支，或改 config 中的 HTML_TO_MARKDOWN_SERVICE_URL 与 USE_GO_MARKDOWN_PARSER","新增抽取策略：在 apps/api/src/lib/extract/ 下新增版本目录，参照 fire-0 实现抽取服务并在 worker 中接线","新增 API endpoint：在 routes/v2.ts 注册路由，controllers/v2 下加控制器，并在各 SDK 的 v2/methods 中封装方法"],"learning_path":["第1步：读 README.md 与 CLAUDE.md，建立 monorepo 结构与能力认知","第2步：读 apps/api/src/index.ts 与 routes/v2.ts，理清服务组成与路由","第3步：读 controllers/v2/scrape.ts，跟一遍请求校验到投递 job 的过程","第4步：读 services/worker/scrape-worker.ts 与 queue-worker.ts，理解 worker 如何消费队列","第5步：读 scraper/scrapeURL/index.ts 与 engines/index.ts，掌握引擎回退策略","第6步：读 lib/html-to-markdown.ts 与 lib/extract/fire-0/extraction-service-f0.ts，理解产物生成与抽取","第7步：读 apps/js-sdk/firecrawl/src/v2/client.ts 与 watcher.ts，理解 SDK 如何封装异步任务"],"diagram_mermaid":"graph TD\n  SDK[客户端 SDK 发起请求] --> API[API 服务 index.ts]\n  API --> CTRL[scrapeController 校验与鉴权]\n  CTRL --> QUEUE[写入队列 Redis]\n  QUEUE --> WORKER[scrape-worker 消费 job]\n  WORKER --> SCRAPE[scrapeURL 核心]\n  SCRAPE --> FALLBACK[buildFallbackList 引擎回退链]\n  FALLBACK --> ENGINES[fire-engine playwright fetch pdf 等引擎]\n  ENGINES --> TRANS[transformers 后处理]\n  TRANS --> MD[parseMarkdown 转 Markdown]\n  MD --> DOC[组装 Document 结果]\n  DOC --> STATE[写回状态并触发 webhook]\n  CTRL --> CRAWL{是否 crawl}\n  CRAWL -->|是| CRAWLER[WebCrawler 链接发现与过滤]\n  CRAWLER --> QUEUE\n  CTRL --> EXTRACT{是否 extract}\n  EXTRACT -->|是| EXTR[performExtraction 按 schema 抽取]\n  EXTR --> LLM[调用大模型抽取]\n  LLM --> JSON[合并去重输出结构化 JSON]","surprises":["抓取引擎不是单一实现而是回退链：按 quality 与请求格式排序，一个引擎失败自动降级到下一个，直到 fetch 兜底","HTML 转 Markdown 有三条路径：优先外部 HTTP 服务，其次通过 koffi 调 Go 动态库，最后回退 JS 的 Turndown，失败还会返回空串","队列是自研 NuQ 而非直接用 BullMQ：基于 Redis 或 FoundationDB 实现 job 锁与分组，还支持 crawl 成员归属","crawl 本质是大量子 scrape job：controller 只投递初始任务，后续链接发现与投递发生在 worker 的 crawl-logic 中","抽取服务带版本后缀 F0：lib/extract/fire-0 表示 fire-0 版本，说明抽取策略是版本化迭代的","SDK 与 API 严格分层：apps/api 只管服务端，apps/*-sdk 各自独立实现 HTTP 客户端，二者通过 REST 契约耦合"],"confidence":"高"},"Genesis-Embodied-AI/Genesis":{"repo":"Genesis-Embodied-AI/Genesis","name":"Genesis World","one_liner":"面向具身智能的统一多物理与可微仿真平台","problem":"用一套 Python 接口统一刚体、FEM、MPM、SPH、PBD 等多种物理求解器与渲染，让机器人仿真可跨 CPU/GPU 大规模并行并支持可微。","difficulty":"困难","core_abstractions":[{"name":"Scene","role":"全局中心对象，聚合配置、Simulator 与 Visualizer，对外提供 add_entity/build/step/reset 与状态存取","file":"genesis/engine/scene.py"},{"name":"Simulator","role":"仿真调度器，持有求解器与耦合器，负责 substep 循环、时间步、传感器更新与状态/梯度管理","file":"genesis/engine/simulator.py"},{"name":"Solver","role":"所有物理求解器的抽象基类，定义 build/process_input/substep 等接口","file":"genesis/engine/solvers/base_solver.py"},{"name":"Entity / RigidEntity","role":"场景中实体的抽象与其刚体实现，提供 set_dofs_position/control_dofs_position 等控制接口","file":"genesis/engine/entities/base_entity.py"},{"name":"Morph","role":"描述实体几何来源的配置，如 MJCF/URDF/USD/Box/Plane，决定资产如何被解析成实体","file":"genesis/options/morphs.py"},{"name":"Material","role":"定义实体所属的物理模型，决定它由哪个求解器与哪种 entity 类处理","file":"genesis/engine/materials/base.py"},{"name":"Options","role":"所有 gs.options.* 配置类的基类，基于 Pydantic BaseModel 做严格校验","file":"genesis/options/options.py"},{"name":"Coupler","role":"多求解器耦合抽象，在同一步内交换不同物理域的状态，如 LegacyCoupler/SAPCoupler/IPCCoupler","file":"genesis/engine/couplers/legacy_coupler.py"},{"name":"Sensor","role":"传感器抽象基类，涵盖相机、IMU、接触力、触觉、激光雷达等，由 SensorManager 统一更新","file":"genesis/engine/sensors/base_sensor.py"},{"name":"Visualizer / RendererOptions","role":"可视化与渲染入口，支持 Nyx/Luisa/Pyrender 与 BatchRenderer 多条渲染路径","file":"genesis/vis/visualizer.py"}],"layers":[{"name":"顶层 API 与初始化层","responsibility":"提供 gs.init/destroy、公开命名空间与 gs 命令行工具","modules":["genesis/__init__.py","genesis/_main.py"],"files":["genesis/__init__.py","genesis/_main.py"]},{"name":"配置层","responsibility":"以 Pydantic 模型声明仿真、各求解器、morph、material、surface、渲染与传感器参数","modules":["genesis/options"],"files":["genesis/options/options.py","genesis/options/solvers.py","genesis/options/morphs.py"]},{"name":"场景与调度层","responsibility":"Scene 聚合一切并驱动 Simulator，Simulator 调度求解器与耦合器完成 substep 循环","modules":["genesis/engine"],"files":["genesis/engine/scene.py","genesis/engine/simulator.py","genesis/engine/interactive_scene.py"]},{"name":"实体层","responsibility":"按材质提供刚体、FEM、MPM、SPH、PBD、SF、混合、工具等实体类型及其几何/关节描述","modules":["genesis/engine/entities"],"files":["genesis/engine/entities/rigid_entity/rigid_entity.py","genesis/engine/entities/base_entity.py"]},{"name":"物理求解器与耦合层","responsibility":"实现各物理域求解器并支持跨求解器耦合","modules":["genesis/engine/solvers","genesis/engine/couplers"],"files":["genesis/engine/solvers/rigid","genesis/engine/solvers/mpm_solver.py","genesis/engine/couplers/sap_coupler.py"]},{"name":"状态与可微层","responsibility":"管理仿真状态缓存与 checkpoint，并通过 grad 模块提供可微仿真与反向传播","modules":["genesis/engine/states","genesis/grad","genesis/datatypes.py"],"files":["genesis/grad/creation_ops.py","genesis/engine/states/cache.py"]},{"name":"传感器与记录层","responsibility":"提供各类传感器实现与数据录制","modules":["genesis/engine/sensors","genesis/recorders"],"files":["genesis/engine/sensors/sensor_manager.py","genesis/engine/sensors/camera.py"]},{"name":"可视化与渲染层","responsibility":"提供 viewer、光栅化/光线追踪/批渲染后端与 GUI 插件","modules":["genesis/vis"],"files":["genesis/vis/visualizer.py","genesis/vis/viewer.py","genesis/vis/raytracer.py"]}],"data_flow":["第1步：调用 gs.init(backend=...) 选择 CPU/CUDA/AMDGPU/Metal 后端并初始化全局状态与 Quadrants 编译器","第2步：构造 gs.Scene(...)，内部创建 Simulator 与 Visualizer，并把各项 options 汇成统一的 SceneOptions","第3步：scene.add_entity(morph, material, surface) 添加实体，Simulator._add_entity 依据 material 选择对应求解器与 entity 类","第4步：可选地 scene.add_sensor / add_camera / add_force_field / add_recorder 扩展场景","第5步：scene.build(n_envs=...) 并行化环境、solver.build()、编译内核并做首次 reset","第6步：用户通过实体接口设置控制量，如 franka.set_dofs_kp / control_dofs_position","第7步：进入主循环反复调用 scene.step()","第8步：Simulator.step 按 substeps 循环执行 process_input 与 substep，substep 内部为 pre_coupling → coupler.couple → post_coupling","第9步：每步末尾 SensorManager.step 更新传感器，Visualizer.update 刷新渲染与录像","第10步：用户读取状态与传感器（get_state / read_sensors）用于 RL 训练或数据生成，scene.backward 支持可微反向传播"],"entry_points":[{"path":"gs (console script -> genesis._main:main)","what":"命令行工具，提供 gs launch/view 打开 viewer 或导出场景"},{"path":"examples/tutorials/control_your_robot.py","what":"最小可运行示例：init→Scene→add_entity→build→step→控制机器人"},{"path":"examples/","what":"覆盖 rigid/deformable/coupling/sensors/rendering 等全部能力的示例目录"},{"path":"genesis/__init__.py (init/Scene/Mesh/options)","what":"编程入口，导入即得全部公开 API"},{"path":"tests/","what":"按 core/coupling/deformable/grad 等分类的测试，可作为行为参考"},{"path":"examples/speed_benchmark","what":"性能基准，了解并行与后端差异"}],"key_files":[{"path":"README.md","why":"先建立四层认知：Simulation Interface、Physics、Render、Compiler"},{"path":"genesis/__init__.py","why":"看清 init/destroy 全局生命周期与对外暴露的 API 边界"},{"path":"examples/tutorials/control_your_robot.py","why":"最快跑通一次完整流程，形成直观印象"},{"path":"genesis/options/options.py","why":"理解基于 Pydantic 的严格配置体系，这是所有参数的入口"},{"path":"genesis/engine/scene.py","why":"掌握中心对象 Scene 的 add_entity/build/step/reset 与状态接口"},{"path":"genesis/engine/simulator.py","why":"理解求解器调度、substep 循环与耦合器插入点"},{"path":"genesis/engine/solvers/base_solver.py","why":"掌握求解器抽象，是加新物理域的起点"},{"path":"genesis/engine/entities/rigid_entity/rigid_entity.py","why":"刚体实体控制 API 的完整实现，机器人操作都落在这里"}],"extension_points":["想加新机器人/物体：用 gs.morphs.MJCF/URDF/USD/Box/Plane 等 morph，直接 scene.add_entity","想加新物理模型：在 genesis/engine/materials 下新增 Material 子类（并配套 options），让 entity/solver 支持它","想加新求解器：继承 genesis/engine/solvers/base_solver.py 的 Solver，实现 build/substep 并在 Simulator 注册","想加多求解器耦合：继承 genesis/engine/couplers 下的 coupler（LegacyCoupler/SAPCoupler/IPCCoupler）并实现 couple","想加新传感器：继承 genesis/engine/sensors/base_sensor.py 的 Sensor，并在 genesis/options/sensors 增加对应 options","想加新渲染器：继承 genesis/options/renderers.py 的 RendererOptions，在 vis 中接入","想加新配置组：继承 genesis/options/options.py 的 Options（Pydantic BaseModel）声明字段"],"learning_path":["第1步：读 README 与文档，记住四层架构与统一多物理引擎的定位","第2步：跑 examples/tutorials/control_your_robot.py，形成 init→Scene→add_entity→build→step 的肌肉记忆","第3步：读 genesis/__init__.py，理解全局初始化与公开 API","第4步：读 genesis/options/options.py 与 solvers.py，掌握严格配置体系与各求解器参数","第5步：读 genesis/engine/scene.py，理解 Scene 如何聚合与驱动整个仿真","第6步：读 genesis/engine/simulator.py 与 solvers/base_solver.py，深入 substep 循环与求解器扩展，再按兴趣深挖 rigid_entity 控制、couplers 多物理耦合或 grad 可微仿真"],"diagram_mermaid":"graph TD\n  A[gs.init 初始化后端] --> B[构造 gs.Scene]\n  B --> C[add_entity 添加实体]\n  C --> D[Simulator 按材质选求解器]\n  D --> E[scene.build 并行化与编译内核]\n  E --> F[设置实体控制量]\n  F --> G[scene.step 主循环]\n  G --> H[Simulator.step 子步循环]\n  H --> I[求解器 substep 更新状态]\n  I --> J[Coupler 耦合多求解器]\n  J --> K[SensorManager 更新传感器]\n  K --> L[Visualizer 渲染与录像]\n  L --> G\n  G --> M[get_state 读取状态用于训练]","surprises":["项目已从 Genesis 更名为 Genesis World 仓库 genesis-world，但 Python 包名仍是 genesis，导入方式不变","配置体系用 Pydantic BaseModel 而非普通 dataclass，且 strict=True、extra='forbid'，字段名或类型写错会直接抛错","底层编译器 Quadrants 是 Taichi 的 fork，把 Python 内核代码降到 CUDA/ROCm/Metal/Vulkan/x86/ARM64","同一个 Scene 内可让多种物理求解器耦合（如刚体+MPM+SPH+IPC），并支持可微仿真的 backward 反向传播"],"confidence":"高"},"OpenBMB/MiniCPM-V":{"repo":"OpenBMB/MiniCPM-V","name":"MiniCPM-V","one_liner":"端侧可部署的多模态大模型系列，图像视频文本理解","problem":"把视觉编码器与语言模型拼成可跑在手机上的多模态大模型，用切图与视觉重采样在有限算力下保留高分辨率细节，并支持量化与端侧部署。","difficulty":"中等","core_abstractions":[{"name":"OmniLMMConfig","role":"模型配置类，继承 MistralConfig 并注册 model_type=omnilmm，声明 num_query、image_size、mm_vision_tower 等视觉参数","file":"omnilmm/model/omnilmm.py"},{"name":"OmniLMMModel","role":"核心模型：组装视觉塔与 Resampler，把视觉特征替换进文本嵌入的占位符位置，再交给语言模型","file":"omnilmm/model/omnilmm.py"},{"name":"OmniLMMForCausalLM","role":"对外因果语言模型：封装 model 与 lm_head，提供 generate_vllm 推理入口，并注册到 AutoModelForCausalLM","file":"omnilmm/model/omnilmm.py"},{"name":"create_vision_module","role":"工厂函数：构建 EVA02 视觉塔并包一层 Resampler，返回二者组成的视觉前端","file":"omnilmm/model/omnilmm.py"},{"name":"Resampler","role":"Perceiver 风格交叉注意力重采样器，用固定数量可学习 query 把视觉特征压成固定长度视觉 token","file":"omnilmm/model/resampler.py"},{"name":"slice_image","role":"高分辨率切图：按长宽比与 max_slice_nums 选出最优网格，把大图切成多个子图分别编码","file":"finetune/dataset.py"},{"name":"get_grid_placeholder","role":"把切图网格展开成图像占位符文本，用 im_start/im_end 包裹每片子图的 token 序列","file":"finetune/dataset.py"},{"name":"omni_preprocess","role":"对话预处理：套用 chat 模板生成 input_ids，并把非 assistant 回答部分 label 置为 ignore_index","file":"omnilmm/train/train_utils.py"},{"name":"MiniCPMVChat","role":"推理分发入口：按 model_path 字符串匹配把请求路由到 12B / Llama3-V / 2_6 / 默认各版本封装","file":"chat.py"},{"name":"Conversation","role":"对话历史与分隔符模板抽象，负责拼接 system 与多轮 role 文本","file":"omnilmm/conversation.py"}],"layers":[{"name":"模型核心层","responsibility":"定义多模态模型结构：视觉塔、Resampler、嵌入替换与生成","modules":["omnilmm/model"],"files":["omnilmm/model/omnilmm.py","omnilmm/model/resampler.py","omnilmm/model/utils.py"]},{"name":"对话与预处理层","responsibility":"对话模板、图像变换与训练样本的 tokenize/label 掩码","modules":["omnilmm"],"files":["omnilmm/conversation.py","omnilmm/train/train_utils.py","omnilmm/utils.py"]},{"name":"数据切图与微调层","responsibility":"高分辨率切图、数据集与 LoRA/全参微调脚本","modules":["finetune"],"files":["finetune/dataset.py","finetune/finetune.py","finetune/trainer.py"]},{"name":"推理与入口层","responsibility":"命令行推理入口与各版本模型封装","modules":["."],"files":["chat.py"]},{"name":"演示与服务层","responsibility":"Gradio/Streamlit Web Demo 与 Omni 实时多模态服务","modules":["web_demos"],"files":["web_demos/web_demo_2.6.py","web_demos/minicpm-o_2.6/model_server.py"]},{"name":"评测层","responsibility":"多模态基准评测接入与 VQA 评分","modules":["eval_mm"],"files":["eval_mm/README.md","eval_mm/vlmevalkit/vlmeval/vlm/minicpm_v.py"]},{"name":"文档层","responsibility":"各版本模型说明、API 与最佳实践文档","modules":["docs"],"files":["docs/api.md","docs/minicpm_v4dot5_en.md"]}],"data_flow":["第1步：用户输入图像与问题，chat.py 的 MiniCPMVChat 按模型路径分发到对应版本封装","第2步：高分辨率图像经 slice_image 按长宽比和 max_slice_nums 决定切图网格，得到主图与多片子图","第3步：build_transform 对图像做 resize 与归一化，得到像素张量","第4步：视觉塔 EVA02 前向提取 patch 特征，取倒数第二层输出","第5步：Resampler 用固定数量 query 做交叉注意力，把视觉特征压成固定长度视觉 token","第6步：wrap_question_for_omni_lmm 把问题中的 image 占位符展开为 im_start + N 个 im_patch + im_end","第7步：OmniLMMModel.forward 用视觉 token 替换文本嵌入中占位符位置的嵌入","第8步：语言模型对拼接后的 inputs_embeds 做自回归生成","第9步：tokenizer 解码生成序列，返回文本回答"],"entry_points":[{"path":"chat.py","what":"命令行推理入口，含 MiniCPMVChat 分发与 OmniLMM12B 封装"},{"path":"finetune/finetune.py","what":"微调入口，解析 ModelArguments/TrainingArguments 并启动训练"},{"path":"web_demos/web_demo_2.6.py","what":"Gradio Web 演示，加载 MiniCPM-V-2_6 并支持视频帧抽取"},{"path":"web_demos/minicpm-o_2.6/model_server.py","what":"MiniCPM-o 实时多模态服务端，含 VAD 与流式推理"},{"path":"omnilmm/model/omnilmm.py:OmniLMMForCausalLM.generate_vllm","what":"把图像编码为嵌入后调用 generate 的推理函数"}],"key_files":[{"path":"README.md","why":"先建立认知：系列模型谱系、端侧部署方式与 max_slice_nums 等关键参数说明"},{"path":"omnilmm/model/omnilmm.py","why":"核心实现：视觉塔与语言模型的拼接、嵌入替换与 generate_vllm"},{"path":"omnilmm/model/resampler.py","why":"视觉到语言的关键连接件，理解固定长度视觉 token 的来源"},{"path":"finetune/dataset.py","why":"切图与占位符生成逻辑所在，理解高分辨率如何被拆成多片"},{"path":"omnilmm/train/train_utils.py","why":"对话如何转成 input_ids 与 labels，理解训练目标掩码"},{"path":"chat.py","why":"推理入口与多版本分发，看清各代模型加载方式差异"},{"path":"finetune/finetune.py","why":"微调参数体系与 tune_vision/tune_llm/use_lora 开关"},{"path":"docs/api.md","why":"最新模型的实际使用方式已转为 OpenAI 兼容 API"}],"extension_points":["替换视觉编码器：改 omnilmm/model/omnilmm.py 的 create_vision_module，替换 timm.create_model 的视觉塔并调整 Resampler 的 kv_dim","更换语言模型底座：改 OmniLMMConfig 与 OmniLMMModel 继承的基类，从 MistralConfig/MistralModel 换成目标 LLM","调整视觉 token 数量：改 config.num_query，Resampler 会用 grid_size=sqrt(num_query) 重设 query 数","新增切图策略：在 finetune/dataset.py 的 slice_image 中改写网格选择逻辑","新增对话模板：在 omnilmm/train/train_utils.py 的 omni_preprocess 里修改 response_template 与 system_content","接入新版本模型：本仓库对 2.6/4.x 走 AutoModel.from_pretrained(trust_remote_code=True)，扩展需在对应 HuggingFace 仓库远程代码中进行"],"learning_path":["第1步：读 README.md，分清 MiniCPM-V 与 MiniCPM-o 两个系列及各代模型关系","第2步：读 omnilmm/model/omnilmm.py，掌握视觉塔加 Resampler 加 LLM 的三段式结构与嵌入替换","第3步：读 omnilmm/model/resampler.py，理解视觉特征如何被压成固定长度 token","第4步：读 finetune/dataset.py 的 slice_image 与 get_grid_placeholder，理解高分辨率切图机制","第5步：读 omnilmm/train/train_utils.py 的 omni_preprocess，理解训练样本构造与 label 掩码","第6步：读 chat.py，看多版本模型如何被分发与加载，再对照 docs/api.md 了解当前推荐用法"],"diagram_mermaid":"graph TD\n  A[用户输入图像与问题] --> B[slice_image 高分辨率切图]\n  B --> C[build_transform 图像预处理]\n  C --> D[EVA02 视觉塔提取特征]\n  D --> E[Resampler 压缩为固定视觉 token]\n  E --> F[替换文本嵌入中的图像占位符]\n  F --> G[Mistral 语言模型自回归生成]\n  G --> H[Tokenizer 解码输出回答]","surprises":["README 已更新到 MiniCPM-V 4.6 与 MiniCPM-o 4.5，但仓库内真正可运行的实现仍是更早的 OmniLMM 架构 EVA02 加 Resampler 加 Mistral，新版本架构并不在本仓库","2.6 及之后的模型通过 AutoModel.from_pretrained(trust_remote_code=True) 从 HuggingFace 拉取远程代码执行，本地只保留加载与演示代码，容易误以为仓库内就是完整模型实现","切图逻辑藏在 finetune/dataset.py 而非模型包内，推理侧的高分辨率细节保留依赖 max_slice_nums 参数而非模型结构","create_vision_module 用 Identity 替换视觉塔最后一层与 attn_pool，实际取倒数第二层特征，且 initialize_vision_modules 写死了训练机绝对权重路径，直接运行会失败","chat.py 的 MiniCPMVChat 靠模型路径字符串匹配来分发版本，路径命名稍有出入就会落到默认分支用错封装"],"confidence":"高"},"OpenBMB/OmniLMM":{"repo":"OpenBMB/OmniLMM","name":"OmniLMM","one_liner":"端侧多模态大模型系列，视觉经重采样器接入 LLM","problem":"让多模态大模型能在手机等端侧高效运行：用 EVA02 视觉塔提取特征，经感知重采样器压成少量 token 后接入 Mistral 语言模型做图文理解。","difficulty":"中等","core_abstractions":[{"name":"OmniLMMForCausalLM","role":"顶层多模态因果语言模型，组装视觉模块与 LM head 并负责生成","file":"omnilmm/model/omnilmm.py"},{"name":"OmniLMMModel","role":"继承 MistralModel，持有 vision_tower 与 resampler，在 forward 中把视觉 embedding 注入文本序列","file":"omnilmm/model/omnilmm.py"},{"name":"Resampler","role":"感知重采样器，用可学习 query 通过交叉注意力把视觉特征压缩为固定数量 token","file":"omnilmm/model/resampler.py"},{"name":"create_vision_module","role":"构建 EVA02 视觉塔，去掉最后一层与 attn_pool，并配套构造 Resampler","file":"omnilmm/model/omnilmm.py"},{"name":"SupervisedDataset","role":"指令微调数据集，读取图文对话 JSON 并产出 pixel_values 与 labels","file":"finetune/dataset.py"},{"name":"CPMTrainer","role":"自定义 Trainer，区分 use_lora 分支并实现多模态 loss 计算","file":"finetune/trainer.py"},{"name":"omni_preprocess","role":"把对话套用 chat 模板并生成只对 assistant 回复计算 loss 的 label 掩码","file":"omnilmm/train/train_utils.py"},{"name":"build_transform","role":"图像预处理与随机增强，统一到视觉塔输入尺寸与归一化","file":"omnilmm/model/utils.py"}],"layers":[{"name":"模型层","responsibility":"视觉编码器、重采样器、语言模 /run/run_batch.py","what":"批量运行入口 sweagent run-batch，并发跑 SWE-bench 等数据集"},{"path":"sweagent/run/run_replay.py","what":"回放 trajectory 或 demo，在环境中重放动作以生成完整轨迹"},{"path":"sweagent/__main__.py","what":"python -m sweagent 的模块入口，分发到 run 子命令"},{"path":"sweagent/run/run.py","what":"CLI 子命令注册与分发，pyproject 中 sweagent 脚本指向它"},{"path":"sweagent/inspector/server.py","what":"轨迹检视网页服务，用于浏览与分析 trajectory"}],"key_files":[{"path":"README.md","why":"先建立整体定位、能力边界与文档入口的认知"},{"path":"config/default.yaml","why":"理解 Agent 行为的最佳入口：prompt 模板、工具 bundle、解析器一次看全"},{"path":"sweagent/agent/agents.py","why":"核心决策循环与错误处理、提交逻辑都在这，是理解 ACI 的主干"},{"path":"sweagent/tools/tools.py","why":"工具运行时与 ACI 的安装、解析、拦截、状态读取全在这里"},{"path":"sweagent/tools/commands.py","why":"命令与参数的抽象定义，决定工具如何暴露给模型"},{"path":"sweagent/tools/parsing.py","why":"各种解析器决定模型输出如何变成可执行动作，是易踩坑处"},{"path":"sweagent/environment/swe_env.py","why":"沙箱与 SWE-ReX 的对接层，理解执行与状态来源"},{"path":"sweagent/run/batch_instances.py","why":"看 SWE-bench 实例如何被加载并转成环境与问题陈述"},{"path":"sweagent/types.py","why":"StepOutput/TrajectoryStep 定义，理解轨迹数据结构"}],"extension_points":["新增一个工具：在 tools/ 下建 bundle 目录，写 config.yaml 声明命令与参数、在 bin/ 放脚本，再在 config/default.yaml 的 bundles 里加 path","新增输出解析格式：在 sweagent/tools/parsing.py 增加 ParseFunction 子类并在 ParseFunction 联合类型中注册","新增任务来源：在 sweagent/agent/problem_statement.py 实现 ProblemStatement 协议并在 ProblemStatementConfig 联合中注册","新增运行期行为：在 sweagent/run/hooks/ 实现 RunHook，或在 sweagent/agent/hooks/ 实现 AgentHook 挂到 Agent","换执行后端：在 EnvironmentConfig.deployment 选择 SWE-ReX 的 docker/modal/local 等部署类型","改历史处理策略：在 sweagent/agent/history_processors.py 新增 HistoryProcessor 并写进配置的 history_processors"],"learning_path":["第1步：读 README.md 与 config/default.yaml，弄清 Agent 的输入输出与配置驱动方式","第2步：读 sweagent/agent/agents.py 的 run/step/forward_with_handling，掌握主循环","第3步：读 sweagent/tools/tools.py 与 commands.py，理解工具如何定义、安装与被拦截","第4步：读 sweagent/tools/parsing.py，理解模型输出到动作的解析与错误重查","第5步：读 sweagent/environment/swe_env.py 与 repo.py，理解沙箱执行与仓库准备","第6步：读 sweagent/run/run_single.py 与 run_batch.py，打通从 CLI 到批量评测的链路","第7步：挑一个 tools 下的 bundle 看 config.yaml，练习新增一个自定义工具"],"diagram_mermaid":"graph TD\n  CLI[CLI 入口 run_single/run_batch] --> CFG[加载 yaml 配置]\n  CFG --> ENV[SWEEnv 启动沙箱并克隆仓库]\n  CFG --> AG[DefaultAgent 构造]\n  ENV --> TOOLS[ToolHandler 安装 bundle 工具]\n  TOOLS --> HIST[渲染模板写入 history]\n  HIST --> LOOP[主循环 step]\n  LOOP --> MODEL[模型查询]\n  MODEL --> PARSE[ParseFunction 解析为动作]\n  PARSE --> GUARD[多行守卫与命令拦截]\n  GUARD --> EXEC[SWEEnv 执行命令]\n  EXEC --> OBS[返回 observation 与 state]\n  OBS --> HIST\n  OBS --> TRAJ[写入 trajectory 与 traj 文件]\n  OBS --> SUBMIT{是否为 submit}\n  SUBMIT -->|是| PATCH[读取 model.patch 作为提交]\n  SUBMIT -->|否| LOOP\n  PATCH --> REVIEW[reviewer 选最佳提交]\n  REVIEW --> PRED[保存预测供 SWE-bench 评测]","surprises":["工具不是 Python 函数而是 bash 脚本 bundle：每个工具本质是容器内可执行文件，Agent 通过命令名调用，配置在 config.yaml","提交补丁靠约定而非 API：模型执行 submit 命令后，框架读取 /root/model.patch 文件内容作为最终提交","解析器与工具强耦合：用 function calling 时无需在 prompt 里写命令文档，用其他解析器则必须包含 command_docs","history 与 trajectory 是两套数据：history 可被处理器裁剪后喂给模型，trajectory 保留完整原始记录用于回放","环境通过 SWE-ReX 外部库部署：SWE-agent 本身不实现容器，执行、读写文件都委托给 deployment"],"confidence":"高"},"assafelovic/gpt-researcher":{"repo":"assafelovic/gpt-researcher","name":"gpt-researcher","one_liner":"自动检索网络并生成带引用的深度研究报告的 Agent","problem":"人工做调研要反复搜索、筛源、阅读、写作并整理引用。gpt-researcher 把规划、检索、抓取、压缩、写作、加引用串成一条自动化流水线，产出带来源的 Markdown 报告。","difficulty":"中等","core_abstractions":[{"name":"GPTResearcher","role":"总编排器：初始化配置、技能与检索器，暴露 conduct_research 与 write_report 两个主入口","file":"gpt_researcher/agent.py"},{"name":"ResearchConductor","role":"研究编排技能：规划子查询、执行搜索、抓取内容并汇总上下文","file":"gpt_researcher/skills/researcher.py"},{"name":"ReportGenerator","role":"报告生成技能：写正文、引言、结论并管理子主题结构","file":"gpt_researcher/skills/writer.py"},{"name":"ContextManager","role":"上下文技能：按查询检索相似内容并做压缩与排序","file":"gpt_researcher/skills/context_manager.py"},{"name":"SourceCurator","role":"来源策展技能：用 LLM 按相关性、可信度对来源排序筛选","file":"gpt_researcher/skills/curator.py"},{"name":"DeepResearchSkill","role":"深度研究技能：以广度与深度递归展开子查询并并行研究","file":"gpt_researcher/skills/deep_research.py"},{"name":"BaseRetriever","role":"检索器契约：声明 search 方法与 requires_scraping 语义，区分需抓取与已带正文两类","file":"gpt_researcher/retrievers/base.py"},{"name":"get_retriever 与 get_retrievers","role":"检索器工厂：按名字或 entry point 插件加载检索器，并决定默认检索器","file":"gpt_researcher/actions/retriever.py"},{"name":"Config","role":"配置系统：从环境变量与 json 变量文件装配 LLM、检索器、字数等参数","file":"gpt_researcher/config/config.py"},{"name":"DocumentLoader","role":"文档来源抽象：加载本地、在线、Azure、LangChain 等不同来源的文档","file":"gpt_researcher/document/document.py"},{"name":"generate_report","role":"报告生成动作：按 report_type 选择提示词模板并调用 LLM 生成正文","file":"gpt_researcher/actions/report_generation.py"},{"name":"add_references","role":"引用管理：把访问过的 URL 去重编号并追加到报告末尾","file":"gpt_researcher/actions/markdown_processing.py"}],"layers":[{"name":"编排层","responsibility":"定义主类与整体流程入口，装配技能、检索器、配置与记忆","modules":["gpt_researcher"],"files":["gpt_researcher/agent.py"]},{"name":"技能层","responsibility":"把研究、写作、上下文、策展、深度研究拆成可组合的技能类","modules":["gpt_researcher/skills"],"files":["gpt_researcher/skills/researcher.py","gpt_researcher/skills/writer.py","gpt_researcher/skills/context_manager.py"]},{"name":"动作层","responsibility":"实现无状态的动作函数：选 agent、规划大纲、搜索、写报告、加引用","modules":["gpt_researcher/actions"],"files":["gpt_researcher/actions/query_processing.py","gpt_researcher/actions/report_generation.py","gpt_researcher/actions/retriever.py"]},{"name":"检索器层","responsibility":"各搜索源实现，统一 search 接口，可插件化扩展","modules":["gpt_researcher/retrievers"],"files":["gpt_researcher/retrievers/base.py","gpt_researcher/retrievers/utils.py"]},{"name":"抓取与文档层","responsibility":"把 URL 或本地文档转成可用的正文内容","modules":["gpt_researcher/scraper","gpt_researcher/document"],"files":["gpt_researcher/scraper/scraper.py","gpt_researcher/document/document.py","gpt_researcher/document/online_document.py"]},{"name":"上下文与记忆层","responsibility":"对检索内容做压缩、相似度排序与向量化嵌入","modules":["gpt_researcher/context","gpt_researcher/memory"],"files":["gpt_researcher/context/compression.py","gpt_researcher/context/retriever.py","gpt_researcher/memory/embeddings.py"]},{"name":"模型与配置层","responsibility":"统一 LLM 调用、提示词族与参数配置","modules":["gpt_researcher/llm_provider","gpt_researcher/config","gpt_researcher/prompts.py"],"files":["gpt_researcher/llm_provider/generic/base.py","gpt_researcher/config/config.py","gpt_researcher/prompts.py"]},{"name":"服务与多智能体层","responsibility":"FastAPI 后端、WebSocket 流式输出，以及多智能体协作报告","modules":["backend","multi_agents"],"files":["backend/server/app.py","multi_agents/agent.py"]}],"data_flow":["第1步：调用方构造 GPTResearcher 并传入 query 与 report_type，初始化配置、检索器与各技能实例","第2步：conduct_research 先由 choose_agent 根据查询选定 agent 角色与提示词","第3步：ResearchConductor 用主检索器做一次初始搜索，作为规划大纲的输入","第4步：plan_research_outline 让 LLM 依据初始结果生成子查询大纲","第5步：对每个子查询调用 get_search_results，得到一批 URL 与摘要","第6步：按 requires_scraping 决定是否需要抓取，抓取器把网页转成正文并收集图片","第7步：ContextManager 通过 select_context 对内容做压缩与相似度排序，累计进 context","第8步：可选 SourceCurator 对来源做 LLM 排序，或用 DeepResearchSkill 递归展开","第9步：write_report 依据 report_type 选择提示词，把 context 交给 LLM 生成正文","第10步：add_references 把 visited_urls 去重编号，追加引用列表到报告末尾","第11步：可选写入引言与结论，最终得到完整 Markdown 报告并统计各步骤成本","第12步：后端通过 WebSocket 把各步骤日志流式推给前端，多智能体模式再走编辑与事实核查"],"entry_points":[{"path":"gpt_researcher/agent.py","what":"核心类 GPTResearcher 的定义，conduct_research 与 write_report 是主入口"},{"path":"main.py","what":"FastAPI 服务启动入口，用 uvicorn 拉起后端 app"},{"path":"cli.py","what":"命令行入口，直接跑一次研究并打印报告"},{"path":"backend/server/app.py","what":"后端 WebSocket 与 REST 路由，驱动研究流程并流式返回"},{"path":"multi_agents/agent.py","what":"多智能体协作模式的入口，编排编辑、审稿、事实核查等角色"},{"path":"backend/report_type/detailed_report/detailed_report.py","what":"详细报告模式的编排示例，展示如何组合子报告"}],"key_files":[{"path":"README.md","why":"先了解产品能力、报告类型与运行方式"},{"path":"gpt_researcher/agent.py","why":"总编排器，先读它建立整体流程与组件关系"},{"path":"gpt_researcher/skills/researcher.py","why":"研究编排核心：规划、搜索、抓取如何串起来"},{"path":"gpt_researcher/actions/retriever.py","why":"检索器工厂与插件机制，理解如何切换搜索源"},{"path":"gpt_researcher/retrievers/base.py","why":"检索器契约与 requires_scraping 语义，容易踩坑处"},{"path":"gpt_researcher/skills/writer.py","why":"报告生成技能，理解写作如何调用提示词"},{"path":"gpt_researcher/actions/report_generation.py","why":"按 report_type 选模板并生成正文的实际逻辑"},{"path":"gpt_researcher/actions/markdown_processing.py","why":"引用与标题处理，理解报告如何加引用"},{"path":"gpt_researcher/config/config.py","why":"参数体系入口，理解 LLM 与检索器如何被配置"}],"extension_points":["新增检索源：在 gpt_researcher/retrievers/ 下新建目录实现 search 方法，并在 actions/retriever.py 的 get_retriever 中注册名字，或用 entry point 插件方式注册","新增报告类型：在 utils/enum.py 的 ReportType 增加取值，并在 actions/report_generation.py 与 prompts.py 提供对应提示词模板","新增提示词族：在 gpt_researcher/prompts.py 增加 PromptFamily 子类并通过 prompt_family 参数切换","换抓取器：在 gpt_researcher/scraper/ 下实现抓取后端并在 scraper.py 的选择逻辑中接线","新增文档来源：在 gpt_researcher/document/ 下实现 loader 并在 DocumentLoader 中分支","新增配置项：在 gpt_researcher/config/variables/default.py 增加默认值，Config 会自动读取环境变量","改引用格式：修改 gpt_researcher/actions/markdown_processing.py 的 add_references"],"learning_path":["第1步：读 README.md，了解报告类型、检索源与运行方式","第2步：读 gpt_researcher/agent.py，掌握总编排与各技能实例","第3步：读 gpt_researcher/skills/researcher.py，理解规划到检索到上下文的主流程","第4步：读 gpt_researcher/actions/retriever.py 与 retrievers/base.py，理解检索器抽象与扩展","第5步：读 gpt_researcher/skills/writer.py 与 actions/report_generation.py，理解报告生成与提示词","第6步：读 gpt_researcher/actions/markdown_processing.py，理解引用管理","第7步：读 backend/server/app.py 与 skills/deep_research.py，理解服务化与深度研究模式"],"diagram_mermaid":"graph TD\n  Q[用户查询] --> AG[GPTResearcher 初始化]\n  AG --> CA[choose_agent 选角色]\n  CA --> RC[ResearchConductor 研究编排]\n  RC --> IS[初始搜索]\n  IS --> PO[plan_research_outline 规划子查询]\n  PO --> SR[对子查询执行检索]\n  SR --> DEC{requires_scraping}\n  DEC -->|是| SC[抓取网页转正文]\n  DEC -->|否| RAW[直接使用返回正文]\n  SC --> CTX[ContextManager 压缩排序]\n  RAW --> CTX\n  CTX --> CUR[SourceCurator 来源策展]\n  CUR --> WG[ReportGenerator 写报告]\n  WG --> LLM[调用大模型生成正文]\n  LLM --> REF[add_references 加引用]\n  REF --> OUT[输出 Markdown 报告]\n  RC --> DR[DeepResearchSkill 递归展开]\n  DR --> SR","surprises":["检索器有两种契约：多数只返回 URL 需要再抓取，少数
