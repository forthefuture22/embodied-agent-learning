e":"browser_use/agent/message_manager/service.py"},{"name":"AgentOutput / ActionResult","role":"核心数据模型：AgentOutput 是 LLM 单步输出（思考+动作列表），ActionResult 是动作执行结果（内容/错误/是否完成）","file":"browser_use/agent/views.py"}],"layers":[{"name":"Agent 编排层","responsibility":"主循环、上下文准备、LLM 调用、动作执行、错误处理与循环检测","modules":["browser_use/agent"],"files":["browser_use/agent/service.py","browser_use/agent/views.py","browser_use/agent/prompts.py"]},{"name":"工具与动作层","responsibility":"定义并注册浏览器动作空间，动态生成 LLM 工具 schema，执行并返回 ActionResult","modules":["browser_use/tools"],"files":["browser_use/tools/service.py","browser_use/tools/registry/service.py","browser_use/tools/registry/views.py","browser_use/tools/views.py"]},{"name":"DOM 表示层","responsibility":"从浏览器抽取 DOM/AX 树并构建增强节点，再序列化成 LLM 可读的带索引文本表示","modules":["browser_use/dom"],"files":["browser_use/dom/service.py","browser_use/dom/serializer/serializer.py","browser_use/dom/views.py"]},{"name":"浏览器控制层","responsibility":"CDP 会话管理、标签页与事件总线、各类 watchdog 实现具体浏览器行为","modules":["browser_use/browser"],"files":["browser_use/browser/session.py","browser_use/browser/events.py","browser_use/browser/watchdog_base.py","browser_use/browser/watchdogs/dom_watchdog.py","browser_use/browser/watchdogs/default_action_watchdog.py"]},{"name":"LLM 抽象层","responsibility":"统一各家大模型调用接口与消息格式，支持结构化输出","modules":["browser_use/llm"],"files":["browser_use/llm/base.py","browser_use/llm/messages.py","browser_use/llm/openai/chat.py"]},{"name":"消息与上下文层","responsibility":"历史描述、状态消息拼装、敏感数据过滤与消息压缩","modules":["browser_use/agent/message_manager"],"files":["browser_use/agent/message_manager/service.py","browser_use/agent/message_manager/views.py"]},{"name":"集成与协议层","responsibility":"把 Agent 能力以 MCP 服务、Claude 工具集、技能包等形式对外暴露","modules":["browser_use/mcp","browser_use/integrations","browser_use/skills"],"files":["browser_use/mcp/server.py","browser_use/mcp/client.py","browser_use/skills/service.py"]},{"name":"辅助能力层","responsibility":"文件系统、截图服务、沙箱执行等横切支撑能力","modules":["browser_use/filesystem","browser_use/screenshots","browser_use/sandbox"],"files":["browser_use/filesystem/file_system.py","browser_use/screenshots/service.py","browser_use/sandbox/sandbox.py"]}],"data_flow":["第1步：调用 Agent.run()，注册信号处理器并调用 browser_session.start() 启动浏览器、挂载所有 watchdog 到事件总线","第2步：进入 step()，Phase1 调用 _prepare_context()，进而调用 browser_session.get_browser_state_summary() 请求最新 DOM 与截图","第3步：BrowserSession 通过 event_bus 派发 BrowserStateRequestEvent，由 DOM watchdog 订阅并处理","第4步：DomService.get_dom_tree() 通过 CDP 拉取 DOMSnapshot、DOM 树与可访问性树，构建 EnhancedDOMTreeNode 并计算可见性","第5步：DOMTreeSerializer.serialize_accessible_elements() 精简树、过滤不可见与越界元素，为可交互元素分配整数索引，产出 SerializedDOMState","第6步：MessageManager.create_state_messages() 把浏览器状态文本、历史、可用动作描述与截图拼装为 LLM 消息序列","第7步：_get_next_action() 调用 llm.ainvoke(messages, output_format=AgentOutput)，得到带思考与动作列表的结构化输出","第8步：_execute_actions() 调用 multi_act()，逐个把动作交给 tools.act() 执行，并做页面变更守卫","第9步：Registry.execute_action() 校验参数、替换敏感数据占位符、注入 browser_session 等特殊参数后调用动作函数","第10步：动作函数通过 event_bus 派发如 NavigateToUrlEvent / ClickElementEvent，由对应 watchdog 执行真实 CDP 操作并返回 ActionResult","第11步：_post_process() 记录结果、更新循环检测器、判断是否 done，并把本步写入 history","第12步：循环直至 done 或达到 max_steps，run() 返回 AgentHistoryList，final_result() 给出最终答案"],"entry_points":[{"path":"browser_use/agent/service.py:run","what":"Agent 主入口，驱动多步循环直到任务完成，返回 AgentHistoryList"},{"path":"browser_use/agent/service.py:step","what":"单步执行入口，串联上下文准备、LLM 调用、动作执行与后处理"},{"path":"browser_use/cli.py","what":"browser-use / bu 命令行入口，交互式运行 Agent"},{"path":"browser_use/mcp/server.py","what":"把浏览器操作封装为 MCP 服务端，供外部 Agent 调用"},{"path":"browser_use/tools/service.py:Tools","what":"构造动作空间与内置浏览器动作的入口"},{"path":"examples/simple.py","what":"最小可运行示例，展示 Agent(task=..., llm=...) 用法"}],"key_files":[{"path":"README.md","why":"先建立整体认知：三种使用形态 云托管/CLI/Python 库 与核心卖点"},{"path":"browser_use/agent/service.py","why":"Agent 主循环与 step/run/multi_act 全在这里，是理解系统骨架的第一站"},{"path":"browser_use/agent/views.py","why":"AgentOutput 与 ActionResult 数据模型，定义了 LLM 输入输出的契约"},{"path":"browser_use/tools/service.py","why":"内置动作与 @action 注册方式，理解动作空间如何定义"},{"path":"browser_use/tools/registry/service.py","why":"动作注册与执行核心：签名转 Pydantic、动态生成 tool schema、特殊参数注入"},{"path":"browser_use/dom/service.py","why":"DOM 感知入口，理解 CDP 如何拉取并增强 DOM/AX 树"},{"path":"browser_use/dom/serializer/serializer.py","why":"DOM 如何变成 LLM 可读的带索引文本，是最具巧思的一环"},{"path":"browser_use/browser/session.py","why":"浏览器会话与事件总线入口，理解控制层与状态获取"},{"path":"browser_use/browser/watchdog_base.py","why":"事件驱动行为的基类，理解动作如何解耦为异步 watchdog"},{"path":"browser_use/agent/message_manager/service.py","why":"上下文如何拼装与压缩，决定 LLM 看到什么"}],"extension_points":["加一个新工具/动作：用 @tools.action(description=...) 装饰函数，参数类型自动转成 LLM schema，参考 browser_use/tools/service.py 内置动作","自定义动作参数模型：给 @action 传 param_model=某个 BaseModel，参考 browser_use/tools/registry/views.py 的 ActionModel","新增浏览器行为：继承 BaseWatchdog 并实现 attach 的监听逻辑，参考 browser_use/browser/watchdogs/dom_watchdog.py","接入新的大模型：实现 BaseChatModel 协议 的 ainvoke 与 provider/name 属性，参考 browser_use/llm/base.py","自定义系统提示：继承或替换 SystemPrompt，用 Agent(override_system_message=...) 或 extend_system_message","结构化输出：给 Agent 传 output_model，done 动作会按该 schema 返回结构化结果"],"learning_path":["第1步：读 README.md，分清 云托管/CLI/Python 库 三种形态与 Agent 基本用法","第2步：读 agent/service.py 的 run() 与 step()，抓住 感知-决策-执行-后处理 四阶段主循环","第3步：读 agent/views.py 的 AgentOutput 与 ActionResult，理解单步输入输出契约","第4步：读 tools/service.py 与 tools/registry/service.py，搞清动作如何注册、schema 如何生成、如何执行","第5步：读 dom/service.py 与 dom/serializer/serializer.py，理解 DOM 如何变成带索引的 LLM 表示","第6步：读 browser/session.py、events.py 与 watchdog_base.py，理解事件总线与 watchdog 解耦的控制层","第7步：读 agent/message_manager/service.py，理解上下文如何拼装与压缩"],"diagram_mermaid":"graph TD\n  T[任务 task] --> A[Agent.run 主循环]\n  A --> P[准备上下文 get_browser_state_summary]\n  P --> E[event_bus 派发 BrowserStateRequestEvent]\n  E --> W[DOM watchdog 处理]\n  W --> D[DomService 拉取 CDP DOM 与 AX 树]\n  D --> S[DOMTreeSerializer 分配整数索引并序列化]\n  S --> M[MessageManager 拼装消息]\n  M --> L[LLM.ainvoke 返回 AgentOutput]\n  L --> X[multi_act 执行动作]\n  X --> R[Registry 校验参数并调用动作函数]\n  R --> B[event_bus 派发 Click 或 Navigate 事件]\n  B --> C[watchdog 执行 CDP 操作]\n  C --> O[ActionResult 回填]\n  O --> A\n  A --> H[AgentHistoryList 最终结果]","surprises":["浏览器控制不是动作函数直接调 CDP，而是通过事件总线 + watchdog 异步解耦：动作只负责派发事件，真正操作浏览器的是一群订阅事件的 watchdog","动作空间用 Pydantic 的 create_model 在运行时动态生成，LLM 走 tool-calling 结构化输出强约束，而不是自由文本解析","LLM 用整数索引如 [12] 引用页面元素而非 CSS 选择器，索引每步重新分配，跨步引用旧索引会失效或点错元素","DOM 序列化会按 paint order 与包围盒裁剪隐藏/越界元素，因此 LLM 看到的元素集合与真实 DOM 并不一致","包内大量使用 __getattr__ 懒加载，因为 agent.views 等模块导入耗时超过 1 秒，直接导入会拖慢启动"],"confidence":"高"},"camel-ai/camel":{"repo":"camel-ai/camel","name":"CAMEL","one_liner":"用角色扮演让两个 Agent 自主对话协作的多智能体研究框架","problem":"解决如何让多个 LLM Agent 在没有人类干预下自主协作：通过角色扮演与任务提示让 Agent 分工对话，并提供 Workforce 把任务分解派发给多个 Worker。","difficulty":"困难","core_abstractions":[{"name":"ChatAgent","role":"最核心的单体 Agent，实现 step 单步循环、工具调用、记忆管理与终止判定","file":"camel/agents/chat_agent.py"},{"name":"BaseAgent","role":"所有 Agent 的抽象基类，只规定 reset 与 step 两个方法","file":"camel/agents/base.py"},{"name":"RolePlaying","role":"两 Agent 角色扮演协作，用任务提示驱动 Assistant 与 User 交替对话","file":"camel/societies/role_playing.py"},{"name":"Workforce","role":"多 Worker 协作系统，内含协调者与任务规划者，负责分配、分解与重试任务","file":"camel/societies/workforce/workforce.py"},{"name":"TaskChannel","role":"任务发布订阅通道，Worker 通过它领取任务并回传结果，实现解耦并发","file":"camel/societies/workforce/task_channel.py"},{"name":"Worker","role":"Workforce 中工作节点的抽象，定义监听通道与处理任务的协议","file":"camel/societies/workforce/worker.py"},{"name":"Task","role":"可分解的任务对象，携带内容、依赖关系与状态，是 Workforce 的调度单位","file":"camel/tasks/task.py"},{"name":"BaseMessage","role":"角色扮演对话中传递的消息对象，携带角色名、角色类型与多模态内容","file":"camel/messages/base.py"},{"name":"ModelFactory","role":"统一的模型工厂，按平台与类型创建后端模型，屏蔽几十家模型差异","file":"camel/models/model_factory.py"},{"name":"SystemMessageGenerator","role":"根据任务类型与角色名生成系统提示词，是角色扮演提示词工程的入口","file":"camel/generators.py"},{"name":"BaseTerminator","role":"对话终止判定抽象，决定角色扮演循环何时结束","file":"camel/terminators/base.py"}],"layers":[{"name":"Agent 层","responsibility":"定义单体 Agent 的推理循环、工具调用与记忆，是所有协作的基础单元","modules":["camel/agents"],"files":["camel/agents/chat_agent.py","camel/agents/base.py","camel/agents/role_assignment_agent.py"]},{"name":"Society 协作层","responsibility":"把多个 Agent 组织成角色扮演或 Workforce 两种协作形态","modules":["camel/societies"],"files":["camel/societies/role_playing.py","camel/societies/workforce/workforce.py","camel/societies/workforce/task_channel.py"]},{"name":"消息层","responsibility":"定义 Agent 间传递的消息格式与多模态内容封装","modules":["camel/messages"],"files":["camel/messages/base.py","camel/messages/func_message.py"]},{"name":"模型层","responsibility":"封装各大模型平台，提供统一的模型后端与工厂","modules":["camel/models","camel/configs"],"files":["camel/models/model_factory.py","camel/models/base_model.py","camel/configs/base_config.py"]},{"name":"提示词层","responsibility":"提供角色扮演、任务生成、评估等各类提示词模板与系统消息生成","modules":["camel/prompts"],"files":["camel/prompts/base.py","camel/prompts/ai_society.py","camel/prompts/task_prompt_template.py"]},{"name":"工具层","responsibility":"提供搜索、代码执行、浏览器等大量可挂载工具","modules":["camel/toolkits"],"files":["camel/toolkits/__init__.py"]},{"name":"记忆与任务层","responsibility":"管理 Agent 记忆以及 Workforce 调度的任务对象与终止条件","modules":["camel/memories","camel/tasks","camel/terminators"],"files":["camel/memories/agent_memories.py","camel/tasks/task.py","camel/terminators/base.py"]},{"name":"示例层","responsibility":"提供角色扮演与 Workforce 的可运行样例","modules":["examples"],"files":["examples/ai_society/role_playing.py","examples/workforce/multiple_single_agents.py"]}],"data_flow":["第1步：用 ModelFactory 创建模型后端并构造 ChatAgent","第2步：角色扮演场景下，RolePlaying 用 SystemMessageGenerator 生成双方系统提示词","第3步：可选地由 TaskSpecifyAgent 把原始任务细化为指定任务提示","第4步：init_chat 生成起始消息交给 Assistant Agent","第5步：调用 step，Assistant 先通过 ChatAgent.step 生成回复","第6步：该回复作为输入交给 User Agent，User 再生成回复","第7步：循环往复，每轮检查终止条件与 CAMEL_TASK_DONE 标记","第8步：Workforce 场景下，人类任务经 process_task 进入协调者","第9步：协调者把任务发布到 TaskChannel，并可能用任务规划者做分解","第10步：Worker 从通道领取任务，调用各自 ChatAgent 执行后回传结果","第11步：失败任务触发重试、创建新 Worker 或进一步分解等策略"],"entry_points":[{"path":"examples/ai_society/role_playing.py","what":"最小角色扮演示例，展示两个 Agent 如何围绕任务对话"},{"path":"examples/workforce/multiple_single_agents.py","what":"Workforce 示例，展示如何添加多个 Worker 并处理一个复合任务"},{"path":"camel/societies/role_playing.py","what":"RolePlaying 类，init_chat 与 step 是驱动对话循环的入口"},{"path":"camel/societies/workforce/workforce.py","what":"Workforce 类，process_task 是启动任务调度的入口"},{"path":"camel/agents/chat_agent.py","what":"ChatAgent.step 是单个 Agent 执行一步的核心入口"}],"key_files":[{"path":"README.md","why":"先读它理解 CAMEL 的设计原则与两大协作形态"},{"path":"camel/agents/chat_agent.py","why":"ChatAgent 是最核心的 Agent 实现，理解 step 才能读懂上层协作"},{"path":"camel/messages/base.py","why":"BaseMessage 是角色扮演的通信载体，先理解它再看对话循环"},{"path":"camel/societies/role_playing.py","why":"看两个 Agent 如何用提示词自主协作，是 CAMEL 的灵魂"},{"path":"camel/generators.py","why":"SystemMessageGenerator 揭示角色提示词是怎么拼出来的"},{"path":"camel/societies/workforce/workforce.py","why":"理解另一种组织方式：任务分解与 Worker 调度"},{"path":"camel/societies/workforce/task_channel.py","why":"TaskChannel 是 Worker 解耦并发的关键机制"},{"path":"examples/workforce/multiple_single_agents.py","why":"最短的 Workforce 上手样例，配合源码阅读"}],"extension_points":["想新增一个 Agent 类型：继承 camel/agents/base.py 的 BaseAgent 或 camel/agents/chat_agent.py 的 ChatAgent，参考 role_assignment_agent.py","想新增一种协作模式：在 camel/societies 下新建类，角色扮演参考 role_playing.py，团队参考 workforce/workforce.py","想新增一个 Worker 类型：继承 camel/societies/workforce/worker.py 的 Worker，参考 single_agent_worker.py 与 role_playing_worker.py","想新增一个工具：在 camel/toolkits 下实现 Toolkit 子类并把函数作为 tools 传给 ChatAgent","想接入新模型：在 camel/models 下实现 BaseModelBackend，并在 model_factory.py 与 camel/configs 注册","想自定义角色提示词：修改 camel/prompts 下的模板或传入 sys_msg_generator_kwargs","想自定义终止逻辑：在 camel/terminators 下继承 BaseTerminator"],"learning_path":["第1步：读 README.md 与 examples/ai_society/role_playing.py，跑通一次角色扮演","第2步：读 camel/agents/chat_agent.py 的 step 与 _step_impl，理解单 Agent 循环","第3步：读 camel/messages/base.py 与 camel/generators.py，理解消息与系统提示生成","第4步：读 camel/societies/role_playing.py 的 init_chat 与 step，理解对话驱动","第5步：读 camel/tasks/task.py 与 camel/societies/workforce/workforce.py，理解任务分解调度","第6步：读 camel/societies/workforce/task_channel.py 与 worker.py，理解并发与解耦"],"diagram_mermaid":"graph TD\n  T[任务提示] --> SM[SystemMessageGenerator 生成角色提示]\n  SM --> A[Assistant Agent]\n  SM --> U[User Agent]\n  A -->|消息| U\n  U -->|消息| A\n  A --> TERM[终止判定]\n  U --> TERM\n  T --> W[Workforce 协调者]\n  W --> TC[TaskChannel]\n  TC --> WK1[Worker A]\n  TC --> WK2[Worker B]\n  WK1 --> TC\n  WK2 --> TC\n  W --> R[结果汇总]","surprises":["两个 Agent 的协作完全不靠外部编排脚本，而是靠系统提示词让模型自己按角色轮流说话","RolePlaying.step 只推进一轮：User 先响应 Assistant，再由 Assistant 响应 User，调用方需自己写循环","Workforce 内部用三个特殊 ChatAgent 分别充当协调者、任务规划者与动态 Worker，复用了同一个 ChatAgent 类","Agent 之间通过 TaskChannel 而非直接调用通信，Worker 是异步监听通道领取任务，天然支持并发与失败重试","仓库里 ModelFactory 与 configs 覆盖数十家模型平台，是理解其可扩展性的关键，但也让 model 目录非常庞大"],"confidence":"高"},"facebookresearch/habitat-lab":{"repo":"facebookresearch/habitat-lab","name":"Habitat-Lab","one_liner":"室内具身 AI 高层库，统一组织任务、数据集与仿真器","problem":"室内导航与交互任务研究缺少统一的仿真环境、任务定义与训练基线。Habitat-Lab 以 Habitat-Sim 为核心，用可插拔的 Task/Dataset/Simulator 三件套和 Hydra 配置体系，支持导航、重排、指令跟随、问答等多类具身任务的训练与评测。","difficulty":"困难","core_abstractions":[{"name":"Env","role":"核心环境类，把 dataset、simulator、task 三者连接起来，管理 episode 迭代、reset 与 step","file":"habitat-lab/habitat/core/env.py"},{"name":"RLEnv","role":"对 Env 的 gym.Env 包装，子类实现 get_reward/get_done/get_info，供 RL 训练使用","file":"habitat-lab/habitat/core/env.py"},{"name":"EmbodiedTask","role":"任务基类，定义动作空间、观测空间、度量与 step/reset，是扩展任务的形式化接口","file":"habitat-lab/habitat/core/embodied_task.py"},{"name":"Dataset","role":"episode 集合的抽象，提供 episode 迭代器与场景划分，是任务实例的来源","file":"habitat-lab/habitat/core/dataset.py"},{"name":"Simulator","role":"仿真器抽象，提供动作执行、传感器套件、agent 状态与场景重配置接口","file":"habitat-lab/habitat/core/simulator.py"},{"name":"Sensor","role":"传感器基类，定义观测的 uuid、空间与 get_observation，sim 与 task 都可挂载","file":"habitat-lab/habitat/core/simulator.py"},{"name":"Measure","role":"度量基类，提供 reset_metric/update_metric/get_ metagpt/const.py"]},{"name":"记忆层","responsibility":"提供短期消息记忆与长期记忆检索能力，供角色去重与增强上下文","modules":["metagpt/memory","metagpt/rag"],"files":["metagpt/memory/memory.py","metagpt/memory/longterm_memory.py","metagpt/memory/brain_memory.py"]},{"name":"配置与模型接入层","responsibility":"统一 LLM、embedding、搜索等 provider 的配置与实例化，支持按角色覆盖模型","modules":["metagpt/configs","metagpt/provider","config"],"files":["metagpt/config2.py","config/config2.example.yaml","metagpt/provider"]}],"data_flow":["第1步：用户构造 Team 并 hire 一组 Role，或直接调用 software_company.startup 走预置软件公司流程","第2步：把 idea 包装成 UserRequirement 消息投入环境 publish_message，按 cause_by 路由给订阅该动作的角色","第3步：Environment.run 每轮遍历所有非 idle 角色，用 asyncio.gather 并发调用各自 role.run","第4步：Role.run 先 _observe，从私有 msg_buffer 与 memory 取新消息，按 rc.watch 与 send_to 过滤出 rc.news","第5步：若存在新消息则进入 react，按 react_mode 选择 _react 或 _plan_and_act 策略","第6步：_react 循环 _think 选动作，BY_ORDER 模式按序轮转、REACT 模式用 LLM 动态选择","第7步：_act 执行 rc.todo.run(history)，Action 组装 prompt 并经 ActionNode.fill 调用 LLM 得到结构化 ActionOutput","第8步：结果被包装成 AIMessage 写入角色 memory，再经 publish_message 广播回环境","第9步：Environment.publish_message 依据 send_to 与 member_addrs 把消息投递到目标角色的 msg_buffer","第10步：Team.run 循环多轮直到 env.is_idle，返回 env.history 作为最终交付物"],"entry_points":[{"path":"metagpt/team.py:Team.run","what":"团队顶层运行循环，投喂需求并按轮次推进直到所有角色空闲"},{"path":"metagpt/software_company.py:startup","what":"预置软件公司的启动入口，组装 PM/架构师/项目经理/工程师团队"},{"path":"metagpt/roles/role.py:Role.run","what":"单个角色的主循环入口：观察-反应-发布消息"},{"path":"metagpt/environment/base_env.py:Environment.run","what":"环境调度入口，每轮并发驱动所有非空闲角色"},{"path":"examples/","what":"各类可直接运行的示例脚本，最快的上手入口"}],"key_files":[{"path":"README.md","why":"先理解核心哲学 Code = SOP(Team)，以及输入输出边界"},{"path":"metagpt/schema.py","why":"Message/Document/Task 等数据模型，理解角色间传递什么"},{"path":"metagpt/roles/role.py","why":"Role 基类与观察-思考-行动循环，是协作机制的核心"},{"path":"metagpt/actions/action.py","why":"Action 基类与 LLM 调用契约，理解一个 SOP 步骤如何执行"},{"path":"metagpt/environment/base_env.py","why":"环境如何广播消息与并发调度角色，理解系统如何跑起来"},{"path":"metagpt/team.py","why":"团队装配与顶层运行循环，把角色和环境串起来"},{"path":"metagpt/actions/write_prd.py","why":"一个典型动作的完整实现，看 prompt 与 ActionNode 如何组织"},{"path":"config/config2.example.yaml","why":"参数体系：全局与按角色的 LLM/embedding 配置"}],"extension_points":["新增一个角色：继承 metagpt/roles/role.py 的 Role，在 __init__ 里 set_actions 并 _watch 关注的动作，参考 product_manager.py","新增一个动作：继承 metagpt/actions/action.py 的 Action，实现 async def run，用 ActionNode 约束结构化输出","定义结构化交付物：使用 metagpt/actions/action_node.py 的 ActionNode 与模板，自动生成可解析字段","新增运行环境：继承 metagpt/environment/base_env.py 的 Environment，重写 publish_message/run 以改变调度或路由","更换记忆后端：继承 metagpt/memory/memory.py 的 Memory 或扩展 longterm_memory.py，接入向量库","新增 LLM/embedding 供应商：在 metagpt/provider 下实现对应 provider 并在 configs 注册"],"learning_path":["第1步：读 README.md 与 software_company.py，明确 SOP 协作的整体目标与团队构成","第2步：读 schema.py 的 Message，理解 cause_by 与 send_to 构成的发布订阅路由","第3步：读 roles/role.py，吃透 _observe/_think/_act/react 的观察-思考-行动循环","第4步：读 actions/action.py 与一个具体动作 write_prd.py，理解动作如何调 LLM 产出交付物","第5步：读 environment/base_env.py 与 team.py，理解环境如何并发调度并判定空闲收敛","第6步：读 config2.example.yaml，了解如何按角色配置不同模型"],"diagram_mermaid":"graph TD\n  U[一句话需求] --> T[Team 雇佣角色]\n  T --> E[Environment 环境]\n  E --> R[Role.run 主循环]\n  R --> O[_observe 过滤新消息]\n  O --> M[Memory 消息记忆]\n  O --> K[_think 选择动作]\n  K --> A[_act 执行动作]\n  A --> AC[Action.run 组装 prompt]\n  AC --> L[LLM 生成结构化输出]\n  L --> A\n  A --> P[publish_message 广播消息]\n  P --> RT[Environment 路由投递]\n  RT --> O\n  R --> ID{全部角色 idle}\n  ID -->|否| R\n  ID -->|是| OUT[返回 env.history 交付物]","surprises":["角色之间不直接互相调用，全部通过 Environment 的消息广播解耦；一个角色是否行动由它订阅的动作类型 cause_by 决定，而非显式编排","SOP 不是硬编码流程图，而是由每个 Role 的 actions 列表与 _watch 规则隐式涌现出来，读代码时需要把多个角色的订阅关系拼起来才能看到完整流程","Role 默认 enable_memory 会去重历史消息，角色可能因为消息已在记忆中而选择不行动，调试时容易误判为卡住","Message 同时承载自然语言 content 和结构化 instruct_content，ActionNode 负责把 LLM 输出转成可校验的字段，是保证多角色交接格式一致的关键"],"confidence":"高"},"getzep/graphiti":{"repo":"getzep/graphiti","name":"Graphiti","one_liner":"为 AI Agent 构建可增量更新的时序知识图谱记忆","problem":"解决传统 RAG 无法表达事实随时间变化的问 db.py","what":"FalkorDB 后端快速上手，展示如何替换图存储"},{"path":"graphiti_core/graphiti.py:Graphiti.add_episode","what":"写入 Episode 的主入口，驱动抽取到落库的全流程"},{"path":"graphiti_core/graphiti.py:Graphiti.search","what":"检索主入口，按查询与配置返回节点边社区"},{"path":"mcp_server/src/graphiti_mcp_server.py","what":"MCP 服务器入口，把图记忆能力暴露给 Agent 客户端"},{"path":"server/graph_service/main.py","what":"FastAPI 服务入口，提供 HTTP 化的图记忆服务"}],"key_files":[{"path":"README.md","why":"先建立认知：时序知识图谱、Episode 溯源与混合检索的整体定位"},{"path":"graphiti_core/graphiti.py","why":"核心编排，add_episode 与 search 是理解系统全貌的必经之路"},{"path":"graphiti_core/nodes.py","why":"EpisodicNode 与 EntityNode 的数据结构与持久化，理解溯源与实体演化"},{"path":"graphiti_core/edges.py","why":"EntityEdge 的 valid_at 与 invalid_at，理解时序有效性建模"},{"path":"graphiti_core/utils/maintenance/edge_operations.py","why":"关系抽取与旧边失效逻辑，是时序语义最烧脑的部分"},{"path":"graphiti_core/driver/driver.py","why":"图存储抽象契约，理解后端如何可插拔"},{"path":"graphiti_core/search/search.py","why":"混合检索实现，理解语义加关键词加图遍历如何融合"},{"path":"graphiti_core/llm_client/client.py","why":"LLM 抽象与重试缓存，理解所有抽取调用的统一入口"},{"path":"examples/quickstart/quickstart_neo4j.py","why":"最小可运行示例，把抽象概念落到具体调用"}],"extension_points":["新增图存储后端：继承 graphiti_core/driver/driver.py 的 GraphDriver 与 GraphDriverSession，参照 neo4j_driver.py 与 falkordb_driver.py 实现","新增 LLM 供应商：继承 graphiti_core/llm_client/client.py 的 LLMClient 并实现 _generate_response","新增嵌入模型：继承 graphiti_core/embedder/client.py 的 EmbedderClient，实现 create 与 create_batch","新增重排器：继承 graphiti_core/cross_encoder/client.py 的 CrossEncoderClient","自定义本体：add_episode 传入 entity_types 与 edge_types 的 Pydantic 模型，约束实体与关系类型","自定义提示词：通过 ChatPromptLibrary 覆盖，参考 graphiti_core/prompts/lib.py 的组合方式","自定义检索策略：改 graphiti_core/search/search_config_recipes.py 中的检索配方组合"],"learning_path":["第1步：读 README.md，理解时序知识图谱、Episode 溯源与混合检索三个核心概念","第2步：读 examples/quickstart/quickstart_neo4j.py，跑通最小闭环","第3步：读 graphiti_core/graphiti.py 的 __init__ 与 add_episode，掌握组件装配与写入流程","第4步：读 graphiti_core/nodes.py 与 edges.py，掌握实体、Episode 与时序边的数据结构","第5步：读 graphiti_core/utils/maintenance/edge_operations.py，理解关系抽取与旧边失效","第6步：读 graphiti_core/driver/driver.py，理解存储后端抽象与扩展方式","第7步：读 graphiti_core/search/search.py，理解混合检索与重排的协同"],"diagram_mermaid":"graph TD\n  A[Episode 原始数据] --> B[retrieve_episodes 取历史上下文]\n  B --> C[extract_nodes 抽取实体]\n  C --> D[resolve_extracted_nodes 去重合并]\n  D --> E[extract_edges 抽取关系]\n  E --> F[resolve_extracted_edges 解析并失效旧边]\n  F --> G[extract_attributes 生成摘要与属性]\n  G --> H[写入图数据库 Neo4j]\n  H --> I[build_communities 可选社区聚类]\n  J[search 查询] --> K[语义加 BM25 加图遍历混合检索]\n  K --> L[返回节点边与社区]","surprises":["事实更新不删除旧数据：当新 Episode 与旧事实冲突时，旧 EntityEdge 被设置 invalid_at 而非删除，因此可以查询任意历史时刻为真的事实","add_episode 文档明确要求逐条顺序 await、不可并发调用，但内部对多条边的解析却用 semaphore_gather 并发，顺序性只约束 Episode 之间","时序失效不是简单比较时间戳：_apply_temporal_invalidation 会用候选边的 valid_at 反推已解析边的 invalid_at，逻辑比直觉复杂","group_id 既是图分区键又是并发请求作用域，_resolve_request_scope 会按 group_id 克隆 driver，避免并发写入互相污染数据库目标","仓库同时内置 Neo4j、FalkorDB、Kuzu 与 Neptune 四个后端，Kuzu 已因上游停维护被标记为弃用，但代码仍在"],"confidence":"高"},"google-deepmind/mujoco":{"repo":"google-deepmind/mujoco","name":"MuJoCo","one_liner":"面向机器人与机器学习的多关节接触动力学物理引擎","problem":"机器人研究需要快速且准确的铰接结构接触动力学仿真。MuJoCo 用预分配的低层数据结构与高效接触求解器，在保证物理精度的同时达到实时性能，并为控制与强化学习提供大量物理量计算工具。","difficulty":"困难","core_abstractions":[{"name":"mjModel","role":"不可变的模型数据结构，由 XML 编译器一次性预分配全部尺寸与参数数组，运行期只读","file":"include/mujoco/mjmodel.h"},{"name":"mjData","role":"可变的仿真状态与中间结果结构，存放 qpos、qvel、qacc、ctrl、contact、efc 等全部运行期数据","file":"include/mujoco/mjdata.h"},{"name":"mjSpec","role":"可变的模型规格对象，支持程序化增删 body、geom、actuator、sensor 后再编译成 mjModel","file":"include/mujoco/mjspec.h"},{"name":"mjsActuator","role":"执行器规格结构，声明 gain、bias、dynamics、transmission 与钳位等参数，定义驱动力的生成方式","file":"include/mujoco/mjspec.h"},{"name":"mjsSensor","role":"传感器规格结构，声明传感器类型、被感测对象、数据类型、计算阶段与维度","file":"include/mujoco/mjspec.h"},{"name":"mj_step","role":"仿真主循环入口，先 mj_forward 计算动力学再按 integrator 类型推进状态","file":"src/engine/engine_forward.c"},{"name":"mj_sensorAcc","role":"加速度阶段传感器计算入口，与 mj_sensorPos、mj_sensorVel 一起构成分阶段的传感器求值体系","file":"src/engine/engine_sensor.c"},{"name":"mj_compile","role":"把 mjSpec 编译成 mjModel 的编译器入口，负责尺寸计算、内存分配与默认值解析","file":"src/user/user_api.cc"},{"name":"mjpPlugin","role":"插件接口结构，允许外部注册新的 actuator、sensor、资源解码器等扩展而不改核心代码","file":"include/mujoco/mjplugin.h"},{"name":"PyMjModel 绑定层","role":"用 pybind11 把 mjModel 与 mjData 的内存映射成 numpy 视图，实现零拷贝的 Python 访问","file":"python/mujoco/structs_wrappers.cc"},{"name":"XML 读取器","role":"解析 MJCF 与 URDF，把 XML 元素映射为 mjSpec 中的各类规格对象","file":"src/xml/xml_native_reader.cc"}],"layers":[{"name":"C 引擎核心层","responsibility":"实现正逆动力学、碰撞检测、约束求解、积分器、传感器与导数计算等物理核心","modules":["src/engine"],"files":["src/engine/engine_forward.c","src/engine/engine_sensor.c","src/engine/engine_solver.c","src/engine/engine_collision_driver.c","src/engine/engine_derivative.c"]},{"name":"模型编译与用户 API 层","responsibility":"把 mjSpec 编译为 mjModel，并提供加载模型、查询信息等用户级 C API","modules":["src/user","src/xml"],"files":["src/user/user_api.cc","src/user/user_model.cc","src/xml/xml_api.cc","src/xml/xml_native_reader.cc"]},{"name":"公共头文件层","responsibility":"定义 mjModel、mjData、mjSpec 与全部枚举类型，是 C API 与各语言绑定的唯一契约","modules":["include/mujoco"],"files":["include/mujoco/mujoco.h","include/mujoco/mjmodel.h","include/mujoco/mjdata.h","include/mujoco/mjtype.h"]},{"name":"插件扩展层","responsibility":"以插件形式提供额外的传感器、执行器与网格解码器，作为核心的扩展机制","modules":["plugin"],"files":["plugin/sensor/touch_grid.cc","plugin/sensor/register.cc","plugin/actuator/pid.cc","plugin/elasticity"]},{"name":"Python 绑定层","responsibility":"用 pybind11 暴露 C API，并把结构体字段映射为可读写 numpy 视图","modules":["python/mujoco"],"files":["python/mujoco/__init__.py","python/mujoco/functions.cc","python/mujoco/structs_wrappers.cc","python/mujoco/specs_wrapper.cc","python/mujoco/rollout.py","python/mujoco/renderer.py"]},{"name":"绑定代码生成层","responsibility":"从 C 头文件与枚举定义自动生成函数与枚举的绑定代码，避免手写绑定漂移","modules":["python/mujoco/codegen","python/mujoco/introspect"],"files":["python/mujoco/codegen/generate_enum_traits.py","python/mujoco/codegen/generate_function_traits.py","python/mujoco/introspect/__init__.py"]},{"name":"MJX 可微分物理层","responsibility":"用 JAX 重写的可微分与可并行的 MuJoCo 分支，支持自动微分与批量仿真","modules":["mjx"],"files":["mjx/mujoco/mjx/__init__.py"]},{"name":"交互式查看器层","responsibility":"基于 GLFW 与 OpenGL 的原生可视化程序，支持交互式模型调试与录制","modules":["simulate"],"files":["simulate/simulate.cc","simulate/main.cc"]}],"data_flow":["第1步：调用 mj_parseXML 或 Python 的 MjSpec.from_file，XML 读取器把 MJCF 解析成可变的 mjSpec","第2步：调用 mj_compile 把 mjSpec 编译成 mjModel，此时全部尺寸与参数数组被一次性预分配","第3步：用 mj_makeData 或 MjData 构造 mjData，分配运行期缓冲、栈与 arena 内存","第4步：用户设置 mjData.ctrl，即各个 actuator 的标量控制输入","第5步：调用 mj_step，先执行 mj_forward 完成位置、速度与加速度阶段的正向计算","第6步：mj_forward 中依次计算碰撞接触、约束、被动力、执行器力与传感器读数","第7步：传感器按 mj_sensorPos、mj_sensorVel、mj_sensorAcc 三个阶段分别求值并写入 sensordata","第8步：mj_step 依据 mjOption.integrator 选择 Euler、RK4、implicit 或 discrete 积分器推进 qpos 与 qvel","第9步：Python 侧通过 numpy 视图直接读取 mjData 的 qpos、qvel、sensordata 等字段，无需拷贝","第10步：需要改模型时用 mjs_addBody、mjs_addSensor、mjs_addActuator 修改 mjSpec 后重新 mj_compile"],"entry_points":[{"path":"simulate/simulate.cc","what":"原生交互式查看器主程序，加载模型并实时可视化仿真"},{"path":"simulate/main.cc","what":"simulate 可执行文件的入口，解析命令行并启动查看器"},{"path":"python/tutorial.ipynb","what":"Python 绑定入门教程，演示加载模型、步进与读取状态"},{"path":"python/mjspec.ipynb","what":"模型编辑教程，演示用 mjSpec 程序化构建与修改模型"},{"path":"sample/basic.cc","what":"最小 C API 示例，演示加载模型、步进仿真与查询状态"},{"path":"sample/compile.cc","what":"C API 编译示例，演示从 XML 解析到 mj_compile 的流程"},{"path":"mjx/mujoco/mjx/__init__.py","what":"MJX 可微分物理的 Python 入口"},{"path":"src/xml/xml_api.cc","what":"C 侧模型加载入口，mj_loadXML 与 mj_parseXML 的实现"}],"key_files":[{"path":"README.md","why":"先建立整体认知：引擎定位、安装方式、Python 与 Unity 绑定入口"},{"path":"include/mujoco/mjmodel.h","why":"mjModel 结构定义，理解模型参数如何被组织成紧凑数组"},{"path":"include/mujoco/mjdata.h","why":"mjData 结构定义，理解运行期状态与中间结果如何存放"},{"path":"include/mujoco/mjspec.h","why":"可变建模 API，理解 mjsBody、mjsActuator、mjsSensor 等规格对象"},{"path":"src/engine/engine_forward.c","why":"mj_step 与 mj_forward 实现，是理解仿真主循环的核心"},{"path":"src/engine/engine_sensor.c","why":"传感器分阶段计算实现，是新增传感器类型必读的文件"},{"path":"src/user/user_api.cc","why":"mj_compile 与 mjs_addActuator、mjs_addSensor 等 API 的实现"},{"path":"src/xml/xml_native_reader.cc","why":"MJCF 解析实现，理解 XML 元素如何映射为规格对象"},{"path":"python/mujoco/functions.cc","why":"Python 绑定函数注册，理解 C API 如何暴露给 Python"},{"path":"doc/programming/extension.rst","why":"官方扩展指南，理解插件系统如何用于新增功能"}],"extension_points":["想加新 actuator 类型：在 include/mujoco/mjtype.h 的 mjtActuator 加枚举，在 src/engine/engine_forward.c 的执行器力计算与 src/xml/xml_native_reader.cc 的解析中补分支","想加新 sensor 类型：在 include/mujoco/mjtype.h 的 mjtSensor 加枚举，在 src/engine/engine_sensor.c 的对应阶段函数中加计算，并在 XML 读取器与 src/xml/mjcf.schema 中注册","想用插件方式扩展：实现 mjpPlugin 接口并调用 mjp_registerPlugin，参考 plugin/sensor/touch_grid.cc 与 plugin/actuator/pid.cc","想新增 Python 绑定函数：在 python/mujoco/functions.cc 用 Def 宏注册对应 traits，或改 python/mujoco/codegen 下的生成器","想程序化建模：用 mjSpec 的 mjs_addBody、mjs_addGeom、mjs_addSensor、mjs_addActuator 构建模型再 mj_compile","想做可微分或大规模并行仿真：在 mjx 目录下用 JAX 实现或扩展"],"learning_path":["第1步：读 README.md 与 python/tutorial.ipynb，跑通加载模型与步进仿真的最小闭环","第2步：读 include/mujoco/mjmodel.h 与 mjdata.h，理解模型只读、数据可变的读写分离设计","第3步：读 src/xml/xml_api.cc 与 src/user/user_api.cc，理解 XML 到 mjSpec 再到 mjModel 的编译流程","第4步：读 src/engine/engine_forward.c 的 mj_step 与 mj_forward，理解仿真主循环与积分器分派","第5步：读 src/engine/engine_sensor.c，理解传感器如何分位置、速度、加速度三阶段求值","第6步：读 include/mujoco/mjspec.h 与 python/mjspec.ipynb，掌握程序化建模与修改模型","第7步：读 doc/programming/extension.rst 与 plugin 下的示例，理解如何用插件扩展引擎"],"diagram_mermaid":"graph TD\n  XML[MJCF 或 URDF 文件] --> PARSER[XML 读取器解析]\n  PARSER --> SPEC[mjSpec 可变模型规格]\n  SPEC --> COMPILE[mj_compile 编译器]\n  COMPILE --> MODEL[mjModel 只读模型数据]\n  MODEL --> DATA[mjData 可变状态数据]\n  CTRL[用户设置 ctrl 控制输入] --> DATA\n  DATA --> STEP[mj_step 仿真主循环]\n  STEP --> FWD[mj_forward 正向动力学]\n  FWD --> COLL[碰撞检测与约束求解]\n  FWD --> SENSOR[传感器分阶段求值]\n  SENSOR --> SENSORDATA[sensordata 传感器读数]\n  STEP --> INT[按类型选择积分器推进状态]\n  INT --> DATA\n  DATA --> PYBIND[Python 绑定 numpy 视图]\n  MODEL --> PYBIND\n  PYBIND --> USER[Python 用户代码]\n  SPEC --> PLUGIN[mjpPlugin 插件扩展]\n  PLUGIN --> COMPILE","surprises":["模型与数据严格分离：mjModel 由编译器一次性预分配且运行期只读，mjData 才存放可变状态，这种读写分离是性能的关键，也意味着改模型必须重新编译","传感器求值分位置、速度、加速度三个阶段且是懒执行，由 flg_energypos 等标记控制，调用顺序会影响结果","Python 绑定大部分由 codegen 从 C 头文件自动生成，手改 functions.cc 之外的绑定文件通常会被下次生成覆盖","mjSpec 是可变的建模对象，mj_compile 才产出不可变 mjModel，早期版本没有这层抽象，程序化建模靠字符串拼接 XML","插件系统允许在不改核心 C 代码的情况下新增 actuator 与 sensor 类型，但需要同时提供 XML 解析钩子与计算实现"],"confidence":"高"},"haosulab/ManiSkill":{"repo":"haosulab/ManiSkill","name":"ManiSkill","one_liner":"基于 SAPIEN 的 GPU 并行机器人操作仿真与训练框架","problem":"机器人操作研究需要大量高吞吐仿真数据与统一任务基准。ManiSkill 用 SAPIEN 做 GPU 并行物理仿真与渲染，单卡可并行数千个环境，并用面向对象 API 屏蔽 GPU 内存管理，让研究者专注任务逻辑与策略训练。","difficulty":"中等","core_abstractions":[{"name":"BaseEnv","role":"所有 ManiSkill 任务的基类，继承 gymnasium.Env，管理观测/奖励/控制模式、并行环境数、仿真后端与 step/reset 生命周期","file":"mani_skill/envs/sapien_env.py"},{"name":"ManiSkillScene","role":"把多个 sapien.Scene 子场景包装成一个逻辑场景，统一转发位姿/速度/驱动等调用并管理 GPU 状态","file":"mani_skill/envs/scene.py"},{"name":"BaseAgent","role":"机器人/智能体抽象基类，加载 URDF/MJCF 为 Articulation、管理控制器、提供动作空间与本体感知","file":"mani_skill/agents/base_agent.py"},{"name":"BaseController","role":"控制器基类，定义动作空间与 set_action 接口，把策略输出转成关节目标位姿或速度","file":"mani_skill/agents/controllers/base_controller.py"},{"name":"register_env","role":"装饰器，把任务类注册进 REGISTERED_ENVS 并同时注册到 gymnasium registry，是任务可被 gym.make 找到的关键","file":"mani_skill/utils/registration.py"},{"name":"ManiSkillVectorEnv","role":"gymnasium VectorEnv 实现，为 GPU 并行环境提供自动重置、终止处理与成功率等指标记录","file":"mani_skill/vector/wrappers/gymnasium.py"},{"name":"Camera","role":"相机传感器实现，按 obs_mode 渲染 rgb/depth/segmentation 等纹理供观测使用","file":"mani_skill/sensors/camera.py"},{"name":"Actor","role":"刚体对象抽象，封装单个或多个 sapien actor 的位姿、速度与几何属性并支持批量操作","file":"mani_skill/utils/structs/actor.py"},{"name":"Articulation","role":"关节机器人抽象，封装多环境 articulation 的 qpos/qvel、链接与驱动控制","file":"mani_skill/utils/structs/articulation.py"},{"name":"Pose","role":"批量位姿类型，统一表示与运算位置和四元数，是场景随机化与观测的核心数据结构","file":"mani_skill/utils/structs/pose.py"},{"name":"SimConfig","role":"仿真与 GPU 内存配置的数据类，含场景参数、GPU 显存池与频率设置","file":"mani_skill/utils/structs/types.py"},{"name":"TableSceneBuilder","role":"可复用场景构建器，搭建桌面与机器人初始状态，供抓取类任务共享","file":"mani_skill/utils/scene_builder/table/scene_builder.py"}],"layers":[{"name":"环境核心层","responsibility":"定义 BaseEnv 生命周期、仿真后端选择、并行场景管理与 step/reset 语义","modules":["mani_skill/envs"],"files":["mani_skill/envs/sapien_env.py","mani_skill/envs/scene.py","mani_skill/envs/sim2real_env.py"]},{"name":"任务层","responsibility":"按类别实现具体任务，定义资产加载、随机化、观测、奖励与成功判定","modules":["mani_skill/envs/tasks"],"files":["mani_skill/envs/tasks/tabletop/pick_cube.py","mani_skill/envs/tasks/tabletop/push_cube.py","mani_skill/envs/tasks/tabletop/stack_cube.py","mani_skill/envs/tasks/control/cartpole.py"]},{"name":"智能体与控制器层","responsibility":"定义机器人抽象、URDF/MJCF 加载、控制器族与多智能体支持","modules":["mani_skill/agents","mani_skill/agents/controllers","mani_skill/agents/robots"],"files":["mani_skill/agents/base_agent.py","mani_skill/agents/registration.py","mani_skill/agents/controllers/base_controller.py","mani_skill/agents/controllers/pd_joint_pos.py","mani_skill/agents/multi_agent.py"]},{"name":"传感器与渲染层","responsibility":"提供相机等传感器与渲染后端，生成视觉观测与人类可视渲染","modules":["mani_skill/sensors","mani_skill/render"],"files":["mani_skill/sensors/base_sensor.py","mani_skill/sensors/camera.py","mani_skill/sensors/depth_camera.py"]},{"name":"向量并行层","responsibility":"把并行环境包装成 gymnasium VectorEnv 并适配 SB3 等训练库","modules":["mani_skill/vector/wrappers"],"files":["mani_skill/vector/wrappers/gymnasium.py","mani_skill/vector/wrappers/sb3.py"]},{"name":"资产与场景构建层","responsibility":"从 URDF/MJCF 与网格资产构建 actor、articulation 与可复用场景","modules":["mani_skill/utils/building","mani_skill/utils/scene_builder"],"files":["mani_skill/utils/building/actors","mani_skill/utils/building/urdf_loader.py","mani_skill/utils/scene_builder/scene_builder.py","mani_skill/utils/scene_builder/table/scene_builder.py"]},{"name":"数据抽象层","responsibility":"提供批量位姿、刚体、关节等统一数据结构，屏蔽 CPU/GPU 与单/多环境差异","modules":["mani_skill/utils/structs"],"files":["mani_skill/utils/structs/pose.py","mani_skill/utils/structs/actor.py","mani_skill/utils/structs/articulation.py","mani_skill/utils/structs/types.py"]},{"name":"工具与注册层","responsibility":"任务注册、资产下载、随机化、观测解析与通用工具","modules":["mani_skill/utils"],"files":["mani_skill/utils/registration.py","mani_skill/utils/download_asset.py","mani_skill/envs/utils/observations"]},{"name":"示例与基线层","responsibility":"提供 RL、BC、Diffusion Policy、ACT 等可运行基线训练与评测脚本","modules":["examples/baselines"],"files":["examples/baselines/ppo/ppo.py","examples/baselines/bc/bc.py","examples/baselines/diffusion_policy/train.py"]},{"name":"轨迹层","responsibility":"录制、回放、合并与转换演示轨迹，支持转成 LeRobot 等数据格式","modules":["mani_skill/trajectory"],"files":["mani_skill/trajectory/dataset.py","mani_skill/trajectory/replay_trajectory.py","mani_skill/trajectory/convert_to_lerobot.py"]}],"data_flow":["第1步：import mani_skill.envs 触发各任务模块导入，@register_env 把任务写入 REGISTERED_ENVS 并同步注册到 gymnasium","第2步：gym.make 或 mani_skill.utils.registration.make 按 uid 找到 EnvSpec 并实例化 BaseEnv 子类","第3步：BaseEnv.__init__ 解析 obs_mode/reward_mode/control_mode，num_envs 大于 1 时 sim_backend 自动切到 physx_cuda","第4步：_setup_scene 创建 ManiSkillScene，GPU 模式下按平方根网格创建 num_envs 个 sapien 子场景并设置间距","第5步：_load_agent 按 robot_uids 从 REGISTERED_AGENTS 取 BaseAgent，加载 URDF/MJCF 为 Articulation 并装配控制器","第6步：_load_scene 加载任务资产，_setup_sensors 依据 obs_mode 创建 Camera，_load_lighting 布置光照","第7步：reset 设置主 RNG 与回合 RNG，调用 _initialize_episode 批量随机化物体位姿与目标，GPU 下 _gpu_apply_all 同步","第8步：step 调 _step_action 把动作交给 agent.controller，按 sim_steps_per_control 执行物理步，再 _gpu_fetch_all 取回状态","第9步：get_obs 依据 obs_mode 组织状态或传感器数据，get_reward 按 reward_mode 调用任务奖励函数，evaluate 给出 success","第10步：observation_space 由 _init_raw_obs 自动推断，action_space 直接来自 agent.controller，任务不手写空间","第11步：ManiSkillVectorEnv 包装环境，提供自动重置与成功率指标，供 RL 基线收集 rollout","第12步：训练脚本用向量环境采样并更新策略，录制轨迹可经 trajectory 层保存为演示数据"],"entry_points":[{"path":"mani_skill/envs/template.py","what":"自定义任务的完整模板，注释说明每个需重写的函数，是扩展任务的起点"},{"path":"mani_skill/envs/minimal_template.py","what":"最小任务模板，仅加载机器人，用于快速起步"},{"path":"mani_skill/utils/registration.py","what":"register_env 装饰器与 make 函数，任务注册与实例化的核心入口"},{"path":"examples/baselines/ppo/ppo.py","what":"PPO 基线训练脚本，展示如何用向量环境与并行仿真训练策略"},{"path":"examples/baselines/bc/bc.py","what":"行为克隆基线，从演示轨迹训练状态或视觉策略"},{"path":"examples/baselines/diffusion_policy/train.py","what":"Diffusion Policy 基线训练脚本"},{"path":"mani_skill/envs/tasks/tabletop/pick_cube.py","what":"经典抓取放球任务，可作为读源码与写新任务的范例"}],"key_files":[{"path":"README.md","why":"先建立整体认知：GPU 并行仿真、任务矩阵、基线与系统支持"},{"path":"mani_skill/envs/template.py","why":"任务抽象全貌：需要重写哪些函数、重配置与回合初始化如何分工"},{"path":"mani_skill/envs/tasks/tabletop/pick_cube.py","why":"一个完整任务的实现，对照模板理解资产加载、随机化、观测与奖励"},{"path":"mani_skill/envs/sapien_env.py","why":"BaseEnv 是全局核心，看清 obs/action/reward 模式与 step/reset 的完整流程"},{"path":"mani_skill/utils/registration.py","why":"任务如何被注册与实例化，是扩展任务与排查 make 报错的必读"},{"path":"mani_skill/agents/base_agent.py","why":"机器人抽象与控制器装配，理解动作空间从何而来"},{"path":"mani_skill/agents/controllers/base_controller.py","why":"控制器接口，理解策略动作如何变成关节控制信号"},{"path":"mani_skill/envs/scene.py","why":"GPU 并行机制的核心：多个子场景如何被合并与统一管理"},{"path":"mani_skill/vector/wrappers/gymnasium.py","why":"向量环境封装，理解并行训练时的自动重置与指标"}],"extension_points":["想加新任务：复制 mani_skill/envs/template.py，继承 BaseEnv，实现 _load_scene/_initialize_episode/evaluate/_get_obs_extra 并用 @register_env 注册","想加新机器人：继承 mani_skill/agents/base_agent.py 的 BaseAgent，设置 uid 与 urdf_path，用 @register_agent 注册","想加新控制器：继承 mani_skill/agents/controllers/base_controller.py 的 BaseController 与 ControllerConfig，在 agent 的 _controller_configs 中声明","想加新传感器：继承 mani_skill/sensors/base_sensor.py 的 BaseSensor，实现 capture 与 get_obs","想加新场景：继承 mani_skill/utils/scene_builder/scene_builder.py 的 SceneBuilder，用场景构建器注册机制登记","想改观测或奖励：在任务里重写 _get_obs_extra 与 compute_dense_reward，无需改动框架","想接入新 RL 库：参考 mani_skill/vector/wrappers/sb3.py 或 gymnasium.py 写适配包装器"],"learning_path":["第1步：读 README.md，跑通 Colab 快速上手，感受 GPU 并行仿真的吞吐","第2步：读 mani_skill/envs/template.py，理解一个任务必须实现哪些函数","第3步：读 mani_skill/envs/tasks/tabletop/pick_cube.py，把模板落到一个真实任务","第4步：读 mani_skill/envs/sapien_env.py，理解 BaseEnv 的 obs/action/reward 与 step/reset 生命周期","第5步：读 mani_skill/utils/registration.py，搞清任务如何被注册并被 gym.make 找到","第6步：读 mani_skill/agents/base_agent.py 与 controllers/base_controller.py，理解机器人动作空间来源","第7步：读 mani_skill/envs/scene.py，理解 GPU 并行场景如何组织","第8步：读 examples/baselines/ppo/ppo.py，看策略如何在并行环境上训练"],"diagram_mermaid":"graph TD\n  REG[register_env 注册任务] --> MAKE[gym.make 按 uid 实例化]\n  MAKE --> ENV[BaseEnv 初始化]\n  ENV --> SCENE[ManiSkillScene 创建子场景]\n  ENV --> AGENT[BaseAgent 加载机器人与控制器]\n  SCENE --> LOADSCENE[_load_scene 加载任务资产]\n  AGENT --> SENSOR[Camera 与传感器装配]\n  LOADSCENE --> RESET[reset 调用 _initialize_episode 随机化]\n  SENSOR --> RESET\n  RESET --> STEP[step 接收动作]\n  STEP --> CTRL[controller 转成关节目标]\n  CTRL --> PHYS[按 sim_steps_per_control 执行物理步]\n  PHYS --> OBS[get_obs 组织观测]\n  PHYS --> REW[get_reward 与 evaluate]\n  OBS --> VEC[ManiSkillVectorEnv 向量封装]\n  REW --> VEC\n  VEC --> TRAIN[RL 基线采样训练]","surprises":["同一份任务代码不改动即可在 CPU 单环境与 GPU 数千并行环境运行，只靠 num_envs 触发 sim_backend 自动切换","observation_space 不是手写的，而是运行时用一次 reset 得到的 _init_raw_obs 自动推断出来的","GPU 并行实际是把 num_envs 个 sapien.Scene 按平方根网格拼进一个物理系统，ManiSkillScene 对用户伪装成单个场景","任务注册时同时写入 ManiSkill 自己的 REGISTERED_ENVS 和 gymnasium registry，两条 make 路径并存容易混淆","动作空间由机器人控制器而非任务决定，任务只通过 SUPPORTED_ROBOTS 声明支持哪些机器人","reset 分两级：_reconfigure 重建整个场景而 _initialize_episode 只重置状态，reconfiguration_freq 决定前者调用频率，改资产时容易踩坑"],"confidence":"高"},"haotian-liu/LLaVA":{"repo":"haotian-liu/LLaVA","name":"LLaVA","one_liner":"视觉指令微调范式开创者，用投影层连接 CLIP 与 LLM","problem":"用轻量投影层把冻结的 CLIP 视觉编码器与开源 LLM 对齐，并用 GPT-4 生成的图文指令数据两阶段训练，得到通用视觉对话模型。","difficulty":"中等","core_abstractions":[{"name":"LlavaMetaModel","role":"持有 vision_tower 与 mm_projector，负责视觉模块的构建与加载","file":"llava/model/llava_arch.py"},{"name":"LlavaMetaForCausalLM","role":"抽象基类，定义 encode_images 与 prepare_inputs_labels_for_multimodal 多模态融合逻辑","file":"llava/model/llava_arch.py"},{"name":"LlavaLlamaForCausalLM","role":"具体模型，组合 LlamaForCausalLM 与多模态能力并实现 generate","file":"llava/model/language_model/llava_llama.py"},{"name":"CLIPVisionTower","role":"封装 CLIP 视觉塔，冻结参数并按层选取 patch 特征","file":"llava/model/multimodal_encoder/clip_encoder.py"},{"name":"build_vision_tower","role":"视觉塔工厂函数，按配置返回对应 tower","file":"llava/model/multimodal_encoder/builder.py"},{"name":"build_vision_projector","role":"投影层工厂，支持 linear 与 mlpNx_gelu 等连接方式","file":"llava/model/multimodal_projector/builder.py"},{"name":"LazySupervisedDataset","role":"懒加载图文指令数据集，负责图像读取与对话预处理","file":"llava/train/train.py"},{"name":"tokenizer_image_token","role":"把 image 占位符替换成 IMAGE_TOKEN_INDEX 后再分词","file":"llava/mm_utils.py"}],"layers":[{"name":"模型层","responsibility":"多模态模型组装、视觉与文本 embedding 融合","modules":["llava/model"],"files":["llava/model/llava_arch.py","llava/model/language_model/llava_llama.py"]},{"name":"视觉编码层","responsibility":"CLIP 视觉塔的封装与构建","modules":["llava/model/multimodal_encoder"],"files":["llava/model/multimodal_encoder/clip_encoder.py","llava/model/multimodal_encoder/builder.py"]},{"name":"连接层","responsibility":"视觉到语言的投影模块","modules":["llava/model/multimodal_projector"],"files":["llava/model/multimodal_projector/builder.py"]},{"name":"训练层","responsibility":"两阶段训练脚本、数据集与 Trainer","modules":["llava/train","scripts"],"files":["llava/train/train.py","llava/train/llava_trainer.py","scripts/v1_5/pretrain.sh"]},{"name":"推理与服务层","responsibility":"CLI、Gradio 与模型 worker","modules":["llava/serve"],"files":["llava/serve/cli.py","llava/serve/gradio_web_server.py"]},{"name":"评测层","responsibility":"各类基准评测脚本","modules":["llava/eval"],"files":["llava/eval/run_llava.py","llava/eval/model_vqa.py"]}],"data_flow":["数据准备：JSON 的 conversations 中用 image 占位符标记图像插入位置","预处理：preprocess_multimodal 把 image 移到句首，图片按 pad 或 square 处理","分词：tokenizer_image_token 把 image 换成 IMAGE_TOKEN_INDEX 再分词","视觉编码：CLIPVisionTower 前向得到 patch  --> E[mm_projector 投影]\n  C --> F[IMAGE_TOKEN_INDEX 处插入图像 embedding]\n  E --> F\n  F --> G[Llama 解码器]\n  G --> H[lm_head 生成回复]","surprises":["用负数 IMAGE_TOKEN_INDEX 等于 -200 作为图像占位，绕开词表实现占位符","阶段一必须关闭 mm_use_im_start_end，否则 prepare_inputs_labels_for_multimodal 直接抛 NotImplementedError","CLIPVisionTower.forward 上有 torch.no_grad，即使解冻视觉塔梯度也不会回传到它","图像 embedding 对应位置的 label 全部置为 IGNORE_INDEX，loss 只算在文本回复上"],"confidence":"高"},"hiyouga/LLaMA-Factory":{"repo":"hiyouga/LLaMA-Factory","name":"LLaMA-Factory","one_liner":"零代码微调上百种大模型的一站式训练框架，统一 CLI 与 WebUI","problem":"大模型微调链路冗长：模型加载、对话模板拼接、数据预处理、LoRA/量化、分布式训练各自为政。LLaMA-Factory 用统一配置与解耦的模型/数据/训练三层，把 100+ 模型与 SFT/DPO/PPO 等方法收敛到一套 CLI 与 WebUI。","difficulty":"中等","core_abstractions":[{"name":"Template","role":"对话模板抽象，把多轮消息按各模型约定的槽位编码成 token ids，并定义 stop words、thinking 词、工具调用词","file":"src/llamafactory/data/template.py"},{"name":"Formatter","role":"模板的槽位渲染器，StringFormatter/FunctionFormatter/ToolFormatter 等负责把 content 填进分隔符","file":"src/llamafactory/data/formatter.py"},{"name":"DatasetProcessor","role":"数据集处理器抽象基类，规定 preprocess_dataset 与 print_data_example，具体子类对应 pretrain/supervised/pairwise 等阶段","file":"src/llamafactory/data/processor/processor_utils.py"},{"name":"BasePlugin","role":"多模态插件抽象，负责图像/视频/音频等非文本模态与占位符的转换","file":"src/llamafactory/data/mm_plugin.py"},{"name":"ModelArguments","role":"模型侧配置数据类，声明 model_name_or_path、量化、adapter、注意力实现等参数","file":"src/llamafactory/hparams/model_args.py"},{"name":"FinetuningArguments","role":"微调方法配置数据类，用 stage 字段决定 pt/sft/rm/ppo/dpo/kto 等分支与 LoRA 相关开关","file":"src/llamafactory/hparams/finetuning_args.py"},{"name":"load_model","role":"模型加载入口函数，按 ModelArguments/FinetuningArguments 加载基座、注入量化与 LoRA adapter","file":"src/llamafactory/model/loader.py"},{"name":"BaseEngine","role":"推理引擎抽象基类，统一 huggingface/vllm/sglang 三种后端在 ChatModel 下的调用契约","file":"src/llamafactory/chat/base_engine.py"},{"name":"run_sft","role":"SFT 工作流函数，串起 tokenizer、template、dataset、model 与 Trainer，是三层解耦的组装样板","file":"src/llamafactory/t c/lerobot/distributed","src/lerobot/optim"],"files":["src/lerobot/configs/parallelism.py","src/lerobot/optim/factory.py"]}],"data_flow":["第1步：用户运行 lerobot-train，draccus 解析 CLI 得到 TrainPipelineConfig","第2步：train() 调用 make_accelerator 建立 accelerate 引擎并解析并行拓扑","第3步：make_train_eval_datasets 从 HF Hub 或本地加载 LeRobotDataset，得到数据集元数据与统计","第4步：make_policy 依据数据集特征与策略配置实例化策略模型","第5步：make_pre_post_processors 依据策略配置构建归一化等前后处理流水线","第6步：make_optimizer_and_scheduler 构建优化器与学习率调度器，accelerator.prepare 包装模型与数据加载器","第7步：训练循环取 batch，经 rename 与 preprocessor 处理后送入 policy(batch)","第8步：policy 前向返回 loss，accelerator.backward 反向传播，optimizer.step 更新权重","第9步：按频率记录日志、跑 eval_dataloader 或仿真环境评估、保存 checkpoint","第10步：可选把训练好的策略与处理器推送到 Hugging Face Hub"],"entry_points":[{"path":"lerobot-train","what":"训练策略的主入口，解析配置后执行完整训练循环"},{"path":"lerobot-eval","what":"在仿真环境或真实硬件上 rollout 策略并计算成功率等指标"},{"path":"lerobot-record","what":"通过遥操作采集真实机器人数据并写成 LeRobotDataset"},{"path":"lerobot-teleoperate","what":"不采集数据，仅做遥操作实时控制机器人"},{"path":"lerobot-calibrate","what":"标定机器人电机零位并保存标定文件"},{"path":"lerobot-dataset-viz","what":"可视化数据集中的视频与状态动作序列"},{"path":"src/lerobot/scripts/lerobot_train.py:543","what":"train() 函数，整个训练流水线的编排核心"},{"path":"src/lerobot/scripts/lerobot_record.py:228","what":"record_loop() 函数，遥操作采集数据的主循环"}],"key_files":[{"path":"README.md","why":"先建立整体认知：硬件、数据集、策略三大块与 CLI 用法"},{"path":"src/lerobot/configs/policies.py","why":"PreTrainedConfig 基类，理解 draccus ChoiceRegistry 如何注册与选择策略"},{"path":"src/lerobot/policies/pretrained.py","why":"PreTrainedPolicy 基类，理解策略必须实现的接口与并行声明"},{"path":"src/lerobot/robots/robot.py","why":"Robot 基类，理解硬件抽象层的契约"},{"path":"src/lerobot/policies/factory.py","why":"make_policy 工厂，理解策略如何被按名约定地实例化"},{"path":"src/lerobot/scripts/lerobot_train.py","why":"训练入口，串联数据集、策略、处理器、优化器与分布式"},{"path":"src/lerobot/datasets/lerobot_dataset.py","why":"LeRobotDataset 实现，理解统一数据格式的读写"},{"path":"src/lerobot/processor/pipeline.py","why":"处理流水线，理解观测/动作前后处理如何可组合"}],"extension_points":["想加新策略：在 src/lerobot/policies/<name>/ 下写 configuration_<name>.py，用 @PreTrainedConfig.register_subclass(\"<name>\") 注册一个继承 PreTrainedConfig 的配置类；再写 modeling_<name>.py 暴露 <Name>Policy，继承 PreTrainedPolicy","想加新机器人：在 src/lerobot/robots/ 下新建目录，写继承 Robot 的类和继承 RobotConfig 的配置类并注册","想加新遥操作器或相机：分别继承 Teleoperator / Camera 并注册对应 Config","想加新仿真环境：在 src/lerobot/envs/ 下写继承 EnvConfig 的类，实现 create_envs 返回 gymnasium 向量化环境","想加新的数据前后处理步骤：在 src/lerobot/processor/ 下写 ProcessorStep 并在策略的 processor_<name>.py 里组装 make_<name>_pre_post_processors","想接入第三方硬件包：发布名为 lerobot_robot_* / lerobot_teleoperator_* / lerobot_camera_* 的包，会被自动发现"],"learning_path":["第1步：读 README.md 与 pyproject.toml 的 [project.scripts]，搞清有哪些 CLI 入口","第2步：读 src/lerobot/configs/policies.py 与 src/lerobot/robots/robot.py，掌握两类核心配置基类与注册机制","第3步：读 src/lerobot/policies/pretrained.py 与一个具体策略如 policies/act/modeling_act.py，理解策略契约","第4步：读 src/lerobot/policies/factory.py，理解配置到实例的按名约定工厂","第5步：读 src/lerobot/scripts/lerobot_train.py 的 train()，把整条训练流水线串起来","第6步：读 src/lerobot/scripts/lerobot_record.py 与 datasets/lerobot_dataset.py，理解数据采集与统一格式"],"diagram_mermaid":"graph TD\n  CLI[CLI 命令行参数] --> CFG[TrainPipelineConfig 配置对象]\n  CFG --> DS[make_train_eval_datasets 构建数据集]\n  CFG --> POL[make_policy 构建策略]\n  CFG --> PROC[make_pre_post_processors 构建处理器]\n  DS --> DL[DataLoader 批量加载]\n  DL --> PRE[Preprocessor 归一化与设备搬运]\n  PRE --> MODEL[Policy forward 计算损失]\n  MODEL --> OPT[optimizer.step 更新权重]\n  OPT --> CKPT[保存 checkpoint]\n  CKPT --> HUB[上传 HuggingFace Hub]\n  POL --> ACT[select_action 推理动作]\n  ACT --> ENV[仿真或真实环境 rollout]","surprises":["策略类的导入完全靠命名约定：配置模块 configuration_<name>.py 会被重写成 modeling_<name>.py 再取 <Name>Policy，模块名不合规会直接报错","训练里刻意写 policy(batch) 而不是 policy.forward(batch)，因为 FSDP2 只通过 nn.Module 的 __call__ 钩子做参数 all-gather","基础安装非常轻，训练/硬件/数据集能力分别藏在 lerobot[training]、lerobot[hardware] 等 extras 后面，缺包时会给出可操作的安装提示","第三方硬件无需改本仓库，只要包名以 lerobot_robot_ 等前缀发布即可被自动发现并用 --robot.type 直接调用"],"confidence":"高"},"huggingface/smolagents":{"repo":"huggingface/smolagents","name":"smolage nts/remote_executors.py"]},{"name":"模型接入层","responsibility":"统一 ChatMessage 协议，适配 Transformers/LiteLLM/OpenAI 等模型","modules":["src/smolagents"],"files":["src/smolagents/models.py"]},{"name":"记忆与状态层","responsibility":"步骤记忆、token 用量统计与日志回调","modules":["src/smolagents"],"files":["src/smolagents/memory.py","src/smolagents/monitoring.py"]},{"name":"提示词与序列化层","responsibility":"YAML 提示模板、Agent/Tool 的保存与 Hub 上传","modules":["src/smolagents/prompts"],"files":["src/smolagents/prompts/code_agent.yaml","src/smolagents/serialization.py"]},{"name":"入口与交互层","responsibility":"CLI、Gradio UI 与网页浏览 Agent","modules":["src/smolagents"],"files":["src/smolagents/cli.py","src/smolagents/gradio_ui.py","src/smolagents/vision_web_browser.py"]}],"data_flow":["第1步：用户调用 agent.run 传入任务字符串，任务写入 AgentMemory 并追加 TaskStep","第2步：run 内部驱动 _run_stream，按 max_steps 进入循环，可选按 planning_interval 触发规划步","第3步：write_memory_to_messages 把记忆步骤转成模型可读的聊天消息序列","第4步：CodeAgent._step_stream 调用 model.generate 生成输出文本","第5步：parse_code_blobs 从文本中抽取代码块，fix_final_answer_code 做修补","第6步：代码作为一次 ToolCall 交给 python_executor 执行","第7步：执行器把 agent.tools 与 managed_agents 以 Python 函数形式注入命名空间，代码可直接调用","第8步：执行日志与最后输出写回 memory_step.observations","第9步：若代码调用了 final_answer 函数，执行器抛出 FinalAnswerException 标记 is_final_answer","第10步：非最终步则回到第3步继续循环，最终步产出 FinalAnswerStep","第11步：run 收集最后一步输出，可选组装 RunResult 返回"],"entry_points":[{"path":"src/smolagents/agents.py","what":"MultiStepAgent.run 与 CodeAgent._step_stream，Agent 运行主入口"},{"path":"src/smolagents/cli.py","what":"smolagent 命令行入口，支持交互式配置"},{"path":"src/smolagents/vision_web_browser.py","what":"webagent 命令行入口，基于 helium 的网页浏览 Agent"},{"path":"smolagent","what":"通用多步 CodeAgent CLI 命令"},{"path":"webagent","what":"网页浏览专用 Agent CLI 命令"}],"key_files":[{"path":"README.md","why":"先读它建立代码即动作的整体认知与安全提示"},{"path":"src/smolagents/agents.py","why":"核心文件，MultiStepAgent/CodeAgent/ToolCallingAgent 全在这里"},{"path":"src/smolagents/tools.py","why":"Tool 基类与 @tool 装饰器，理解扩展点的起点"},{"path":"src/smolagents/local_python_executor.py","why":"代码动作如何被受限执行，AST 白名单机制"},{"path":"src/smolagents/models.py","why":"模型抽象与各厂商适配，理解 ChatMessage 协议"},{"path":"src/smolagents/memory.py","why":"记忆步骤模型，理解循环如何累积上下文"},{"path":"src/smolagents/prompts/code_agent.yaml","why":"CodeAgent 的系统提示模板，决定输出代码块格式"},{"path":"src/smolagents/default_tools.py","why":"内置工具实现范例，写新工具可照抄"}],"extension_points":["加新工具：继承 src/smolagents/tools.py 的 Tool 实现 forward，或用 @tool 装饰普通函数","自定义 Agent 行为：继承 MultiStepAgent 并实现 _step_stream","自定义执行环境：继承 PythonExecutor 实现 __call__，或继承 RemotePythonExecutor","接入新模型：继承 Model 实现 generate，参考 models.py 中各适配类","改动作格式：编辑 src/smolagents/prompts/code_agent.yaml 提示模板与 code_block_tags"],"learning_path":["第1步读 README.md，理解代码即动作与传统 JSON 调用的差异","第2步读 src/smolagents/agents.py 的 MultiStepAgent.run 与 _run_stream 主循环","第3步读 CodeAgent._step_stream，看生成到解析到执行三步","第4步读 src/smolagents/tools.py 的 Tool 与 @tool，理解工具即函数","第5步读 src/smolagents/local_python_executor.py，理解受限执行与 final_answer 终止","第6步读 src/smolagents/models.py 与 memory.py，补齐模型与记忆细节"],"diagram_mermaid":"graph TD\n  A[用户任务] --> B[写入 AgentMemory]\n  B --> C[记忆转聊天消息]\n  C --> D[模型生成代码动作]\n  D --> E[解析代码块]\n  E --> F[PythonExecutor 执行]\n  F --> G[工具以函数形式调用]\n  G --> H{调用 final_answer}\n  H -->|否| I[写回观察结果]\n  I --> C\n  H -->|是| J[返回最终答案]\n  J --> K[组装 RunResult]","surprises":["LocalPythonExecutor 名字像沙箱，实则只是 AST 白名单限制，官方明确声明不是安全边界，不能跑不可信代码","终止条件不是模型输出某个 JSON 字段，而是代码里调用 final_answer 函数并触发异常来中断执行","工具在沙箱中就是普通 Python 函数，模型可以写 for 循环在一次动作里批量调用多个工具，因此比 JSON 调用少约 30% 步骤","同一套基类下 CodeAgent 与 ToolCallingAgent 仅覆盖 _step_stream 就切换了动作表示形式，抽象非常薄"],"confidence":"高"},"isaac-sim/IsaacLab":{"repo":"isaac-sim/IsaacLab","name":"Isaac Lab","one_liner":"基于 Omniverse 的 GPU 并行机器人学习仿真与训练框架","problem":"把机器人强化学习/模仿学习的仿真、传感器、随机化与策略训练整合成可大规模并行的统一流程，降低 sim-to-real 门槛。","difficulty":"困难","core_abstractions":[{"name":"ManagerBasedEnv","role":"manager-based 工作流的环境基类，持有场景与各类 manager，但不含 reward/termination，对 MDP 保持无关","file":"source/isaaclab/isaaclab/envs/manager_based_env.py"},{"name":"ManagerBased ots/franka.py"]},{"name":"环境抽象层","responsibility":"把场景与 manager 组织成对 agent 暴露的 step/reset 接口，区分 manager-based 与 direct 两种工作流","modules":["source/isaaclab/isaaclab/envs"],"files":["source/isaaclab/isaaclab/envs/manager_based_env.py","source/isaaclab/isaaclab/envs/manager_based_rl_env.py","source/isaaclab/isaaclab/envs/direct_rl_env.py"]},{"name":"Manager/MDP 层","responsibility":"把 MDP 拆成 action/observation/reward/termination/event/command/curriculum/recorder 等可插拔 term 并统一调度","modules":["source/isaaclab/isaaclab/managers","source/isaaclab/isaaclab/envs/mdp"],"files":["source/isaaclab/isaaclab/managers/action_manager.py","source/isaaclab/isaaclab/managers/observation_manager.py","source/isaaclab/isaaclab/envs/mdp/rewards.py"]},{"name":"任务层","responsibility":"提供 30+ 现成环境与机器人配置，并通过 gym.register 把任务名映射到 env cfg 与各 RL 库的 agent cfg","modules":["source/isaaclab_tasks","source/isaaclab_tasks_experimental"],"files":["source/isaaclab_tasks/isaaclab_tasks/contrib/lift/lift_env_cfg.py","source/isaaclab_tasks/isaaclab_tasks/contrib/lift/config/franka/__init__.py"]},{"name":"RL 集成层","responsibility":"统一 train/play/export 入口，按 --rl_library 分发到 RSL-RL/SB3/SKRL/rl_games/TorchRL 等后端并做环境适配","modules":["source/isaaclab_rl"],"files":["source/isaaclab_rl/isaaclab_rl/entrypoints/dispatch.py","source/isaaclab_rl/isaaclab_rl/entrypoints/backends/train_rsl_rl.py"]}],"data_flow":["第1步：运行 scripts/reinforcement_learning/train.py，它导入 isaaclab_rl.entrypoints.run_train_cli","第2步：dispatch.run_cli 解析 --rl_library 与 --task，并从 gym.spec 的 kwargs 解析出默认后端","第3步：resolve_task_config 通过任务注册取出 env_cfg_entry_point 与 agent 配置并实例化为 @configclass","第4步：launch_simulation 启动 Kit 与 SimulationContext，创建 USD stage 并配置物理/渲染","第5步：create_isaaclab_env 用 gym.make(task) 实例化 ManagerBasedRLEnv","第6步：ManagerBasedEnv.__init__ 创建 InteractiveScene 与 EventManager，调用 sim.reset() 激活物理句柄","第7步：load_managers 依次构建 recorder/action/observation manager，并把配置解析成 term","第8步：RslRlVecEnvWrapper 包装环境，构建 OnPolicyRunner 等策略 runner","第9步：runner.lea 实际代码中并不存在 mem0/graphs，README 也已移除图记忆说明：图记忆在本版本被移除或仅存于托管平台，切勿按旧版文档寻找 GraphStore","所谓向量库与图库协同，在本版本由 entity store 承担：实体被抽取后写入第二个向量集合，用 linked_memory_ids 与记忆关联，而非构建知识图谱","写入路径不再逐条做 ADD/UPDATE/DELETE 决策循环，而是 additive extraction 加 MD5 hash 去重加实体链接；记忆更新需显式调用 update(memory_id)","检索默认是语义加 BM25 混合，但只有实现了 keyword_search 的向量库才启用 BM25，否则会静默降级为纯语义相似度，容易造成不同后端行为不一致"],"confidence":"高"},"microsoft/agent-lightning":{"repo":"microsoft/agent-lightning","name":"agent-lightning","one_liner":"用 OpenAI 代理把任意 Agent 零改动接入 RL 训练的轻量框架","problem":"把已有 Agent 的推理轨迹变成可训练的 RL 数据：Agent 照常用真实工具与环境跑，框架通过模型代理旁路捕获每次请求与奖励，训练算法无需侵入 Agent 代码。","difficulty":"困难","core_abstractions":[{"name":"Rollout","role":"一次 Agent 执行的工作单元，含输入、配置、生命周期状态，是训练与控制器之间的核心契约","file":"agentlightning/schemas.py"},{"name":"Event","role":"轨迹中的单条事件，只有 model_request 与 reward 有约定结构，其余为不透明透传，是训练数据的原子载体","file":"agentlightning/schemas.py"},{"name":"Model","role":"已注册的模型推理端点，按 model 与 endpoint 建索引，训练器把 vLLM 地址注册进来供网关选择","file":"agentlightning/schemas.py"},{"name":"ProxyRouter","role":"网关侧模型代理：按 rollout_id 稳定选择端点、改写温度与 logprobs 等参数并转发到 vLLM","file":"agentlightning/server/proxy.py"},{"name":"RolloutHooks","role":"Rollout 生命周期钩子基类，在入队、成功、失败时回调，是算法侧注入自定义数据处理的扩展点","file":"agentlightning/hooks.py"},{"name":"AglRolloutManager","role":"训练器侧的 rollout 客户端：注册端点、批量创建 rollout、轮询终态、拉取事件并组装 CompletedRollout","file":"agentlightning/verl/agl_rollout_manager.py"},{"name":"AgentLightningRayPPOTrainer","role":"继承 verl RayPPOTrainer 的自定义训练器，用 Agent Lightning 的 rollout 替换原生 agent loop 并驱动 PPO","file":"agentlightning/verl/trainer.py"},{"name":"RolloutAdapter","role":"把 CompletedRollout 的模型调用三元组转换成 verl 的 DataProto 训练样本，并做长度截断与奖励填充","file":"agentlightning/verl/rollout_adapter.py"},{"name":"LocalReconciler","role":"本地模式控制器：轮询排队 rollout，以子进程方式启动 agent，并回收终态与超时","file":"agentlightning/controller/local_reconciler.py"},{"name":"ProxyPauseState","role":"网关暂停与排空状态，异步训练在切换策略前暂停新请求并等待在途请求清零","file":"agentlightning/server/proxy.py"}],"layers":[{"name":"契约层","responsibility":"定义 Rollout/Event/Model 等跨组件共享的 Pydantic 数据结构与状态机，以及带重试的 HTTP 客户端","modules":["agentlightning"],"files":["agentlightning/schemas.py","agentlightning/client.py","agentlightning/hooks.py"]},{"name":"API 网关层","responsibility":"FastAPI 服务，维护内存中的 rollout 与事件存储，提供 OpenAI 兼容代理并自动记录模型调用事件","modules":["agentlightning/server"],"files":["agentlightning/server/app.py","agentlightning/server/proxy.py","agentlightning/server/store.py","agentlightning/server/routes/rollouts.py","agentlightning/server/routes/events.py","agentlightning/server/routes/proxy.py"]},{"name":"控制器层","responsibility":"把排队 rollout 变成真实执行：本地子进程或 K8s Job，并回写运行状态","modules":["agentlightning/controller"],"files":["agentlightning/controller/__main__.py","agentlightning/controller/local_reconciler.py","agentlightning/controller/k8s_reconciler.py"]},{"name":"训练层","responsibility":"在 verl 之上驱动 PPO：注册端点、创建 rollout、转换训练样本、计算优势并更新策略","modules":["agentlightning/verl"],"files":["agentlightning/verl/entrypoint.py","agentlightning/verl/trainer.py","agentlightning/verl/agl_rollout_manager.py","agentlightning/verl/rollout_adapter.py"]},{"name":"配置层","responsibility":"Hydra YAML 集中管理网关、控制器与训练器的参数体系","modules":["agentlightning/config"],"files":["agentlightning/config/server.yaml","agentlightning/config/controller.yaml","agentlightning/verl/config.yaml"]},{"name":"示例层","responsibility":"提供可端到端运行的 Agent 与训练脚本，展示零改动接入方式","modules":["examples"],"files":["examples/gsm8k/gsm8k_agent.py","examples/gsm8k/train_gsm8k_agent.py"]}],"data_flow":["第1步：训练器启动，把当前 vLLM 推理端点通过 POST /api/models 注册到网关","第2步：训练器为每个训练样本创建 Rollout，POST /api/rollouts 写入内存 store 并置为 QUEUING","第3步：Controller 轮询排队中的 Rollout，本地模式为每个 rollout 拉起一个 agent 子进程","第4步：子进程 agent 读取环境变量，把 OpenAI base_url 指向网关的 rollout 专属代理 URL","第5步：网关 ProxyRouter 按 rollout_id 哈希选择端点、改写温度与 return_token_ids，转发到 vLLM 并记录 model_request 事件","第6步：agent 执行结束，向事件接口 POST 一条 reward 事件","第7步：Controller 观察到子进程退出，把 Rollout 状态补丁为 SUCCEEDED 或 FAILED","第8步：训练器轮询终态 Rollout，拉取 raw 与 triplet 两种格式的事件","第9步：RolloutAdapter 把模型调用三元组转成左填充的 DataProto 训练样本，写入 token_level_scores","第10步：verl 计算优势并更新 actor 权重，checkpoint_manager 推送新权重到推理端点","第11步：异步模式下训练器暂停并排空网关在途请求，再进入下一步","第12步：删除已消费的 rollout 以约束网关内存占用，进入下一训练步"],"entry_points":[{"path":"agentlightning/server/__main__.py","what":"Hydra 启动 API 网关，创建 FastAPI 应用并监听端口"},{"path":"agentlightning/controller/__main__.py","what":"Hydra 启动 Rollout 控制器，按 runner_type 选择本地或 K8s reconciler"},{"path":"agentlightning/verl/entrypoint.py:run_ppo","what":"训练入口：初始化 Ray、加载数据集并启动 AgentLightningRayPPOTrainer"},{"path":"examples/gsm8k/train_gsm8k_agent.py:main","what":"端到端示例：构建配置并调用 run_ppo 训练 GSM8K agent"},{"path":"examples/gsm8k/gsm8k_agent.py:ChatAgent.run","what":"Agent 侧入口，展示零改动接入：只把 base_url 指向网关并上报 reward"}],"key_files":[{"path":"README.md","why":"先建立 v1.0 三组件架构认知：Trainer、API Gateway、Rollout Controller"},{"path":"docs/05-basics.md","why":"官方对 rollout、事件、代理 URL 与控制器职责的最佳导览"},{"path":"agentlightning/schemas.py","why":"Rollout/Event/Model 契约与状态机定义，理解全部跨组件语义的起点"},{"path":"agentlightning/server/proxy.py","why":"网关代理核心：端点选择、参数改写、事件捕获与暂停排空都在这"},{"path":"agentlightning/server/routes/rollouts.py","why":"Rollout 生命周期 API 与终态游标分页，理解状态如何被驱动"},{"path":"agentlightning/controller/local_reconciler.py","why":"看 rollout 如何真正变成子进程，以及 agent 环境变量如何注入"},{"path":"agentlightning/verl/trainer.py","why":"训练主循环：_rollout 与 _train_step 展示 rollout 如何融入 PPO"},{"path":"agentlightning/verl/agl_rollout_manager.py","why":"训练器侧 rollout 客户端，含同步与异步两种等待策略"},{"path":"agentlightning/verl/rollout_adapter.py","why":"轨迹到训练样本的转换与轨迹级合并逻辑，决定数据质量"},{"path":"agentlightning/hooks.py","why":"RolloutHooks 扩展点与动态加载机制，改数据流先看这里"}],"extension_points":["想换/加 RL 算法：改 agentlightning/verl/trainer.py 的 _train_step，或换 config 的 algorithm.adv_estimator；rollout 级优势见 agentlightning/verl/rollout_level_advantage.py","想加新执行环境：实现新 Reconciler，参考 agentlightning/controller/local_reconciler.py 与 k8s_reconciler.py 的轮询与回写模式","想定制训练数据后处理：继承 RolloutHooks 实现 on_enqueue/on_succeeded，并在 config.agentlightning.hooks 指向文件","想换奖励来 rkspace 的 run() 或复制一个新 workspace 子类"],"learning_path":["第1步：读 README.md，跑通 PushT 的 Colab 或 demo，建立任务直觉","第2步：读 image_pusht_diffusion_policy_cnn.yaml，理解 Hydra 如何用 _target_ 声明式装配全部组件","第3步：读 workspace/train_diffusion_unet_hybrid_workspace.py 的 run()，把训练循环串起来","第4步：读 policy/diffusion_unet_hybrid_image_policy.py 的 compute_loss 与 conditional_sample，理解扩散策略核心","第5步：读 model/diffusion/conditional_unet1d.py，理解去噪网络结构与条件注入","第6步：读 dataset/base_dataset.py 与 env_runner/pusht_image_runner.py，理解数据来源与评估闭环"],"diagram_mermaid":"graph TD\n  ZARR[Zarr 回放缓冲区示教数据] --> DS[BaseImageDataset 数据集]\n  DS --> NORM[LinearNormalizer 计算归一化]\n  NORM --> BATCH[DataLoader 采样动作序列 batch]\n  BATCH --> CLOSS[compute_loss 归一化并加噪]\n  CLOSS --> UNET[ConditionalUnet1D 预测噪声]\n  UNET --> MSE[MSE 损失反向更新权重]\n  MSE --> EMA[EMA 更新影子权重]\n  EMA --> CKPT[保存 dill checkpoint]\n  OBS[推理观测 dict] --> PNORM[normalize 观测]\n  PNORM --> ENC[obs_encoder 提取全局条件]\n  ENC --> SAMPLE[conditional_sample 迭代去噪]\n  SAMPLE --> ACT[unnormalize 输出动作块]\n  ACT --> ROBOT[机器人或仿真环境执行]","surprises":["策略不是普通 nn.Module 直接调用，而是通过 Hydra 的 _target_ 从 YAML 声明式实例化，改结构往往先改配置","checkpoint 用 dill 序列化整个 cfg 与 workspace 状态，eval.py 直接反序列化 cfg 再重建工作区，配置文件因此也是模型的一部分","观测条件有两种模式：obs_as_global_cond 走全局特征拼接，否则走 inpainting 把观测特征写进动作序列的前若干步并加 mask，两条路径在同一策略里并存","扩散去噪用 diffusers 的 DDPMScheduler，训练时随机采时间步加噪，推理时按 num_inference_steps 迭代，同一个 conditional_sample 在训练与推理语义不同"],"confidence":"高"},"reworkd/AgentGPT":{"repo":"reworkd/AgentGPT","name":"AgentGPT","one_liner":"浏览器里跑自主 Agent 的全栈应用，前端驱动任务循环","problem":"解决让普通用户零部署地在浏览器里配置并运行一个自主 Agent：输入目标后自动拆解任务、逐个执行、再汇总，前端负责循环，后端负责单步 LLM 调用。","difficulty":"中等","core_abstractions":[{"name":"AutonomousAgent","role":"前端自主循环的大脑，用一个工作队列顺序推进各类工作项直到任务清空","file":"next/src/services/agent/autonomous-agent.ts"},{"name":"AgentWork","role":"工作项接口，规定 run、conclude、next、onError 四个方法，是任务树的节点协议","file":"next/src/services/agent/agent-work/agent-work.ts"},{"name":"StartGoalWork","role":"起始工作项，向后端请求初始任务列表并创建 Agent 记录","file":"next/src/services/agent/ag  BE[FastAPI 后端 start 端点]\n  BE --> T[任务列表]\n  T --> AT[AnalyzeTaskWork 分析任务]\n  AT --> EX[ExecuteTaskWork 执行任务]\n  EX --> ST[流式结果写回状态]\n  ST --> N{还有任务吗}\n  N -->|有| AT\n  N -->|无| STOP[停止 Agent]\n  AA --> SUM[SummarizeWork 总结]","surprises":["真正的大脑在前端：任务循环、任务树状态与暂停恢复都在浏览器里跑，后端只是无状态的一问一答 LLM 服务","CreateTaskWork 这类用于动态生成后续任务的工作项在仓库中存在，但主循环并未挂载它，属于遗留或未启用的代码","任务不是一次性规划好的树，而是每完成一步再由后端 create 端点追加一条新任务，是一种边执行边扩展的线性拆解","前端用 NEXT_PUBLIC_BACKEND_URL 直接请求 FastAPI，而不是走 Next.js 的 API 路由，因此跨域与鉴权都在 fetch-utils 里手写","工作项靠 next 方法返回下一个工作项来自我串联，而非集中式状态机，读代码时容易忽略这条隐式链路"],"confidence":"高"},"stanfordnlp/dspy":{"repo":"stanfordnlp/dspy","name":"dspy","one_liner":"把 Prompt 变成可编译优化程序的声明式 Python 框架","problem":"手写 Prompt 脆弱、难迁移、难以系统改进。DSPy 让人用 Signature 声明输入输出、用 Module 组合程序、用 Optimizer 依据指标自动搜索提示词与示例，把 Prompt 从字符串变成可训练、可优化的程序参数。","difficulty":"困难","core_abstractions":[{"name":"Signature","role":"声明式输入输出契约，可用类字段或字符串 question -> answer 定义","file":"dspy/signatures/signature.py"},{"name":"SignatureMeta","role":"Signature 元类，解析注解并暴露 input_fields/output_fields/instructions","file":"dspy/signatures/signature.py"},{"name":"Module","role":"所有 DSPy 程序的基类，实现 forward 组合子模块与 Predict","file":"dspy/primitives/module.py"},{"name":"Predict","role":"最基础模块，把 Signature 交给 Adapter 完成一次 LM 调用","file":"dspy/predict/predict.py"},{"name":"Adapter","role":"在 Signature 与具体 LM 消息格式之间做格式化与解析","file":"dspy/adapters/base.py"},{"name":"ChatAdapter","role":"默认适配器，把字段与示例渲染成聊天消息并解析输出","file":"dspy/adapters/chat_adapter.py"},{"name":"Prediction","role":"模块输出对象，支持属性式访问预测字段","file":"dspy/primitives/prediction.py"},{"name":"Example","role":"训练与评估样本对象，承载输入字段与标签","file":"dspy/primitives/example.py"},{"name":"Teleprompter","role":"优化器基类，compile 接收 student 与 trainset 返回优化后程序","file":"dspy/teleprompt/teleprompt.py"},{"name":"BootstrapFewShot","role":"经典优化器，自动采样并筛选高质量 few-shot 示例","file":"dspy/teleprompt/bootstrap.py"},{"name":"BaseLM","role":"语言模型接口基类，统一 chat/async 调用","file":"dspy/clients/base_lm.py"},{"name":"Settings","role":"全局配 name":"ContentScrapingStrategy","role":"内容清洗抽象，把原始 HTML 抽成 cleaned_html、links、media、metadata 与表格","file":"crawl4ai/content_scraping_strategy.py"},{"name":"RelevantContentFilter","role":"内容过滤抽象基类，定义 filter_content 契约，是 BM25 与剪枝过滤的共同父类","file":"crawl4ai/content_filter_strategy.py"},{"name":"BM25ContentFilter","role":"基于 BM25 加标签权重的过滤，按查询相关度筛选文本块产出 fit_markdown","file":"crawl4ai/content_filter_strategy.py"},{"name":"PruningContentFilter","role":"基于文本长度、链接密度等统计指标的树剪枝过滤，无需查询即可去噪","file":"crawl4ai/content_filter_strategy.py"},{"name":"MarkdownGenerationStrategy","role":"Markdown 生成抽象，默认实现用 html2text 产出 raw 与带引用 markdown，并调用内容过滤产出 fit_markdown","file":"crawl4ai/markdown_generation_strategy.py"},{"name":"ExtractionStrategy","role":"结构化抽取抽象，含 LLM、CSS、XPath、LXML、Regex 等具体策略","file":"crawl4ai/extraction_strategy.py"},{"name":"DeepCrawlStrategy","role":"深度爬取抽象，定义 can_process_url 与 link_discovery，派生 BFS 与 BestFirst 等策略","file":"crawl4ai/deep_crawling/base_strategy.py"},{"name":"CrawlResult","role":"抓取结果数据模型，聚合 html、cleaned_html、markdown、links、media、extracted_content 等字段","file":"crawl4ai/models.py"}],"layers":[{"name":"抓取入口层","responsibility":"对外暴露抓取 API 与命令行入口，编排整体流程","modules":["crawl4ai"],"files":["crawl4ai/async_webcrawler.py","crawl4ai/cli.py","crawl4ai/__init__.py"]},{"name":"配置层","responsibility":"定义 BrowserConfig 与 CrawlerRunConfig 等参数体系","modules":["crawl4ai"],"files":["crawl4ai/async_configs.py","crawl4ai/config.py"]},{"name":"抓取策略层","responsibility":"浏览器与 HTTP 抓取、反爬与代理轮换、浏览器适配","modules":["crawl4ai"],"files":["crawl4ai/async_crawler_strategy.py","crawl4ai/browser_adapter.py","crawl4ai/proxy_strategy.py"]},{"name":"内容清洗与过滤层","responsibility":"HTML 清洗抽取与 BM25、剪枝、LLM 内容过滤","modules":["crawl4ai"],"files":["crawl4ai/content_scraping_strategy.py","crawl4ai/content_filter_strategy.py","crawl4ai/content_filter_strategy_lxml.py"]},{"name":"Markdown 与抽取层","responsibility":"HTML 转 Markdown、分块与结构化抽取","modules":["crawl4ai"],"files":["crawl4ai/markdown_generation_strategy.py","crawl4ai/extraction_strategy.py","crawl4ai/chunking_strategy.py"]},{"name":"深度爬取层","responsibility":"BFS 与 BestFirst 等深度爬取策略及 URL 过滤器与打分器","modules":["crawl4ai/deep_crawling"],"files":["crawl4ai/deep_crawling/base_strategy.py","crawl4ai/deep_crawling/bfs_strategy.py","crawl4ai/deep_crawling/bff_strategy.py"]},{"name":"调度与工具层","responsibility":"并发调度、URL 播种与站点地图映射等辅助能力","modules":["crawl4ai"],"files":["crawl4ai/async_dispatcher.py","crawl4ai/async_url_seeder.py","crawl4ai/domain_mapper.py"]},{"name":"部署层","responsibility":"Docker 镜像与部署脚本，供自托管服务使用","modules":["deploy"],"files":["deploy/docker","Dockerfile","docker-compose.yml"]}],"data_flow":["第1步：调用 AsyncWebCrawler.arun 传入 url 与 CrawlerRunConfig，未启动则先 start 浏览器","第2步：CacheContext 与 CacheValidator 判断是否命中缓存及缓存是否新鲜","第3步：未命中则用 AsyncCrawlerStrategy 经 Playwright 抓取页面，得到 html、截图与网络请求记录","第4步：抓取后 is_blocked 判定反爬，必要时轮换代理重试或调用 fallback_fetch_function","第5步：aprocess_html 调用 ContentScrapingStrategy.scrap 清洗出 cleaned_html、links、media、metadata","第6步：preprocess_html_for_schema 生成 fit_html 供结构化抽取使用","第7步：DefaultMarkdownGenerator.generate_markdown 用 html2text 产出 raw_markdown 并把链接转为引用","第8步：若配置了 RelevantContentFilter，则过滤后生成 fit_markdown 与 fit_html","第9步：若配置了 ExtractionStrategy，则按 chunking_strategy 分块后抽取结构化内容","第10步：组装 CrawlResult 返回，并按缓存策略写入本地缓存"],"entry_points":[{"path":"crawl4ai/async_webcrawler.py:AsyncWebCrawler.arun","what":"单页抓取主入口，驱动抓取到结果组装的全流程"},{"path":"crawl4ai/async_webcrawler.py:AsyncWebCrawler.arun_many","what":"批量抓取入口，配合 dispatcher 做并发与限速"},{"path":"crawl4ai/cli.py","what":"命令行入口，安装后命令名为 crwl"},{"path":"crawl4ai/adaptive_crawler.py:AdaptiveCrawler","what":"自适应爬取入口，按信息充足度动态决定是否继续"},{"path":"crawl4ai/__init__.py","what":"包导出入口，暴露 AsyncWebCrawler 与各类策略"},{"path":"crawl4ai/async_webcrawler.py:AsyncWebCrawler.aseed_urls","what":"URL 播种入口，从站点地图与 Common Crawl 批量发现链接"}],"key_files":[{"path":"README.md","why":"先建立认知：LLM 友好抓取、自托管与云服务两种用法"},{"path":"crawl4ai/async_webcrawler.py","why":"核心编排，arun 与 aprocess_html 是理解全流程的必经之路"},{"path":"crawl4ai/async_configs.py","why":"参数体系中枢，看清抓取、过滤、抽取、缓存如何被组合"},{"path":"crawl4ai/content_scraping_strategy.py","why":"HTML 清洗抽取实现，理解 cleaned_html 与链接媒体的来源"},{"path":"crawl4ai/content_filter_strategy.py","why":"BM25 与剪枝过滤实现，理解 fit_markdown 如何变干净"},{"path":"crawl4ai/markdown_generation_strategy.py","why":"Markdown 生成与引用转换，理解 raw 与 fit 两类产物"},{"path":"crawl4ai/extraction_strategy.py","why":"结构化抽取策略族，理解如何把页面抽成 JSON"},{"path":"crawl4ai/deep_crawling/base_strategy.py","why":"深度爬取抽象，理解多页爬取的扩展方式"},{"path":"crawl4ai/models.py","why":"CrawlResult 与 MarkdownGenerationResult 字段全貌"}],"extension_points":["新增抓取方式：继承 crawl4ai/async_crawler_strategy.py 的 AsyncCrawlerStrategy，参考 AsyncHTTPCrawlerStrategy","新增内容过滤：继承 crawl4ai/content_filter_strategy.py 的 RelevantContentFilter 并实现 filter_content","新增 Markdown 生成：继承 crawl4ai/markdown_generation_strategy.py 的 MarkdownGenerationStrategy，通过 config.markdown_generator 注入","新增抽取策略：继承 crawl4ai/extraction_strategy.py 的 ExtractionStrategy，通过 config.extraction_strategy 注入","新增深度爬取策略：继承 crawl4ai/deep_crawling/base_strategy.py 的 DeepCrawlStrategy，参考 bfs_strategy.py","新增分块策略：继承 crawl4ai/chunking_strategy.py 的 ChunkingStrategy，配合抽取策略使用","新增浏览器适配器：继承 crawl4ai/browser_adapter.py 的 BrowserAdapter，例如接入反检测浏览器"],"learning_path":["第1步：读 README.md，理解自托管与云服务两条路径与 LLM 友好的定位","第2步：读 crawl4ai/async_webcrawler.py 的 arun 与 aprocess_html，掌握抓取到产出的全流程","第3步：读 crawl4ai/async_configs.py，掌握 CrawlerRunConfig 如何组合各阶段策略","第4步：读 crawl4ai/content_scraping_strategy.py，理解 HTML 如何被清洗成 cleaned_html","第5步：读 crawl4ai/markdown_generation_strategy.py，理解 raw 与 fit markdown 的差别","第6步：读 crawl4ai/content_filter_strategy.py，理解 BM25 与剪枝过滤的算法与参数","第7步：读 crawl4ai/extraction_strategy.py 与 deep_crawling/base_strategy.py，理解抽取与多页爬取的扩展点"],"diagram_mermaid":"graph TD\n  A[arun 传入 url 与 CrawlerRunConfig] --> B[CacheContext 检查缓存]\n  B --> C[AsyncCrawlerStrategy 抓取 HTML]\n  C --> D[ContentScrapingStrategy 清洗出 cleaned_html]\n  D --> E[preprocess_html_for_schema 生成 fit_html]\n  E --> F[DefaultMarkdownGenerator 生成 raw_markdown]\n  F --> G[RelevantContentFilter 过滤生成 fit_markdown]\n  G --> H[ExtractionStrategy 抽取结构化内容]\n  H --> I[组装 CrawlResult 并写缓存]","surprises":["Markdown 有两份产物：raw_markdown 不做任何过滤，fit_markdown 才经过内容过滤，默认情况下过滤并未启用，需要显式挂 content_filter","arun 返回的是 CrawlResultContainer 而非 CrawlResult，靠属性代理把 result.markdown 这类访问转发到底层结果以保持向后兼容","抓取层同时存在 Playwright 浏览器与纯 HTTP 两套 AsyncCrawlerStrategy，HTTP 更快但不执行 JS，选择错误会导致动态页面抓到空内容","反爬处理内嵌在主流程而非旁路：抓取后用 is_blocked 判定，失败则换代理重试，最后还有 fallback_fetch_function 兜底","新式调用要求把参数收进 CrawlerRunConfig 传入 config，旧的散装 kwargs 仍兼容但已标记为迁移路径，混用容易触发意外默认值"],"confidence":"高"},"unitreerobotics/unitree_rl_gym":{"repo":"unitreerobotics/unitree_rl_gym","name":"unitree_rl_gym","one_liner":"宇树机器人 Isaac Gym 并行强化学习训练与 sim2real 部署模板","problem":"让宇树 Go2/H1/H1_2/G1 机器人通过大规模并行仿真训练出运动控制策略，并把训练好的策略零改动地迁移到 MuJoCo 仿真和真机上。它把环境、配置、训练算法与部署链路打通，是 sim2real 的标准脚手架。","difficulty":"困难","core_abstractions":[{"name":"TaskRegistry","role":"全局任务注册表，把任务名映射到环境类、环境配置与训练配置，并提供 make_env 与 make_alg_runner 两个工厂方法","file":"legged_gym/utils/task_registry.py"},{"name":"BaseTask","role":"所有 RL 任务的基类，负责创建 Isaac Gym 仿真、分配观测/奖励/重置缓冲并驱动 viewer","file":"legged_gym/envs/base/base_task.py"},{"name":"LeggedRobot","role":"足式机器人环境主体，实现并行步进、观测计算、奖励计算、终止判定与域随机化","file":"legged_gym/envs/base/legged_robot.py"},{"name":"LeggedRobotCfg","role":"足式机器人环境配置基类，用嵌套类声明 env、terrain、control、asset、rewards、noise、sim 等全部参数","file":"legged_gym/envs/base/legged_robot_config.py"},{"name":"LeggedRobotCfgPPO","role":"PPO 训练配置基类，声明 policy、algorithm、runner 三组超参与实验名","file":"legged_gym/envs/base/legged_robot_config.py"},{"name":"BaseConfig","role":"极简配置基类，用反射把内部嵌套类自动实例化为属性，实现点号访问的层级配置","file":"legged_gym/envs/base/base_config.py"},{"name":"G1Robot","role":"G1 人形机器人环境子类，重写观测拼接、噪声向量、足部状态与相位相关奖励","file":"legged_gym/envs/g1/g1_env.py"},{"name":"G1RoughCfg","role":"G1 的环境与 PPO 配置子类，指定 URDF、关节默认角、PD 增益、奖励权重与网络结构","file":"legged_gym/envs/g1/g1_config.py"},{"name":"export_policy_as_jit","role":"把训练好的 actor 网络导出为 TorchScript，供 MuJoCo 与真机部署直接加载","file":"legged_gym/utils/helpers.py"},{"name":"Terrain","role":"程序化生成地形高度场与地形课程，支持坡道、楼梯、离散障碍等类型","file":"legged_gym/utils/terrain.py"}],"layers":[{"name":"任务注册层","responsibility":"把机器人任务注册进全局表，并按名字构建环境与算法 runner","modules":["legged_gym/utils","legged_gym/envs"],"files":["legged_gym/utils/task_registry.py","legged_gym/envs/__init__.py"]},{"name":"环境基类层","responsibility":"封装 Isaac Gym 仿真创建、并行缓冲、步进与 viewer 的通用逻辑","modules":["legged_gym/envs/base"],"files":["legged_gym/envs/base/base_task.py","legged_gym/envs/base/legged_robot.py","legged_gym/envs/base/base_config.py"]},{"name":"机器人任务层","responsibility":"为每种机器人定义环境子类与配置子类，定制观测、奖励与 URDF 资源","modules":["legged_gym/envs/g1","legged_gym/envs/go2","legged_gym/envs/h1","legged_gym/envs/h1_2"],"files":["legged_gym/envs/g1/g1_env.py","legged_gym/envs/g1/g1_config.py","legged_gym/envs/h1_2/h1_2_env.py"]},{"name":"配置体系层","responsibility":"用嵌套类声明全部仿真、控制、奖励、域随机化与 PPO 超参，支持命令行覆盖","modules":["legged_gym/envs/base"],"files":["legged_gym/envs/base/legged_robot_config.py","legged_gym/envs/base/base_config.py"]},{"name":"工具层","responsibility":"提供参数解析、仿真参数构建、seed、checkpoint 定位、策略导出、日志与数学工具","modules":["legged_gym/utils"],"files":["legged_gym/utils/helpers.py","legged_gym/utils/logger.py","legged_gym/utils/terrain.py","legged_gym/utils/math.py"]},{"name":"训练与播放入口层","responsibility":"提供训练与可视化播放命令行入口，播放时导出 TorchScript 策略","modules":["legged_gym/scripts"],"files":["legged_gym/scripts/train.py","legged_gym/scripts/play.py"]},{"name":"部署层","responsibility":"把训练策略部署到 MuJoCo 仿真与真机，包含 Python 与 C++ 两条真机链路","modules":["deploy/deploy_mujoco","deploy/deploy_real"],"files":["deploy/deploy_mujoco/deploy_mujoco.py","deploy/deploy_real/deploy_real.py","deploy/deploy_real/cpp_g1/main.cpp"]},{"name":"机器人资源层","responsibility":"存放各机器人的 URDF 与 MuJoCo XML 描述及网格文件","modules":["resources/robots"],"files":["resources/robots/g1_description/g1_12dof.urdf"]}],"data_flow":["第1步：运行 legged_gym/scripts/train.py --task=g1，get_args 解析命令行并导入 envs 触发任务注册","第2步：task_registry.make_env 按任务名取出环境类与配置，用 parse_sim_params 构建 Isaac Gym 仿真参数并实例化环境","第3步：环境在 BaseTask 中创建并行仿真与缓冲，LeggedRobot._create_envs 按 URDF 加载机器人并建立 actor 与 DOF 张量","第4步：task_registry.make_alg_runner 用训练配置构建 rsl_rl 的 OnPolicyRunner，负责 PPO 训练循环","第5步：训练循环中 env.step 接收动作，按 decimation 做多次 PD 力矩计算与仿真步进","第6步：post_physics_step 刷新张量状态，计算观测、奖励、终止并对需要重置的环境 reset_idx","第7步：域随机化在每步或每次重置时扰动摩擦、质量与外力，提升策略鲁棒性","第8步：PPO 用并行环境采样出的 batch 更新策略，checkpoint 存入 logs/<experiment>/<date>_<run>/model_<iter>.pt","第9步：运行 play.py 加载 checkpoint，关闭噪声与域随机化并导出 actor 为 TorchScript 到 logs/<experiment>/exported/policies","第10步：Sim2Sim 用 deploy_mujoco.py 读取 yaml 配置，在 MuJoCo 中加载同一策略与 XML 做 PD 控制验证","第11步：Sim2Real 用 deploy_real.py 通过 unitree_sdk2py 与真机 DDS 通信，按同一观测构造与 PD 增益下发力矩指令"],"entry_points":[{"path":"legged_gym/scripts/train.py","what":"训练主入口，构建环境与 PPO runner 并启动学习循环"},{"path":"legged_gym/scripts/play.py","what":"加载 checkpoint 可视化策略，并导出 TorchScript 供部署使用"},{"path":"deploy/deploy_mujoco/deploy_mujoco.py","what":"Sim2Sim 部署入口，在 MuJoCo 中运行导出的策略"},{"path":"deploy/deploy_real/deploy_real.py","what":"Sim2Real 部署入口，通过 unitree_sdk2py 控制真机"},{"path":"deploy/deploy_real/cpp_g1/main.cpp","what":"G1 的 C++ 真机部署示例入口，依赖 LibTorch 推理"},{"path":"deploy/deploy_mujoco/configs/g1.yaml","what":"Sim2Sim 的机器人配置，声明策略路径、PD 增益、观测缩放与初始指令"},{"path":"deploy/deploy_real/configs/g1.yaml","what":"真机部署的机器人配置，声明网络接口、消息类型与电机参数"}],"key_files":[{"path":"README.md","why":"先建立整体认知：Train 到 Sim2Real 的四阶段流程与各命令用法"},{"path":"legged_gym/scripts/train.py","why":"主入口极短，看清任务注册表如何把环境与算法装配起来"},{"path":"legged_gym/utils/task_registry.py","why":"任务注册与 make_env、make_alg_runner 是理解整个装配流程的钥匙"},{"path":"legged_gym/envs/base/legged_robot.py","why":"环境主体，step、观测、奖励、终止与域随机化全在这里"},{"path":"legged_gym/envs/base/legged_robot_config.py","why":"最完整的参数体系，理解仿真、控制、奖励与噪声如何声明"},{"path":"legged_gym/envs/g1/g1_config.py","why":"一个具体机器人的配置，看 URDF、关节默认角与 PD 增益如何被指定"},{"path":"legged_gym/envs/g1/g1_env.py","why":"具体机器人环境子类，理解观测与奖励如何被定制"},{"path":"deploy/deploy_mujoco/deploy_mujoco.py","why":"Sim2Sim 闭环，理解部署侧如何重建观测并驱动策略"},{"path":"deploy/deploy_real/deploy_real.py","why":"Sim2Real 链路，理解策略如何接上真机 SDK 与状态反馈"},{"path":"legged_gym/utils/helpers.py","why":"get_args、export_policy_as_jit 等工具是训练与部署的粘合剂"}],"extension_points":["想加新机器人：在 legged_gym/envs/ 下新建目录写 Env 子类与 Cfg 子类，在 resources/robots 放入 URDF，并在 legged_gym/envs/__init__.py 里 task_registry.register 注册","想改奖励函数：在具体机器人 Env 中新增 _reward_xxx 方法，并在对应 Cfg 的 rewards.scales 中加同名权重，_prepare_reward_function 会自动收集","想改观测：改具体机器人 Env 的 compute_observations 与 _get_noise_scale_vec，并同步更新 Cfg 的 num_observations","想改仿真参数：改 Cfg 的 sim 与 sim.physx 段，或 terrain、domain_rand 段","想换训练算法：替换 task_registry.make_alg_runner 中构建的 runner，或在 CfgPPO 中换 policy_class_name","想部署到新硬件：仿照 deploy_real 写新的部署脚本，保持观测构造与 PD 增益和训练配置一致"],"learning_path":["第1步：读 README.md，理解 Train 到 Play 到 Sim2Sim 到 Sim2Real 的四阶段流程","第2步：读 legged_gym/scripts/train.py 与 task_registry.py，理解环境与算法如何被注册和装配","第3步：读 legged_gym/envs/base/legged_robot_config.py，把仿真、控制、奖励、噪声参数体系过一遍","第4步：读 legged_gym/envs/base/legged_robot.py 的 step 与 post_physics_step，理解并行步进与观测奖励计算","第5步：读 legged_gym/envs/g1/g1_env.py 与 g1_config.py，看一个具体机器人如何定制环境与配置","第6步：读 legged_gym/scripts/play.py 与 helpers.py 的 export_policy_as_jit，理解策略如何导出","第7步：读 deploy/deploy_mujoco/deploy_mujoco.py 与 deploy/deploy_real/deploy_real.py，理解部署侧观测重建与控制闭环"],"diagram_mermaid":"graph TD\n  CLI[train.py 命令行入口] --> ARGS[get_args 解析参数]\n  ARGS --> REG[TaskRegistry 任务注册表]\n  REG --> ENVCFG[环境配置与 PPO 配置]\n  ENVCFG --> ENV[LeggedRobot 并行环境]\n  ENV --> SIM[Isaac Gym 并行仿真]\n  REG --> RUNNER[rsl_rl OnPolicyRunner 训练器]\n  RUNNER --> ENV\n  ENV --> STEP[step 按 decimation 做 PD 控制与步进]\n  STEP --> POST[post_physics_step 计算观测奖励终止]\n  POST --> DR[域随机化扰动摩擦质量与外力]\n  POST --> RUNNER\n  RUNNER --> CKPT[保存 model pt 检查点]\n  CKPT --> PLAY[play.py 加载并导出策略]\n  PLAY --> JIT[TorchScript 策略文件]\n  JIT --> S2S[deploy_mujoco 仿真验证]\n  JIT --> S2R[deploy_real 真机部署]\n  S2R --> SDK[unitree_sdk2py 与真机通信]","surprises":["核心 PPO 算法不在本仓库，而是外部 /* ================= 路由 ================= */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(!h) return {v:'home'};
  const p = h.split('/');
  if(p.length===1) return {v:'domain', d:p[0]};
  if(p.length===2) return {v:'branch', d:p[0], b:+p[1]};
  return {v:'project', d:p[0], b:+p[1], r:repoBySlug[p.slice(2).join('/')]};
}
function go(h){ location.hash = h; }

/* ================= 侧栏树 ================= */
function renderTree(){
  const cur = route();
  let html = `<div class="trow ${cur.v==='home'?'on':''}" onclick="go('')">
      <span class="tw">›</span><span class="tl">总览</span></div>`;
  for(const [dk, dv] of Object.entries(DOMAINS)){
    const pal = PAL[dk];
    const projs = PROJECTS.filter(p => p.domains.includes(dk));
    const open = cur.d === dk;
    html += `<div class="tnode ${open?'open':''}" data-d="${dk}">
      <div class="trow ${cur.v==='domain'&&cur.d===dk?'on':''}" onclick="go('/${dk}')">
        <span class="tw">›</span><span class="dot" style="background:${pal.c}"></span>
        <span class="tl">${pal.label}</span><span class="tc">${projs.length}</span></div>
      <div class="tkids">`;
    dv.branches.forEach((br, i) => {
      const bp = projs.filter(p => p.branches.includes(br));
      if(!bp.length) return;
      const bOpen = cur.d===dk && cur.b===i;
      html += `<div class="tnode ${bOpen?'open':''}">
        <div class="trow ${cur.v==='branch'&&cur.d===dk&&cur.b===i?'on':''}" onclick="go('/${dk}/${i}')">
          <span class="tw">›</span><span class="tl" title="${esc(br)}">${esc(br)}</span>
          <span class="tc">${bp.length}</span></div>
        <div class="tkids">`;
      bp.sort((a,b)=>starNum(b.star)-starNum(a.star)).forEach(p => {
        const on = cur.v==='project' && cur.r===p.repo;
        html += `<div class="trow tproj ${on?'on':''}" onclick="go('/${dk}/${i}/${slug(p.repo)}')">
          <span class="tw"></span>
          <span class="tl" title="${esc(p.name)}">${esc(p.name)}<span class="st">${esc(p.star||'')}</span>${
            ARCH[p.repo]?'<span class="archflag" title="已有语义架构分析">◆</span>':''}</span></div>`;
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  }
  document.getElementById('tree').innerHTML = html;
  const on = document.querySelector('#tree .trow.on');
  if(on) on.scrollIntoView({block:'nearest'});
}

/* ================= 复用组件 ================= */
function bars(items, cls, unit){
  if(!items || !items.length) return '<div style="font-size:11.5px;color:var(--ink3)">未检测到</div>';
  const max = Math.max(...items.map(i=>i.v)) || 1;
  return '<div class="bars">' + items.map(i =>
    `<div class="row"><span class="lb" title="${esc(i.n)}">${esc(i.n)}</span>
      <span class="track"><span class="fill ${cls}" style="width:${Math.max(2,(i.v/max)*100)}%"></span></span>
      <span class="vl">${unit==='loc'?fmt(i.v)+' 行':fmt(i.v)}</span></div>`).join('') + '</div>';
}
function crumbs(items){
  return '<div class="crumbs">' + items.map((it,i) =>
    i===items.length-1 ? `<span>${esc(it.t)}</span>`
      : `<a onclick="go('${it.h}')">${esc(it.t)}</a><span>›</span>`).join('') + '</div>';
}
