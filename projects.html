<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目浏览器 · 具身智能 × AI Agent</title>
<style>
  :root{
    --bg:#F7F7F5; --panel:#FFFFFF; --line:#E4E2DC; --line2:#EFEDE7;
    --ink:#2C2C2A; --ink2:#5F5E5A; --ink3:#8B8A85; --ink4:#A9A8A3;
    --emb:#0F6E56; --emb-bg:#E1F5EE; --emb-soft:#F2FBF8;
    --agt:#185FA5; --agt-bg:#E6F1FB; --agt-soft:#F3F9FE;
    --crs:#854F0B; --crs-bg:#FAEEDA; --crs-soft:#FDF8EE;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-size:13.5px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}

  /* ---------- 顶栏 ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
  .brand{font-size:14.5px;font-weight:500;white-space:nowrap}
  .brand span{color:var(--ink3);font-weight:400;font-size:12px;margin-left:7px}
  .search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
    padding:5px 11px;background:var(--panel);flex:0 1 300px}
  .search input{border:none;outline:none;font:inherit;font-size:12.5px;width:100%;background:transparent;color:var(--ink)}
  .search input::placeholder{color:var(--ink4)}
  .hstats{margin-left:auto;display:flex;gap:18px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
  .hstats b{color:var(--ink);font-weight:500}

  /* ---------- 布局 ---------- */
  .layout{display:grid;grid-template-columns:286px 1fr;align-items:start;height:calc(100vh - 53px)}
  aside{height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px 40px}
  main{height:100%;overflow-y:auto;padding:20px 26px 80px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} aside{display:none} }

  /* ---------- 侧栏树 ---------- */
  .tnode{user-select:none}
  .trow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;line-height:1.35}
  .trow:hover{background:#F4F3EE}
  .trow.on{background:#EDEBE4}
  .trow.on .tl{font-weight:500}
  .tw{width:13px;flex:0 0 13px;color:var(--ink4);font-size:9px;text-align:center;transition:transform .13s}
  .tnode.open > .trow .tw{transform:rotate(90deg)}
  .tl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .tc{font-size:10.5px;color:var(--ink4);font-family:var(--mono);flex:0 0 auto}
  .tkids{display:none;margin-left:11px;border-left:1px solid var(--line2);padding-left:3px}
  .tnode.open > .tkids{display:block}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .tproj .tl{font-size:12px;color:var(--ink2)}
  .tproj .tl .st{color:var(--ink4);font-size:10px;margin-left:4px;font-family:var(--mono)}
  .archflag{color:#0F6E56;font-size:9px;margin-left:3px}

  /* ---------- 内容 ---------- */
  .crumbs{font-size:12px;color:var(--ink3);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .crumbs a{cursor:pointer;border-bottom:1px dotted var(--line)}
  .crumbs a:hover{color:var(--ink)}
  h1.vt{font-size:17px;font-weight:500;margin:0 0 4px}
  .vs{font-size:12.5px;color:var(--ink3);margin-bottom:18px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer}
  .dcard:hover{border-color:#C9C7C0}
  .dcard .n{font-size:13.5px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .dcard .m{font-size:11.5px;color:var(--ink3);line-height:1.6}
  .dcard .bar{height:4px;background:#F1EFE8;border-radius:3px;margin-top:9px;overflow:hidden;display:flex}
  .dcard .bar i{height:100%;display:block}

  /* 紧凑项目列表 */
  table.pl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  table.pl th{text-align:left;font-size:11px;font-weight:400;color:var(--ink3);padding:9px 12px;
    background:#FAFAF8;border-bottom:1px solid var(--line)}
  table.pl td{padding:9px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:middle}
  table.pl tr:last-child td{border-bottom:none}
  table.pl tbody tr{cursor:pointer}
  table.pl tbody tr:hover{background:#FAFAF8}
  .pname{font-weight:500}
  .prepo{font-size:11px;color:var(--ink3);font-family:var(--mono)}
  .num{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;white-space:nowrap}
  .chip{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:20px;background:#F1EFE8;color:var(--ink2);white-space:nowrap}
  .chip.star{background:#FAEEDA;color:#854F0B;font-weight:500}
  .chip.lic{background:#EAF3DE;color:#3B6D11}
  .chip.lang{background:#E6F1FB;color:#185FA5}
  .chip.arch{background:#E1F5EE;color:#0F6E56;font-weight:500}
  .chip.pri{background:#EEEDFE;color:#534AB7;font-weight:500}

  /* ---------- 项目详情 ---------- */
  .dhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .dhead h1{font-size:19px;font-weight:500;margin:0}
  .dhead .sub{font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:3px}
  .dchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:13px}
  .panel > h2{font-size:13.5px;font-weight:500;margin:0 0 3px}
  .panel > .ph{font-size:11.5px;color:var(--ink3);margin-bottom:12px}
  .lead{font-size:13.5px;line-height:1.72;color:var(--ink);margin:0 0 10px}
  .feats{display:flex;flex-wrap:wrap;gap:5px}
  .feats i{font-style:normal;font-size:11px;background:#FAFAF8;border:1px solid var(--line2);
    border-radius:6px;padding:2px 8px;color:var(--ink2)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media (max-width:1080px){ .cols{grid-template-columns:1fr} }
  .bars{display:flex;flex-direction:column;gap:4px}
  .row{display:grid;grid-template-columns:124px 1fr 84px;align-items:center;gap:9px;font-size:11.5px}
  .row .lb{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
  .track{height:9px;background:#F1EFE8;border-radius:5px;overflow:hidden}
  .fill{height:100%;border-radius:5px;background:#B5D4F4}
  .fill.g{background:#9FE1CB}
  .row .vl{text-align:right;color:var(--ink3);font-family:var(--mono);font-size:11px}
  .cmd{background:#FAFAF8;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;
    font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-bottom:5px;
    white-space:pre-wrap;word-break:break-all;cursor:pointer}
  .cmd:hover{border-color:#C9C7C0}
  ol.flow,ul.pl2{margin:0;padding-left:19px}
  ol.flow li,ul.pl2 li{margin-bottom:6px;line-height:1.65;font-size:12.5px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;font-size:11px;font-weight:400;color:var(--ink3);padding:6px 10px 6px 0;border-bottom:1px solid var(--line2)}
  .tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.6}
  .tbl tr:last-child td{border-bottom:none}
  .tbl code,.kf code,.cmd{font-family:var(--mono)}
  .tbl code{font-size:11px;background:#FAFAF8;padding:1px 5px;border-radius:4px;color:var(--ink2)}
  .kf{list-style:none;margin:0;padding:0;counter-reset:k}
  .kf li{counter-increment:k;position:relative;padding-left:26px;margin-bottom:9px;line-height:1.6;font-size:12.5px}
  .kf li::before{content:counter(k);position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;
    background:#E1F5EE;color:#0F6E56;font-size:10px;text-align:center;line-height:17px;font-weight:500}
  .kf code{font-size:11px;background:#FAFAF8;padding:1px 5px;border-radius:4px;color:var(--ink2)}
  .note{font-size:12.5px;line-height:1.7;color:var(--ink2);background:#FAFAF8;border-left:2px solid var(--line);
    padding:9px 12px;border-radius:0 7px 7px 0;margin-bottom:7px}
  .mermaid-wrap{overflow-x:auto;background:#FCFCFB;border:1px solid var(--line2);border-radius:9px;padding:12px}
  .mermaid-wrap svg{max-width:100%;height:auto}
  details.src{margin-top:9px}
  details.src summary{font-size:11.5px;color:var(--ink3);cursor:pointer}
  details.src pre{background:#FAFAF8;border:1px solid var(--line2);border-radius:8px;padding:10px;
    font-size:11px;font-family:var(--mono);overflow-x:auto;margin-top:7px;color:var(--ink2)}
  .kpi{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px}
  .kpi div b{display:block;font-size:19px;font-weight:500;line-height:1.25}
  .kpi div span{font-size:11.5px;color:var(--ink3)}
  .ovrows{display:flex;flex-direction:column;gap:3px;margin-top:12px}
  .ovrow{display:flex;gap:3px;height:46px}
  .ovtile{border-radius:6px;padding:5px 7px;overflow:hidden;cursor:pointer;display:flex;
    flex-direction:column;justify-content:space-between;min-width:0}
  .ovtile:hover{filter:brightness(.94)}
  .ovtile .n{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovtile .v{font-size:9.5px;opacity:.7;font-family:var(--mono);white-space:nowrap}
  .empty{padding:50px;text-align:center;color:var(--ink3)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2C2C2A;color:#fff;
    font-size:12.5px;padding:8px 16px;border-radius:9px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:60}
  .toast.on{opacity:1}
  .back{font-size:12.5px;color:var(--ink2);background:none;border:none;padding:0;margin-bottom:12px;
    border-bottom:1px dotted var(--line);cursor:pointer}
  .back:hover{color:var(--ink)}
</style>
</head>

</div>

","gymnasium/envs/classic_control/cartpole.py"]},{"name":"包装器层","responsibility":"提供通用、观测/动作/奖励变换、有状态、渲染与 Atari 预处理等大量可复用包装器","modules":["gymnasium/wrappers"],"files":["gymnasium/wrappers/common.py","gymnasium/wrappers/transform_observation.py"]},{"name":"向量化层","responsibility":"把单环境接口扩展为批量环境接口，提供同步与基于多进程的异步实现","modules":["gymnasium/vector"],"files":["gymnasium/vector/sync_vector_env.py","gymnasium/vector/async_vector_env.py"]},{"name":"工具与校验层","responsibility":"提供环境规范校验、step API 兼容转换、回放、录制、随机种子等辅助能力","modules":["gymnasium/utils"],"files":["gymnasium/utils/env_checker.py","gymnasium/utils/play.py","gymnasium/utils/step_api_compatibility.py"]}],"data_flow":["第1步：import gymnasium 时，gymnasium/envs/__init__.py 通过大量 register 调用把内置环境写入全局 registry","第2步：用户调用 gym.make('CartPole-v1')，进入 envs/registration.py 的 make 函数","第3步：_find_spec 按 id 从 registry 取出 EnvSpec，其中含 entry_point、max_episode_steps、additional_wrappers","第4步：load_env_creator 动态导入 entry_point 字符串（如 classic_control.cartpole:CartPoleEnv）得到环境类","第5步：用合并后的 kwargs 调用 env_creator(**kwargs) 实例化底层环境，并校验它继承自 gymnasium.Env","第6步：把精简后的 EnvSpec 写回 env.unwrapped.spec，作为环境的元信息","第7步：按固定顺序套标准包装器：PassiveEnvChecker → OrderEnforcing → TimeLimit → additional_wrappers → 渲染相关","第8步：返回包装后的环境，用户调用 env.reset(seed=...) 得到 (observation, info)","第9步：循环调用 env.step(action) 得到 (observation, reward, terminated, truncated, info)","第10步：当 terminated 或 truncated 为真时调用 env.reset() 开始新 episode，全部结束后 env.close() 释放资源"],"entry_points":[{"path":"gymnasium.make / gymnasium.make_vec","what":"创建单环境或向量化环境的主入口"},{"path":"gymnasium.register","what":"注册自定义环境到 registry，供 make 使用"},{"path":"gymnasium.Env","what":"自定义环境时继承的基类，需实现 step/reset 等"},{"path":"gymnasium.Wrapper","what":"自定义包装器时继承的基类"},{"path":"gymnasium.utils.env_checker.check_env","what":"校验一个环境是否符合 Gymnasium API 规范"},{"path":"gymnasium.utils.play","what":"键盘交互式回放环境，便于调试"},{"path":"gymnasium.wrappers.RecordVideo","what":"录制环境视频"},{"path":"docs/introduction/create_custom_env.md","what":"官方自定义环境教程，含 gym.register 完整示例"}],"key_files":[{"path":"README.md","why":"先建立定位认知：它是接口标准而非算法库，并提供一批标准环境"},{"path":"gymnasium/core.py","why":"读 Env 与 Wrapper 的 step/reset 契约，这是整个生态的稳定接口"},{"path":"gymnasium/envs/registration.py","why":"理解 register/spec/make 如何把 id 变成自动装配好包装器的环境实例"},{"path":"gymnasium/__init__.py","why":"看清对外暴露的公共 API 与内置环境的自动注册时机"},{"path":"gymnasium/envs/classic_control/cartpole.py","why":"一个最小但完整的真实环境实现，对照接口理解 reset/step 写法"},{"path":"gymnasium/wrappers/common.py","why":"理解 TimeLimit/Autoreset/PassiveEnvChecker/RecordEpisodeStatistics 这些自动包装器"},{"path":"gymnasium/vector/vector_env.py","why":"理解批量环境接口与 AutoresetMode，向量化是训练提速的关键"},{"path":"gymnasium/utils/env_checker.py","why":"了解环境规范的具体检查项，写自定义环境前先看它"}],"extension_points":["想加新环境：继承 gymnasium.Env，实现 step/reset/render/close 并定义 action_space/observation_space，再用 gym.register(id=..., entry_point=...) 注册","想改已有环境行为：继承 gymnasium.Wrapper（或 Observation/Reward/ActionWrapper）并重写对应方法，用对象组合叠加","想加观测/奖励/动作变换：直接用 wrappers 里的 TransformObservation/TransformReward/ClipAction 等，或继承对应专项 Wrapper","想在注册时自动附加包装器：在 register 的 additional_wrappers 传入 WrapperSpec","想批量训练：用 gym.make_vec 或直接构造 SyncVectorEnv/AsyncVectorEnv，也可继承 VectorEnv","想加新空间类型：继承 gymnasium.spaces.Space 并实现 sample/contains","写完环境自检：调用 gymnasium.utils.env_checker.check_env 做合规校验"],"learning_path":["第1步：读 README 与 docs/introduction/basic_usage.md，跑通 make→reset→step→close 循环","第2步：读 core.py 的 Env，牢记 step 返回五元组、reset 返回二元组这两个契约","第3步：读 registration.py 的 register/make，理解注册表与包装器自动装配顺序","第4步：读 cartpole.py，把一个真实环境的实现与接口对应起来","第5步：读 wrappers/common.py，掌握 TimeLimit/Autoreset/RecordEpisodeStatistics 的用途","第6步：按 docs/introduction/create_custom_env.md 动手实现并注册一个自定义环境"],"diagram_mermaid":"graph TD\n  A[用户调用 gym.make] --> B[从 registry 取 EnvSpec]\n  B --> C[动态导入 entry_point 环境类]\n  C --> D[实例化底层 Env]\n  D --> E[写入 env.unwrapped.spec]\n  E --> F[PassiveEnvChecker 校验]\n  F --> G[OrderEnforcing 顺序检查]\n  G --> H[TimeLimit 时间截断]\n  H --> I[additional_wrappers 追加]\n  I --> J[返回包装后的 env]\n  J --> K[reset 返回 obs 与 info]\n  K --> L[step 返回 obs reward terminated truncated info]\n  L --> K","surprises":["自 v0.26 起 step 返回 terminated 与 truncated 两个布尔值取代单个 done，用于区分 MDP 终止与外部时间截断，直接影响 bootstrap 写法","reset 返回 (obs, info) 元组而非单个 obs，很多旧教程仍按旧接口写","make 会自动套上 PassiveEnvChecker、OrderEnforcing、TimeLimit，用户无需手动添加，重复添加反而可能出错","Autoreset 现在是一个显式包装器而非向量环境的隐式行为，且向量环境用 AutoresetMode 枚举来控制重置语义"],"confidence":"高"},"Genesis-Embodied-AI/Genesis":{"repo":"Genesis-Embodied-AI/Genesis","name":"Genesis World","one_liner":"面向具身智能的统一多物理与可微仿真平台","problem":"用一套 Python 接口统一刚体、FEM、MPM、SPH、PBD 等多种物理求解器与渲染，让机器人仿真可跨 CPU/GPU 大规模并行并支持可微。","difficulty":"困难","core_abstractions":[{"name":"Scene","role":"全局中心对象，聚合配置、Simulator 与 Visualizer，对外提供 add_entity/build/step/reset 与状态存取","file":"genesis/engine/scene.py"},{"name":"Simulator","role":"仿真调度器，持有求解器与耦合器，负责 substep 循环、时间步、传感器更新与状态/梯度管理","file":"genesis/engine/simulator.py"},{"name":"Solver","role":"所有物理求解器的抽象基类，定义 build/process_input/substep 等接口","file":"genesis/engine/solvers/base_solver.py"},{"name":"Entity / RigidEntity","role":"场景中实体的抽象与其刚体实现，提供 set_dofs_position/control_dofs_position 等控制接口","file":"genesis/engine/entities/base_entity.py"},{"name":"Morph","role":"描述实体几何来源的配置，如 MJCF/URDF/USD/Box/Plane，决定资产如何被解析成实体","file":"genesis/options/morphs.py"},{"name":"Material","role":"定义实体所属的物理模型，决定它由哪个求解器与哪种 entity 类处理","file":"genesis/engine/materials/base.py"},{"name":"Options","role":"所有 gs.options.* 配置类的基类，基于 Pydantic BaseModel 做严格校验","file":"genesis/options/options.py"},{"name":"Coupler","role":"多求解器耦合抽象，在同一步内交换不同物理域的状态，如 LegacyCoupler/SAPCoupler/IPCCoupler","file":"genesis/engine/couplers/legacy_coupler.py"},{"name":"Sensor","role":"传感器抽象基类，涵盖相机、IMU、接触力、触觉、激光雷达等，由 SensorManager 统一更新","file":"genesis/engine/sensors/base_sensor.py"},{"name":"Visualizer / RendererOptions","role":"可视化与渲染入口，支持 Nyx/Luisa/Pyrender 与 BatchRenderer 多条渲染路径","file":"genesis/vis/visualizer.py"}],"layers":[{"name":"顶层 API 与初始化层","responsibility":"提供 gs.init/destroy、公开命名空间与 gs 命令行工具","modules":["genesis/__init__.py","genesis/_main.py"],"files":["genesis/__init__.py","genesis/_main.py"]},{"name":"配置层","responsibility":"以 Pydantic 模型声明仿真、各求解器、morph、material、surface、渲染与传感器参数","modules":["genesis/options"],"files":["genesis/options/options.py","genesis/options/solvers.py","genesis/options/morphs.py"]},{"name":"场景与调度层","responsibility":"Scene 聚合一切并驱动 Simulator，Simulator 调度求解器与耦合器完成 substep 循环","modules":["genesis/engine"],"files":["genesis/engine/scene.py","genesis/engine/simulator.py","genesis/engine/interactive_scene.py"]},{"name":"实体层","responsibility":"按材质提供刚体、FEM、MPM、SPH、PBD、SF、混合、工具等实体类型及其几何/关节描述","modules":["genesis/engine/entities"],"files":["genesis/engine/entities/rigid_entity/rigid_entity.py","genesis/engine/entities/base_entity.py"]},{"name":"物理求解器与耦合层","responsibility":"实现各物理域求解器并支持跨求解器耦合","modules":["genesis/engine/solvers","genesis/engine/couplers"],"files":["genesis/engine/solvers/rigid","genesis/engine/solvers/mpm_solver.py","genesis/engine/couplers/sap_coupler.py"]},{"name":"状态与可微层","responsibility":"管理仿真状态缓存与 checkpoint，并通过 grad 模块提供可微仿真与反向传播","modules":["genesis/engine/states","genesis/grad","genesis/datatypes.py"],"files":["genesis/grad/creation_ops.py","genesis/engine/states/cache.py"]},{"name":"传感器与记录层","responsibility":"提供各类传感器实现与数据录制","modules":["genesis/engine/sensors","genesis/recorders"],"files":["genesis/engine/sensors/sensor_manager.py","genesis/engine/sensors/camera.py"]},{"name":"可视化与渲染层","responsibility":"提供 viewer、光栅化/光线追踪/批渲染后端与 GUI 插件","modules":["genesis/vis"],"files":["genesis/vis/visualizer.py","genesis/vis/viewer.py","genesis/vis/raytracer.py"]}],"data_flow":["第1步：调用 gs.init(backend=...) 选择 CPU/CUDA/AMDGPU/Metal 后端并初始化全局状态与 Quadrants 编译器","第2步：构造 gs.Scene(...)，内部创建 Simulator 与 Visualizer，并把各项 options 汇成统一的 SceneOptions","第3步：scene.add_entity(morph, material, surface) 添加实体，Simulator._add_entity 依据 material 选择对应求解器与 entity 类","第4步：可选地 scene.add_sensor / add_camera / add_force_field / add_recorder 扩展场景","第5步：scene.build(n_envs=...) 并行化环境、solver.build()、编译内核并做首次 reset","第6步：用户通过实体接口设置控制量，如 franka.set_dofs_kp / control_dofs_position","第7步：进入主循环反复调用 scene.step()","第8步：Simulator.step 按 substeps 循环执行 process_input 与 substep，substep 内部为 pre_coupling → coupler.couple → post_coupling","第9步：每步末尾 SensorManager.step 更新传感器，Visualizer.update 刷新渲染与录像","第10步：用户读取状态与传感器（get_state / read_sensors）用于 RL 训练或数据生成，scene.backward 支持可微反向传播"],"entry_points":[{"path":"gs (console script -> genesis._main:main)","what":"命令行工具，提供 gs launch/view 打开 viewer 或导出场景"},{"path":"examples/tutorials/control_your_robot.py","what":"最小可运行示例：init→Scene→add_entity→build→step→控制机器人"},{"path":"examples/","what":"覆盖 rigid/deformable/coupling/sensors/rendering 等全部能力的示例目录"},{"path":"genesis/__init__.py (init/Scene/Mesh/options)","what":"编程入口，导入即得全部公开 API"},{"path":"tests/","what":"按 core/coupling/deformable/grad 等分类的测试，可作为行为参考"},{"path":"examples/speed_benchmark","what":"性能基准，了解并行与后端差异"}],"key_files":[{"path":"README.md","why":"先建立四层认知：Simulation Interface、Physics、Render、Compiler"},{"path":"genesis/__init__.py","why":"看清 init/destroy 全局生命周期与对外暴露的 API 边界"},{"path":"examples/tutorials/control_your_robot.py","why":"最快跑通一次完整流程，形成直观印象"},{"path":"genesis/options/options.py","why":"理解基于 Pydantic 的严格配置体系，这是所有参数的入口"},{"path":"genesis/engine/scene.py","why":"掌握中心对象 Scene 的 add_entity/build/step/reset 与状态接口"},{"path":"genesis/engine/simulator.py","why":"理解求解器调度、substep 循环与耦合器插入点"},{"path":"genesis/engine/solvers/base_solver.py","why":"掌握求解器抽象，是加新物理域的起点"},{"path":"genesis/engine/entities/rigid_entity/rigid_entity.py","why":"刚体实体控制 API 的完整实现，机器人操作都落在这里"}],"extension_points":["想加新机器人/物体：用 gs.morphs.MJCF/URDF/USD/Box/Plane 等 morph，直接 scene.add_entity","想加新物理模型：在 genesis/engine/materials 下新增 Material 子类（并配套 options），让 entity/solver 支持它","想加新求解器：继承 genesis/engine/solvers/base_solver.py 的 Solver，实现 build/substep 并在 Simulator 注册","想加多求解器耦合：继承 genesis/engine/couplers 下的 coupler（LegacyCoupler/SAPCoupler/IPCCoupler）并实现 couple","想加新传感器：继承 genesis/engine/sensors/base_sensor.py 的 Sensor，并在 genesis/options/sensors 增加对应 options","想加新渲染器：继承 genesis/options/renderers.py 的 RendererOptions，在 vis 中接入","想加新配置组：继承 genesis/options/options.py 的 Options（Pydantic BaseModel）声明字段"],"learning_path":["第1步：读 README 与文档，记住四层架构与统一多物理引擎的定位","第2步：跑 examples/tutorials/control_your_robot.py，形成 init→Scene→add_entity→build→step 的肌肉记忆","第3步：读 genesis/__init__.py，理解全局初始化与公开 API","第4步：读 genesis/options/options.py 与 solvers.py，掌握严格配置体系与各求解器参数","第5步：读 genesis/engine/scene.py，理解 Scene 如何聚合与驱动整个仿真","第6步：读 genesis/engine/simulator.py 与 solvers/base_solver.py，深入 substep 循环与求解器扩展，再按兴趣深挖 rigid_entity 控制、couplers 多物理耦合或 grad 可微仿真"],"diagram_mermaid":"graph TD\n  A[gs.init 初始化后端] --> B[构造 gs.Scene]\n  B --> C[add_entity 添加实体]\n  C --> D[Simulator 按材质选求解器]\n  D --> E[scene.build 并行化与编译内核]\n  E --> F[设置实体控制量]\n  F --> G[scene.step 主循环]\n  G --> H[Simulator.step 子步循环]\n  H --> I[求解器 substep 更新状态]\n  I --> J[Coupler 耦合多求解器]\n  J --> K[SensorManager 更新传感器]\n  K --> L[Visualizer 渲染与录像]\n  L --> G\n  G --> M[get_state 读取状态用于训练]","surprises":["项目已从 Genesis 更名为 Genesis World 仓库 genesis-world，但 Python 包名仍是 genesis，导入方式不变","配置体系用 Pydantic BaseModel 而非普通 dataclass，且 strict=True、extra='forbid'，字段名或类型写错会直接抛错","底层编译器 Quadrants 是 Taichi 的 fork，把 Python 内核代码降到 CUDA/ROCm/Metal/Vulkan/x86/ARM64","同一个 Scene 内可让多种物理求解器耦合（如刚体+MPM+SPH+IPC），并支持可微仿真的 backward 反向传播"],"confidence":"高"},"Physical-Intelligence/openpi":{"repo":"Physical-Intelligence/openpi","name":"openpi","one_liner":"Physical Intelligence 的 π0 系列 VLA 视觉-语言-动作基础模型开源实现","problem":"机器人操作需要把摄像头画面与自然语言指令映射成连续动作序列。openpi 提供在 10k+ 小时机器人数据上预训练的 π0 / π0-FAST / π0.5 模型，支持开箱推理与在自己的数据上微调。","difficulty":"困难","core_abstractions":[{"name":"BaseModel","role":"所有模型实现的抽象基类，规定 compute_loss 与 sample_actions 两个核心方法","file":"src/openpi/models/model.py"},{"name":"BaseModelConfig","role":"模型配置基类，定义 action_dim / action_horizon / max_token_len，并负责 create 与 load 模型","file":"src/openpi/models/model.py"},{"name":"Observation","role":"模型输入的结构化数据类，统一多路图像、图像掩码、机器人状态与 tokenized prompt","file":"src/openpi/models/model.py"},{"name":"Policy","role":"推理侧封装，把输入 transforms、模型 sample_actions、输出 transforms 串成 infer 接口","file":"src/openpi/policies/policy.py"},{"name":"BasePolicy","role":"客户端侧的极简策略协议，只要求实现 infer，是策略服务器与机器人运行时之间的契约","file":"packages/openpi-client/src/openpi_client/base_policy.py"},{"name":"DataTransformFn","role":"数据变换协议，对无 batch 的嵌套 dict 逐样本处理，是数据格式适配的核心抽象","file":"src/openpi/transforms.py"},{"name":"TrainConfig","role":"训练总配置，组合模型配置、数据配置、优化器、并行与 checkpoint 参数","file":"src/openpi/training/config.py"},{"name":"DataConfigFactory","role":"数据配置工厂基类，负责把某平台数据映射成模型输入并声明 transforms","file":"src/openpi/training/config.py"},{"name":"WeightLoader","role":"权重加载器协议，支持从预训练 checkpoint 或 PaliGemma 加载部分权重","file":"src/openpi/training/weight_loaders.py"}],"layers":[{"name":"模型层","responsibility":"实现 π0 / π0-FAST / π0.5 的 JAX 与 PyTorch 网络，含 PaliGemma 主干、SigLIP 视觉编码器与动作专家","modules":["src/openpi/models","src/openpi/models_pytorch"],"files":["src/openpi/models/model.py","src/openpi/models/pi0.py","src/openpi/models/pi0_config.py","src/openpi/models_pytorch/pi0_pytorch.py"]},{"name":"数据变换层","responsibility":"定义可组合的无 batch 数据变换，负责键重排、归一化、prompt 注入与平台适配","modules":["src/openpi/transforms.py"],"files":["src/openpi/transforms.py"]},{"name":"策略层","responsibility":"把 transforms 与模型组装成可推理的 Policy，并提供各平台专属的输入输出映射","modules":["src/openpi/policies"],"files":["src/openpi/policies/policy.py","src/openpi/policies/policy_config.py","src/openpi/policies/libero_policy.py","src/openpi/policies/droid_policy.py"]},{"name":"训练层","responsibility":"定义 TrainConfig 体系、数据加载、优化器、FSDP 分片、checkpoint 与权重加载","modules":["src/openpi/training"],"files":["src/openpi/training/config.py","src/openpi/training/data_loader.py","src/openpi/training/optimizer.py","src/openpi/training/weight_loaders.py","src/openpi/training/sharding.py"]},{"name":"服务层","responsibility":"把 Policy 封装成 websocket 策略服务器，供远程机器人客户端查询动作","modules":["src/openpi/serving"],"files":["src/openpi/serving/websocket_policy_server.py","scripts/serve_policy.py"]},{"name":"客户端层","responsibility":"独立可安装的轻量客户端包，含动作块缓冲、运行时与机器人环境抽象","modules":["packages/openpi-client"],"files":["packages/openpi-client/src/openpi_client/base_policy.py","packages/openpi-client/src/openpi_client/action_chunk_broker.py","packages/openpi-client/src/openpi_client/runtime/agent.py"]},{"name":"共享工具层","responsibility":"数组类型检查、图像工具、归一化统计、下载与 NNX 工具","modules":["src/openpi/shared"],"files":["src/openpi/shared/normalize.py","src/openpi/shared/image_tools.py","src/openpi/shared/nnx_utils.py","src/openpi/shared/download.py"]}],"data_flow":["第1步：调用方构造观测 dict，含多路图像、机器人状态与 prompt 文本","第2步：Policy.infer 先复制输入，依次应用 repack_transforms 与 InjectDefaultPrompt","第3步：data_transforms 把平台原始键映射为模型期望的图像键与状态键","第4步：Normalize 用 norm_stats 把状态与动作归一化到稳定范围","第5步：model_transforms 把数据整理成模型输入格式","第6步：Observation.from_dict 把嵌套 dict 转成结构化 Observation，并补上图像掩码","第7步：model.sample_actions 以 flow matching 迭代去噪从噪声生成动作块","第8步：输出经 Unnormalize 与 data_transforms.outputs 还原为平台动作格式","第9步：返回含 actions 与 policy_timing 的 dict，动作块由客户端 broker 按步执行","第10步：训练时同一套 transforms 生成 batch，train_step 调 compute_loss 得到 flow matching 损失并反向更新"],"entry_points":[{"path":"scripts/train.py","what":"JAX 训练主入口，按 config 名加载配置并跑训练循环"},{"path":"scripts/train_pytorch.py","what":"PyTorch 版训练入口，支持单卡与 torchrun 多卡"},{"path":"scripts/serve_policy.py","what":"加载 checkpoint 并启动 websocket 策略服务器"},{"path":"scripts/compute_norm_stats.py","what":"为某训练配置预先计算数据归一化统计"},{"path":"src/openpi/policies/policy_config.py:16","what":"create_trained_policy，推理侧组装 Policy 的标准入口"},{"path":"src/openpi/training/config.py:955","what":"get_config 与 cli，按名字取训练配置"},{"path":"examples/inference.ipynb","what":"无需机器人的最小推理示例"}],"key_files":[{"path":"README.md","why":"先建立整体认知：三类模型、checkpoint、微调三步流程与 JAX/PyTorch 双实现"},{"path":"src/openpi/models/model.py","why":"核心抽象所在：Observation、BaseModel、BaseModelConfig 与 restore_params"},{"path":"src/openpi/policies/policy.py","why":"推理链路的组装点，看清 transforms 与 sample_actions 的先后关系"},{"path":"src/openpi/policies/policy_config.py","why":"create_trained_policy，理解如何从 checkpoint 构造可推理策略"},{"path":"src/openpi/training/config.py","why":"TrainConfig 体系与全部内置配置，是理解参数组织与扩展入口的关键"},{"path":"src/openpi/models/pi0.py","why":"π0 模型本体，含 flow matching 与 attention mask 的实现"},{"path":"scripts/train.py","why":"训练主循环，把数据加载、模型初始化、优化器与 checkpoint 串起来"},{"path":"src/openpi/transforms.py","why":"数据变换抽象与归一化实现，理解数据格式如何适配模型"}],"extension_points":["想加新机器人平台：在 src/openpi/policies/ 下参考 libero_policy.py / droid_policy.py 写输入输出 transforms 与 Policy 子类","想加新数据来源：继承 training/config.py 的 DataConfigFactory，实现 create 返回 DataConfig，并在 _CONFIGS 里注册新 TrainConfig","想加新模型结构：继承 models/model.py 的 BaseModel 与 BaseModelConfig，实现 create / compute_loss / sample_actions 与 inputs_spec","想换权重加载策略：实现 training/weight_loaders.py 的 WeightLoader 协议","想改归一化或数据预处理：在 transforms.py 里新增 DataTransformFn 并在 DataConfig 的 transforms 中组装","想部署到自定义运行时：基于 packages/openpi-client 的 BasePolicy 与 runtime 实现机器人侧循环"],"learning_path":["第1步：读 README.md，跑通 examples/inference.ipynb，建立推理链路直觉","第2步：读 src/openpi/models/model.py，掌握 Observation / BaseModel / BaseModelConfig 三个核心抽象","第3步：读 src/openpi/transforms.py，理解无 batch 数据变换与归一化协议","第4步：读 src/openpi/policies/policy.py 与 policy_config.py，把推理链路的组装串起来","第5步：读 src/openpi/models/pi0.py，理解 flow matching 与多模态注意力","第6步：读 src/openpi/training/config.py 与 scripts/train.py，理解训练配置体系与训练循环"],"diagram_mermaid":"graph TD\n  OBS[观测 dict 图像 状态 prompt] --> REPACK[RepackTransform 重排键]\n  REPACK --> INJ[InjectDefaultPrompt 注入语言指令]\n  INJ --> DT[data_transforms 平台适配]\n  DT --> NORM[Normalize 归一化]\n  NORM --> MT[model_transforms 整理模型输入]\n  MT --> OBSOBJ[Observation 结构化对象]\n  OBSOBJ --> MODEL[Pi0 sample_actions]\n  MODEL --> FLOW[flow matching 迭代去噪]\n  FLOW --> UNNORM[Unnormalize 反归一化]\n  UNNORM --> OUT[输出 actions 动作块]\n  OUT --> BROKER[客户端 action chunk broker 逐帧执行]","surprises":["同一仓库同时维护 JAX 与 PyTorch 两套实现，推理 API 完全一致，靠 checkpoint 里是否存在 model.safetensors 自动判定后端"," ibility":"定义 Message、Document、Task、Plan 等跨角色传递的数据结构","modules":["metagpt"],"files":["metagpt/schema.py","metagpt/const.py"]},{"name":"记忆层","responsibility":"提供短期消息记忆与长期记忆检索能力，供角色去重与增强上下文","modules":["metagpt/memory","metagpt/rag"],"files":["metagpt/memory/memory.py","metagpt/memory/longterm_memory.py","metagpt/memory/brain_memory.py"]},{"name":"配置与模型接入层","responsibility":"统一 LLM、embedding、搜索等 provider 的配置与实例化，支持按角色覆盖模型","modules":["metagpt/configs","metagpt/provider","config"],"files":["metagpt/config2.py","config/config2.example.yaml","metagpt/provider"]}],"data_flow":["第1步：用户构造 Team 并 hire 一组 Role，或直接调用 software_company.startup 走预置软件公司流程","第2步：把 idea 包装成 UserRequirement 消息投入环境 publish_message，按 cause_by 路由给订阅该动作的角色","第3步：Environment.run 每轮遍历所有非 idle 角色，用 asyncio.gather 并发调用各自 role.run","第4步：Role.run 先 _observe，从私有 msg_buffer 与 memory 取新消息，按 rc.watch 与 send_to 过滤出 rc.news","第5步：若存在新消息则进入 react，按 react_mode 选择 _react 或 _plan_and_act 策略","第6步：_react 循环 _think 选动作，BY_ORDER 模式按序轮转、REACT 模式用 LLM 动态选择","第7步：_act 执行 rc.todo.run(history)，Action 组装 prompt 并经 ActionNode.fill 调用 LLM 得到结构化 ActionOutput","第8步：结果被包装成 AIMessage 写入角色 memory，再经 publish_message 广播回环境","第9步：Environment.publish_message 依据 send_to 与 member_addrs 把消息投递到目标角色的 msg_buffer","第10步：Team.run 循环多轮直到 env.is_idle，返回 env.history 作为最终交付物"],"entry_points":[{"path":"metagpt/team.py:Team.run","what":"团队顶层运行循环，投喂需求并按轮次推进直到所有角色空闲"},{"path":"metagpt/software_company.py:startup","what":"预置软件公司的启动入口，组装 PM/架构师/项目经理/工程师团队"},{"path":"metagpt/roles/role.py:Role.run","what":"单个角色的主循环入口：观察-反应-发布消息"},{"path":"metagpt/environment/base_env.py:Environment.run","what":"环境调度入口，每轮并发驱动所有非空闲角色"},{"path":"examples/","what":"各类可直接运行的示例脚本，最快的上手入口"}],"key_files":[{"path":"README.md","why":"先理解核心哲学 Code = SOP(Team)，以及输入输出边界"},{"path":"metagpt/schema.py","why":"Message/Document/Task 等数据模型，理解角色间传递什么"},{"path":"metagpt/roles/role.py","why":"Role 基类与观察-思考-行动循环，是协作机制的核心"},{"path":"metagpt/actions/action.py","why":"Action 基类与 LLM 调用契约，理解一个 SOP 步骤如何 uggingface/lerobot","name":"LeRobot","one_liner":"PyTorch 端到端机器人学习工具链，统一硬件、数据集与策略接口","problem":"机器人学习生态碎片化：各家硬件、数据格式、策略实现互不兼容。LeRobot 用统一抽象把真实机器人控制、数据集、训练与评估串成可复用流水线。","difficulty":"中等","core_abstractions":[{"name":"Robot","role":"所有真实机器人的抽象基类，规定 connect / get_observation / send_action / calibrate 等硬件无关接口","file":"src/lerobot/robots/robot.py"},{"name":"PreTrainedPolicy","role":"所有策略模型的抽象基类，继承 nn.Module，提供 select_action、predict_action_chunk、from_pretrained 等统一推理与加载接口","file":"src/lerobot/policies/pretrained.py"},{"name":"PreTrainedConfig","role":"所有策略配置的基类，基于 draccus ChoiceRegistry 做类型注册，是策略的工厂入口","file":"src/lerobot/configs/policies.py"},{"name":"LeRobotDataset","role":"标准化的机器人数据集格式，Parquet 存状态/动作、MP4 或图像存视觉，支持流式与 HF Hub 加载","file":"src/lerobot/datasets/lerobot_dataset.py"},{"name":"RobotConfig","role":"机器人配置基类，同样是 draccus ChoiceRegistry，决定 --robot.type 实例化哪个机器人","file":"src/lerobot/robots/config.py"},{"name":"EnvConfig","role":"仿真环境配置基类，通过 create_envs 生成 gymnasium 向量化环境，供评估与仿真数据采集","file":"src/lerobot/envs/configs.py"},{"name":"PolicyProcessorPipeline","role":"可组合的处理器流水线，负责观测/动作的归一化、设备搬运、重命名等前后处理步骤","file":"src/lerobot/processor/pipeline.py"},{"name":"Teleoperator","role":"遥操作设备抽象基类，与 Robot 对称，提供 get_action 供数据采集时人工示教","file":"src/lerobot/teleoperators/teleoperator.py"}],"layers":[{"name":"配置与 CLI 层","responsibility":"用 draccus 把命令行参数解析成强类型配置对象，是所有入口脚本的起点","modules":["src/lerobot/configs"],"files":["src/lerobot/configs/train.py","src/lerobot/configs/policies.py","src/lerobot/configs/parser.py"]},{"name":"硬件抽象层","responsibility":"把不同机器人、遥操作器、相机、电机统一到 Robot / Teleoperator / Camera 接口下","modules":["src/lerobot/robots","src/lerobot/teleoperators","src/lerobot/cameras","src/lerobot/motors"],"files":["src/lerobot/robots/robot.py","src/lerobot/teleoperators/teleoperator.py","src/lerobot/robots/so_follower/so_follower.py"]},{"name":"数据层","responsibility":"定义并读写 LeRobotDataset 格式，含视频编码、分片、统计与流式加载","modules":["src/lerobot/datasets"],"files":["src/lerobot/datasets/lerobot_dataset.py","src/lerobot/datasets/dataset_writer.py","src/lerobot/datasets/streaming_dataset.py"]},{"name":"策略层","responsibility":"实现各类模仿学习、强化学习、VLA、世界模型与奖励模型策略","modules":["src/lerobot/policies","src/lerobot/rewards","src/lerobot/rl"],"files":["src/lerobot/policies/pretrained.py","src/lerobot/policies/act/modeling_act.py","src/lerobot/policies/diffusion/modeling_diffusion.py","src/lerobot/policies/pi0/modeling_pi0.py"]},{"name":"处理层","responsibility":"观测/动作的归一化、重命名、相对动作、图像增强、设备搬运等可组合处理步骤","modules":["src/lerobot/processor"],"files":["src/lerobot/processor/pipeline.py","src/lerobot/processor/normalize_processor.py","src/lerobot/processor/factory.py"]},{"name":"仿真环境层","responsibility":"封装 LIBERO、MetaWorld、RoboCasa 等基准为统一向量化环境","modules":["src/lerobot/envs"],"files":["src/lerobot/envs/factory.py","src/lerobot/envs/libero.py","src/lerobot/envs/metaworld.py"]},{"name":"训练与评估编排层","responsibility":"入口脚本组装数据集、策略、优化器与分布式引擎，跑训练循环和 rollout 评估","modules":["src/lerobot/scripts"],"files":["src/lerobot/scripts/lerobot_train.py","src/lerobot/scripts/lerobot_eval.py","src/lerobot/scripts/lerobot_record.py"]},{"name":"分布式与加速层","responsibility":"基于 accelerate 提供 DDP/FSDP2/混合精度/梯度累积等并行能力","modules":["src/lerobot/distributed","src/lerobot/optim"],"files":["src/lerobot/distributed/parallelism.py","src/lerobot/optim/factory.py"]}],"data_flow":["第1步：用户运行 lerobot-train，draccus 解析 CLI 得到 TrainPipelineConfig","第2步：train() 调用 make_accelerator 建立 accelerate 引擎并解析并行拓扑","第3步：make_train_eval_datasets 从 HF Hub 或本地加载 LeRobotDataset，得到数据集元数据与统计","第4步：make_policy 依据数据集特征与策略配置实例化策略模型","第5步：make_pre_post_processors 依据策略配置构建归一化等前后处理流水线","第6步：make_optimizer_and_scheduler 构建优化器与学习率调度器，accelerator.prepare 包装模型与数据加载器","第7步：训练循环取 batch，经 rename 与 preprocessor 处理后送入 policy(batch)","第8步：policy 前向返回 loss，accelerator.backward 反向传播，optimizer.step 更新权重","第9步：按频率记录日志、跑 eval_dataloader 或仿真环境评估、保存 checkpoint","第10步：可选把训练好的策略与处理器推送到 Hugging Face Hub"],"entry_points":[{"path":"lerobot-train","what":"训练策略的主入口，解析配置后执行完整训练循环"},{"path":"lerobot-eval","what":"在仿真环境或真实硬件上 rollout 策略并计算成功率等指标"},{"path":"lerobot-record","what":"通过遥操作采集真实机器人数据并写成 LeRobotDataset"},{"path":"lerobot-teleoperate","what":"不采集数据，仅做遥操作实时控制机器人"},{"path":"lerobot-calibrate","what":"标定机器人电机零位并保存标定文件"},{"path":"lerobot-dataset-viz","what":"可视化数据集中的视频与状态动作序列"},{"path":"src/lerobot/scripts/lerobot_train.py:543","what":"train() 函数，整个训练流水线的编排核心"},{"path":"src/lerobot/scripts/lerobot_record.py:228","what":"record_loop() 函数，遥操作采集数据的主循环"}],"key_files":[{"path":"README.md","why":"先建立整体认知：硬件、数据集、策略三大块与 CLI 用法"},{"path":"src/lerobot/configs/policies.py","why":"PreTrainedConfig 基类，理解 draccus ChoiceRegistry 如何注册与选择策略"},{"path":"src/lerobot/policies/pretrained.py","why":"PreTrainedPolicy 基类，理解策略必须实现的接口与并行声明"},{"path":"src/lerobot/robots/robot.py","why":"Robot 基类，理解硬件抽象层的契约"},{"path":"src/lerobot/policies/factory.py","why":"make_policy 工厂，理解策略如何被按名约定地实例化"},{"path":"src/lerobot/scripts/lerobot_train.py","why":"训练入口，串联数据集、策略、处理器、优化器与分布式"},{"path":"src/lerobot/datasets/lerobot_dataset.py","why":"LeRobotDataset 实现，理解统一数据格式的读写"},{"path":"src/lerobot/processor/pipeline.py","why":"处理流水线，理解观测/动作前后处理如何可组合"}],"extension_points":["想加新策略：在 src/lerobot/policies/<name>/ 下写 configuration_<name>.py，用 @PreTrainedConfig.register_subclass(\"<name>\") 注册一个继承 PreTrainedConfig 的配置类；再写 modeling_<name>.py 暴露 <Name>Policy，继承 PreTrainedPolicy","想加新机器人：在 src/lerobot/robots/ 下新建目录，写继承 Robot 的类和继承 RobotConfig 的配置类并注册","想加新遥操作器或相机：分别继承 Teleoperator / Camera 并注册对应 Config","想加新仿真环境：在 src/lerobot/envs/ 下写继承 EnvConfig 的类，实现 create_envs 返回 gymnasium 向量化环境","想加新的数据前后处理步骤：在 src/lerobot/processor/ 下写 ProcessorStep 并在策略的 processor_<name>.py 里组装 make_<name>_pre_post_processors","想接入第三方硬件包：发布名为 lerobot_robot_* / lerobot_teleoperator_* / lerobot_camera_* 的包，会被自动发现"],"learning_path":["第1步：读 README.md 与 pyproject.toml 的 [project.scripts]，搞清有哪些 CLI 入口","第2步：读 src/lerobot/configs/policies.py 与 src/lerobot/robots/robot.py，掌握两类核心配置基类与注册机制","第3步：读 src/lerobot/policies/pretrained.py 与一个具体策略如 policies/act/modeling_act.py，理解策略契约","第4步：读 src/lerobot/policies/factory.py，理解配置到实例的按名约定工厂","第5步：读 src/lerobot/scripts/lerobot_train.py 的 train()，把整条训练流水线串起来","第6步：读 src/lerobot/scripts/lerobot_record.py 与 datasets/lerobot_dataset.py，理解数据采集与统一格式"],"diagram_mermaid":"graph TD\n  CLI[CLI 命令行参数] --> CFG[TrainPipelineConfig 配置对象]\n  CFG --> DS[make_train_eval_datasets 构建数据集]\n  CFG --> POL[make_policy 构建策略]\n  CFG --> PROC[make_pre_post_processors 构建处理器]\n  DS --> DL[DataLoader 批量加载]\n  DL --> PRE[Preprocessor 归一化与设备搬运]\n  PRE --> MODEL[Policy forward 计算损失]\n  MODEL --> OPT[optimizer.step 更新权重]\n  OPT --> CKPT[保存 checkpoint]\n  CKPT --> HUB[上传 HuggingFace Hub]\n  POL --> ACT[select_action 推理动作]\n  ACT --> ENV[仿真或真实环境 rollout]","surprises":["策略类的导入完全靠命名约定：配置模块 configuration_<name>.py 会被重写成 modeling_<name>.py 再取 <Name>Policy，模块名不合规会直接报错","训练里刻意写 policy(batch) 而不是 policy.forward(batch)，因为 FSDP2 只通过 nn.Module 的 __call__ 钩子做参数 all-gather","基础安装非常轻，训练/硬件/数据集能力分别藏在 lerobot[training]、lerobot[hardware] 等 extras 后面，缺包时会给出可操作的安装提示","第三方硬件无需改本仓库，只要包名以 lerobot_robot_ 等前缀发布即可被自动发现并用 --robot.type 直接调用"],"confidence":"高"},"isaac-sim/IsaacLab":{"repo":"isaac-sim/IsaacLab","name":"Isaac Lab","one_liner":"基于 Omniverse 的 GPU 并行机器人学习仿真与训练框架","problem":"把机器人强化学习/模仿学习的仿真、传感器、随机化与策略训练整合成可大规模并行的统一流程，降低 sim-to-real 门槛。","difficulty":"困难","core_abstractions":[{"name":"ManagerBasedEnv","role":"manager-based 工作流的环境基类，持有场景与各类 manager，但不含 reward/termination，对 MDP 保持无关","file":"source/isaaclab/isaaclab/envs/manager_based_env.py"},{"name":"ManagerBasedRLEnv","role":"在 ManagerBasedEnv 之上补齐 reward、termination、reset 与 Gymnasium 接口的 RL 任务环境，是绝大多数训练任务的入口类","file":"source/isaaclab/isaaclab/envs/manager_based_rl_env.py"},{"name":"DirectRLEnv / DirectMARLEnv","role":"另一种工作流：不拆 manager，由用户在一个类里直接实现 scene 搭建、观测、奖励、终止与 reset","file":"source/isaaclab/isaaclab/envs/direct_rl_env.py"},{"name":"ManagerBase / ManagerTermBase","role":"所有 manager 的抽象基类，负责把配置对象解析成一个个 term 并统一调度，是 MDP 分解机制的核心","file":"source/isaaclab/isaaclab/managers/manager_base.py"},{"name":"InteractiveScene","role":"场景管理器，依据 InteractiveSceneCfg 创建机器人、刚体、传感器等实体并做 GPU 批量克隆与数据缓冲","file":"source/isaaclab/isaaclab/scene/interactive_scene.py"},{"name":"SimulationContext","role":"物理仿真上下文单例，控制 dt、物理步进、渲染与物理后端，env 必须由它驱动","file":"source/isaaclab/isaaclab/sim/simulation_context.py"},{"name":"configclass + EnvCfg","role":"基于 dataclass 的配置体系，用 @configclass 声明式定义场景/MDP 项，是用户定义新任务的主要接口","file":"source/isaaclab/isaaclab/envs/manager_based_env_cfg.py"},{"name":"RslRlVecEnvWrapper","role":"把 Isaac Lab 环境适配成 RSL-RL 等库所需的向量化环境接口，是 env 与策略库之间的桥","file":"source/isaaclab_rl/isaaclab_rl/rsl_rl/vecenv_wrapper.py"}],"layers":[{"name":"启动/App 层","responsibility":"启动 Omniverse Kit 内核、解析命令行与 Kit 参数、创建仿真上下文与可视化窗口","modules":["source/isaaclab/isaaclab/app","apps","source/isaaclab/isaaclab/cli"],"files":["source/isaaclab/isaaclab/app/app_launcher.py","source/isaaclab/isaaclab/app/sim_launcher.py"]},{"name":"仿真核心层","responsibility":"封装物理步进、时间步/decimation、渲染与物理后端抽象","modules":["source/isaaclab/isaaclab/sim","source/isaaclab_physx","source/isaaclab_newton"],"files":["source/isaaclab/isaaclab/sim/simulation_context.py","source/isaaclab/isaaclab/sim/simulation_cfg.py"]},{"name":"场景/资产/传感器层","responsibility":"提供机器人、刚体、可变形体、相机/激光雷达/接触等资产的配置与运行时句柄","modules":["source/isaaclab/isaaclab/scene","source/isaaclab/isaaclab/assets","source/isaaclab/isaaclab/sensors","source/isaaclab/isaaclab/terrains"],"files":["source/isaaclab/isaaclab/scene/interactive_scene.py","source/isaaclab_assets/robots/franka.py"]},{"name":"环境抽象层","responsibility":"把场景与 manager 组织成对 agent 暴露的 step/reset 接口，区分 manager-based 与 direct 两种工作流","modules":["source/isaaclab/isaaclab/envs"],"files":["source/isaaclab/isaaclab/envs/manager_based_env.py","source/isaaclab/isaaclab/envs/manager_based_rl_env.py","source/isaaclab/isaaclab/envs/direct_rl_env.py"]},{"name":"Manager/MDP 层","responsibility":"把 MDP 拆成 action/observation/reward/termination/event/command/curriculum/recorder 等可插拔 term 并统一调度","modules":["source/isaaclab/isaaclab/managers","source/isaaclab/isaaclab/envs/mdp"],"files":["source/isaaclab/isaaclab/managers/action_manager.py","source/isaaclab/isaaclab/managers/observation_manager.py","source/isaaclab/isaaclab/envs/mdp/rewards.py"]},{"name":"任务层","responsibility":"提供 30+ 现成环境与机器人配置，并通过 gym.register 把任务名映射到 env cfg 与各 RL 库的 agent cfg","modules":["source/isaaclab_tasks","source/isaaclab_tasks_experimental"],"files":["source/isaaclab_tasks/isaaclab_tasks/contrib/lift/lift_env_cfg.py","source/isaaclab_tasks/isaaclab_tasks/contrib/lift/config/franka/__init__.py"]},{"name":"RL 集成层","responsibility":"统一 train/play/export 入口，按 --rl_library 分发到 RSL-RL/SB3/SKRL/rl_games/TorchRL 等后端并做环境适配","modules":["source/isaaclab_rl"],"files":["source/isaaclab_rl/isaaclab_rl/entrypoints/dispatch.py","source/isaaclab_rl/isaaclab_rl/entrypoints/backends/train_rsl_rl.py"]}],"data_flow":["第1步：运行 scripts/reinforcement_learning/train.py，它导入 isaaclab_rl.entrypoints.run_train_cli","第2步：dispatch.run_cli 解析 --rl_library 与 --task，并从 gym.spec 的 kwargs 解析出默认后端","第3步：resolve_task_config 通过任务注册取出 env_cfg_entry_point 与 agent 配置并实例化为 @configclass","第4步：launch_simulation 启动 Kit 与 SimulationContext，创建 USD stage 并配置物理/渲染","第5步：create_isaaclab_env 用 gym.make(task) 实例化 ManagerBasedRLEnv","第6步：ManagerBasedEnv.__init__ 创建 InteractiveScene 与 EventManager，调用 sim.reset() 激活物理句柄","第7步：load_managers 依次构建 recorder/action/observation manager，并把配置解析成 term","第8步：RslRlVecEnvWrapper 包装环境，构建 OnPolicyRunner 等策略 runner","第9步：runner.learn 循环中策略输出 action，调用 env.step(action)","第10步：step 内 action_manager.process_action/apply_action 驱动 decimation 次物理步进，再算 termination/reward、reset 终止环境、observation_manager.compute 生成观测并返回"],"entry_points":[{"path":"scripts/reinforcement_learning/train.py","what":"统一 RL 训练入口，转调 isaaclab_rl.entrypoints.run_train_cli"},{"path":"scripts/reinforcement_learning/play.py","what":"加载 checkpoint 回放/评估策略"},{"path":"scripts/environments/zero_agent.py","what":"零动作 agent，用于快速验证环境能否跑通"},{"path":"scripts/environments/random_agent.py","what":"随机动作 agent，用于冒烟测试环境"},{"path":"scripts/tutorials/03_envs","what":"环境创建与 manager 配置的官方教学脚本"},{"path":"isaaclab (console script -> isaaclab.cli:cli)","what":"安装后的命令行工具，提供环境列表、预编译等子命令"},{"path":"apps/isaaclab.python.kit","what":"Kit experience 文件，定义启动 Isaac Sim 内核所需的扩展集"}],"key_files":[{"path":"README.md","why":"先建立整体认知：GPU 并行、基于 Isaac Sim、支持 RL/IL 与多后端"},{"path":"source/isaaclab/isaaclab/envs/manager_based_env.py","why":"理解 env 如何组织场景与 manager，以及 step/reset 的主循环"},{"path":"source/isaaclab/isaaclab/envs/manager_based_rl_env.py","why":"看 RL 版如何补上 reward/termination/reset 与 Gymnasium 接口"},{"path":"source/isaaclab/isaaclab/managers/manager_base.py","why":"理解 MDP 分解机制与 term 的统一调度方式"},{"path":"source/isaaclab_tasks/isaaclab_tasks/contrib/lift/lift_env_cfg.py","why":"一个完整 manager-based 任务配置范例，把抽象落到具体 term"},{"path":"source/isaaclab_tasks/isaaclab_tasks/contrib/lift/config/franka/__init__.py","why":"看清 gym.register 如何把任务名、env 类与 cfg 入口绑定"},{"path":"source/isaaclab_rl/isaaclab_rl/entrypoints/dispatch.py","why":"理解统一入口如何按 --rl_library 分发到各 RL 后端"},{"path":"source/isaaclab_rl/isaaclab_rl/entrypoints/backends/train_rsl_rl.py","why":"完整的训练调用链：解析→启动仿真→建环境→包装→runner.learn"}],"extension_points":["想加新环境：写一个继承 ManagerBasedRLEnvCfg 或 DirectRLEnvCfg 的 @configclass，在包内 __init__.py 用 gym.register(entry_point='isaaclab.envs:ManagerBasedRLEnv', kwargs={'env_cfg_entry_point': ...}) 注册","想加新机器人：在 source/isaaclab_assets/robots 下新增 ArticulationCfg，并在任务 cfg 的 scene.robot 里 replace 使用","想加新 MDP 项：在 source/isaaclab/isaaclab/envs/mdp 下写函数，再在任务 cfg 里用 RewTerm/ObsTerm/EventTerm/TerminationTermCfg 引用","想加新 manager：继承 source/isaaclab/isaaclab/managers/manager_base.py 的 ManagerBase，并实现 active_terms 等抽象方法","想换物理后端：在 source/isaaclab_physx 或 source/isaaclab_newton 实现对应 physics manager，通过 physics= 选择器切换","想接新 RL 库：在 source/isaaclab_rl/isaaclab_rl/entrypoints/backends 增加 train/play 后端模块，并在 dispatch._BACKEND_MODULES 注册"],"learning_path":["第1步：读 RE graph/func/__init__.py"]}],"data_flow":["第1步：用户构造 StateGraph(state_schema)，用 add_node/add_edge/add_conditional_edges 声明节点与边","第2步：调用 compile()，校验图并把 state/input/output schema 解析为 channels，生成 CompiledStateGraph 即 Pregel 实例","第3步：attach_node/attach_edge/attach_branch 把节点、边、分支装配为 PregelNode 与触发关系","第4步：调用 invoke/stream，传入 input 与 config，config 中携带 thread_id 用于检查点寻址","第5步：Pregel 循环初始化：从 BaseCheckpointSaver.get_tuple 读取该 thread 的检查点恢复各 channel，无则用 empty_checkpoint","第6步：把 input 写入 START channel，prepare_next_tasks 依据 channel 触发条件生成 superstep 任务，来源分 PULL 边触发与 PUSH Send","第7步：superstep 内并发执行各 PregelNode 的用户函数，节点从 channel 读输入、产出 writes","第8步：apply_writes 将 writes 按各 channel 的 reduce 语义合并，更新 channel 版本号","第9步：未到 END 时 create_checkpoint 生成快照并 checkpointer.put 持久化，put_writes 记录中间写入","第10步：达到 END 后按 output_channels 聚合最终状态返回给调用方"],"entry_points":[{"path":"libs/langgraph/langgraph/graph/state.py:compile","what":"把用户构建的 StateGraph 编译为可执行的 CompiledStateGraph，是构建到执行的枢纽"},{"path":"libs/langgraph/langgraph/pregel/main.py:459","what":"Pregel 类定义，实现 invoke/stream/stream_events/get_state 等对外执行接口"},{"path":"libs/langgraph/langgraph/pregel/main.py:stream","what":"核心流式执行入口，驱动整个 superstep 循环"},{"path":"libs/langgraph/langgraph/func/__init__.py","what":"函数式 API 装饰器入口，用 @entrypoint/@task 建图"},{"path":"libs/prebuilt/langgraph/prebuilt/chat_agent_executor.py","what":"预置 ReAct 风格 Agent 构造器，最常见的上手入口"}],"key_files":[{"path":"README.md","why":"先建立定位认知：低层编排框架，核心是 durable execution / HITL / memory"},{"path":"libs/langgraph/langgraph/graph/state.py","why":"StateGraph 与 compile() 所在，理解 DSL 如何编译成执行引擎"},{"path":"libs/langgraph/langgraph/pregel/main.py","why":"Pregel 执行引擎主体，看 invoke/stream 如何驱动循环与检查点"},{"path":"libs/langgraph/langgraph/pregel/_algo.py","why":"superstep 调度核心：prepare_next_tasks 与 apply_writes 决定任务如何产生与写回"},{"path":"libs/langgraph/langgraph/pregel/_loop.py","why":"执行循环与检查点保存/恢复逻辑集中地"},{"path":"libs/langgraph/langgraph/channels/base.py","why":"理解状态如何存储与 reduce 的关键抽象，含 get/update/checkpoint 契约"} /* ================= 路由 ================= */
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(!h) return {v:'home'};
  const p = h.split('/');
  if(p.length===1) return {v:'domain', d:p[0]};
  if(p.length===2) return {v:'branch', d:p[0], b:+p[1]};
  return {v:'project', d:p[0], b:+p[1], r:repoBySlug[p.slice(2).join('/')]};
}
function go(h){ location.hash = h; }

/* ================= 侧栏树 ================= */
function renderTree(){
  const cur = route();
  let html = `<div class="trow ${cur.v==='home'?'on':''}" onclick="go('')">
      <span class="tw">›</span><span class="tl">总览</span></div>`;
  for(const [dk, dv] of Object.entries(DOMAINS)){
    const pal = PAL[dk];
    const projs = PROJECTS.filter(p => p.domains.includes(dk));
    const open = cur.d === dk;
    html += `<div class="tnode ${open?'open':''}" data-d="${dk}">
      <div class="trow ${cur.v==='domain'&&cur.d===dk?'on':''}" onclick="go('/${dk}')">
        <span class="tw">›</span><span class="dot" style="background:${pal.c}"></span>
        <span class="tl">${pal.label}</span><span class="tc">${projs.length}</span></div>
      <div class="tkids">`;
    dv.branches.forEach((br, i) => {
      const bp = projs.filter(p => p.branches.includes(br));
      if(!bp.length) return;
      const bOpen = cur.d===dk && cur.b===i;
      html += `<div class="tnode ${bOpen?'open':''}">
        <div class="trow ${cur.v==='branch'&&cur.d===dk&&cur.b===i?'on':''}" onclick="go('/${dk}/${i}')">
          <span class="tw">›</span><span class="tl" title="${esc(br)}">${esc(br)}</span>
          <span class="tc">${bp.length}</span></div>
        <div class="tkids">`;
      bp.sort((a,b)=>starNum(b.star)-starNum(a.star)).forEach(p => {
        const on = cur.v==='project' && cur.r===p.repo;
        html += `<div class="trow tproj ${on?'on':''}" onclick="go('/${dk}/${i}/${slug(p.repo)}')">
          <span class="tw"></span>
          <span class="tl" title="${esc(p.name)}">${esc(p.name)}<span class="st">${esc(p.star||'')}</span>${
            ARCH[p.repo]?'<span class="archflag" title="已有语义架构分析">◆</span>':''}</span></div>`;
      });
      html += `</div></div>`;
    });
    html += `</div></div>`;
  }
  document.getElementById('tree').innerHTML = html;
  const on = document.querySelector('#tree .trow.on');
  if(on) on.scrollIntoView({block:'nearest'});
}

function bars(items, cls, unit){
  if(!items || !items.length) return '<div style="font-size:11.5px;color:var(--ink3)">未检测到</div>';
  const max = Math.max(...items.map(i=>i.v)) || 1;
  return '<div class="bars">' + items.map(i =>
    `<div class="row"><span class="lb" title="${esc(i.n)}">${esc(i.n)}</span>
      <span class="track"><span class="fill ${cls}" style="width:${Math.max(2,(i.v/max)*100)}%"></span></span>
      <span class="vl">${unit==='loc'?fmt(i.v)+' 行':fmt(i.v)}</span></div>`).join('') + '</div>';
}
function crumbs(items){
  return '<div class="crumbs">' + items.map((it,i) =>
    i===items.length-1 ? `<span>${esc(it.t)}</span>`
      : `<a onclick="go('${it.h}')">${esc(it.t)}</a><span>›</span>`).join('') + '</div>';
}

/* ================= 视图：总览 ================= */
function viewHome(){
  const loc = PROJECTS.reduce((a,p)=>a+(p.loc||0),0);
  const files = PROJECTS.reduce((a,p)=>a+(p.file_count||0),0);
  const archN = Object.keys(ARCH).length;
  let html = crumbs([{t:'总览', h:''}]);
  html += `<h1 class="vt">项目全景</h1><div class="vs">${PROJECTS.length} 个已克隆并完成结构分析的开源项目${
    archN?` · 其中 ${archN} 个已完成语义级架构分析`:''}</div>`;
  html += `<div class="kpi">
    <div><b>${PROJECTS.length}</b><span>个项目</span></div>
    <div><b>${fmt(loc)}</b><span>行代码</span></div>
    <div><b>${fmt(files)}</b><span>个文件</span></div>
    <div><b>${archN}</b><span>份语义架构</span></div>
  </div>`;

  html += `<div class="panel"><h2>项目全景图</h2><div class="ph">矩形面积正比于代码行数 · 点击进入项目详情</div>`;
  const ps = PROJECTS.slice().sort((a,b)=>(b.loc||0)-(a.loc||0));
  const total = ps.reduce((a,p)=>a+(p.loc||0),0)||1;
  const ROWS = 6, target = total/ROWS;
  const rows = []; let cur = [], curSum = 0;
  for(const p of ps){
    cur.push(p); curSum += (p.loc||0);
    if(curSum >= target && rows.length < ROWS-1){ rows.push({items:cur,sum:curSum}); cur=[]; curSum=0; }
  }
  if(cur.length) rows.push({items:cur, sum:curSum});
  html += '<div class="ovrows">' + rows.map(r => '<div class="ovrow">' + r.items.map(p=>{
    const pal = PAL[p.domains[0]] || PAL.agent;
    const w = ((p.loc||1)/r.sum*100).toFixed(2);
    const dk = p.domains[0];
    const bi = DOMAINS[dk].branches.findIndex(b => p.branches.includes(b));
    return `<div class="ovtile" style="flex:0 0 ${w}%;background:${pal.bg};color:${pal.c}"
      onclick="go('/${dk}/${bi}/${slug(p.repo)}')" title="${esc(p.name)} · ${fmt(p.loc)} 行">
      <span class="n">${esc(p.name)}</span><span class="v">${fmt(p.loc)}</span></div>`;
  }).join('') + '</div>').join('') + '</div></div>';

  html += `<div class="grid">`;
  for(const [dk, dv] of Object.entries(DOMAINS)){
    const pal = PAL[dk];
    const projs = PROJECTS.filter(p => p.domains.includes(dk));
    const dloc = projs.reduce((a,p)=>a+(p.loc||0),0);
    const darch = projs.filter(p=>ARCH[p.repo]).length;
    html += `<div class="dcard" onclick="go('/${dk}')">
      <div class="n"><span class="dot" style="background:${pal.c}"></span>${pal.label}</div>
      <div class="m">${dv.branches.length} 个分支 · ${projs.length} 个项目<br>${fmt(dloc)} 行代码${
        darch?` · ${darch} 份语义架构`:''}</div>
      <div class="bar">${dv.branches.map((br,i)=>{
        const n = projs.filter(p=>p.branches.includes(br)).length;
        return `<i style="width:${(n/projs.length*100).toFixed(1)}%;background:${pal.c};opacity:${0.35+i*0.06}"></i>`;
      }).join('')}</div></div>`;
  }
  html += `</div>`;
  document.getElementById('view').innerHTML = html;
}

/* ================= 视图：板块 ================= */
function viewDomain(dk){
  const dv = DOMAINS[dk]; if(!dv) return viewHome();
  const pal = PAL[dk];
  const projs = PROJECTS.filter(p => p.domains.includes(dk));
  let html = crumbs([{t:'总览',h:''},{t:pal.label,h:'/'+dk}]);
  html += `<h1 class="vt">${pal.label}</h1>
    <div class="vs">${dv.branches.length} 个分支 · ${projs.length} 个项目 · ${fmt(projs.reduce((a,p)=>a+(p.loc||0),0))} 行代码</div>`;
  html += `<div class="grid">`;
  dv.branches.forEach((br, i) => {
    const bp = projs.filter(p => p.branches.includes(br));
    if(!bp.length) return;
    const loc = bp.reduce((a,p)=>a+(p.loc||0),0);
    const top = bp.slice().sort((a,b)=>starNum(b.star)-starNum(a.star))[0];
    const darch = bp.filter(p=>ARCH[p.repo]).length;
    html += `<div class="dcard" onclick="go('/${dk}/${i}')">
      <div class="n">${esc(br)}</div>
      <div class="m">${bp.length} 个项目 · ${fmt(loc)} 行<br>代表：${esc(top.name)} ${esc(top.star||'')}${
        darch?`<br>◆ ${darch} 份语义架构`:''}</div></div>`;
  });
  html += `</div>`;
  document.getElementById('view').innerHTML = html;
}

/* ================= 视图：分支 ================= */
function viewBranch(dk, bi){
  const dv = DOMAINS[dk]; if(!dv) return viewHome();
  const br = dv.branches[bi]; if(br===undefined) return viewDomain(dk);
  const pal = PAL[dk];
  const projs = PROJECTS.filter(p => p.domains.includes(dk) && p.branches.includes(br))
    .sort((a,b)=>starNum(b.star)-starNum(a.star));
  let html = crumbs([{t:'总览',h:''},{t:pal.label,h:'/'+dk},{t:br,h:`/${dk}/${bi}`}]);
  html += `<h1 class="vt">${esc(br)}</h1>
    <div class="vs">${projs.length} 个项目 · ${fmt(projs.reduce((a,p)=>a+(p.loc||0),0))} 行代码 · 按 star 排序</div>`;
  html += `<table class="pl"><thead><tr>
    <th style="width:26%">项目</th><th style="width:22%">仓库</th><th>说明</th>
    <th style="width:82px;text-align:right">代码行</th><th style="width:60px;text-align:right">star</th>
    <th style="width:76px">架构</th></tr></thead><tbody>`;
  for(const p of projs){
    const desc = ((p.readme&&p.readme.summary) || p.description || '').slice(0, 70);
    html += `<tr onclick="go('/${dk}/${bi}/${slug(p.repo)}')">
      <td><span class="pname">${esc(p.name)}</span></td>
      <td><span class="prepo">${esc(p.repo)}</span></td>
      <td style="color:var(--ink2)">${esc(desc)}${desc.length>=70?'…':''}</td>
      <td class="num">${fmt(p.loc)}</td>
      <td class="num">${esc(p.star||'')}</td>
      <td>${ARCH[p.repo]?'<span class="chip arch">◆ 已分析</span>':'<span style="color:var(--ink4);font-size:11px">—</span>'}</td>
    </tr>`;
  }
  html += `</tbody></table>`;
  document.getElementById('view').innerHTML = html;
}

/* ================= 视图：项目详情 ================= */
function viewProject(dk, bi, repo){
  const p = byRepo[repo]; if(!p) return viewHome();
  const dv = DOMAINS[dk], pal = PAL[dk];
  const br = dv ? dv.branches[bi] : p.branches[0];
  const a = ARCH[repo];
  const pri = PRIO[repo];

  let html = crumbs([{t:'总览',h:''},{t:pal.label,h:'/'+dk},
    {t:br||'—',h:`/${dk}/${bi}`},{t:p.name,h:''}]);
  html += `<div class="dhead"><div>
      <h1>${esc(p.name)}</h1>
      <div class="sub">${esc(p.repo)} · ${esc(p.path||'')}</div></div></div>`;
  html += `<div class="dchips">
    ${p.star?`<span class="chip star">★ ${esc(p.star)}</span>`:''}
    ${p.language?`<span class="chip lang">${esc(p.language)}</span>`:''}
    ${p.license&&p.license!=='无'?`<span class="chip lic">${esc(p.license)}</span>`:''}
    ${a?`<span class="chip arch">◆ 语义架构已分析</span>`:''}
    ${pri?`<span class="chip pri" title="任务A 语义架构图优先级">架构优先级 ${pri.arch_score}</span>`:''}
    ${pri?`<span class="chip pri" title="任务B 网页工具改造适用性">工具改造 ${pri.tool_score}</span>`:''}
    <span class="chip">${fmt(p.file_count)} 文件 · ${fmt(p.loc)} 行</span>
  </div>`;

  if(a){
    html += `<div class="panel" style="border-left:3px solid ${pal.c}">
      <h2>语义架构</h2><div class="ph">由子 agent 深读源码产出 · 置信度 ${esc(a.confidence||'—')} · 难度 ${esc(a.difficulty||'—')}</div>
      <p class="lead">${esc(a.one_liner||'')}</p>
      <div class="note">${esc(a.problem||'')}</div>`;
    if(a.diagram_mermaid){
      html += `<div class="mermaid-wrap"><pre class="mermaid">${esc(a.diagram_mermaid)}</pre></div>
        <details class="src"><summary>查看 Mermaid 源码</summary><pre>${esc(a.diagram_mermaid)}</pre></details>`;
    }
    html += `</div>`;

    if((a.core_abstractions||[]).length){
      html += `<div class="panel"><h2>核心抽象</h2><div class="ph">读懂这几个类，就读懂了半个项目</div>
        <table class="tbl"><thead><tr><th style="width:150px">抽象</th><th>职责</th><th style="width:38%">定义位置</th></tr></thead><tbody>`;
      for(const c of a.core_abstractions)
        html += `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.role)}</td><td><code>${esc(c.file)}</code></td></tr>`;
      html += `</tbody></table></div>`;
    }
    if((a.layers||[]).length){
      html += `<div class="panel"><h2>分层结构</h2><div class="ph">自顶向下的职责划分</div>
        <table class="tbl"><thead><tr><th style="width:150px">层</th><th>职责</th><th style="width:34%">主要模块</th></tr></thead><tbody>`;
      for(const l of a.layers)
        html += `<tr><td><b>${esc(l.name)}</b></td><td>${esc(l.responsibility)}</td>
          <td>${(l.modules||[]).map(m=>`<code>${esc(m)}</code>`).join(' ')}</td></tr>`;
      html += `</tbody></table></div>`;
    }
    if((a.data_flow||[]).length){
      html += `<div class="panel"><h2>数据流</h2><div class="ph">从输入到输出的完整链路</div><ol class="flow">`;
      for(const s of a.data_flow) html += `<li>${esc(s)}</li>`;
      html += `</ol></div>`;
    }
    const two = [];
    if((a.key_files||[]).length){
      two.push(`<div class="panel"><h2>建议阅读顺序</h2><div class="ph">按这个顺序读，不要从入口直接跳</div><ol class="kf">` +
        a.key_files.map(k=>`<li><code>${esc(k.path)}</code><br>${esc(k.why)}</li>`).join('') + `</ol></div>`);
    }
    if((a.learning_path||[]).length || (a.extension_points||[]).length){
      let s = `<div class="panel"><h2>学习路径与扩展点</h2>`;
      if((a.learning_path||[]).length)
        s += `<div class="ph">建议学习顺序</div><ol class="flow">` +
             a.learning_path.map(x=>`<li>${esc(x)}</li>`).join('') + `</ol>`;
      if((a.extension_points||[]).length)
        s += `<div class="ph" style="margin-top:14px">想扩展时改哪里</div><ul class="pl2">` +
             a.extension_points.map(x=>`<li>${esc(x)}</li>`).join('') + `</ul>`;
      two.push(s + `</div>`);
    }
    if(two.length) html += `<div class="cols">${two.join('')}</div>`;

    if((a.surprises||[]).length){
      html += `<div class="panel"><h2>容易踩的坑</h2><div class="ph">反直觉的设计，读之前先知道</div>`;
      for(const s of a.surprises) html += `<div class="note">${esc(s)}</div>`;
      html += `</div>`;
    }
  } else {
    html += `<div class="panel"><h2>语义架构</h2><div class="ph">尚未分析</div>
      <div class="note">该项目还没有做语义级架构分析（需人工深读代码）。当前展示的是自动扫描出的结构级信息。
      优先级评分：架构优先级 <b>${pri?pri.arch_score:'—'}</b>。</div></div>`;
  }

  const desc = (p.readme&&p.readme.summary) || p.description || '';
  const feats = (p.readme&&p.readme.features)||[];
  if(desc || feats.length){
    html += `<div class="panel"><h2>功能全景</h2><div class="ph">来自 README 与仓库元数据</div>`;
    if(desc) html += `<p class="lead">${esc(desc)}</p>`;
    if(feats.length) html += `<div class="feats">${feats.slice(0,10).map(f=>`<i>${esc(f.slice(0,60))}</i>`).join('')}</div>`;
    html += `</div>`;
  }

  const langs = (p.languages||[]).filter(l=>l.loc>0).slice(0,7).map(l=>({n:l.name,v:l.loc}));
  const dirs = (p.top_dirs||[]).slice(0,8).map(d=>({n:d.name+'/', v:d.loc||d.files}));
  html += `<div class="cols">
    <div class="panel"><h2>模块架构</h2><div class="ph">顶层目录按代码行数</div>${bars(dirs,'g','loc')}</div>
    <div class="panel"><h2>技术栈</h2><div class="ph">按代码行数分布</div>${bars(langs,'','loc')}</div>
  </div>`;

  const cmds = p.run_commands||[], ents = p.entry_points||[];
  if(cmds.length || ents.length){
    html += `<div class="panel"><h2>运行流程</h2><div class="ph">点击命令可复制</div>`;
    for(const c of cmds.slice(0,4)) html += `<div class="cmd" data-cmd="${esc(c)}">${esc(c)}</div>`;
    if(ents.length) html += `<div class="feats" style="margin-top:9px">${
      ents.slice(0,8).map(e=>`<i>${esc(e.kind)}: ${esc(e.file)}</i>`).join('')}</div>`;
    html += `</div>`;
  }

  html += `<div class="panel"><h2>其他</h2><div class="ph">数据与出处</div>
    <table class="tbl"><tbody>
      <tr><td style="width:110px;color:var(--ink3)">GitHub</td><td><a href="https://github.com/${esc(p.repo)}" target="_blank">${esc(p.repo)} ↗</a></td></tr>
      <tr><td style="color:var(--ink3)">本地路径</td><td><code>${esc(p.path||'')}</code></td></tr>
      <tr><td style="color:var(--ink3)">最后推送</td><td>${esc(p.pushed_at||'—')}</td></tr>
      ${(p.topics||[]).length?`<tr><td style="color:var(--ink3)">Topics</td><td>${(p.topics||[]).map(t=>`<span class="chip">${esc(t)}</span>`).join(' ')}</td></tr>`:''}
    </tbody></table></div>`;

  document.getElementById('view').innerHTML = html;

  document.querySelectorAll('.cmd').forEach(el=>{
    el.onclick = ()=>{
      navigator.clipboard.writeText(el.dataset.cmd).then(()=>{
        const t = document.getElementById('toast');
        t.textContent = '已复制: ' + el.dataset.cmd.slice(0,44);
        t.classList.add('on'); setTimeout(()=>t.classList.remove('on'), 1400);
      }).catch(()=>{});
    };
  });
  if(mermaidReady){
    try{ mermaid.run({querySelector:'.mermaid'}); }catch(e){}
  }
}

/* ================= 搜索 ================= */
function runSearch(q){
  q = q.trim().toLowerCase();
  if(!q) return false;
  const hits = PROJECTS.filter(p =>
    (p.name||'').toLowerCase().includes(q) || (p.repo||'').toLowerCase().includes(q) ||
    ((p.description||'')+((p.readme&&p.readme.summary)||'')).toLowerCase().includes(q));
  let html = crumbs([{t:'搜索结果',h:''}]);
  html += `<h1 class="vt">搜索「${esc(q)}」</h1><div class="vs">命中 ${hits.length} 个项目</div>`;
  if(!hits.length){ html += `<div class="empty">没有匹配的项目</div>`; }
  else {
    html += `<table class="pl"><thead><tr><th style="width:24%">项目</th><th style="width:20%">仓库</th>
      <th>所属分支</th><th style="width:82px;text-align:right">代码行</th><th style="width:60px;text-align:right">star</th></tr></thead><tbody>`;
    for(const p of hits.sort((a,b)=>starNum(b.star)-starNum(a.star))){
      const dk = p.domains[0], bi = DOMAINS[dk].branches.findIndex(b=>p.branches.includes(b));
      html += `<tr onclick="go('/${dk}/${bi}/${slug(p.repo)}')">
        <td><span class="pname">${esc(p.name)}</span>${ARCH[p.repo]?' <span class="chip arch">◆</span>':''}</td>
        <td><span class="prepo">${esc(p.repo)}</span></td>
        <td style="color:var(--ink2);font-size:12px">${esc(p.branches.join(' / '))}</td>
        <td class="num">${fmt(p.loc)}</td><td class="num">${esc(p.star||'')}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  document.getElementById('view').innerHTML = html;
  return true;
}

/* ================= 渲染 ================= */
function render(){
  const q = document.getElementById('q').value;
  renderTree();
  const cur = route();
  if(q.trim()){ runSearch(q); }
  else if(cur.v==='home') viewHome();
  else if(cur.v==='domain') viewDomain(cur.d);
  else if(cur.v==='branch') viewBranch(cur.d, cur.b);
  else if(cur.v==='project') viewProject(cur.d, cur.b, cur.r);
  else viewHome();
  document.getElementById('view').scrollTop = 0;
}

function renderStats(){
  const loc = PROJECTS.reduce((a,p)=>a+(p.loc||0),0);
  const archN = Object.keys(ARCH).length;
  document.getElementById('hstats').innerHTML =
    `<span><b>${PROJECTS.length}</b> 项目</span>
     <span><b>${fmt(loc)}</b> 行</span>
     <span><b>${archN}</b> 份语义架构</span>
     <span>${META.date||''}</span>`;
}

window.addEventListener('hashchange', render);
document.getElementById('q').addEventListener('input', render);
renderStats(); render();
</script>
</body>
