<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>项目浏览器 · 具身智能 × AI Agent</title>
<style>
  :root{
    --bg:#F7F7F5; --panel:#FFFFFF; --line:#E4E2DC; --line2:#EFEDE7;
    --ink:#2C2C2A; --ink2:#5F5E5A; --ink3:#8B8A85; --ink4:#A9A8A3;
    --emb:#0F6E56; --emb-bg:#E1F5EE; --emb-soft:#F2FBF8;
    --agt:#185FA5; --agt-bg:#E6F1FB; --agt-soft:#F3F9FE;
    --crs:#854F0B; --crs-bg:#FAEEDA; --crs-soft:#FDF8EE;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-size:13.5px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  button{font:inherit;cursor:pointer}

  /* ---------- 顶栏 ---------- */
  header{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:16px;padding:10px 18px;flex-wrap:wrap}
  .brand{font-size:14.5px;font-weight:500;white-space:nowrap}
  .brand span{color:var(--ink3);font-weight:400;font-size:12px;margin-left:7px}
  .search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;
    padding:5px 11px;background:var(--panel);flex:0 1 300px}
  .search input{border:none;outline:none;font:inherit;font-size:12.5px;width:100%;background:transparent;color:var(--ink)}
  .search input::placeholder{color:var(--ink4)}
  .hstats{margin-left:auto;display:flex;gap:18px;font-size:11.5px;color:var(--ink3);flex-wrap:wrap}
  .hstats b{color:var(--ink);font-weight:500}

  /* ---------- 布局 ---------- */
  .layout{display:grid;grid-template-columns:286px 1fr;align-items:start;height:calc(100vh - 53px)}
  aside{height:100%;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line);padding:12px 8px 40px}
  main{height:100%;overflow-y:auto;padding:20px 26px 80px}
  @media (max-width:900px){ .layout{grid-template-columns:1fr} aside{display:none} }

  /* ---------- 侧栏树 ---------- */
  .tnode{user-select:none}
  .trow{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;cursor:pointer;line-height:1.35}
  .trow:hover{background:#F4F3EE}
  .trow.on{background:#EDEBE4}
  .trow.on .tl{font-weight:500}
  .tw{width:13px;flex:0 0 13px;color:var(--ink4);font-size:9px;text-align:center;transition:transform .13s}
  .tnode.open > .trow .tw{transform:rotate(90deg)}
  .tl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
  .tc{font-size:10.5px;color:var(--ink4);font-family:var(--mono);flex:0 0 auto}
  .tkids{display:none;margin-left:11px;border-left:1px solid var(--line2);padding-left:3px}
  .tnode.open > .tkids{display:block}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
  .tproj .tl{font-size:12px;color:var(--ink2)}
  .tproj .tl .st{color:var(--ink4);font-size:10px;margin-left:4px;font-family:var(--mono)}
  .archflag{color:#0F6E56;font-size:9px;margin-left:3px}

  /* ---------- 内容 ---------- */
  .crumbs{font-size:12px;color:var(--ink3);margin-bottom:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .crumbs a{cursor:pointer;border-bottom:1px dotted var(--line)}
  .crumbs a:hover{color:var(--ink)}
  h1.vt{font-size:17px;font-weight:500;margin:0 0 4px}
  .vs{font-size:12.5px;color:var(--ink3);margin-bottom:18px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 14px;cursor:pointer}
  .dcard:hover{border-color:#C9C7C0}
  .dcard .n{font-size:13.5px;font-weight:500;margin-bottom:5px;display:flex;align-items:center;gap:7px}
  .dcard .m{font-size:11.5px;color:var(--ink3);line-height:1.6}
  .dcard .bar{height:4px;background:#F1EFE8;border-radius:3px;margin-top:9px;overflow:hidden;display:flex}
  .dcard .bar i{height:100%;display:block}

  /* 紧凑项目列表 */
  table.pl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  table.pl th{text-align:left;font-size:11px;font-weight:400;color:var(--ink3);padding:9px 12px;
    background:#FAFAF8;border-bottom:1px solid var(--line)}
  table.pl td{padding:9px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:middle}
  table.pl tr:last-child td{border-bottom:none}
  table.pl tbody tr{cursor:pointer}
  table.pl tbody tr:hover{background:#FAFAF8}
  .pname{font-weight:500}
  .prepo{font-size:11px;color:var(--ink3);font-family:var(--mono)}
  .num{font-family:var(--mono);font-size:11.5px;color:var(--ink2);text-align:right;white-space:nowrap}
  .chip{display:inline-block;font-size:10.5px;padding:1.5px 7px;border-radius:20px;background:#F1EFE8;color:var(--ink2);white-space:nowrap}
  .chip.star{background:#FAEEDA;color:#854F0B;font-weight:500}
  .chip.lic{background:#EAF3DE;color:#3B6D11}
  .chip.lang{background:#E6F1FB;color:#185FA5}
  .chip.arch{background:#E1F5EE;color:#0F6E56;font-weight:500}
  .chip.pri{background:#EEEDFE;color:#534AB7;font-weight:500}

  /* ---------- 项目详情 ---------- */
  .dhead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .dhead h1{font-size:19px;font-weight:500;margin:0}
  .dhead .sub{font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:3px}
  .dchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 17px;margin-bottom:13px}
  .panel > h2{font-size:13.5px;font-weight:500;margin:0 0 3px}
  .panel > .ph{font-size:11.5px;color:var(--ink3);margin-bottom:12px}
  .lead{font-size:13.5px;line-height:1.72;color:var(--ink);margin:0 0 10px}
  .feats{display:flex;flex-wrap:wrap;gap:5px}
  .feats i{font-style:normal;font-size:11px;background:#FAFAF8;border:1px solid var(--line2);
    border-radius:6px;padding:2px 8px;color:var(--ink2)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  @media (max-width:1080px){ .cols{grid-template-columns:1fr} }
  .bars{display:flex;flex-direction:column;gap:4px}
  .row{display:grid;grid-template-columns:124px 1fr 84px;align-items:center;gap:9px;font-size:11.5px}
  .row .lb{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
  .track{height:9px;background:#F1EFE8;border-radius:5px;overflow:hidden}
  .fill{height:100%;border-radius:5px;background:#B5D4F4}
  .fill.g{background:#9FE1CB}
  .row .vl{text-align:right;color:var(--ink3);font-family:var(--mono);font-size:11px}
  .cmd{background:#FAFAF8;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;
    font-family:var(--mono);font-size:11.5px;color:var(--ink2);margin-bottom:5px;
    white-space:pre-wrap;word-break:break-all;cursor:pointer}
  .cmd:hover{border-color:#C9C7C0}
  ol.flow,ul.pl2{margin:0;padding-left:19px}
  ol.flow li,ul.pl2 li{margin-bottom:6px;line-height:1.65;font-size:12.5px}
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .tbl th{text-align:left;font-size:11px;font-weight:400;color:var(--ink3);padding:6px 10px 6px 0;border-bottom:1px solid var(--line2)}
  .tbl td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line2);vertical-align:top;line-height:1.6}
  .tbl tr:last-child td{border-bottom:none}
  .tbl code,.kf code,.cmd{font-family:var(--mono)}
  .tbl code{font-size:11px;background:#FAFAF8;padding:1px 5px;border-radius:4px;color:var(--ink2)}
  .kf{list-style:none;margin:0;padding:0;counter-reset:k}
  .kf li{counter-increment:k;position:relative;padding-left:26px;margin-bottom:9px;line-height:1.6;font-size:12.5px}
  .kf li::before{content:counter(k);position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;
    background:#E1F5EE;color:#0F6E56;font-size:10px;text-align:center;line-height:17px;font-weight:500}
  .kf code{font-size:11px;background:#FAFAF8;padding:1px 5px;border-radius:4px;color:var(--ink2)}
  .note{font-size:12.5px;line-height:1.7;color:var(--ink2);background:#FAFAF8;border-left:2px solid var(--line);
    padding:9px 12px;border-radius:0 7px 7px 0;margin-bottom:7px}
  .mermaid-wrap{overflow-x:auto;background:#FCFCFB;border:1px solid var(--line2);border-radius:9px;padding:12px}
  .mermaid-wrap svg{max-width:100%;height:auto}
  details.src{margin-top:9px}
  details.src summary{font-size:11.5px;color:var(--ink3);cursor:pointer}
  details.src pre{background:#FAFAF8;border:1px solid var(--line2);border-radius:8px;padding:10px;
    font-size:11px;font-family:var(--mono);overflow-x:auto;margin-top:7px;color:var(--ink2)}
  .kpi{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:18px}
  .kpi div b{display:block;font-size:19px;font-weight:500;line-height:1.25}
  .kpi div span{font-size:11.5px;color:var(--ink3)}
  .ovrows{display:flex;flex-direction:column;gap:3px;margin-top:12px}
  .ovrow{display:flex;gap:3px;height:46px}
  .ovtile{border-radius:6px;padding:5px 7px;overflow:hidden;cursor:pointer;display:flex;
    flex-direction:column;justify-content:space-between;min-width:0}
  .ovtile:hover{filter:brightness(.94)}
  .ovtile .n{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ovtile .v{font-size:9.5px;opacity:.7;font-family:var(--mono);white-space:nowrap}
  .empty{padding:50px;text-align:center;color:var(--ink3)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2C2C2A;color:#fff;
    font-size:12.5px;padding:8px 16px;border-radius:9px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:60}
  .toast.on{opacity:1}
  .back{font-size:12.5px;color:var(--ink2);background:none;border:none;padding:0;margin-bottom:12px;
    border-bottom:1px dotted var(--line);cursor:pointer}
  .back:hover{color:var(--ink)}
</style>
</head>

</div>

e_baselines3/common/off_policy_algorithm.py","why":"离线算法的经验回放循环，与在线算法对照阅读"},{"path":"stable_baselines3/ppo/ppo.py","why":"最典型的在线算法，看 policy_aliases 声明与 train 更新逻辑"},{"path":"stable_baselines3/common/policies.py","why":"BasePolicy/ActorCriticPolicy，理解策略与算法的组合方式"},{"path":"stable_baselines3/common/callbacks.py","why":"回调机制的全部钩子，扩展训练过程必读"},{"path":"stable_baselines3/common/vec_env/base_vec_env.py","why":"VecEnv 抽象，理解环境如何被统一与向量化"},{"path":"stable_baselines3/common/buffers.py","why":"ReplayBuffer 与 RolloutBuffer，理解经验存储与采样"},{"path":"stable_baselines3/dqn/dqn.py","why":"典型离线算法，与 PPO 对照看两类范式差异"}],"extension_points":["想加新算法：新建 stable_baselines3/<algo>/ 目录，继承 OnPolicyAlgorithm 或 OffPolicyAlgorithm，实现 _setup_model/train/learn，并声明 policy_aliases 字典把策略名映射到策略类","想加新策略：继承 stable_baselines3/common/policies.py 的 BasePolicy 或 ActorCriticPolicy，实现 _predict、forward、evaluate_actions，并在算法的 policy_aliases 里登记","想加新特征提取器：继承 BaseFeaturesExtractor，通过 policy_kwargs 的 features_extractor_class 传入","想加新回调：继承 stable_baselines3/common/callbacks.py 的 BaseCallback，重写 _on_step / _on_rollout_end 等钩子，learn 时用 callback= 传入","想加新环境包装器或向量化后端：继承 VecEnv 或 VecEnvWrapper，实现 reset/step_async/step_wait","想加新经验缓冲：继承 BaseBuffer 或 ReplayBuffer，在算法的 replay_buffer_class / rollout_buffer_class 指定","想加新的日志后端：继承 stable_baselines3/common/logger.py 的 KVWriter 并注册"],"learning_path":["第1步：读 README.md 与官方文档的 RL 入门指南，建立算法与接口的总体印象","第2步：读 stable_baselines3/common/base_class.py 的 BaseAlgorithm，掌握统一接口与 _setup_learn","第3步：读 stable_baselines3/common/on_policy_algorithm.py 与 off_policy_algorithm.py，理解在线/离线两种学习循环","第4步：读 stable_baselines3/ppo/ppo.py，看一个具体算法如何声明策略别名并实现 train","第5步：读 stable_baselines3/common/policies.py，理解策略与算法如何组合、forward 与 _predict 的分工","第6步：读 stable_baselines3/common/callbacks.py，掌握回调扩展机制","第7步：读 stable_baselines3/common/vec_env/base_vec_env.py，理解环境的统一与向量化"],"diagram_mermaid":"graph TD\n  USER[用户代码 PPO 加 env] --> INIT[BaseAlgorithm 初始化]\n  INIT --> RESOLVE[按 policy_aliases 解析策略类]\n  INIT --> WRAP[_wrap_env 包装成 VecEnv]\n  USER --> LEARN[learn 训练循环]\n  LEARN --> SETUP[_setup_learn 初始化日志与回调]\n  SETUP --> MODEL[_setup_model 实例化 policy 与 buffer]\n  MODEL --> COLLECT[collect_rollouts 采样经验]\n  COLLECT --> POLICY[policy 前向采样动作]\n  POLICY --> STEP[env.step 执行动作]\n  STEP --> CB[callback.on_step 触发回调]\n  STEP --> BUFFER[经验存入 rollout buffer]\n  BUFFER --> ADV[计算回报与优势]\n  ADV --> TRAIN[train 梯度更新 policy]\n  TRAIN --> COLLECT\n  LEARN --> SAVE[save 存成 zip 模型]\n  LEARN --> PREDICT[predict 推理动作]","surprises":["算法与策略是解耦的两条线：算法只管学习循环，策略只管网络与动作采样，二者通过 policy_aliases 字典按字符串名绑定","所有算法共用同一套 learn/predict/save/load 接口，即使单个环境也会被包成 DummyVecEnv，所以内部永远是批量接口","回调通过 update_locals(locals()) 动态注入训练循环的局部变量，回调里能直接读到当前步的 obs、reward 等内部状态","策略的 forward 与 _predict 分工不同：forward 训练时返回动作/价值/对数概率，_predict 推理时只返回动作，混用会出错","模型保存成 zip，policy、optimizer、replay_buffer 一起打包，load 依赖递归 getattr/setattr 恢复，改动属性名可能破坏兼容"],"confidence":"高"},"Farama-Foundation/Gymnasium":{"repo":"Farama-Foundation/Gymnasium","name":"Gymnasium","one_liner":"强化学习环境与算法之间的标准 Python 接口库","problem":"用统一 API 描述环境与智能体的交互，让不同 RL 算法与不同环境可以互相替换并公平比较，同时提供一批标准环境和可复用的包装器。","difficulty":"入门","core_abstractions":[{"name":"Env","role":"最核心接口，定义 step/reset/render/close 与 action_space/observation_space，所有环境都必须实现它","file":"gymnasium/core.py"},{"name":"Wrapper","role":"装饰器基类，以对象组合方式模块化改造环境行为而不改原代码，是全部包装器的父类","file":"gymnasium/core.py"},{"name":"ObservationWrapper / RewardWrapper / ActionWrapper","role":"针对观测、奖励、动作三类数据的专项包装器基类，分别重写 observation/reward/action 变换","file":"gymnasium/core.py"},{"name":"EnvSpec + register/make","role":"环境注册表与工厂：register 把 id 映射到 entry_point 与元信息，make 据此动态构造并自动装配包装器","file":"gymnasium/envs/registration.py"},{"name":"Space","role":"动作空间与观测空间的抽象，提供 sample/contains 等，是接口契约的数值载体","file":"gymnasium/spaces/space.py"},{"name":"VectorEnv / SyncVectorEnv / AsyncVectorEnv","role":"批量环境抽象与同步/异步两种实现，把单环境接口扩展成对多环境的批量 step/reset","file":"gymnasium/vector/vector_env.py"},{"name":"PassiveEnvChecker / OrderEnforcing / TimeLimit / Autoreset","role":"make 时自动施加的标准包装器，分别做规范校验、调用顺序检查、时间截断与 episode 自动重置","file":"gymnasium/wrappers/common.py"},{"name":"env_checker","role":"独立的环境规范校验器，用确定性、seed、返回类型等检查帮助用户写出合规的自定义环境","file":"gymnasium/utils/env_checker.py"}],"layers":[{"name":"核心接口层","responsibility":"定义环境与包装器的最小契约，是整个库不依赖具体环境的稳定内核","modules":["gymnasium/core.py"],"files":["gymnasium/core.py"]},{"name":"空间定义层","responsibility":"定义 Box/Discrete/Dict/MultiDiscrete 等动作与观测空间及其采样与合法性判断","modules":["gymnasium/spaces"],"files":["gymnasium/spaces/space.py","gymnasium/spaces/box.py"]},{"name":"注册与工厂层","responsibility":"维护全局 registry，实现 register/spec/make/make_vec 与 EnvSpec 序列化","modules":["gymnasium/envs/registration.py"],"files":["gymnasium/envs/registration.py"]},{"name":"内置环境层","responsibility":"提供 classic control、box2d、toy text、mujoco、tabular、phys2d 等标准环境并在导入时自动注册","modules":["gymnasium/envs"],"files":["gymnasium/envs/__init__.py","gymnasium/envs/classic_control/cartpole.py"]},{"name":"包装器层","responsibility":"提供通用、观测/动作/奖励变换、有状态、渲染与 Atari 预处理等大量可复用包装器","modules":["gymnasium/wrappers"],"files":["gymnasium/wrappers/common.py","gymnasium/wrappers/transform_observation.py"]},{"name":"向量化层","responsibility":"把单环境接口扩展为批量环境接口，提供同步与基于多进程的异步实现","modules":["gymnasium/vector"],"files":["gymnasium/vector/sync_vector_env.py","gymnasium/vector/async_vector_env.py"]},{"name":"工具与校验层","responsibility":"提供环境规范校验、step API 兼容转换、回放、录制、随机种子等辅助能力","modules":["gymnasium/utils"],"files":["gymnasium/utils/env_checker.py","gymnasium/utils/play.py","gymnasium/utils/step_api_compatibility.py"]}],"data_flow":["第1步：import gymnasium 时，gymnasium/envs/__init__.py 通过大量 register 调用把内置环境写入全局 registry","第2步：用户调用 gym.make('CartPole-v1')，进入 envs/registration.py 的 make 函数","第3步：_find_spec 按 id 从 registry 取出 EnvSpec，其中含 entry_point、max_episode_steps、additional_wrappers","第4步：load_env_creator 动态导入 entry_point 字符串（如 classic_control.cartpole:CartPoleEnv）得到环境类","第5步：用合并后的 kwargs 调用 env_creator(**kwargs) 实例化底层环境，并校验它继承自 gymnasium.Env","第6步：把精简后的 EnvSpec 写回 env.unwrapped.spec，作为环境的元信息","第7步：按固定顺序套标准包装器：PassiveEnvChecker → OrderEnforcing → TimeLimit → additional_wrappers → 渲染相关","第8步：返回包装后的环境，用户调用 env.reset(seed=...) 得到 (observation, info)","第9步：循环调用 env.step(action) 得到 (observation, reward, terminated, truncated, info)","第10步：当 terminated 或 truncated 为真时调用 env.reset() 开始新 episode，全部结束后 env.close() 释放资源"],"entry_points":[{"path":"gymnasium.make / gymnasium.make_vec","what":"创建单环境或向量化环境的主入口"},{"path":"gymnasium.register","what":"注册自定义环境到 registry，供 make 使用"},{"path":"gymnasium.Env","what":"自定义环境时继承的基类，需实现 step/reset 等"},{"path":"gymnasium.Wrapper","what":"自定义包装器时继承的基类"},{"path":"gymnasium.utils.env_checker.check_env","what":"校验一个环境是否符合 Gymnasium API 规范"},{"path":"gymnasium.utils.play","what":"键盘交互式回放环境，便于调试"},{"path":"gymnasium.wrappers.RecordVideo","what":"录制环境视频"},{"path":"docs/introduction/create_custom_env.md","what":"官方自定义环境教程，含 gym.register 完整示例"}],"key_files":[{"path":"README.md","why":"先建立定位认知：它是接口标准而非算法库，并提供一批标准环境"},{"path":"gymnasium/core.py","why":"读 Env 与 Wrapper 的 step/reset 契约，这是整个生态的稳定接口"},{"path":"gymnasium/envs/registration.py","why":"理解 register/spec/make 如何把 id 变成自动装配好包装器的环境实例"},{"path":"gymnasium/__init__.py","why":"看清对外暴露的公共 API 与内置环境的自动注册时机"},{"path":"gymnasium/envs/classic_control/cartpole.py","why":"一个最小但完整的真实环境实现，对照接口理解 reset/step 写法"},{"path":"gymnasium/wrappers/common.py","why":"理解 TimeLimit/Autoreset/PassiveEnvChecker/RecordEpisodeStatistics 这些自动包装器"},{"path":"gymnasium/vector/vector_env.py","why":"理解批量环境接口与 AutoresetMode，向量化是训练提速的关键"},{"path":"gymnasium/utils/env_checker.py","why":"了解环境规范的具体检查项，写自定义环境前先看它"}],"extension_points":["想加新环境：继承 gymnasium.Env，实现 step/reset/render/close 并定义 action_space/observation_space，再用 gym.register(id=..., entry_point=...) 注册","想改已有环境行为：继承 gymnasium.Wrapper（或 Observation/Reward/ActionWrapper）并重写对应方法，用对象组合叠加","想加观测/奖励/动作变换：直接用 wrappers 里的 TransformObservation/TransformReward/ClipAction 等，或继承对应专项 Wrapper","想在注册时自动附加包装器：在 register 的 additional_wrappers 传入 WrapperSpec","想批量训练：用 gym.make_vec 或直接构造 SyncVectorEnv/AsyncVectorEnv，也可继承 VectorEnv","想加新空间类型：继承 gymnasium.spaces.Space 并实现 sample/contains","写完环境自检：调用 gymnasium.utils.env_checker.check_env 做合规校验"],"learning_path":["第1步：读 README 与 docs/introduction/basic_usage.md，跑通 make→reset→step→close 循环","第2步：读 core.py 的 Env，牢记 step 返回五元组、reset 返回二元组这两个契约","第3步：读 registration.py 的 register/make，理解注册表与包装器自动装配顺序","第4步：读 cartpole.py，把一个真实环境的实现与接口对应起来","第5步：读 wrappers/common.py，掌握 TimeLimit/Autoreset/RecordEpisodeStatistics 的用途","第6步：按 docs/introduction/create_custom_env.md 动手实现并注册一个自定义环境"],"diagram_mermaid":"graph TD\n  A[用户调用 gym.make] --> B[从 registry 取 EnvSpec]\n  B --> C[动态导入 entry_point 环境类]\n  C --> D[实例化底层 Env]\n  D --> E[写入 env.unwrapped.spec]\n  E --> F[PassiveEnvChecker 校验]\n  F --> G[OrderEnforcing 顺序检查]\n  G --> H[TimeLimit 时间截断]\n  H --> I[additional_wrappers 追加]\n  I --> J[返回包装后的 env]\n  J --> K[reset 返回 obs 与 info]\n  K --> L[step 返回 obs reward terminated truncated info]\n  L --> K","surprises":["自 v0.26 起 step 返回 terminated 与 truncated 两个布尔值取代单个 done，用于区分 MDP 终止与外部时间截断，直接影响 bootstrap 写法","reset 返回 (obs, info) 元组而非单个 obs，很多旧教程仍按旧接口写","make 会自动套上 PassiveEnvChecker、OrderEnforcing、TimeLimit，用户无需手动添加，重复添加反而可能出错","Autoreset 现在是一个显式包装器而非向量环境的隐式行为，且向量环境用 AutoresetMode 枚举来控制重置语义"],"confidence":"高"},"Genesis-Embodied-AI/Genesis":{"repo":"Genesis-Embodied-AI/Genesis","name":"Genesis World","one_liner":"面向具身智能的统一多物理与可微仿真平台","problem":"用一套 Python 接口统一刚体、FEM、MPM、SPH、PBD 等多种物理求解器与渲染，让机器人仿真可跨 CPU/GPU 大规模并行并支持可微。","difficulty":"困难","core_abstractions":[{"name":"Scene","role":"全局中心对象，聚合配置、Simulator 与 Visualizer，对外提供 add_entity/build/step/reset 与状态存取","file":"genesis/engine/scene.py"},{"name":"Simulator","role":"仿真调度器，持有求解器与耦合器，负责 substep 循环、时间步、传感器更新与状态/梯度管理","file":"genesis/engine/simulator.py"},{"name":"Solver","role":"所有物理求解器的抽象基类，定义 build/process_input/substep 等接口","file":"genesis/engine/solvers/base_solver.py"},{"name":"Entity / RigidEntity","role":"场景中实体的抽象与其刚体实现，提供 set_dofs_position/control_dofs_position 等控制接口","file":"genesis/engine/entities/base_entity.py"},{"name":"Morph","role":"描述实体几何来源的配置，如 MJCF/URDF/USD/Box/Plane，决定资产如何被解析成实体","file":"genesis/options/morphs.py"},{"name":"Material","role":"定义实体所属的物理模型，决定它由哪个求解器与哪种 entity 类处理","file":"genesis/engine/materials/base.py"},{"name":"Options","role":"所有 gs.options.* 配置类的基类，基于 Pydantic BaseModel 做严格校验","file":"genesis/options/options.py"},{"name":"Coupler","role":"多求解器耦合抽象，在同一步内交换不同物理域的状态，如 LegacyCoupler/SAPCoupler/IPCCoupler","file":"genesis/engine/couplers/legacy_coupler.py"},{"name":"Sensor","role":"传感器抽象基类，涵盖相机、IMU、接触力、触觉、激光雷达等，由 SensorManager 统一更新","file":"genesis/engine/sensors/base_sensor.py"},{"name":"Visualizer / RendererOptions","role":"可视化与渲染入口，支持 Nyx/Luisa/Pyrender 与 BatchRenderer 多条渲染路径","file":"genesis/vis/visualizer.py"}],"layers":[{"name":"顶层 API 与初始化层","responsibility":"提供 gs.init/destroy、公开命名空间与 gs 命令行工具","modules":["genesis/__init__.py","genesis/_main.py"],"files":["genesis/__init__.py","genesis/_main.py"]},{"name":"配置层","responsibility":"以 Pydantic 模型声明仿真、各求解器、morph、material、surface、渲染与传感器参数","modules":["genesis/options"],"files":["genesis/options/options.py","genesis/options/solvers.py","genesis/options/morphs.py"]},{"name":"场景与调度层","responsibility":"Scene 聚合一切并驱动 Simulator，Simulator 调度求解器与耦合器完成 substep 循环","modules":["genesis/engine"],"files":["genesis/engine/scene.py","genesis/engine/simulator.py","genesis/engine/interactive_scene.py"]},{"name":"实体层","responsibility":"按材质提供刚体、FEM、MPM、SPH、PBD、SF、混合、工具等实体类型及其几何/关节描述","modules":["genesis/engine/entities"],"files":["genesis/engine/entities/rigid_entity/rigid_entity.py","genesis/engine/entities/base_entity.py"]},{"name":"物理求解器与耦合层","responsibility":"实现各物理域求解器并支持跨求解器耦合","modules":["genesis/engine/solvers","genesis/engine/couplers"],"files":["genesis/engine/solvers/rigid","genesis/engine/solvers/mpm_solver.py","genesis/engine/couplers/sap_coupler.py"]},{"name":"状态与可微层","responsibility":"管理仿真状态缓存与 checkpoint，并通过 grad 模块提供可微仿真与反向传播","modules":["genesis/engine/states","genesis/grad","genesis/datatypes.py"],"files":["genesis/grad/creation_ops.py","genesis/engine/states/cache.py"]},{"name":"传感器与记录层","responsibility":"提供各类传感器实现与数据录制","modules":["genesis/engine/sensors","genesis/recorders"],"files":["genesis/engine/sensors/sensor_manager.py","genesis/engine/sensors/camera.py"]},{"name":"可视化与渲染层","responsibility":"提供 viewer、光栅化/光线追踪/批渲染后端与 GUI 插件","modules":["genesis/vis"],"files":["genesis/vis/visualizer.py","genesis/vis/viewer.py","genesis/vis/raytracer.py"]}],"data_flow":["第1步：调用 gs.init(backend=...) 选择 CPU/CUDA/AMDGPU/Metal 后端并初始化全局状态与 Quadrants 编译器","第2步：构造 gs.Scene(...)，内部创建 Simulator 与 Visualizer，并把各项 options 汇成统一的 SceneOptions","第3步：scene.add_entity(morph, material, surface) 添加实体，Simulator._add_entity 依据 material 选择对应求解器与 entity 类","第4步：可选地 scene.add_sensor / add_camera / add_force_field / add_recorder 扩展场景","第5步：scene.build(n_envs=...) 并行化环境、solver.build()、编译内核并做首次 reset","第6步：用户通过实体接口设置控制量，如 franka.set_dofs_kp / control_dofs_position","第7步：进入主循环反复调用 scene.step()","第8步：Simulator.step 按 substeps 循环执行 process_input 与 substep，substep 内部为 pre_coupling → coupler.couple → post_coupling","第9步：每步末尾 SensorManager.step 更新传感器，Visualizer.update 刷新渲染与录像","第10步：用户读取状态与传感器（get_state / read_sensors）用于 RL 训练或数据生成，scene.backward 支持可微反向传播"],"entry_points":[{"path":"gs (console script -> genesis._main:main)","what":"命令行工具，提供 gs launch/view 打开 viewer 或导出场景"},{"path":"examples/tutorials/control_your_robot.py","what":"最小可运行示例：init→Scene→add_entity→build→step→控制机器人"},{"path":"examples/","what":"覆盖 rigid/deformable/coupling/sensors/rendering 等全部能力的示例目录"},{"path":"genesis/__init__.py (init/Scene/Mesh/options)","what":"编程入口，导入即得全部公开 API"},{"path":"tests/","what":"按 core/coupling/deformable/grad 等分类的测试，可作为行为参考"},{"path":"examples/speed_benchmark","what":"性能基准，了解并行与后端差异"}],"key_files":[{"path":"README.md","why":"先建立四层认知：Simulation Interface、Physics、Render、Compiler"},{"path":"genesis/__init__.py","why":"看清 init/destroy 全局生命周期与对外暴露的 API 边界"},{"path":"examples/tutorials/control_your_robot.py","why":"最快跑通一次完整流程，形成直观印象"},{"path":"genesis/options/options.py","why":"理解基于 Pydantic 的严格配置体系，这是所有参数的入口"},{"path":"genesis/engine/scene.py","why":"掌握中心对象 Scene 的 add_entity/build/step/reset 与状态接口"},{"path":"genesis/engine/simulator.py","why":"理解求解器调度、substep 循环与耦合器插入点"},{"path":"genesis/engine/solvers/base_solver.py","why":"掌握求解器抽象，是加新物理域的起点"},{"path":"genesis/engine/entities/rigid_entity/rigid_entity.py","why":"刚体实体控制 API 的完整实现，机器人操作都落在这里"}],"extension_points":["想加新机器人/物体：用 gs.morphs.MJCF/URDF/USD/Box/Plane 等 morph，直接 scene.add_entity","想加新物理模型：在 genesis/engine/materials 下新增 Material 子类（并配套 options），让 entity/solver 支持它","想加新求解器：继承 genesis/engine/solvers/base_solver.py 的 Solver，实现 build/substep 并在 Simulator 注册","想加多求解器耦合：继承 genesis/engine/couplers 下的 coupler（LegacyCoupler/SAPCoupler/IPCCoupler）并实现 couple","想加新传感器：继承 genesis/engine/sensors/base_sensor.py 的 Sensor，并在 genesis/options/sensors 增加对应 options","想加新渲染器：继承 genesis/options/renderers.py 的 RendererOptions，在 vis 中接入","想加新配置组：继承 genesis/options/options.py 的 Options（Pydantic BaseModel）声明字段"],"learning_path":["第1步：读 README 与文档，记住四层架构与统一多物理引擎的定位","第2步：跑 examples/tutorials/control_your_robot.py，形成 init→Scene→add_entity→build→step 的肌肉记忆","第3步：读 genesis/__init__.py，理解全局初始化与公开 API","第4步：读 genesis/options/options.py 与 solvers.py，掌握严格配置体系与各求解器参数","第5步：读 genesis/engine/scene.py，理解 Scene 如何聚合与驱动整个仿真","第6步：读 genesis/engine/simulator.py 与 solvers/base_solver.py，深入 substep 循环与求解器扩展，再按兴趣深挖 rigid_entity 控制、couplers 多物理耦合或 grad 可微仿真"],"diagram_mermaid":"graph TD\n  A[gs.init 初始化后端] --> B[构造 gs.Scene]\n  B --> C[add_entity 添加实体]\n  C --> D[Simulator 按材质选求解器]\n  D --> E[scene.build 并行化与编译内核]\n  E --> F[设置实体控制量]\n  F --> G[scene.step 主循环]\n  G --> H[Simulator.step 子步循环]\n  H --> I[求解器 substep 更新状态]\n  I --> J[Coupler 耦合多求解器]\n  J --> K[SensorManager 更新传感器]\n  K --> L[Visualizer 渲染与录像]\n  L --> G\n  G --> M[get_state 读取状态用于训练]","surprises":["项目已从 Genesis 更名为 Genesis World 仓库 genesis-world，但 Python 包名仍是 genesis，导入方式不变","配置体系用 Pydantic BaseModel 而非普通 dataclass，且 strict=True、extra='forbid'，字段名或类型写错会直接抛错","底层编译器 Quadrants 是 Taichi 的 fork，把 Python 内核代码降到 CUDA/ROCm/Metal/Vulkan/x86/ARM64","同一个 Scene 内可让多种物理求解器耦合（如刚体+MPM+SPH+IPC），并支持可微仿真的 backward 反向传播"],"confidence":"高"},"OpenBMB/MiniCPM-V":{"repo":"OpenBMB/MiniCPM-V","name":"MiniCPM-V","one_liner":"端侧可部署的多模态大模型系列，图像视频文本理解","problem":"把视觉编码器与语言模型拼成可跑在手机上的多模态大模型，用切图与视觉重采样在有限算力下保留高分辨率细节，并支持量化与端侧部署。","difficulty":"中等","core_abstractions":[{"name":"OmniLMMConfig","role":"模型配置类，继承 MistralConfig 并注册 model_type=omnilmm，声明 num_query、image_size、mm_vision_tower 等视觉参数","file":"omnilmm/model/omnilmm.py"},{"name":"OmniLMMModel","role":"核心模型：组装视觉塔与 Resampler，把视觉特征替换进文本嵌入的占位符位置，再交给语言模型","file":"omnilmm/model/omnilmm.py"},{"name":"OmniLMMForCausalLM","role":"对外因果语言模型：封装 model 与 lm_head，提供 generate_vllm 推理入口，并注册到 AutoModelForCausalLM","file":"omnilmm/model/omnilmm.py"},{"name":"create_vision_module","role":"工厂函数：构建 EVA02 视觉塔并包一层 Resampler，返回二者组成的视觉前端","file":"omnilmm/model/omnilmm.py"},{"name":"Resampler","role":"Perceiver 风格交叉注意力重采样器，用固定数量可学习 query 把视觉特征压成固定长度视觉 token","file":"omnilmm/model/resampler.py"},{"name":"slice_image","role":"高分辨率切图：按长宽比与 max_slice_nums 选出最优网格，把大图切成多个子图分别编码","file":"finetune/dataset.py"},{"name":"get_grid_placeholder","role":"把切图网格展开成图像占位符文本，用 im_start/im_end 包裹每片子图的 token 序列","file":"finetune/dataset.py"},{"name":"omni_preprocess","role":"对话预处理：套用 chat 模板生成 input_ids，并把非 assistant 回答部分 label 置为 ignore_index","file":"omnilmm/train/train_utils.py"},{"name":"MiniCPMVChat","role":"推理分发入口：按 model_path 字符串匹配把请求路由到 12B / Llama3-V / 2_6 / 默认各版本封装","file":"chat.py"},{"name":"Conversation","role":"对话历史与分隔符模板抽象，负责拼接 system 与多轮 role 文本","file":"omnilmm/conversation.py"}],"layers":[{"name":"模型核心层","responsibility":"定义多模态模型结构：视觉塔、Resampler、嵌入替换与生成","modules":["omnilmm/model"],"files":["omnilmm/model/omnilmm.py","omnilmm/model/resampler.py","omnilmm/model/utils.py"]},{"name":"对话与预处理层","responsibility":"对话模板、图像变换与训练样本的 tokenize/label 掩码","modules":["omnilmm"],"files":["omnilmm/conversation.py","omnilmm/train/train_utils.py","omnilmm/utils.py"]},{"name":"数据切图与微调层","responsibility":"高分辨率切图、数据集与 LoRA/全参微调脚本","modules":["finetune"],"files":["finetune/dataset.py","finetune/finetune.py","finetune/trainer.py"]},{"name":"推理与入口层","responsibility":"命令行推理入口与各版本模型封装","modules":["."],"files":["chat.py"]},{"name":"演示与服务层","responsibility":"Gradio/Streamlit Web Demo 与 Omni 实时多模态服务","modules":["web_demos"],"files":["web_demos/web_demo_2.6.py","web_demos/minicpm-o_2.6/model_server.py"]},{"name":"评测层","responsibility":"多模态基准评测接入与 VQA 评分","modules":["eval_mm"],"files":["eval_mm/README.md","eval_mm/vlmevalkit/vlmeval/vlm/minicpm_v.py"]},{"name":"文档层","responsibility":"各版本模型说明、API 与最佳实践文档","modules":["docs"],"files":["docs/api.md","docs/minicpm_v4dot5_en.md"]}],"data_flow":["第1步：用户输入图像与问题，chat.py 的 MiniCPMVChat 按模型路径分发到对应版本封装","第2步：高分辨率图像经 slice_image 按长宽比和 max_slice_nums 决定切图网格，得到主图与多片子图","第3步：build_transform 对图像做 resize 与归一化，得到像素张量","第4步：视觉塔 EVA02 前向提取 patch 特征，取倒数第二层输出","第5步：Resampler 用固定数量 query 做交叉注意力，把视觉特征压成固定长度视觉 token","第6步：wrap_question_for_omni_lmm 把问题中的 image 占位符展开为 im_start + N 个 im_patch + im_end","第7步：OmniLMMModel.forward 用视觉 token 替换文本嵌入中占位符位置的嵌入","第8步：语言模型对拼接后的 inputs_embeds 做自回归生成","第9步：tokenizer 解码生成序列，返回文本回答"],"entry_points":[{"path":"chat.py","what":"命令行推理入口，含 MiniCPMVChat 分发与 OmniLMM12B 封装"},{"path":"finetune/finetune.py","what":"微调入口，解析 ModelArguments/TrainingArguments 并启动训练"},{"path":"web_demos/web_demo_2.6.py","what":"Gradio Web 演示，加载 MiniCPM-V-2_6 并支持视频帧抽取"},{"path":"web_demos/minicpm-o_2.6/model_server.py","what":"MiniCPM-o 实时多模态服务端，含 VAD 与流式推理"},{"path":"omnilmm/model/omnilmm.py:OmniLMMForCausalLM.generate_vllm","what":"把图像编码为嵌入后调用 generate 的推理函数"}],"key_files":[{"path":"README.md","why":"先建立认知：系列模型谱系、端侧部署方式与 max_slice_nums 等关键参数说明"},{"path":"omnilmm/model/omnilmm.py","why":"核心实现：视觉塔与语言模型的拼接、嵌入替换与 generate_vllm"},{"path":"omnilmm/model/resampler.py","why":"视觉到语言的关键连接件，理解固定长度视觉 token 的来源"},{"path":"finetune/dataset.py","why":"切图与占位符生成逻辑所在，理解高分辨率如何被拆成多片"},{"path":"omnilmm/train/train_utils.py","why":"对话如何转成 input_ids 与 labels，理解训练目标掩码"},{"path":"chat.py","why":"推理入口与多版本分发，看清各代模型加载方式差异"},{"path":"finetune/finetune.py","why":"微调参数体系与 tune_vision/tune_llm/use_lora 开关"},{"path":"docs/api.md","why":"最新模型的实际使用方式已转为 OpenAI 兼容 API"}],"extension_points":["替换视觉编码器：改 omnilmm/model/omnilmm.py 的 create_vision_module，替换 timm.create_model 的视觉塔并调整 Resampler 的 kv_dim","更换语言模型底座：改 OmniLMMConfig 与 OmniLMMModel 继承的基类，从 MistralConfig/MistralModel 换成目标 LLM","调整视觉 token 数量：改 config.num_query，Resampler 会用 grid_size=sqrt(num_query) 重设 query 数","新增切图策略：在 finetune/dataset.py 的 slice_image 中改写网格选择逻辑","新增对话模板：在 omnilmm/train/train_utils.py 的 omni_preprocess 里修改 response_template 与 system_content","接入新版本模型：本仓库对 2.6/4.x 走 AutoModel.from_pretrained(trust_remote_code=True)，扩展需在对应 HuggingFace 仓库远程代码中进行"],"learning_path":["第1步：读 README.md，分清 MiniCPM-V 与 MiniCPM-o 两个系列及各代模型关系","第2步：读 omnilmm/model/omnilmm.py，掌握视觉塔加 Resampler 加 LLM 的三段式结构与嵌入替换","第3步：读 omnilmm/model/resampler.py，理解视觉特征如何被压成固定长度 token","第4步：读 finetune/dataset.py 的 slice_image 与 get_grid_placeholder，理解高分辨率切图机制","第5步：读 omnilmm/train/train_utils.py 的 omni_preprocess，理解训练样本构造与 label 掩码","第6步：读 chat.py，看多版本模型如何被分发与加载，再对照 docs/api.md 了解当前推荐用法"],"diagram_mermaid":"graph TD\n  A[用户输入图像与问题] --> B[slice_image 高分辨率切图]\n  B --> C[build_transform 图像预处理]\n  C --> D[EVA02 视觉塔提取特征]\n  D --> E[Resampler 压缩为固定视觉 token]\n  E --> F[替换文本嵌入中的图像占位符]\n  F --> G[Mistral 语言模型自回归生成]\n  G --> H[Tokenizer 解码输出回答]","surprises":["README 已更新到 MiniCPM-V 4.6 与 MiniCPM-o 4.5，但仓库内真正可运行的实现仍是更早的 OmniLMM 架构 EVA02 加 Resampler 加 Mistral，新版本架构并不在本仓库","2.6 及之后的模型通过 AutoModel.from_pretrained(trust_remote_code=True) 从 HuggingFace 拉取远程代码执行，本地只保留加载与演示代码，容易误以为仓库内就是完整模型实现","切图逻辑藏在 finetune/dataset.py 而非模型包内，推理侧的高分辨率细节保留依赖 max_slice_nums 参数而非模型结构","create_vision_module 用 Identity 替换视觉塔最后一层与 attn_pool，实际取倒数第二层特征，且 initialize_vision_modules 写死了 name":"策略层","responsibility":"把 transforms 与模型组装成可推理的 Policy，并提供各平台专属的输入输出映射","modules":["src/openpi/policies"],"files":["src/openpi/policies/policy.py","src/openpi/policies/policy_config.py","src/openpi/policies/libero_policy.py","src/openpi/policies/droid_policy.py"]},{"name":"训练层","responsibility":"定义 TrainConfig 体系、数据加载、优化器、FSDP 分片、checkpoint 与权重加载","modules":["src/openpi/training"],"files":["src/openpi/training/config.py","src/openpi/training/data_loader.py","src/openpi/training/optimizer.py","src/openpi/training/weight_loaders.py","src/openpi/training/sharding.py"]},{"name":"服务层","responsibility":"把 Policy 封装成 websocket 策略服务器，供远程机器人客户端查询动作","modules":["src/openpi/serving"],"files":["src/openpi/serving/websocket_policy_server.py","scripts/serve_policy.py"]},{"name":"客户端层","responsibility":"独立可安装的轻量客户端包，含动作块缓冲、运行时与机器人环境抽象","modules":["packages/openpi-client"],"files":["packages/openpi-client/src/openpi_client/base_policy.py","packages/openpi-client/src/openpi_client/action_chunk_broker.py","packages/openpi-client/src/openpi_client/runtime/agent.py"]},{"name":"共享工具层","responsibility":"数组类型检查、图像工具、归一化统计、下载与 NNX 工具","modules":["src/openpi/shared"],"files":["src/openpi/shared/normalize.py","src/openpi/shared/image_tools.py","src/openpi/shared/nnx_utils.py","src/openpi/shared/download.py"]}],"data_flow":["第1步：调用方构造观测 dict，含多路图像、机器人状态与 prompt 文本","第2步：Policy.infer 先复制输入，依次应用 repack_transforms 与 InjectDefaultPrompt","第3步：data_transforms 把平台原始键映射为模型期望的图像键与状态键","第4步：Normalize 用 norm_stats 把状态与动作归一化到稳定范围","第5步：model_transforms 把数据整理成模型输入格式","第6步：Observation.from_dict 把嵌套 dict 转成结构化 Observation，并补上图像掩码","第7步：model.sample_actions 以 flow matching 迭代去噪从噪声生成动作块","第8步：输出经 Unnormalize 与 data_transforms.outputs 还原为平台动作格式","第9步：返回含 actions 与 policy_timing 的 dict，动作块由客户端 broker 按步执行","第10步：训练时同一套 transforms 生成 batch，train_step 调 compute_loss 得到 flow matching 损失并反向更新"],"entry_points":[{"path":"scripts/train.py","what":"JAX 训练主入口，按 config 名加载配置并跑训练循环"},{"path":"scripts/train_pytorch.py","what":"PyTorch 版训练入口，支持单卡与 torchrun 多卡"},{"path":"scripts/serve_policy.py","what":"加载 checkpoint 并启动 websocket 策略服务器"},{"path":"scripts/compute_norm_stats.py","what":"为某训练配置预先计算数据归一化统计"},{"path":"src/openpi/policies/policy_config.py:16","what":"create_trained_policy，推理侧组装 Policy 的标准入口"},{"path":"src/openpi/training/config.py:955","what":"get_config 与 cli，按名字取训练配置"},{"path":"examples/inference.ipynb","what":"无需机器人的最小推理示例"}],"key_files":[{"path":"README.md","why":"先建立整体认知：三类模型、checkpoint、微调三步流程与 JAX/PyTorch 双实现"},{"path":"src/openpi/models/model.py","why":"核心抽象所在：Observation、BaseModel、BaseModelConfig 与 restore_params"},{"path":"src/openpi/policies/policy.py","why":"推理链路的组装点，看清 transforms 与 sample_actions 的先后关系"},{"path":"src/openpi/policies/policy_config.py","why":"create_trained_policy，理解如何从 checkpoint 构造可推理策略"},{"path":"src/openpi/training/config.py","why":"TrainConfig 体系与全部内置配置，是理解参数组织与扩展入口的关键"},{"path":"src/openpi/models/pi0.py","why":"π0 模型本体，含 flow matching 与 attention mask 的实现"},{"path":"scripts/train.py","why":"训练主循环，把数据加载、模型初始化、优化器与 checkpoint 串起来"},{"path":"src/openpi/transforms.py","why":"数据变换抽象与归一化实现，理解数据格式如何适配模型"}],"extension_points":["想加新机器人平台：在 src/openpi/policies/ 下参考 libero_policy.py / droid_policy.py 写输入输出 transforms 与 Policy 子类","想加新数据来源：继承 training/config.py 的 DataConfigFactory，实现 create 返回 DataConfig，并在 _CONFIGS 里注册新 TrainConfig","想加新模型结构：继承 models/model.py 的 BaseModel 与 BaseModelConfig，实现 create / compute_loss / sample_actions 与 inputs_spec","想换权重加载策略：实现 training/weight_loaders.py 的 WeightLoader 协议","想改归一化或数据预处理：在 transforms.py 里新增 DataTransformFn 并在 DataConfig 的 transforms 中组装","想部署到自定义运行时：基于 packages/openpi-client 的 BasePolicy 与 runtime 实现机器人侧循环"],"learning_path":["第1步：读 README.md，跑通 examples/inference.ipynb，建立推理链路直觉","第2步：读 src/openpi/models/model.py，掌握 Observation / BaseModel / BaseModelConfig 三个核心抽象","第3步：读 src/openpi/transforms.py，理解无 batch 数据变换与归一化协议","第4步：读 src/openpi/policies/policy.py 与 policy_config.py，把推理链路的组装串起来","第5步：读 src/openpi/models/pi0.py，理解 flow matching 与多模态注意力","第6步：读 src/openpi/training/config.py 与 scripts/train.py，理解训练配置体系与训练循环"],"diagram_mermaid":"graph TD\n  OBS[观测 dict 图像 状态 prompt] --> REPACK[RepackTransform 重排键]\n  REPACK --> INJ[InjectDefaultPrompt 注入语言指令]\n  INJ --> DT[data_transforms 平台适配]\n  DT --> NORM[Normalize 归一化]\n  NORM --> MT[model_transforms 整理模型输入]\n  MT --> OBSOBJ[Observation 结构化对象]\n  OBSOBJ --> MODEL[Pi0 sample_actions]\n  MODEL --> FLOW[flow matching 迭代去噪]\n  FLOW --> UNNORM[Unnormalize 反归一化]\n  UNNORM --> OUT[输出 actions 动作块]\n  OUT --> BROKER[客户端 action chunk broker 逐帧执行]","surprises":["同一仓库同时维护 JAX 与 PyTorch 两套实现，推理 API 完全一致，靠 checkpoint 里是否存在 model.safetensors 自动判定后端","数据变换刻意工作在无 batch 的 numpy 嵌套 dict 上，靠 DataLoader 的 collate 才堆成 batch，训练与推理复用同一批变换","PyTorch 路线需要手动把 transformers_replace 里的补丁覆盖进 transformers 库，用来支持 AdaRMS 与 KV cache 复用，属于较脏的依赖处理","训练前必须先用 compute_norm_stats.py 生成归一化统计，否则训练会因缺失 norm_stats 直接报错；norm stats 还会随 checkpoint 一起分发以保证推理一致"],"confidence":"高"},"RoboVerseOrg/RoboVerse":{"repo":"RoboVerseOrg/RoboVerse","name":"RoboVerse","one_liner":"统一多种仿真器与任务的机器人学习平台与基准","problem":"机器人学习被仿真器碎片化：Isaac Sim、MuJoCo、SAPIEN、Genesis 等各有 API 与资产格式，任务无法跨后端复用。RoboVerse 用统一的场景配置与任务接口把多仿真器、多任务、多机器人收敛到一套 gym 兼容 API，并附带数据集与基准。","difficulty":"困难","core_abstractions":[{"name":"BaseSimHandler","role":"所有仿真后端的抽象基类，规定 _set_states / _set_dof_targets / _get_states / _simulate 等物理交互契约与能力标志","file":"packages/metasim/metasim/sim/base.py"},{"name":"BaseTaskEnv","role":"任务环境基类，包裹 handler 形成完整任务，要求子类实现 _observation / _reward / _terminated / _observation_space 等","file":"packages/metasim/metasim/task/base.py"},{"name":"RLTaskEnv","role":"面向强化学习的任务基类，提供 reset/step、自动重置、动作裁剪与奖励终止计算","file":"packages/metasim/metasim/task/rl_task.py"},{"name":"ScenarioCfg","role":"场景配置中心，声明 simulator、robots、objects、cameras、num_envs 等，是构建一切环境的输入","file":"packages/metasim/metasim/scenario/scenario.py"},{"name":"RobotCfg","role":"机器人配置类，描述关节、执行器、初始状态等，供 get_robot 按名解析","file":"packages/metasim/metasi se_pack/tasks","roboverse_pack/robots","roboverse_pack/scenes","roboverse_pack/grounds"],"files":["roboverse_pack/tasks/pick_place/base.py","roboverse_pack/robots/aloha.py"]},{"name":"查询与随机化层","responsibility":"提取接触力等额外状态，并对场景做域随机化","modules":["packages/metasim/metasim/queries","packages/metasim/metasim/randomization"],"files":["packages/metasim/metasim/queries/base.py","packages/metasim/metasim/randomization/core"]},{"name":"学习层","responsibility":"基于统一环境做 RL（SB3/CleanRL/FastTD3/rsl_rl）、IL（ACT/DP）与 VLA 训练评估","modules":["roboverse_learn/rl","roboverse_learn/il","roboverse_learn/vla"],"files":["roboverse_learn/rl/sb3/ppo_train.py","roboverse_learn/il/policies"]},{"name":"教程与工具层","responsibility":"编号教程链、开发脚本与第三方集成工具","modules":["examples","scripts","tools"],"files":["examples/0_static_scene.py","examples/9_cfg_task.py","examples/rl/0_ppo.py"]}],"data_flow":["第1步：用户构造 ScenarioCfg，指定 simulator、robots、objects、cameras 与 num_envs","第2步：ScenarioCfg.__post_init__ 用 get_robot / get_scene / get_ground 把字符串资源名解析成配置对象并做校验","第3步：用户定义任务类继承 BaseTaskEnv 或 RLTaskEnv，用 @register_task 装饰注册到 TASK_REGISTRY","第4步：用户实例化 Task(scenario)，或用 metasim.register_gym_envs 后 gym.make(\"RoboVerse/<task>\")","第5步：BaseTaskEnv.__init__ 调 _instantiate_env，经 get_sim_handler_class(SimType) 从 SIM_BACKENDS 取后端 handler 类","第6步：handler 依据场景初始化具体仿真器，加载机器人、物体与地面资产","第7步：reset 写入初始状态并返回观测，环境开始一个 episode","第8步：step 接收动作，先触发 pre_physics_step_callback 做动作预处理","第9步：handler._set_dof_targets 下发目标，_simulate 推进物理，_get_states 读回新状态","第10步：任务用 _reward / _terminated / _time_out 计算奖励与终止，触发 post_physics_step_callback","第11步：返回 obs/reward/terminated/truncated/info，RL 学习层用这些数据训练 PPO 等策略","第12步：脚本可批量采集轨迹并保存为统一数据集，供 IL/VLA 训练使用"],"entry_points":[{"path":"packages/metasim/metasim/__init__.py:18","what":"register_gym_envs，发现并注册所有任务为 RoboVerse/<task> 的 gym 环境"},{"path":"packages/metasim/metasim/task/gym_registration.py:241","what":"register_all_tasks_with_gym，批量把任务注册进 gymnasium"},{"path":"packages/metasim/metasim/task/gym_registration.py:260","what":"register_task_with_gym，注册单个任务并绑定单环境与向量入口"},{"path":"packages/metasim/metasim/task/base.py:20","what":"BaseTaskEnv，所有任务的父类，定义 step/reset 与回调契约"},{"path":"packages/metasim/metasim/task/rl_task.py:23","what":"RLTaskEnv，面向 RL 的任务基类"},{"path":"examples/0_static_scene.py","what":"教程链起点，创建静态场景并加载仿真器"},{"path":"examples/9_cfg_task.py","what":"演示如何用配置定义一个任务"},{"path":"examples/rl/0_ppo.py","what":"用统一环境训练 PPO 的 RL 示例"},{"path":"roboverse_learn/rl/sb3/ppo_train.py","what":"基于 Stable-Baselines3 的 PPO 训练脚本"}],"key_files":[{"path":"README.md","why":"先理解仓库布局：MetaSim 核心包与内容/学习代码两层的分工"},{"path":"examples/0_static_scene.py","why":"最简入门，看场景如何被创建与仿真器如何被拉起"},{"path":"packages/metasim/metasim/sim/base.py","why":"BaseSimHandler，理解仿真器统一接口与后端能力标志"},{"path":"packages/metasim/metasim/utils/setup_util.py","why":"SIM_BACKENDS 分发表与 get_sim_handler_class，理解后端如何被选择"},{"path":"packages/metasim/metasim/scenario/scenario.py","why":"ScenarioCfg，理解场景配置的全部字段与解析流程"},{"path":"packages/metasim/metasim/task/base.py","why":"BaseTaskEnv，理解任务的 step/reset 与回调扩展点"},{"path":"packages/metasim/metasim/task/registry.py","why":"register_task 与 TASK_REGISTRY，理解任务注册与发现机制"},{"path":"packages/metasim/metasim/task/rl_task.py","why":"RLTaskEnv，理解 RL 任务的动作、奖励与自动重置"},{"path":"packages/metasim/metasim/task/gym_registration.py","why":"gym 适配层，理解统一环境如何接入标准 gymnasium 生态"},{"path":"examples/9_cfg_task.py","why":"看一个完整任务如何用配置组装出来"}],"extension_points":["想加新仿真器：在 packages/metasim/metasim/constants.py 的 SimType 枚举加一个值，在 packages/metasim/metasim/utils/setup_util.py 的 SIM_BACKENDS 加一条 BackendSpec，再在 packages/metasim/metasim/sim/<backend>/ 写继承 BaseSimHandler 的 handler 类","想加新任务：在 roboverse_pack/tasks/<name>/ 下写继承 BaseTaskEnv 或 RLTaskEnv 的类，用 @register_task(\"name\") 装饰，并声明 supported_simulators","想加新机器人：在 roboverse_pack/robots/ 下写 RobotCfg 子类，让 get_robot 能按名解析","想加新物体或场景或地面：分别继承 scenario/objects.py 的 BaseObjCfg、scenario/scene.py 的 SceneCfg、scenario/grounds.py 的 GroundCfg","想加新查询：继承 packages/metasim/metasim/queries/base.py 的 BaseQueryType，实现从 handler 提取信息","想加新随机化策略：在 randomization/presets 下写预设并在场景中引用","想换学习算法：在 roboverse_learn/rl/ 下按 SB3/CleanRL/FastTD3 的既有模式加训练脚本，复用统一 gym 接口"],"learning_path":["第1步：读 README.md 与 docs，理解 MetaSim 核心包与内容/学习代码的分工以及仓库目录表","第2步：跑并读 examples/0_static_scene.py 到 9_cfg_task.py 的编号教程链，建立直观印象","第3步：读 packages/metasim/metasim/sim/base.py，理解 BaseSimHandler 的统一接口与能力标志","第4步：读 packages/metasim/metasim/utils/setup_util.py 的 SIM_BACKENDS，理解后端如何按 SimType 分发","第5步：读 packages/metasim/metasim/scenario/scenario.py，掌握 ScenarioCfg 如何组织场景","第6步：读 packages/metasim/metasim/task/base.py 与 registry.py，理解任务契约与注册发现机制","第7步：读 packages/metasim/metasim/task/gym_registration.py 与 rl_task.py，理解如何接入 gym 与 RL","第8步：读 roboverse_learn/rl/sb3/ppo_train.py，看统一环境上如何跑强化学习训练"],"diagram_mermaid":"graph TD\n  USER[用户代码或脚本] --> SC[ScenarioCfg 场景配置]\n  SC --> RESOLVE[解析机器人与场景资源]\n  USER --> TASK[任务类 继承 BaseTaskEnv]\n  TASK --> REG[register_task 注册到 TASK_REGISTRY]\n  TASK --> ENV[实例化任务或 gym.make]\n  ENV --> DISPATCH[get_sim_handler_class 按 SimType 分发]\n  DISPATCH --> HANDLER[具体后端 Handler 如 MuJoCo]\n  HANDLER --> SIM[初始化仿真器并加载资产]\n  ENV --> RESET[reset 写入初始状态]\n  ENV --> STEP[step 接收动作]\n  STEP --> PHYSICS[_set_dof_targets 与 _simulate 推进物理]\n  PHYSICS --> STATE[_get_states 读回状态]\n  STATE --> REWARD[_reward 与 _terminated 计算]\n  REWARD --> OUT[返回 obs 与 reward 与 info]\n  OUT --> LEARN[roboverse_learn 训练 RL 或 IL 或 VLA]","surprises":["一个仓库其实是两个包：仿真核心 MetaSim 在 packages/metasim 且 import 名是 metasim，内容与学习代码是根目录的 roboverse-py，安装时必须先装 metasim 再装根包","加仿真器被刻意做成极简两步：注释明确写着 Adding a simulator = one SimType value + one entry here，即改 constants.py 与 setup_util.py 两处","任务发现默认走 AST 静态索引而非导入全部模块，只有设置 METASIM_TASK_DISCOVERY=eager 才恢复旧的 import-everything 行为","任务用 supported_simulators 主动声明支持的仿真器，越界会在构造时就报错，而不是等到后端深处才失败","gym 包装会强制 num_envs=1 并 deepcopy 场景配置，因为任务类的 scenario 是共享类属性，否则 gym.make 会污染整个进程的默认值"],"confidence":"高"},"browser-use/browser-use":{"repo":"browser-use/browser-use","name":"browser-use","one_liner":"让 LLM 像人一样操作真实浏览器的开源 Agent 框架","problem":"解决「把网页变成 LLM 可理解、可操作的接口」这一核心难题：把动态 DOM 压缩成带整数索引的可交互元素列表喂给 LLM，再把 LLM 输出的结构化动作翻译成 CDP 浏览器操作，形成感知-决策-执行的闭环。","difficulty":"中等","core_abstractions":[{"name":"Agent","role":"智能体主循环与编排中心：组装 LLM、工具、浏览器会话，按 step 驱动 感知-决策-执行-后处理 循环","file":"browser_use/agent/service.py"},{"name":"Tools","role":"动作空间容器：内置 click/type/navigate/search 等浏览器动作，支持 @action 装饰器注册自定义工具","file":"browser_use/tools/service.py"},{"name":"Registry","role":"动作注册表与执行器：把函数签名转成 Pydantic 参数模型，动态生成 LLM tool schema，负责参数校验与特殊参数注入","file":"browser_use/tools/registry/service.py"},{"name":"BrowserSession","role":"浏览器会话控制层：封装 CDP 客户端、标签页、watchdog 生命周期，对外提供 get_browser_state_summary 与事件总线","file":"browser_use/browser/session.py"},{"name":"DomService","role":"DOM 感知服务：通过 CDP 拉取 DOMSnapshot、DOM 树与可访问性树，构建带可见性/坐标信息的 EnhancedDOMTreeNode","file":"browser_use/dom/service.py"},{"name":"DOMTreeSerializer","role":"DOM 到 LLM 表示的翻译器：精简树、按 paint order 与包围盒过滤，为可交互元素分配整数索引并序列化成紧凑文本","file":"browser_use/dom/serializer/serializer.py"},{"name":"BaseWatchdog","role":"事件驱动浏览器行为的基类：子类监听特定事件并执行 CDP 操作，实现动作与浏览器控制的解耦","file":"browser_use/browser/watchdog_base.py"},{"name":"BaseEvent / EventBus","role":"类型化事件与事件总线：NavigateToUrlEvent、ClickElementEvent 等把动作意图异步派发给对应 watchdog","file":"browser_use/browser/events.py"},{"name":"BaseChatModel","role":"LLM 抽象协议：统一 ainvoke 接口，支持按 output_format 返回结构化 Pydantic 结果，屏蔽各家模型差异","file":"browser_use/llm/base.py"},{"name":"MessageManager","role":"上下文管理器：把浏览器状态、历史动作、可用动作描述与敏感信息拼装成 LLM 消息序列，含消息压缩","file":"browser_use/agent/message_manager/service.py"},{"name":"AgentOutput / ActionResult","role":"核心数据模型：AgentOutput 是 LLM 单步输出（思考+动作列表），ActionResult 是动作执行结果（内容/错误/是否完成）","file":"browser_use/agent/views.py"}],"layers":[{"name":"Agent 编排层","responsibility":"主循环、上下文准备、LLM 调用、动作执行、错误处理与循环检测","modules":["browser_use/agent"],"files":["browser_use/agent/service.py","browser_use/agent/views.py","browser_use/agent/prompts.py"]},{"name":"工具与动作层","responsibility":"定义并注册浏览器动作空间，动态生成 LLM 工具 schema，执行并返回 ActionResult","modules":["browser_use/tools"],"files":["browser_use/tools/service.py","browser_use/tools/registry/service.py","browser_use/tools/registry/views.py","browser_use/tools/views.py"]},{"name":"DOM 表示层","responsibility":"从浏览器抽取 DOM/AX 树并构建增强节点，再序列化成 LLM 可读的带索引文本表示","modules":["browser_use/dom"],"files":["browser_use/dom/service.py","browser_use/dom/serializer/serializer.py","browser_use/dom/views.py"]},{"name":"浏览器控制层","responsibility":"CDP 会话管理、标签页与事件总线、各类 watchdog 实现具体浏览器行为","modules":["browser_use/browser"],"files":["browser_use/browser/session.py","browser_use/browser/events.py","browser_use/browser/watchdog_base.py","browser_use/browser/watchdogs/dom_watchdog.py","browser_use/browser/watchdogs/default_action_watchdog.py"]},{"name":"LLM 抽象层","responsibility":"统一各家大模型调用接口与消息格式，支持结构化输出","modules":["browser_use/llm"],"files":["browser_use/llm/base.py","browser_use/llm/messages.py","browser_use/llm/openai/chat.py"]},{"name":"消息与上下文层","responsibility":"历史描述、状态消息拼装、敏感数据过滤与消息压缩","modules":["browser_use/agent/message_manager"],"files":["browser_use/agent/message_manager/service.py","browser_use/agent/message_manager/views.py"]},{"name":"集成与协议层","responsibility":"把 Agent 能力以 MCP 服务、Claude 工具集、技能包等形式对外暴露","modules":["browser_use/mcp","browser_use/integrations","browser_use/skills"],"files":["browser_use/mcp/server.py","browser_use/mcp/client.py","browser_use/skills/service.py"]},{"name":"辅助能力层","responsibility":"文件系统、截图服务、沙箱执行等横切支撑能力","modules":["browser_use/filesystem","browser_use/screenshots","browser_use/sandbox"],"files":["browser_use/filesystem/file_system.py","browser_use/screenshots/service.py","browser_use/sandbox/sandbox.py"]}],"data_flow":["第1步：调用 Agent.run()，注册信号处理器并调用 browser_session.start() 启动浏览器、挂载所有 watchdog 到事件总线","第2步：进入 step()，Phase1 调用 _prepare_context()，进而调用 browser_session.get_browser_state_summary() 请求最新 DOM 与截图","第3步：BrowserSession 通过 event_bus 派发 BrowserStateRequestEvent，由 DOM watchdog 订阅并处理","第4步：DomService.get_dom_tree() 通过 CDP 拉取 DOMSnapshot、DOM 树与可访问性树，构建 EnhancedDOMTreeNode 并计算可见性","第5步：DOMTreeSerializer.serialize_accessible_elements() 精简树、过滤不可见与越界元素，为可交互元素分配整数索引，产出 SerializedDOMState","第6步：MessageManager.create_state_messages() 把浏览器状态文本、历史、可用动作描述与截图拼装为 LLM 消息序列","第7步：_get_next_action() 调用 llm.ainvoke(messages, output_format=AgentOutput)，得到带思考与动作列表的结构化输出","第8步：_execute_actions() 调用 multi_act()，逐个把动作交给 tools.act() 执行，并做页面变更守卫","第9步：Registry.execute_action() 校验参数、替换敏感数据占位符、注入 browser_session 等特殊参数后调用动作函数","第10步：动作函数通过 event_bus 派发如 NavigateToUrlEvent / ClickElementEvent，由对应 watchdog 执行真实 CDP 操作并返回 ActionResult","第11步：_post_process() 记录结果、更新循环检测器、判断是否 done，并把本步写入 history","第12步：循环直至 done 或达到 max_steps，run() 返回 AgentHistoryList，final_result() 给出最终答案"],"entry_points":[{"path":"browser_use/agent/service.py:run","what":"Agent 主入口，驱动多步循环直到任务完成，返回 AgentHistoryList"},{"path":"browser_use/agent/service.py:step","what":"单步执行入口，串联上下文准备、LLM 调用、动作执行与后处理"},{"path":"browser_use/cli.py","what":"browser-use / bu 命令行入口，交互式运行 Agent"},{"path":"browser_use/mcp/server.py","what":"把浏览器操作封装为 MCP 服务端，供外部 Agent 调用"},{"path":"browser_use/tools/service.py:Tools","what":"构造动作空间与内置浏览器动作的入口"},{"path":"examples/simple.py","what":"最小可运行示例，展示 Agent(task=..., llm=...) 用法"}],"key_files":[{"path":"README.md","why":"先建立整体认知：三种使用形态 云托管/CLI/Python 库 与核心卖点"},{"path":"browser_use/agent/service.py","why":"Agent 主循环与 step/run/multi_act 全在这里，是理解系统骨架的第一站"},{"path":"browser_use/agent/views.py","why":"AgentOutput 与 ActionResult 数据模型，定义了 LLM 输入输出的契约"},{"path":"browser_use/tools/service.py","why":"内置动作与 @action 注册方式，理解动作空间如何定义"},{"path":"browser_use/tools/registry/service.py","why":"动作注册与执行核心：签名转 Pydantic、动态生成 tool schema、特殊参数注入"},{"path":"browser_use/dom/service.py","why":"DOM 感知入口，理解 CDP 如何拉取并增强 DOM/AX 树"},{"path":"browser_use/dom/serializer/serializer.py","why":"DOM 如何变成 LLM 可读的带索引文本，是最具巧思的一环"},{"path":"browser_use/browser/session.py","why":"浏览器会话与事件总线入口，理解控制层与状态获取"},{"path":"browser_use/browser/watchdog_base.py","why":"事件驱动行为的基类，理解动作如何解耦为异步 watchdog"},{"path":"browser_use/agent/message_manager/service.py","why":"上下文如何拼装与压缩，决定 LLM 看到什么"}],"extension_points":["加一个新工具/动作：用 @tools.action(description=...) 装饰函数，参数类型自动转成 LLM schema，参考 browser_use/tools/service.py 内置动作","自定义动作参数模型：给 @action 传 param_model=某个 BaseModel，参考 browser_use/tools/registry/views.py 的 ActionModel","新增浏览器行为：继承 BaseWatchdog 并实现 attach 的监听逻辑，参考 browser_use/browser/watchdogs/dom_watchdog.py","接入新的大模型：实现 BaseChatModel 协议 的 ainvoke 与 provider/name 属性，参考 browser_use/llm/base.py","自定义系统提示：继承或替换 SystemPrompt，用 Agent(override_system_message=...) 或 extend_system_message","结构化输出：给 Agent 传 output_model，done 动作会按该 schema 返回结构化结果"],"learning_path":["第1步：读 README.md，分清 云托管/CLI/Python 库 三种形态与 Agent 基本用法","第2步：读 agent/service.py 的 run() 与 step()，抓住 感知-决策-执行-后处理 四阶段主循环","第3步：读 agent/views.py 的 AgentOutput 与 ActionResult，理解单步输入输出契约","第4步：读 tools/service.py 与 tools/registry/service.py，搞清动作如何注册、schema 如何生成、如何执行","第5步：读 dom/service.py 与 dom/serializer/serializer.py，理解 DOM 如何变成带索引的 LLM 表示","第6步：读 browser/session.py、events.py 与 watchdog_base.py，理解事件总线与 watchdog 解耦的控制层","第7步：读 agent/message_manager/service.py，理解上下文如何拼装与压缩"],"diagram_mermaid":"graph TD\n  T[任务 task] --> A[Agent.run 主循环]\n  A --> P[准备上下文 get_browser_state_summary]\n  P --> E[event_bus 派发 BrowserStateRequestEvent]\n  E --> W[DOM watchdog 处理]\n  W --> D[DomService 拉取 CDP DOM 与 AX 树]\n  D --> S[DOMTreeSerializer 分配整数索引并序列化]\n  S --> M[MessageManager 拼装消息]\n  M --> L[LLM.ainvoke 返回 AgentOutput]\n  L --> X[multi_act 执行动作]\n  X --> R[Registry 校验参数并调用动作函数]\n  R --> B[event_bus 派发 Click 或 Navigate 事件]\n  B --> C[watchdog 执行 CDP 操作]\n  C --> O[ActionResult 回填]\n  O --> A\n  A --> H[AgentHistoryList 最终结果]","surprises":["浏览器控制不是动作函数直接调 CDP，而是通过事件总线 + watchdog 异步解耦：动作只负责派发事件，真正操作浏览器的是一群订阅事件的 watchdog","动作空间用 Pydantic 的 create_model 在运行时动态生成，LLM 走 tool-calling 结构化输出强约束，而不是自由文本解析","LLM 用整数索引如 [12] 引用页面元素而非 CSS 选择器，索引每步重新分配，跨步引用旧索引会失效或点错元素","DOM 序列化会按 paint order 与包围盒裁剪隐藏/越界元素，因此 LLM 看到的元素集合与真实 D bitat-lab/habitat/core/dataset.py 与 simulator.py，理解 episode 与观测来源","第5步：读 habitat-lab/habitat/core/registry.py，理解组件注册与字符串 id 引用机制","第6步：读 habitat-lab/habitat/config/default.py 与 default_structured_configs.py，理解 Hydra 配置体系","第7步：读 habitat-lab/habitat/tasks/nav/nav.py 与 datasets/pointnav/pointnav_dataset.py，把任务与数据集落到实例","第8步：读 habitat-baselines/habitat_baselines/run.py 与 rl/ppo/ppo_trainer.py，理解基线训练循环"],"diagram_mermaid":"graph TD\n  CFG[Hydra 配置树] --> ENV[Env 初始化]\n  ENV --> DS[make_dataset 加载 episodes]\n  ENV --> SIM[make_sim 创建仿真器]\n  ENV --> TASK[make_task 创建任务]\n  DS --> ENV\n  SIM --> OBS[sim 与 task 的 sensor_suite 并集]\n  TASK --> OBS\n  ENV --> RESET[reset 取 episode 并重配置场景]\n  RESET --> STEP[step 分派动作给 Action]\n  STEP --> SIMSTEP[Simulator 执行动作]\n  SIMSTEP --> MEAS[Measurements 更新度量]\n  MEAS --> RLENV[RLEnv 转成 reward 与 done]\n  RLENV --> FACTORY[EnvFactory 建环境]\n  FACTORY --> TRAINER[PPOTrainer 训练循环]","surprises":["Env 把 dataset、simulator、task 三者紧耦合在一起，切换 episode 会触发 sim.reconfigure 重建场景，任务实例与 episode 一一对应","几乎所有组件都靠全局单例 Registry 注册，import 即注册，配置里只写字符串 id，排查组件缺失时要从注册时机入手","observation_space 是 simulator 与 task 两套 sensor_suite 观测空间的并集，任务可以自带传感器而不只依赖仿真器","RLEnv 只是对 Env 的 gym 包装，reward 与 done 必须由子类实现，核心 Env 本身完全不产生奖励","配置用 Hydra structured config，patch_config 之后 OmegaConf 被设为只读，运行时修改配置需要 read_write 上下文","Measure 之间有顺序依赖，check_measure_dependencies 要求被依赖的度量必须在配置列表里排在前面，否则断言失败"],"confidence":"高"},"geekan/MetaGPT":{"repo":"geekan/MetaGPT","name":"MetaGPT","one_liner":"把软件公司 SOP 编码成多智能体协作流程的框架","problem":"让多个 LLM 角色按标准作业流程 SOP 协作，把一句话需求自动转成用户故事、需求文档、API 设计、代码与测试，解决单 Agent 难以完成长链路复杂任务的问题。","difficulty":"中等","core_abstractions":[{"name":"Role","role":"角色智能体基类：封装观察-思考-行动循环，持有动作列表与订阅规则，是协作的基本单位","file":"metagpt/roles/role.py"},{"name":"Action","role":"可执行动作基类：封装一次 LLM 调用或工具操作，产出 ActionOutput，是 SOP 的最小步骤","file":"metagpt/actions/action.py"},{"name":"Message","role":"角色间通信的统一消息结构，携带 cause_by 与 send_to 实现基于内容的发布订阅路由","file":"metagpt/schema.py"},{"name":"Environment","role":"运行环境与调度器：承载所有角色，负责消息广播投递与按轮次并发驱动角色运行","file":"metagpt/environment/base_env.py"},{"name":"Team","role":"多角色团队的装配与顶层运行循环，负责雇佣角色、投喂初始需求、按轮次推进直到全部空闲","file":"metagpt/team.py"},{"name":"ActionNode","role":"结构化输出节点：把 prompt 模板与期望字段约束成可解析的结构化结果，支撑 SOP 中固定格式交付物","file":"metagpt/actions/action_node.py"},{"name":"Memory","role":"角色的消息记忆：存储已观察消息并支持按角色、动作、时间检索，避免重复处理","file":"metagpt/memory/memory.py"}],"layers":[{"name":"角色层","responsibility":"定义各类角色的动作集合与订阅规则，实现观察-思考-行动循环与不同反应策略","modules":["metagpt/roles"],"files":["metagpt/roles/role.py","metagpt/roles/product_manager.py","metagpt/roles/architect.py","metagpt/roles/engineer.py"]},{"name":"动作层","responsibility":"实现具体 SOP 步骤：写 PRD、设计 API、写代码、写测试等，负责组装 prompt 与调用 LLM","modules":["metagpt/actions"],"files":["metagpt/actions/action.py","metagpt/actions/write_prd.py","metagpt/actions/design_api.py","metagpt/actions/action_node.py"]},{"name":"环境调度层","responsibility":"承载角色、广播消息、按轮次并发执行角色并判断系统是否空闲","modules":["metagpt/environment","metagpt/team.py"],"files":["metagpt/environment/base_env.py","metagpt/team.py","metagpt/software_company.py"]},{"name":"消息与数据模型层","responsibility":"定义 Message、Document、Task、Plan 等跨角色传递的数据结构","modules":["metagpt"],"files":["metagpt/schema.py","metagpt/const.py"]},{"name":"记忆层","responsibility":"提供短期消息记忆与长期记忆检索能力，供角色去重与增强上下文","modules":["metagpt/memory","metagpt/rag"],"files":["metagpt/memory/memory.py","metagpt/memory/longterm_memory.py","metagpt/memory/brain_memory.py"]},{"name":"配置与模型接入层","responsibility":"统一 LLM、embedding、搜索等 provider 的配置与实例化，支持按角色覆盖模型","modules":["metagpt/configs","metagpt/provider","config"],"files":["metagpt/config2.py","config/config2.example.yaml","metagpt/provider"]}],"data_flow":["第1步：用户构造 Team 并 hire 一组 Role，或直接调用 software_company.startup 走预置软件公司流程","第2步：把 idea 包装成 UserRequirement 消息投入环境 publish_message，按 cause_by 路由给订阅该动作的角色","第3步：Environment.run 每轮遍历所有非 idle 角色，用 asyncio.gather 并发调用各自 role.run","第4步：Role.run 先 _observe，从私有 msg_buffer 与 memory 取新消息，按 rc.watch 与 send_to 过滤出 rc.news","第5步：若存在新消息则进入 react，按 react_mode 选择 _react 或 _plan_and_act 策略","第6步：_react 循环 _think 选动作，BY_ORDER 模式按序轮转、REACT 模式用 LLM 动态选择","第7步：_act 执行 rc.todo.run(history)，Action 组装 prompt 并经 ActionNode.fill 调用 LLM 得到结构化 ActionOutput","第8步：结果被包装成 AIMessage 写入角色 memory，再经 publish_message 广播回环境","第9步：Environment.publish_message 依据 send_to 与 member_addrs 把消息投递到目标角色的 msg_buffer","第10步：Team.run 循环多轮直到 env.is_idle，返回 env.history 作为最终交付物"],"entry_points":[{"path":"metagpt/team.py:Team.run","what":"团队顶层运行循环，投喂需求并按轮次推进直到所有角色空闲"},{"path":"metagpt/software_company.py:startup","what":"预置软件公司的启动入口，组装 PM/架构师/项目经理/工程师团队"},{"path":"metagpt/roles/role.py:Role.run","what":"单个角色的主循环入口：观察-反应-发布消息"},{"path":"metagpt/environment/base_env.py:Environment.run","what":"环境调度入口，每轮并发驱动所有非空闲角色"},{"path":"examples/","what":"各类可直接运行的示例脚本，最快的上手入口"}],"key_files":[{"path":"README.md","why":"先理解核心哲学 Code = SOP(Team)，以及输入输出边界"},{"path":"metagpt/schema.py","why":"Message/Document/Task 等数据模型，理解角色间传递什么"},{"path":"metagpt/roles/role.py","why":"Role 基类与观察-思考-行动循环，是协作机制的核心"},{"path":"metagpt/actions/action.py","why":"Action 基类与 LLM 调用契约，理解一个 SOP 步骤如何执行"},{"path":"metagpt/environment/base_env.py","why":"环境如何广播消息与并发调度角色，理解系统如何跑起来"},{"path":"metagpt/team.py","why":"团队装配与顶层运行循环，把角色和环境串起来"},{"path":"metagpt/actions/write_prd.py","why":"一个典型动作的完整实现，看 prompt 与 ActionNode 如何组织"},{"path":"config/config2.example.yaml","why":"参数体系：全局与按角色的 LLM/embedding 配置"}],"extension_points":["新增一个角色：继承 metagpt/roles/role.py 的 Role，在 __init__ 里 set_actions 并 _watch 关注的动作，参考 product_manager.py","新增一个动作：继承 metagpt/actions/action.py 的 Action，实现 async def run，用 ActionNode 约束结构化输出","定义结构化交付物：使用 metagpt/actions/action_node.py 的 ActionNode 与模板，自动生成可解析字段","新增运行环境：继承 metagpt/environment/base_env.py 的 Environment，重写 publish_message/run 以改变调度或路由","更换记忆后端：继承 metagpt/memory/memory.py 的 Memory 或扩展 longterm_memory.py，接入向量库","新增 LLM/embedding 供应商：在 metagpt/provider 下实现对应 provider 并在 configs 注册"],"learning_path":["第1步：读 README.md 与 software_company.py，明确 SOP 协作的整体目标与团队构成","第2步：读 schema.py 的 Message，理解 cause_by 与 send_to 构成的发布订阅路由","第3步：读 roles/role.py，吃透 _observe/_think/_act/react 的观察-思考-行动循环","第4步：读 actions/action.py 与一个具体动作 write_prd.py，理解动作如何调 LLM 产出交付物","第5步：读 environment/base_env.py 与 team.py，理解环境如何并发调度并判定空闲收敛","第6步：读 config2.example.yaml，了解如何按角色配置不同模型"],"diagram_mermaid":"graph TD\n  U[一句话需求] --> T[Team 雇佣角色]\n  T --> E[Environment 环境]\n  E --> R[Role.run 主循环]\n  R --> O[_observe 过滤新消息]\n  O --> M[Memory 消息记忆]\n  O --> K[_think 选择动作]\n  K --> A[_act 执行动作]\n  A --> AC[Action.run 组装 prompt]\n  AC --> L[LLM 生成结构化输出]\n  L --> A\n  A --> P[publish_message 广播消息]\n  P --> RT[Environment 路由投递]\n  RT --> O\n  R --> ID{全部角色 idle}\n  ID -->|否| R\n  ID -->|是| OUT[返回 env.history 交付物]","surprises":["角色之间不直接互相调用，全部通过 Environment 的消息广播解耦；一个角色是否行动由它订阅的动作类型 cause_by 决定，而非显式编排","SOP 不是硬编码流程图，而是由每个 Role 的 actions 列表与 _watch 规则隐式涌现出来，读代码时需要把多个角色的订阅关系拼起来才能看到完整流程","Role 默认 enable_memory 会去重历史消息，角色可能因为消息已在记忆中而选择不行动，调试时容易误判为卡住","Message 同时承载自然语言 content 和结构化 instruct_content，ActionNode 负责把 LLM 输出转成可校验的字段，是保证多角色交接格式一致的关键"],"confidence":"高"},"getzep/graphiti":{"repo":"getzep/graphiti","name":"Graphiti","one_liner":"为 AI Agent 构建可增量更新的时序知识图谱记忆","problem":"解决传统 RAG 无法表达事实随时间变化的问题：把原始 Episode 增量抽取成实体与关系，用 valid_at 与 invalid_at 记录事实有效期，旧事实失效而非删除，并支持语义加关键词加图遍历的混合检索。","difficulty":"困难","core_abstractions":[{"name":"Graphiti","role":"主入口类，持有 driver/llm_client/embedder/cross_encoder，编排 add_episode 与 search 全流程","file":"graphiti_core/graphiti.py"},{"name":"GraphDriver","role":"图数据库抽象基类，定义 execute_query/session/build_indices_and_constraints 等后端契约","file":"graphiti_core/driver/driver.py"},{"name":"Neo4jDriver","role":"Neo4j 后端实现，把抽象查询映射到 Cypher 与索引构建","file":"graphiti_core/driver/neo4j_driver.py"},{"name":"EpisodicNode","role":"Episode 节点：原始输入数据的载体与溯源根，带 source 与 reference_time","file":"graphiti_core/nodes.py"},{"name":"EntityNode","role":"实体节点：从 Episode 抽取的人物或概念，带 name_embedding 与随时间演化的 summary","file":"graphiti_core/nodes.py"},{"name":"EntityEdge","role":"实体间关系边，携带 valid_at 与 invalid_at 构成事实的时序有效期","file":"graphiti_core/edges.py"},{"name":"CommunityNode","role":"社区聚类节点，对实体做聚类后生成社区摘要以支持全局检索","file":"graphiti_core/nodes.py"},{"name":"LLMClient","role":"LLM 抽象基类，统一 generate_response 的重试、缓存、结构化输出与多语言抽取指令","file":"graphiti_core/llm_client/client.py"},{"name":"EmbedderClient","role":"嵌入抽象基类，定义 create 与 create_batch 供节点边生成向量","file":"graphiti_core/embedder/client.py"},{"name":"CrossEncoderClient","role":"重排抽象基类，对混合检索候选做相关性重排","file":"graphiti_core/cross_encoder/client.py"},{"name":"search","role":"混合检索入口，按 edge/node/episode/community 四类分别做语义加 BM25 加图遍历","file":"graphiti_core/search/search.py"}],"layers":[{"name":"核心编排层","responsibility":"编排 Episode 写入与检索，管理客户端与请求作用域","modules":["graphiti_core"],"files":["graphiti_core/graphiti.py","graphiti_core/graphiti_types.py"]},{"name":"图数据模型层","responsibility":"定义节点、边、Episode 与时序字段及其持久化方法","modules":["graphiti_core"],"files":["graphiti_core/nodes.py","graphiti_core/edges.py","graphiti_core/models/edges"]},{"name":"存储驱动层","responsibility":"图数据库后端抽象与 Neo4j/FalkorDB/Kuzu/Neptune 实现","modules":["graphiti_core/driver"],"files":["graphiti_core/driver/driver.py","graphiti_core/driver/neo4j_driver.py","graphiti_core/driver/falkordb_driver.py"]},{"name":"抽取与维护层","responsibility":"实体关系抽取、去重解析、时序失效与社区构建","modules":["graphiti_core/utils/maintenance"],"files":["graphiti_core/utils/maintenance/node_operations.py","graphiti_core/utils/maintenance/edge_operations.py","graphiti_core/utils/maintenance/community_operations.py"]},{"name":"模型接入层","responsibility":"LLM、嵌入、重排三类 provider 的抽象与具体实现","modules":["graphiti_core/llm_client","graphiti_core/embedder","graphiti_core/cross_encoder"],"files":["graphiti_core/llm_client/client.py","graphiti_core/embedder/client.py","graphiti_core/cross_encoder/client.py"]},{"name":"检索层","responsibility":"混合检索实现与检索配置配方","modules":["graphiti_core/search"],"files":["graphiti_core/search/search.py","graphiti_core/search/search_config.py","graphiti_core/search/search_config_recipes.py"]},{"name":"提示词层","responsibility":"抽取、去重、摘要、评估等各阶段提示词模板","modules":["graphiti_core/prompts"],"files":["graphiti_core/prompts/extract_nodes.py","graphiti_core/prompts/extract_edges.py","graphiti_core/prompts/dedupe_nodes.py"]},{"name":"服务与工具层","responsibility":"MCP 服务器、FastAPI 服务与批量写入等工具","modules":["mcp_server","server","graphiti_core/utils"],"files":["mcp_server/src/graphiti_mcp_server.py","server/graph_service/main.py","graphiti_core/utils/bulk_utils.py"]}],"data_flow":["第1步：调用 add_episode 传入 name、episode_body、reference_time、group_id 等参数","第2步：retrieve_episodes 按 reference_time 取最近若干历史 Episode 作为抽取上下文","第3步：extract_nodes 用 LLM 从当前与历史 Episode 中抽取实体节点","第4步：resolve_extracted_nodes 做实体去重与合并，返回节点与 uuid 映射","第5步：extract_edges 抽取实体间关系边，并解析每条边的 valid_at/invalid_at","第6步：resolve_extracted_edges 解析重复边，并对被新事实取代的旧边执行时序失效","第7步：extract_attributes_from_nodes 为节点生成属性与随时间演化的摘要","第8步：_process_episode_data 构造 EpisodicEdge 并把节点边写入图数据库","第9步：可选 build_communities 对实体聚类并生成社区节点与摘要","第10步：search 查询走语义加 BM25 加图遍历的混合检索，可选 cross_encoder 重排后返回"],"entry_points":[{"path":"examples/quickstart/quickstart_neo4j.py","what":"Neo4j 快速上手，演示初始化、add_episode 与 search 的完整调用"},{"path":"examples/quickstart/quickstart_falkordb.py","what":"FalkorDB 后端快速上手，展示如何替换图存储"},{"path":"graphiti_core/graphiti.py:Graphiti.add_episode","what":"写入 Episode 的主入口，驱动抽取到落库的全流程"},{"path":"graphiti_core/graphiti.py:Graphiti.search","what":"检索主入口，按查询与配置返回节点边社区"},{"path":"mcp_server/src/graphiti_mcp_server.py","what":"MCP 服务器入口，把图记忆能力暴露给 Agent 客户端"},{"path":"server/graph_service/main.py","what":"FastAPI 服务入口，提供 HTTP 化的图记忆服务"}],"key_files":[{"path":"README.md","why":"先建立认知：时序知识图谱、Episode 溯源与混合检索的整体定位"},{"path":"graphiti_core/graphiti.py","why":"核心编排，add_episode 与 search 是理解系统全貌的必经之路"},{"path":"graphiti_core/nodes.py","why":"EpisodicNode 与 EntityNode 的数据结构与持久化，理解溯源与实体演化"},{"path":"graphiti_core/edges.py","why":"EntityEdge 的 valid_at 与 invalid_at，理解时序有效性建模"},{"path":"graphiti_core/utils/maintenance/edge_operations.py","why":"关系抽取与旧边失效逻辑，是时序语义最烧脑的部分"},{"path":"graphiti_core/driver/driver.py","why":"图存储抽象契约，理解后端如何可插拔"},{"path":"graphiti_core/search/search.py","why":"混合检索实现，理解语义加关键词加图遍历如何融合"},{"path":"graphiti_core/llm_client/client.py","why":"LLM 抽象与重试缓存，理解所有抽取调用的统一入口"},{"path":"examples/quickstart/quickstart_neo4j.py","why":"最小可运行示例，把抽象概念落到具体调用"}],"extension_points":["新增图存储后端：继承 graphiti_core/driver/driver.py 的 GraphDriver 与 GraphDriverSession，参照 neo4j_driver.py 与 falkordb_driver.py 实现","新增 LLM 供应商：继承 graphiti_core/llm_client/client.py 的 LLMClient 并实现 _generate_response","新增嵌入模型：继承 graphiti_core/embedder/client.py 的 EmbedderClient，实现 create 与 create_batch","新增重排器：继承 graphiti_core/cross_encoder/client.py 的 CrossEncoderClient","自定义本体：add_episode 传入 entity_types 与 edge_types 的 Pydantic 模型，约束实体与关系类型","自定义提示词：通过 ChatPromptLibrary 覆盖，参考 graphiti_core/prompts/lib.py 的组合方式","自定义检索策略：改 graphiti_core/search/search_config_recipes.py 中的检索配方组合"],"learning_path":["第1步：读 README.md，理解时序知识图谱、Episode 溯源与混合检索三个核心概念","第2步：读 examples/quickstart/quickstart_neo4j.py，跑通最小闭环","第3步：读 graphiti_core/graphiti.py 的 __init__ 与 add_episode，掌握组件装配与写入流程","第4步：读 graphiti_core/nodes.py 与 edges.py，掌握实体、Episode 与时序边的数据结构","第5步：读 graphiti_core/utils/maintenance/edge_operations.py，理解关系抽取与旧边失效","第6步：读 graphiti_core/driver/driver.py，理解存储后端抽象与扩展方式","第7步：读 graphiti_core/search/search.py，理解混合检索与重排的协同"],"diagram_mermaid":"graph TD\n  A[Episode 原始数据] --> B[retrieve_episodes 取历史上下文]\n  B --> C[extract_nodes 抽取实体]\n  C --> D[resolve_extracted_nodes 去重合并]\n  D --> E[extract_edges 抽取关系]\n  E --> F[resolve_extracted_edges 解析并失效旧边]\n  F --> G[extract_attributes 生成摘要与属性]\n  G --> H[写入图数据库 Neo4j]\n  H --> I[build_communities 可选社区聚类]\n  J[search 查询] --> K[语义加 BM25 加图遍历混合检索]\n  K --> L[返回节点边与社区]","surprises":["事实更新不删除旧数据：当新 Episode 与旧事实冲突时，旧 EntityEdge 被设置 invalid_at 而非删除，因此可以查询任意历史时刻为真的事实","add_episode 文档明确要求逐条顺序 await、不可并发调用，但内部对多条边的解析却用 semaphore_gather 并发，顺序性只约束 Episode 之间","时序失效不是简单比较时间戳：_apply_temporal_invalidation 会用候选边的 valid_at 反推已解析边的 invalid_at，逻辑比直觉复杂","group_id 既是图分区键又是并发请求作用域，_resolve_request_scope 会按 group_id 克隆 driver，避免并发写入互相污染数据库目标","仓库同时内置 Neo4j、FalkorDB、Kuzu 与 Neptune 四个后端，Kuzu 已因上游停维护被标记为弃用，但代码仍在"],"confidence":"高"},"haosulab/ManiSkill":{"repo":"haosulab/ManiSkill","name":"ManiSkill","one_liner":"基于 SAPIEN 的 GPU 并行机器人操作仿真与训练框架","problem":"机器人操作研究需要大量高吞吐仿真数据与统一任务基准。ManiSkill 用 SAPIEN 做 GPU 并行物理仿真与渲染，单卡可并行数千个环境，并用面向对象 API 屏蔽 GPU 内存管理，让研究者专注任务逻辑与策略训练。","difficulty":"中等","core_abstractions":[{"name":"BaseEnv","role":"所有 ManiSkill 任务的基类，继承 gymnasium.Env，管理观测/奖励/控制模式、并行环境数、仿真后端与 step/reset 生命周期","file":"mani_skill/envs/sapien_env.py"},{"name":"ManiSkillScene","role":"把多个 sapien.Scene 子场景包装成一个逻辑场景，统一转发位姿/速度/驱动等调用并管理 GPU 状态","file":"mani_skill/envs/scene.py"},{"name":"BaseAgent","role":"机器人/智能体抽象基类，加载 URDF/MJCF 为 Articulation、管理控制器、提供动作空间与本体感知","file":"mani_skill/agents/base_agent.py"},{"name":"BaseController","role":"控制器基类，定义动作空间与 set_action 接口，把策略输出转成关节目标位姿或速度","file":"mani_skill/agents/controllers/base_controller.py"},{"name":"register_env","role":"装饰器，把任务类注册进 REGISTERED_ENVS 并同时注册到 gymnasium registry，是任务可被 gym.make 找到的关键","file":"mani_skill/utils/registration.py"},{"name":"ManiSkillVectorEnv","role":"gymnasium VectorEnv 实现，为 GPU 并行环境提供自动重置、终止处理与成功率等指标记录","file":"mani_skill/vector/wrappers/gymnasium.py"},{"name":"Camera","role":"相机传感器实现，按 obs_mode 渲染 rgb/depth/segmentation 等纹理供观测使用","file":"mani_skill/sensors/camera.py"},{"name":"Actor","role":"刚体对象抽象，封装单个或多个 sapien actor 的位姿、速度与几何属性并支持批量操作","file":"mani_skill/utils/structs/actor.py"},{"name":"Articulation","role":"关节机器人抽象，封装多环境 articulation 的 qpos/qvel、链接与驱动控制","file":"mani_skill/utils/structs/articulation.py"},{"name":"Pose","role":"批量位姿类型，统一表示与运算位置和四元数，是场景随机化与观测的核心数据结构","file":"mani_skill/utils/structs/pose.py"},{"name":"SimConfig","role":"仿真与 GPU 内存配置的数据类，含场景参数、GPU 显存池与频率设置","file":"mani_skill/utils/structs/types.py"},{"name":"TableSceneBuilder","role":"可复用场景构建器，搭建桌面与机器人初始状态，供抓取类任务共享","file":"mani_skill/utils/scene_builder/table/scene_builder.py"}],"layers":[{"name":"环境核心层","responsibility":"定义 BaseEnv 生命周期、仿真后端选择、并行场景管理与 step/reset 语义","modules":["mani_skill/envs"],"files":["mani_skill/envs/sapien_env.py","mani_skill/envs/scene.py","mani_skill/envs/sim2real_env.py"]},{"name":"任务层","responsibility":"按类别实现具体任务，定义资产加载、随机化、观测、奖励与成功判定","modules":["mani_skill/envs/tasks"],"files":["mani_skill/envs/tasks/tabletop/pick_cube.py","mani_skill/envs/tasks/tabletop/push_cube.py","mani_skill/envs/tasks/tabletop/stack_cube.py","mani_skill/envs/tasks/control/cartpole.py"]},{"name":"智能体与控制器层","responsibility":"定义机器人抽象、URDF/MJCF 加载、控制器族与多智能体支持","modules":["mani_skill/agents","mani_skill/agents/controllers","mani_skill/agents/robots"],"files":["mani_skill/agents/base_agent.py","mani_skill/agents/registration.py","mani_skill/agents/controllers/base_controller.py","mani_skill/agents/controllers/pd_joint_pos.py","mani_skill/agents/multi_agent.py"]},{"name":"传感器与渲染层","responsibility":"提供相机等传感器与渲染后端，生成视觉观测与人类可视渲染","modules":["mani_skill/sensors","mani_skill/render"],"files":["mani_skill/sensors/base_sensor.py","mani_skill/sensors/camera.py","mani_skill/sensors/depth_camera.py"]},{"name":"向量并行层","responsibility":"把并行环境包装成 gymnasium VectorEnv 并适配 SB3 等训练库","modules":["mani_skill/vector/wrappers"],"files":["mani_skill/vector/wrappers/gymnasium.py","mani_skill/vector/wrappers/sb3.py"]},{"name":"资产与场景构建层","responsibility":"从 URDF/MJCF 与网格资产构建 actor、articulation 与可复用场景","modules":["mani_skill/utils/building","mani_skill/utils/scene_builder"],"files":["mani_skill/utils/building/actors","mani_skill/utils/building/urdf_loader.py","mani_skill/utils/scene_builder/scene_builder.py","mani_skill/utils/scene_builder/table/scene_builder.py"]},{"name":"数据抽象层","responsibility":"提供批量位姿、刚体、关节等统一数据结构，屏蔽 CPU/GPU 与单/多环境差异","modules":["mani_skill/utils/structs"],"files":["mani_skill/utils/structs/pose.py","mani_skill/utils/structs/actor.py","mani_skill/utils/structs/articulation.py","mani_skill/utils/structs/types.py"]},{"name":"工具与注册层","responsibility":"任务注册、资产下载、随机化、观测解析与通用工具","modules":["mani_skill/utils"],"files":["mani_skill/utils/registration.py","mani_skill/utils/download_asset.py","mani_skill/envs/utils/observations"]},{"name":"示例与基线层","responsibility":"提供 RL、BC、Diffusion Policy、ACT 等可运行基线训练与评测脚本","modules":["examples/baselines"],"files":["examples/baselines/ppo/ppo.py","examples/baselines/bc/bc.py","examples/baselines/diffusion_policy/train.py"]},{"name":"轨迹层","responsibility":"录制、回放、合并与转换演示轨迹，支持转成 LeRobot 等数据格式","modules":["mani_skill/trajectory"],"files":["mani_skill/trajectory/dataset.py","mani_skill/trajectory/replay_trajectory.py","mani_skill/trajectory/convert_to_lerobot.py"]}],"data_flow":["第1步：import mani_skill.envs 触发各任务模块导入，@register_env 把任务写入 REGISTERED_ENVS 并同步注册到 gymnasium","第2步：gym.make 或 mani_skill.utils.registration.make 按 uid 找到 EnvSpec 并实例化 BaseEnv 子类","第3步：BaseEnv.__init__ 解析 obs_mode/reward_mode/control_mode，num_envs 大于 1 时 sim_backend 自动切到 physx_cuda","第4步：_setup_scene 创建 ManiSkillScene，GPU 模式下按平方根网格创建 num_envs 个 sapien 子场景并设置间距","第5步：_load_agent 按 robot_uids 从 REGISTERED_AGENTS 取 BaseAgent，加载 URDF/MJCF 为 Articulation 并装配控制器","第6步：_load_scene 加载任务资产，_setup_sensors 依据 obs_mode 创建 Camera，_load_lighting 布置光照","第7步：reset 设置主 RNG 与回合 RNG，调用 _initialize_episode 批量随机化物体位姿与目标，GPU 下 _gpu_apply_all 同步","第8步：step 调 _step_action 把动作交给 agent.controller，按 sim_steps_per_control 执行物理步，再 _gpu_fetch_all 取回状态","第9步：get_obs 依据 obs_mode 组织状态或传感器数据，get_reward 按 reward_mode 调用任务奖励函数，evaluate 给出 success","第10步：observation_space 由 _init_raw_obs 自动推断，action_space 直接来自 agent.controller，任务不手写空间","第11步：ManiSkillVectorEnv 包装环境，提供自动重置与成功率指标，供 RL 基线收集 rollout","第12步：训练脚本用向量环境采样并更新策略，录制轨迹可经 trajectory 层保存为演示数据"],"entry_points":[{"path":"mani_skill/envs/template.py","what":"自定义任务的完整模板，注释说明每个需重写的函数，是扩展任务的起点"},{"path":"mani_skill/envs/minimal_template.py","what":"最小任务模板，仅加载机器人，用于快速起步"},{"path":"mani_skill/utils/registration.py","what":"register_env 装饰器与 make 函数，任务注册与实例化的核心入口"},{"path":"examples/baselines/ppo/ppo.py","what":"PPO 基线训练脚本，展示如何用向量环境与并行仿真训练策略"},{"path":"examples/baselines/bc/bc.py","what":"行为克隆基线，从演示轨迹训练状态或视觉策略"},{"path":"examples/baselines/diffusion_policy/train.py","what":"Diffusion Policy 基线训练脚本"},{"path":"mani_skill/envs/tasks/tabletop/pick_cube.py","what":"经典抓取放球任务，可作为读源码与写新任务的范例"}],"key_files":[{"path":"README.md","why":"先建立整体认知：GPU 并行仿真、任务矩阵、基线与系统支持"},{"path":"mani_skill/envs/template.py","why":"任务抽象全貌：需要重写哪些函数、重配置与回合初始化如何分工"},{"path":"mani_skill/envs/tasks/tabletop/pick_cube.py","why":"一个完整任务的实现，对照模板理解资产加载、随机化、观测与奖励"},{"path":"mani_skill/envs/sapien_env.py","why":"BaseEnv 是全局核心，看清 obs/action/reward 模式与 step/reset 的完整流程"},{"path":"mani_skill/utils/registration.py","why":"任务如何被注册与实例化，是扩展任务与排查 make 报错的必读"},{"path":"mani_skill/agents/base_agent.py","why":"机器人抽象与控制器装配，理解动作空间从何而来"},{"path":"mani_skill/agents/controllers/base_controller.py","why":"控制器接口，理解策略动作如何变成关节控制信号"},{"path":"mani_skill/envs/scene.py","why":"GPU 并行机制的核心：多个子场景如何被合并与统一管理"},{"path":"mani_skill/vector/wrappers/gymnasium.py","why":"向量环境封装，理解并行训练时的自动重置与指标"}],"extension_points":["想加新任务：复制 mani_skill/envs/template.py，继承 BaseEnv，实现 _load_scene/_initialize_episode/evaluate/_get_obs_extra 并用 @register_env 注册","想加新机器人：继承 mani_skill/agents/base_agent.py 的 BaseAgent，设置 uid 与 urdf_path，用 @register_agent 注册","想加新控制器：继承 mani_skill/agents/controllers/base_controller.py 的 BaseController 与 ControllerConfig，在 agent 的 _controller_configs 中声明","想加新传感器：继承 mani_skill/sensors/base_sensor.py 的 BaseSensor，实现 capture 与 get_obs","想加新场景：继承 mani_skill/utils/scene_builder/scene_builder.py 的 SceneBuilder，用场景构建器注册机制登记","想改观测或奖励：在任务里重写 _get_obs_extra 与 compute_dense_reward，无需改动框架","想接入新 RL 库：参考 mani_skill/vector/wrappers/sb3.py 或 gymnasium.py 写适配包装器"],"learning_path":["第1步：读 README.md，跑通 Colab 快速上手，感受 GPU 并行仿真的吞吐","第2步：读 mani_skill/envs/template.py，理解一个任务必须实现哪些函数","第3步：读 mani_skill/envs/tasks/tabletop/pick_cube.py，把模板落到一个真实任务","第4步：读 mani_skill/envs/sapien_env.py，理解 BaseEnv 的 obs/action/reward 与 step/reset 生命周期"
